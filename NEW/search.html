<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore • Instagram</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #262626;padding:10px}
.search-wrap{max-width:600px;margin:0 auto;display:flex;gap:10px}
.search-wrap input{flex:1;background:#262626;border:none;color:#fff;padding:10px 15px;border-radius:8px;outline:none}
.search-wrap button{background:#0095f6;border:none;color:#fff;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
.users{max-width:600px;margin:10px auto;padding:0 10px}
.user-row{display:flex;align-items:center;gap:12px;padding:10px;background:#111;border-radius:8px;margin-bottom:8px;cursor:pointer}
.user-row:hover{background:#222}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);display:flex;align-items:center;justify-content:center;font-weight:bold}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:10px 0;z-index:10}
.nav a{color:#fff;text-decoration:none;font-size:22px}
.empty{text-align:center;padding:40px;color:#777}

/* NEW: Skeleton loader only */
.skeleton-row{display:flex;align-items:center;gap:12px;padding:10px;background:#111;border-radius:8px;margin-bottom:8px;animation:fadeIn .2s}
.skeleton-avatar{width:40px;height:40px;border-radius:50%;background:#222;flex-shrink:0}
.skeleton-line{height:12px;background:#222;border-radius:6px}
.skeleton-line.name{width:120px}
.skeleton-line.sub{width:180px;margin-top:6px;height:10px}
.skeleton-shimmer{position:relative;overflow:hidden;background:#1a1a1a}
.skeleton-shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="top">
<div class="search-wrap">
<input id="q" type="text" placeholder="Search username..." oninput="doSearch()">
<button onclick="doSearch()">Search</button>
</div>
</div>

<div id="userResults" class="users"></div>

<div class="nav">
<a href="feed.html">🏠</a>
<a href="explore.html">🔍</a>
<a href="create.html">➕</a>
<a href="reels.html">🎬</a>
<a href="messages.html" style="font-size:22px">💬<span id="msgCount" class="msg-badge hide">0</span></a>
<a href="notification.html"> 🔔 </a>
<a href="profile.html">👤</a>
</div>

<script>
const BASE = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.href = "login.html";

function showSkeleton(){
  const userDiv = document.getElementById('userResults');
  userDiv.innerHTML = Array(5).fill(0).map(()=>`
    <div class="skeleton-row">
      <div class="skeleton-avatar skeleton-shimmer"></div>
      <div>
        <div class="skeleton-line name skeleton-shimmer"></div>
        <div class="skeleton-line sub skeleton-shimmer"></div>
      </div>
    </div>
  `).join('');
}

async function doSearch(){
  const query = document.getElementById('q').value.trim();
  const userDiv = document.getElementById('userResults');

  if(!query){
    userDiv.innerHTML = `<div class="empty">Type username to search</div>`;
    return;
  }

  // SHOW SKELETON UNTIL FETCH RETURNS - NEW
  showSkeleton();

  // SEARCH USER - FROM DATABASE (your logic untouched)
  const res = await fetch(BASE + '/api/explore?q=' + encodeURIComponent(query));
  const data = await res.json();

  if(Array.isArray(data) && data.length && data[0].username){
    userDiv.innerHTML = data.map(u => `
      <div class="user-row" onclick="location.href='profile.html?id=${u._id}'">
        <div class="avatar">${u.username[0].toUpperCase()}</div>
        <div><b>${u.username}</b><br><small style="color:#aaa">${u.email||''}</small></div>
      </div>
    `).join('');
  } else {
    userDiv.innerHTML = `<div class="empty">No user found for "${query}"</div>`;
  }
}
</script>
</body>
</html>
