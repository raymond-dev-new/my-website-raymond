<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Read Novel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0f0f17;color:#fff;font-family:Arial;padding-bottom:90px}.box{max-width:650px;margin:0 auto;padding:16px}.cover{width:100%;height:320px;border-radius:20px;object-fit:cover;background:#222;box-shadow:0 15px 30px rgba(0,0,0,.5)}.title{font-size:26px;font-weight:800;margin-top:16px;line-height:1.2}.author{color:#c4b5fd;font-size:14px;margin-top:6px}.row{display:flex;gap:18px;margin-top:16px;padding:16px 0;border-top:1px solid #262626;border-bottom:1px solid #262626}.row span{cursor:pointer;font-size:14px}.text{font-size:16px;line-height:1.9;white-space:pre-wrap;margin-top:18px;color:#e8e8e8}.cmt{padding:12px 0;border-bottom:1px solid #1f1f1f;font-size:14px}.inputRow{display:flex;gap:8px;margin-top:14px}.inputRow input{flex:1;background:#1e1e2a;border:1px solid #333;border-radius:20px;color:#fff;padding:13px;outline:none}.inputRow button{background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;border:none;border-radius:20px;padding:0 20px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,18,.95);border-top:1px solid #262626;display:flex;justify-content:space-around;padding:14px 0}.nav a{color:#fff;text-decoration:none;font-size:22px}</style>
</head><body>
<div class="box" id="box"><p style="text-align:center;color:#888;padding:50px">Loading novel... 📖</p></div>
<div class="nav"><a href="feed.html">🏠</a><a href="search.html">🔍</a><a href="create.html">✍️</a><a href="message.html">💬</a><a href="diary.html">📖</a><a href="profile.html">👤</a></div>
<script>
const BASE="http://localhost:8000";
const token=localStorage.getItem('token');
const id=new URLSearchParams(location.search).get('id');
let post=null;
function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }
async function load(){
  const res=await fetch(BASE+'/api/posts/'+id,{headers:{authorization:token}});
  post=await res.json();
  const liked=post.likes.includes(getMyId());
  const saved=post.savedBy && post.savedBy.includes(getMyId());
  let comments=post.comments.map(c=>'<div class="cmt"><b>@'+(c.user?.username||'user')+'</b> '+c.text+'</div>').join('') || '<p style="color:#777"></p>';
  // NEW: use post.cover directly, no BASE +
  document.getElementById('box').innerHTML=`
    ${post.cover?'<img class="cover" src="'+post.cover+'">':''}
    <div class="title">${post.title}</div><div class="author" style="cursor:pointer"> @${'author'} • ${''}</div>
    <div class="row">
      <span onclick="doLike()">${liked?'❤️':'🤍'} ${post.likes.length} Likes</span>
      
    </div>
     <h3 style="margin-top:26px">Welcome 😊 Login to see more features</h3></div>
    <div class="text">${post.content}</div>
    `;
}
async function doLike(){ await fetch(BASE+'/api/posts/'+id+'/like',{method:'POST',headers:{authorization:token}}); load(); }
async function doSave(){ await fetch(BASE+'/api/posts/'+id+'/save',{method:'POST',headers:{authorization:token}}); load(); alert('Saved to Diary! 📖'); }
async function doComment(){
  const t=document.getElementById('cInput').value.trim(); if(!t) return;
  await fetch(BASE+'/api/posts/'+id+'/comment',{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text:t})});
  load();
}
load();
</script></body></html>
