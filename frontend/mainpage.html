<!DOCTYPE html>
<html lang="en">
<head>
 
   <script>
   // uncomment when ready
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.replace('/login.html');
    } 
  </script>
   
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPortal - Dashboard</title>
 <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    
   * { box-sizing: border-box; } /* FIX: makes padding not break layout */

   body {
  background-image: url("photo_2026-07-24_19-55-32.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  margin: 0;
  padding: 0;
  /*min-height: 100vh;*/
  font-family: Roboto;
}

/* TOP BAR FOR LOGOUT + INFO */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 15px;
  max-width: 1200px;
  margin: 0 auto;
}

.left-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.left-buttons button {
  width: auto;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 20px;
}

.info-link {
  color: #3a0797;
  font-size: 17px;
  font-weight: 700;
  text-decoration: underline;
  padding: 8px;
}

/* GLASS CARD - CENTERED WITH MAX WIDTH */
.container {
  border-radius: 20px;
  margin: 10px auto; /* center on laptop */
  padding: 15px;
  
  max-width: 1200px; /* stops it from getting too wide on laptop */
  width: 95%;
}

/* MARKETPLACE BANNER */
.market-banner {
  background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
  color: #000;
  padding: 12px;
  text-align: center;
  font-weight: 900;
  font-size: 13px;
  border-radius: 12px;
  margin-bottom: 15px;
}
.market-banner span {
  display: block;
  font-size: 11px;
  margin-top: 4px;
  font-weight: 700;
}

.h1{
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: 900;
  margin: 5px 0;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
}

.h22{
  text-align: center;
  color: rgba(255,255,255,0.9);
  font-weight: 600;
  font-size: 13px;
  padding: 0 10px;
  margin-bottom: 10px;
}

button {
  font-size: 16px;
  font-weight: 700;
  padding: 15px;
  border-radius: 15px;
  color: white;
  background-color: green;
  border: none;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: all 0.2s;
}

button:hover{
  transform: translateY(-2px);
}

/* ORANGE ADVERTISE BUTTON */
.btn-advertise {
  background: linear-gradient(135deg, #FF8C00 0%, #FF4500 100%) !important;
}

/* DEFAULT: 2 COLUMN GRID FOR PHONE */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.featured {
  margin: 20px 0;
  padding: 15px;
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
}
.featured h3 {
  color: white;
  text-align: center;
  margin-bottom: 12px;
  font-size: 18px;
  font-weight: 900;
}
.featured-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}
.featured-item {
  background: white;
  border-radius: 10px;
  padding: 8px;
  text-align: center;
  color: #000;
  font-size: 12px;
  font-weight: 700;
}
.featured-item img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 5px;
}
.featured-ad {
  border: 2px dashed orange;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,165,0,0.2);
  color: orange;
  font-weight: 900;
}

.test{
  text-align: center;
  padding: 10px;
  font-size: 18px;
  font-weight: 700;
  color: white;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}

.count{
  font-size: 14px;
  text-align: center;
  color: #FFD700;
  font-weight: 700;
  margin: 5px 0 10px 0;
}

/* ========== RESPONSIVE BREAKPOINTS ========== */

/* TABLET: 768px and up */
@media screen and (min-width: 768px) {
  .container {
    padding: 25px;
  }
  .h1 {
    font-size: 36px;
  }
  .market-banner {
    font-size: 16px;
  }
  .market-banner span {
    font-size: 14px;
  }
  button {
    font-size: 18px;
    padding: 18px;
  }
  .grid {
    grid-template-columns: repeat(3, 1fr); /* 3 columns on tablet */
    gap: 15px;
  }
  .featured-grid {
    grid-template-columns: repeat(4,1fr); /* 4 featured items */
  }
  .featured-item img {
    height: 120px;
  }
}

/* LAPTOP: 1024px and up */
@media screen and (min-width: 1024px) {
  .container {
    padding: 30px;
    margin: 20px auto;
  }
  .h1 {
    font-size: 42px;
  }
  .top-bar {
    padding: 15px 30px;
  }
  .left-buttons button {
    font-size: 15px;
    padding: 10px 18px;
  }
  button {
    font-size: 20px;
    padding: 20px;
  }
  .grid {
    grid-template-columns: repeat(4, 1fr); /* 4 columns on laptop */
    gap: 20px;
  }
  .featured {
    padding: 25px;
  }
  .featured h3 {
    font-size: 24px;
  }
  .featured-item {
    font-size: 14px;
  }
  .featured-item img {
    height: 150px;
  }
}

/* SMALL PHONE: 480px and below */
@media screen and (max-width: 480px) {
  .h1 {
    font-size: 24px;
  }
  button {
    font-size: 15px;
    padding: 14px;
  }
  .market-banner {
    font-size: 12px;
  }
}
  </style>
</head>
<body>

<div class="container">

  <!-- MARKETPLACE BANNER -->
  <div class="market-banner">
    🛍️ SHOP PRODUCTS FROM VENDORS | 📢 ADVERTISE YOUR PRODUCTS HERE
    <span>Reach 500+ Active Users • From ₦5,000 for 7 Days</span>
  </div>
  
  <h2 class="h1"> WELCOME </h2>

   <div class="top-bar">
    <div class="left-buttons">
      <button class="logout"> Log out </button>
      <button class="changep"> Change password </button>
    </div>
    <a href="info.html" class="info-link">Info/contact</a>
  </div>

  <h2 class="count"> 1 </h2>
  <h2 class="test"></h2> 
  
    <small style="color: rgb(9, 130, 167); font-weight: 700; font-size: 16px;">After payment we will upload your Products in shop product with your whatsapp number so u can be contacted by our 500+ users</small>
  <!-- RESPONSIVE BUTTON GRID -->
  <div class="grid">
   <div>  <button class="Calculator"> 🧮 Calculator </button> </div>
   <div>  <button class="Media"> Watch LIve Match </button> </div> 
   <div> <button class="product"> 🛍️ Shop Products </button> </div>
   <div> <button class="advertise btn-advertise"> 📢 Advertise </button> </div>
   <div> <button class="game"> 🎮 Games </button> </div>
   <div> </div>
  </div>

</div>

  <script>
     const Autoken = localStorage.getItem('token');
    if (Autoken) {
      setTimeout(() => {
       const name = document.querySelector('.test')
       const localName = localStorage.getItem('Name')
       name.innerHTML = ` Welcome ${localName} nice having you! `
      }, 2000)
      setTimeout(() => {
       const name = document.querySelector('.test')
       name.innerHTML = ` Welcome Guest `
      }, 15000)
      setTimeout(() => {
       const name = document.querySelector('.test')
       name.innerHTML = ''
      }, 180000)
    }
       let count = 0
    setInterval(() => {
     const countt = document.querySelector('.count')
     countt.innerHTML = count
     count++
    }, 1000 )
   
   const calculator = document.querySelector('.Calculator')
   const product = document.querySelector('.product')
   const changep = document.querySelector('.changep')
   const game = document.querySelector('.game')
   const logout = document.querySelector('.logout')                
   const Media = document.querySelector('.Media') 
   const advertise = document.querySelector('.advertise')
      
   calculator.addEventListener('click', () => {
      window.location.href="calculate.html"
   })  
   Media.addEventListener('click', () => {
      window.location.href="savemainpage.html"
   })  
   product.addEventListener('click', () => {
     window.location.href="amazon.html"
   })
   advertise.addEventListener('click', () => {
     window.location.href="https://wa.me/2348115614822?text=Hello%20I%20want%20to%20advertise%20my%20products%20on%20MyPortal"
   })
   changep.addEventListener('click', () => {
     window.location.href="change.html"
   })
   game.addEventListener('click', () => {
     window.location.href="gamepage.html"
   })
   logout.addEventListener('click', () => {
     window.location.href="register.html"
     localStorage.removeItem('token')
   })
  </script>
</body>
</html>
