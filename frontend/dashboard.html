<style>

<div class="top">

<b class="b"> Register an account to enjoy the full functionality</b>
<div class="section" id="pinSec" style="display:none"><h3>📌 Pinned For You</h3><p>3 random novels stay here for 3 days</p></div>
<div class="grid" id="pinnedGrid"></div>
<div class="section"><h3>📚 Discover Stories</h3><p>Tap any cover to read</p></div>

<script>
// ============================================================
// CACHE ADDITION - ADDED ONLY - START
// ============================================================
// WildReaders Cache - IndexedDB (FREE, unlimited) + Cache Storage (FREE, for images)
// Why: Public feed has many covers. localStorage is only ~5MB and would crash. IndexedDB has no such limit.
// Pattern: Show cached feed instantly (0s) -> Fetch new in background -> Update if changed.
// This block does NOT replace your logic below. It runs BESIDE it.
// Note: This is the PUBLIC feed - no login needed, so cache key is 'feed_posts_public'
// to not clash with logged-in feed.html which uses 'feed_posts'.
// ============================================================
const WRDB = window.WRDB || {
  dbName: 'WildReadersDB',
  storeName: 'cache',
  _open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(this.storeName)) {
          req.result.createObjectStore(this.storeName);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  // CACHE ADDITION: Save anything - feed posts - to IndexedDB
  async save(key, data) {
    try {
      const db = await this._open();
      return new Promise((resolve) => {
        const tx = db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch (e) { return false; }
  },
  // CACHE ADDITION: Get anything from IndexedDB, returns null if not found
  async get(key) {
    try {
      const db = await this._open();
      return new Promise((resolve) => {
        const tx = db.transaction(this.storeName, 'readonly');
        const req = tx.objectStore(this.storeName).get(key);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    } catch (e) { return null; }
  }
};
// CACHE ADDITION: Turn ON Cache Storage for images (covers) via Service Worker
// Service Worker caches cover images so they load in 0s second time.
// It NEVER caches /api/ - so new novels always come fresh from server.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// CACHE ADDITION: Helper - paint feed from posts using your SAME card() + getPinned() below
// This is only for instant cached render. Your original load() still does the fresh fetch below.
function renderFeedFromCache(posts) {
  if (!Array.isArray(posts) || !posts.length) return;
  let pinned = getPinned(posts);
  let pinnedIds = pinned.map(p => p._id);
  let rest = shuffle(posts.filter(p => !pinnedIds.includes(p._id)));
  document.getElementById('pinnedGrid').innerHTML = pinned.map(p=>card(p,true)).join('');
  document.getElementById('pinSec').style.display='block';
  document.getElementById('feedGrid').innerHTML = rest.map(p=>card(p,false)).join('');
}
// ============================================================
// CACHE ADDITION - ADDED ONLY - END
// ============================================================
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
//if(!token) location.href="login.html";
// NEW: cover is already full image from DB, use directly - no BASE +
function shuffle(a){ let arr=[...a]; for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function getPinned(all){
  const THREE=3*24*60*60*1000;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('pinned_novels')||'null'); }catch{}
  if(saved && saved.time && Date.now()-saved.time < THREE && saved.ids.length===3){
    let p=all.filter(x=> saved.ids.includes(x._id));
    if(p.length===3) return p;
  }
  let np=shuffle(all).slice(0,3);
  localStorage.setItem('pinned_novels', JSON.stringify({ids: np.map(x=>x._id), time: Date.now()}));
  return np;
}
function card(p, isPin){
  let cover=p.cover ? '<img src="'+p.cover+'">' : '<div class="noimg">📖</div>';
  return '<div class="card" onclick="location.href=\'Nread.html?id='+p._id+'\'"><div class="cover">'+(isPin?'<span class="pin">📌 PINNED</span>':'')+cover+'</div><div class="body"><div class="title">'+p.title+'</div><div class="meta"><span>@'+(p.user?.username||'author')+'</span><span>❤️ '+(p.likes?.length||0)+'</span><span>💬 '+(p.comments?.length||0)+'</span></div></div></div>';
}
async function load(){
  // CACHE ADDITION - ADDED ONLY: Show cached public feed instantly (0s) BEFORE server fetch
  // Visitor sees old feed immediately while we fetch fresh data below.
  // If no cache, this does nothing and normal fetch below runs.
  // Uses 'feed_posts_public' so it never mixes with logged-in feed.html cache.
  try {
    const cachedPosts = await WRDB.get('feed_posts_public');
    if (cachedPosts && cachedPosts.length) {
      renderFeedFromCache(cachedPosts);
    }
  } catch (e) {}
  const res=await fetch(BASE+'/api/posts/feed?page=1&limit=20',{headers:{authorization:token}});
  let posts=await res.json();
  if(!posts.length){ document.getElementById('feedGrid').innerHTML='<p style="grid-column:1/3;text-align:center">No novels yet. Be the first! ✍️</p>'; return; }
  let pinned=getPinned(posts);
  let pinnedIds=pinned.map(p=>p._id);
  let rest=shuffle(posts.filter(p=> !pinnedIds.includes(p._id)));
  document.getElementById('pinnedGrid').innerHTML=pinned.map(p=>card(p,true)).join('');
  document.getElementById('pinSec').style.display='block';
  document.getElementById('feedGrid').innerHTML=rest.map(p=>card(p,false)).join('');
  // CACHE ADDITION - ADDED ONLY: Save fresh public feed to IndexedDB for next instant open
  // This runs AFTER your original fetch, so it never changes what visitor sees now.
  // Next time visitor opens this page, it will show in 0s from this cache.
  WRDB.save('feed_posts_public', posts);
}
load();

</script></body></html>
