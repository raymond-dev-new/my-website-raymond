<script>
// ============================================================
// CACHE ADDITION - ADDED ONLY - FIXED
// FIX: Removed <script src="wildreaders-db.js"> from <head>
// Reason: That file + this inline block both declared const WRDB
// -> "Identifier 'WRDB' has already been declared" -> load() never ran
// Now WRDB exists ONLY here, so no clash, fetch always runs.
// ============================================================
const WRDB = {
  dbName: 'WildReadersDB',
  storeName: 'cache',
  _open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(this.storeName)) {
          req.result.createObjectStore(this.storeName);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async save(key, data) {
    try {
      const db = await this._open();
      return new Promise((resolve) => {
        const tx = db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch (e) { return false; }
  },
  async get(key) {
    try {
      const db = await this._open();
      return new Promise((resolve) => {
        const tx = db.transaction(this.storeName, 'readonly');
        const req = tx.objectStore(this.storeName).get(key);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    } catch (e) { return null; }
  }
};
// CACHE ADDITION: Turn ON Cache Storage for images (covers) via Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function renderFeedFromCache(posts) {
  if (!Array.isArray(posts) || !posts.length) return;
  let pinned = getPinned(posts);
  let pinnedIds = pinned.map(p => p._id);
  let rest = shuffle(posts.filter(p => !pinnedIds.includes(p._id)));
  document.getElementById('pinnedGrid').innerHTML = pinned.map(p=>card(p,true)).join('');
  document.getElementById('pinSec').style.display='block';
  document.getElementById('feedGrid').innerHTML = rest.map(p=>card(p,false)).join('');
}
const BASE="https://my-website-raymond-sepia.vercel.app";
const token=localStorage.getItem('token');
//if(!token) location.href="login.html";
// NEW: cover is already full image from DB, use directly - no BASE +
function shuffle(a){ let arr=[...a]; for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
// ============================================================
// CHANGED ONLY - GLOBAL PINNED POSTS - SAME FOR ALL USERS
// Before: used localStorage 'pinned_novels' + Math.random() per device,
// so every user got different 3 pins.
// Now: NO localStorage. Seed = current 3-day period number.
// Same seed + same posts list = same shuffle = same 3 pins for everyone.
// After 3 days, seed changes, so a NEW set of 3 is picked for everyone.
// ============================================================
function seededShuffle(a, seed){
  let arr = [...a];
  let s = seed >>> 0;
  function rand(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for(let i = arr.length-1; i > 0; i--){
    let j = Math.floor(rand() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function getPinned(all){
  if(!Array.isArray(all) || !all.length) return [];
  const THREE = 3*24*60*60*1000;
  // Same for all users in the same 3-day window
  const period = Math.floor(Date.now() / THREE);
  // Sort by _id first so order is identical for all users
  // before we apply the seeded shuffle
  let sorted = [...all].sort((a,b) => String(a._id).localeCompare(String(b._id)));
  let shuffled = seededShuffle(sorted, period);
  return shuffled.slice(0,3);
}
function card(p, isPin){
  let cover=p.cover ? '<img src="'+p.cover+'">' : '<div class="noimg">📖</div>';
  return '<div class="card" onclick="location.href=\'Nread.html?id='+p._id+'\'"><div class="cover">'+(isPin?'<span class="pin">📌 PINNED</span>':'')+cover+'</div><div class="body"><div class="title">'+p.title+'</div><div class="meta"><span>@'+(p.user?.username||'author')+'</span><span>❤️ '+(p.likes?.length||0)+'</span><span>💬 '+(p.comments?.length||0)+'</span></div></div></div>';
}
async function load(){
  // CACHE ADDITION - FIXED: Cache read has 500ms timeout, never blocks fetch
  // Before: await WRDB.get() could hang -> fetch never started -> stuck on Loading
  // Now: if cache takes >500ms, we skip it and go straight to fetch
  try {
    const cachedPosts = await Promise.race([
      WRDB.get('feed_posts_public'),
      new Promise(r => setTimeout(() => r(null), 500))
    ]);
    if (cachedPosts && cachedPosts.length) {
      renderFeedFromCache(cachedPosts);
    }
  } catch (e) {}
  try {
    const res=await fetch(BASE+'/api/posts/feed?page=1&limit=20',{headers:{authorization:token}});
    let posts=await res.json();
    if(!posts.length){ document.getElementById('feedGrid').innerHTML='<p style="grid-column:1/3;text-align:center">No novels yet. Be the first! ✍️</p>'; return; }
    let pinned=getPinned(posts);
    let pinnedIds=pinned.map(p=>p._id);
    let rest=shuffle(posts.filter(p=> !pinnedIds.includes(p._id)));
    document.getElementById('pinnedGrid').innerHTML=pinned.map(p=>card(p,true)).join('');
    document.getElementById('pinSec').style.display='block';
    document.getElementById('feedGrid').innerHTML=rest.map(p=>card(p,false)).join('');
    WRDB.save('feed_posts_public', posts);
  } catch (e) {
    // CACHE ADDITION: If fetch fails AND we had no cache, show error instead of infinite Loading
    const grid = document.getElementById('feedGrid');
    if (grid && grid.innerHTML.includes('Loading stories')) {
      grid.innerHTML = '<p style="grid-column:1/3;text-align:center">Could not load. Check internet and refresh.</p>';
    }
  }
}
load();

</script></body></html>
