
<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feed</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a12;color:#fff;font-family:Arial;padding-bottom:90px}.top{max-width:935px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(10,10,18,.95);backdrop-filter:blur(12px);z-index:10}.logo{font-family:cursive;font-size:26px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.section{max-width:935px;margin:0 auto;padding:14px 16px 4px}.section h3{margin:0}.section p{color:#888;font-size:12px;margin:4px 0}.grid{max-width:935px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 16px}.card{background:#16161f;border:1px solid #26262f;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}.card:active{transform:scale(.97)}.cover{position:relative;width:100%;height:220px;background:#222}.cover img{width:100%;height:100%;object-fit:cover}.noimg{width:100%;height:100%;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:56px}.pin{position:absolute;top:10px;left:10px;background:#f59e0b;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.4)}.body{padding:12px}.title{font-size:14px;font-weight:800;line-height:1.3;min-height:36px}.meta{font-size:12px;color:#999;margin-top:8px;display:flex;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,18,.95);backdrop-filter:blur(12px);border-top:1px solid #262626;display:flex;justify-content:space-around;padding:14px 0}.nav a{color:#fff;text-decoration:none;font-size:22px}.nav a.active{transform:scale(1.25)}
button{color:#ec4899;padding:10px 20px;border-radius:10px;font-size:15px;font-weight:700}
.lin{background-color:#ec4899;padding:10px 20px;border-radius:10px;font-size:15px;font-weight:700}
.linn{background-color:blue;padding:10px 20px;border-radius:10px;font-size:15px;font-weight:700}
.b{display:flex;align-items:center;justify-content:center;padding:10px 10px;background-color:#ec4899;width:80%;border-radius:35%;margin:0 auto;text-align:center;box-sizing:border-box;font-size:14px}
.spinner{width:42px;height:42px;margin:18px auto 10px;border:4px solid #26262f;border-top:4px solid #ec4899;border-right:4px solid #a78bfa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="top"><b class="logo">WildReaders ✨</b></div>
<b class="b"> Register an account to enjoy the full functionality</b>
<div class="section"><h3>📌 Pinned Stories</h3><p>Top 10 stories — always here</p></div>
<div class="grid" id="feedGrid"><div style="grid-column:1/3;text-align:center;color:#777"><div class="spinner"></div><p style="text-align:center;color:#777">Loading stories... <br> updating page usually take 1 minutes + please stay on page while is still loading</p></div></div>
<div class="nav"><a href="register.html" class="lin">Register</a><a href="login.html" class="linn">Login</a></div>
<script>
const WRDB = {
  dbName: 'WildReadersDB', storeName: 'cache',
  _open() { return new Promise((resolve, reject) => { const req = indexedDB.open(this.dbName, 1); req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(this.storeName)) { req.result.createObjectStore(this.storeName); } }; req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); },
  async save(key, data) { try { const db = await this._open(); return new Promise((resolve) => { const tx = db.transaction(this.storeName, 'readwrite'); tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key); tx.oncomplete = () => resolve(true); tx.onerror = () => resolve(false); }); } catch (e) { return false; } },
  async get(key) { try { const db = await this._open(); return new Promise((resolve) => { const tx = db.transaction(this.storeName, 'readonly'); const req = tx.objectStore(this.storeName).get(key); req.onsuccess = () => resolve(req.result ? req.result.data : null); req.onerror = () => resolve(null); }); } catch (e) { return null; } }
};
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
const BASE="https://raymond-web-rho.vercel.app";
const token=localStorage.getItem('token');
function card(p){ let cover=p.cover ? '<img src="'+p.cover+'" loading="lazy">' : '<div class="noimg">📖</div>'; return '<div class="card" data-id="'+p._id+'" onclick="location.href=\'Nread.html?id='+p._id+'\'"><div class="cover"><span class="pin">📌 PINNED</span>'+cover+'</div><div class="body"><div class="title">'+p.title+'</div><div class="meta"><span>@'+(p.user?.username||'author')+'</span><span>❤️ '+(p.likes?.length||0)+'</span><span>💬 '+(p.comments?.length||0)+'</span></div></div></div>'; }
async function load(){
  // 1. Show saved 10 - if less than 24h since last fetch, NO FETCH
  try {
    const saved = await WRDB.get('pinned_10_forever');
    if (saved && saved.length) {
      document.getElementById('feedGrid').innerHTML = saved.map(p=>card(p)).join('');
      const lastFetch = Number(localStorage.getItem('pinned_10_last_fetch') || 0);
      if (lastFetch && (Date.now() - lastFetch) < 24*60*60*1000) {
        return; // STOP - still within 24 hours, no fetch
      }
      // 24 hours passed - fall through to fetch new 10 below
    }
  } catch(e) {}
  // 2. First time ever OR 24 hours passed - fetch once to save first 10
  try {
    const res = await fetch(BASE+'/api/posts/feed?page=1&limit=10', {headers:{authorization:token}});
    let posts = await res.json();
    if(!Array.isArray(posts)) posts = posts.posts || [];
    let first10 = posts.slice(0,10);
    if(first10.length){
      await WRDB.save('pinned_10_forever', first10);
      localStorage.setItem('pinned_10_last_fetch', String(Date.now()));
      document.getElementById('feedGrid').innerHTML = first10.map(p=>card(p)).join('');
    } else {
      // If fetch returns empty but we have saved, keep saved (already shown above)
      const hasCards = document.querySelectorAll('#feedGrid .card').length > 0;
      if(!hasCards){ document.getElementById('feedGrid').innerHTML='<p style="grid-column:1/3;text-align:center">No novels yet. Be the first! ✍️</p>'; }
    }
  } catch(e) {
    const hasCards = document.querySelectorAll('#feedGrid .card').length > 0;
    if(!hasCards){ const grid = document.getElementById('feedGrid'); if (grid && grid.innerHTML.includes('Loading stories')) { grid.innerHTML = '<p style="grid-column:1/3;text-align:center">Could not load. Check internet and refresh.</p>'; } }
  }
}
load();
</script>
<script>

</script>
</body></html>
