<!DOCTYPE html>
<html lang="en">
<head>
  <script>
 const token = localStorage.getItem('token');
    if (!token) {
      window.location.replace('/login.html');
    } 
   </script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Vault</title>
<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #007bff; --danger: #dc3545; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px; }
.container { max-width: 700px; margin: 0 auto; }
  h2 { text-align: center; margin-bottom: 15px; font-size: 20px; }
.box { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: var(--text); }
  button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media(min-width: 768px){ #gallery { grid-template-columns: 1fr 1fr 1fr; } }

.media-card { background: var(--card); border-radius: 10px; overflow: hidden; }
.media-card img,.media-card video { width: 100%; height: 150px; object-fit: cover; cursor: pointer; display: block; }
.media-card button { background: var(--danger); border-radius: 0; padding: 8px; font-size: 13px; }
.hidden { display: none; }
.empty { text-align: center; color: #aaa; grid-column: 1/-1; padding: 40px 0; }

  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; padding: 10px; }
  #viewerContent { width: 100%; max-width: 900px; }
  #viewerContent img, #viewerContent video { width: 100%; height: auto; max-height: 80vh; border-radius: 8px; }
  #closeBtn { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 28px; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
  #closeBtn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="container">

  <div id="loginBox" class="box">
    <h2>Login to Vault</h2>
    <input type="text" id="emailInput" placeholder="Enter your email" />
    <button onclick="login()">Enter</button>
  </div>

  <div id="appBox" class="hidden">
    <h2>📁 Vault - <span id="userEmail"></span></h2>
    <div class="box">
      <input type="file" id="fileInput" accept="image/*,video/*" multiple />
      <button id="uploadBtn">Upload Selected</button>
      <button onclick="logout()" style="background:#555;margin-top:8px;">Logout</button>
    </div>
    <div id="gallery"><div class="empty">Loading...</div></div>
  </div>

</div>

<div id="viewer">
  <button id="closeBtn" onclick="closeViewer()">&larr;</button>
  <div id="viewerContent"></div>
</div>

<script>
const CLOUD_NAME = "aevzkk4q"; // MATCHES YOUR CLOUDINARY DASHBOARD
const UPLOAD_PRESET = "media_vault";
const MAX_FILE_SIZE = 100 * 1024 * 1024; // 100MB Cloudinary free limit
const API_URL = "https://my-website-raymond.vercel.app";

let CURRENT_USER = "";

function checkFileSize(file) {
  if (file.size > MAX_FILE_SIZE) {
    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
    alert(`File too large! 😅\n\n"${file.name}"\nSize: ${sizeMB} MB\nMax allowed: 100 MB\n\nCompress the video or upgrade Cloudinary.`);
    return false;
  }
  return true;
}

function login() {
  const email = document.getElementById('emailInput').value.trim();
  if(!email) return alert("Enter email");
  CURRENT_USER = email;
  document.getElementById('userEmail').innerText = email;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  loadFromDB();
}

function logout() {
  CURRENT_USER = "";
  document.getElementById('appBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

async function loadFromDB() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = `<div class="empty">Loading...</div>`;
  try {
    const res = await fetch(`${API_URL}/api/get-media?userId=${encodeURIComponent(CURRENT_USER)}`);
    const mediaList = await res.json();
    if(!Array.isArray(mediaList) || mediaList.length === 0) {
      gallery.innerHTML = `<div class="empty">No media yet. Upload something!</div>`;
      return;
    }
    gallery.innerHTML = mediaList.map(item => `
      <div class="media-card">
        ${item.type === 'video'
   ? `<video src="${item.url}" onclick="openViewer('${item.url}', 'video')"></video>`
          : `<img src="${item.url}" onclick="openViewer('${item.url}', 'image')" />`
        }
        <button onclick="deleteMedia('${item._id}')">Delete</button>
      </div>
    `).join("");
  } catch(err) {
    console.error(err);
    gallery.innerHTML = `<div class="empty">Error loading. Check server.</div>`;
  }
}

document.getElementById('uploadBtn').onclick = async () => {
  const files = document.getElementById('fileInput').files;
  if (files.length === 0) return alert("Pick files first");

  // Check all files before starting upload
  for(let i = 0; i < files.length; i++) {
    if (!checkFileSize(files[i])) return;
  }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.innerText = `Uploading 0/${files.length}...`;

  let uploaded = 0;
  for(let i = 0; i < files.length; i++) {
    const file = files[i];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
      const result = await res.json();

      if(res.ok && result.secure_url) {
        await fetch(`${API_URL}/api/save-media`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            userId: CURRENT_USER,
            url: result.secure_url,
            type: result.resource_type,
            public_id: result.public_id
          })
        });
        uploaded++;
        btn.innerText = `Uploading ${uploaded}/${files.length}...`;
      } else {
        // Handle Cloudinary errors cleanly
        const errMsg = result.error?.message || 'Upload failed';
        alert(`"${file.name}" failed:\n${errMsg}`);
      }
    } catch(err) {
      console.error("Upload error", err);
      alert(`Network error uploading ${file.name}`);
    }
  }

  document.getElementById('fileInput').value = "";
  btn.disabled = false;
  btn.innerText = "Upload Selected";
  if(uploaded > 0) {
    alert(`${uploaded} files uploaded! ✅`);
    loadFromDB();
  }
}

async function deleteMedia(id) {
  if(!confirm("Delete this media?")) return;
  await fetch(`${API_URL}/api/delete-media/${id}`, {method: 'DELETE'});
  loadFromDB();
}

function openViewer(url, type) {
  const viewer = document.getElementById('viewer');
  const content = document.getElementById('viewerContent');
  if(type === 'video') {
    content.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
  } else {
    content.innerHTML = `<img src="${url}" />`;
  }
  viewer.style.display = 'flex';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = "";
}
document.getElementById('viewer').addEventListener('click', (e) => {
  if(e.target.id === 'viewer') closeViewer();
})
</script>
</body>
</html>
