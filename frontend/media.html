<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Vault - MongoDB Only</title>
<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #007bff; --danger: #dc3545; --warn: #ffc107; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px; }
.container { max-width: 700px; margin: 0 auto; }
  h2 { text-align: center; margin-bottom: 15px; font-size: 20px; }
.box { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: var(--text); }
.warning { font-size: 12px; color: var(--warn); margin-bottom: 10px; text-align: center; }
  button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media(min-width: 768px){ #gallery { grid-template-columns: 1fr 1fr 1fr; } }
.media-card { background: var(--card); border-radius: 10px; overflow: hidden; position: relative; }
.media-card img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; display: block; }
.media-card button { background: var(--danger); border-radius: 0; padding: 8px; font-size: 13px; }
.hidden { display: none; }
.empty { text-align: center; color: #aaa; grid-column: 1/-1; padding: 40px 0; }
  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 999; padding: 10px; }
  #viewerContent img { width: 100%; height: auto; max-height: 80vh; border-radius: 8px; }
  #closeBtn { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 28px; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div id="loginBox" class="box">
    <h2>Login to Vault</h2>
    <input type="text" id="emailInput" placeholder="Enter your email" />
    <button onclick="login()">Enter</button>
  </div>

  <div id="appBox" class="hidden">
    <h2>📁 Vault - <span id="userEmail"></span></h2>
    <div class="box">
      <p class="warning">⚠️ Images Only</p>
      <input type="file" id="fileInput" accept="image/*" multiple />
      <button id="uploadBtn">Upload Selected</button>
      <button onclick="logout()" style="background:#555;margin-top:8px;">Logout</button>
    </div>
    <div id="gallery"><div class="empty">Loading...</div></div>
  </div>
</div>

<div id="viewer">
  <button id="closeBtn" onclick="closeViewer()">&larr;</button>
  <div id="viewerContent"></div>
</div>

<script>
  //https://my-website-raymond.vercel.app
  //http://localhost:8000
const API_URL = "https://my-website-raymond.vercel.app"; // CHANGE THIS
let CURRENT_USER = "";

function login() {
  const email = document.getElementById('emailInput').value.trim();
  if(!email) return alert("Enter email");
  CURRENT_USER = email;
  document.getElementById('userEmail').innerText = email;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  loadFromDB();
}

function logout() {
  CURRENT_USER = "";
  document.getElementById('appBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

// LOAD FROM MONGODB
async function loadFromDB() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = `<div class="empty">Loading...</div>`;
  try {
    const res = await fetch(`${API_URL}/api/get-media?userId=${encodeURIComponent(CURRENT_USER)}`);
    const mediaList = await res.json();
    if(Array.isArray(mediaList) && mediaList.length > 0) {
      gallery.innerHTML = mediaList.map(item => `
        <div class="media-card">
          <img src="${item.src}" loading="lazy" onclick="openViewer('${item.src}')" />
          <button onclick="deleteMedia('${item._id}')">Delete</button>
        </div>
      `).join("");
    } else {
      gallery.innerHTML = `<div class="empty">No images yet.</div>`;
    }
  } catch(err) {
    gallery.innerHTML = `<div class="empty">Check your internet connection.</div>`;
  }
}

// UPLOAD DIRECT FILE TO MONGODB - NO BASE64
document.getElementById('uploadBtn').onclick = async () => {
  const files = document.getElementById('fileInput').files;
  if (files.length === 0) return alert("Pick images first");

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;

  for(let i = 0; i < files.length; i++) {
    const file = files[i];
    btn.innerText = `Uploading ${i+1}/${files.length}...`;

    const formData = new FormData();
    formData.append('file', file); // SEND RAW FILE
    formData.append('userId', CURRENT_USER);

    try {
      await fetch(`${API_URL}/api/save-media`, {
        method: 'POST',
        body: formData // NO JSON HEADERS
      });
    } catch(err) { alert(`Error: ${err.message}`); }
  }

  document.getElementById('fileInput').value = "";
  btn.disabled = false;
  btn.innerText = "Upload Selected";
  alert(`Upload done! ✅`);
  loadFromDB();
}

async function deleteMedia(id) {
   if(!confirm('Delete this image?')) return;
  await fetch(`${API_URL}/api/delete-media/${id}`, {method: 'DELETE'});
  loadFromDB();
}

function openViewer(url) {
  document.getElementById('viewerContent').innerHTML = `<img src="${url}" />`;
  document.getElementById('viewer').style.display = 'flex';
}
function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = "";
}
</script>
</body>
</html>
