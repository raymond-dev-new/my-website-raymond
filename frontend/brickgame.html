<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nokia Bricks 8x10</title>
<style>
body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 5px; }
#info { display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
#board {
  display: inline-grid;
  grid-template-columns: repeat(8, 30px); /* CHANGED: 8 columns */
  grid-template-rows: repeat(10, 30px); /* 10 rows tall */
  gap: 1px;
  background: #0f0; /* green border like your photo */
  padding: 3px;
  border: 3px solid #0f0;
  margin: 5px auto;
}
.cell { width: 30px; height: 30px; background: #000; }
.cell.filled { background: #0f0; }
.cell.current { background: #ff0; } /* yellow falling brick like your photo */
#controls button { width: 50px; height: 35px; margin: 3px; font-size: 18px; background: #0f0; border: none; color: #000; font-weight: bold; }
#toast {
  position: fixed; top: 10px; right: -200px; background: #ff0; color: #000;
  padding: 8px 15px; font-weight: bold; transition: right 0.3s ease;
}
#toast.show { right: 10px; }
#endScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); display: none;
  justify-content: center; align-items: center;
}
#endBox { background: #000; padding: 20px; border: 2px solid red; }
#endBox h1 { color: red; margin: 0; }
</style>
</head>
<body>

<div id="info">
  <div>SCORE: <span id="score">0</span></div>
  <div>ROWS: <span id="rows">0</span></div>
</div>

<div id="board"></div>

<div id="controls">
  <button onclick="move(-1)">←</button>
  <button onclick="rotate()">↻</button>
  <button onclick="move(1)">→</button>
  <br>
  <button onclick="drop()">↓</button>
</div>

<div id="toast"></div>

<div id="endScreen">
  <div id="endBox">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="start()">RESTART</button>
  </div>
</div>

<script>
const W = 8, H = 10; // CHANGED: 8 columns, 10 rows
let grid = [];
let current = null;
let score = 0;
let rowsCleared = 0;
let gameOver = false;
let SPEED = 1000; // 1 second per drop

const SHAPES = [
  [[1,1],[1,1]], // O
  [[1,1,1,1]], // I
  [[1,0],[1,0],[1,1]], // L
  [[0,1],[0,1],[1,1]], // J
  [[1,1,0],[0,1,1]], // Z
  [[0,1,1],[1,1,0]], // S
  [[1,1,1],[0,1,0]] // T
];

function start() {
  grid = Array(H).fill().map(() => Array(W).fill(0));
  score = 0; rowsCleared = 0; gameOver = false;
  spawn();
  draw();
  document.getElementById('endScreen').style.display = 'none';
  gameLoop = setInterval(tick, SPEED);
}

function spawn() {
  let s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
  current = { shape: s, x: Math.floor(W/2)-1, y: 0 };
  if(!canMove(current, 0, 0)) gameOverNow();
}

function canMove(obj, dx, dy) {
  for(let y=0; y<obj.shape.length; y++){
    for(let x=0; x<obj.shape[0].length; x++){
      if(obj.shape[y][x]){
        let nx = obj.x + x + dx;
        let ny = obj.y + y + dy;
        if(nx<0 || nx>=W || ny>=H || (ny>=0 && grid[ny][nx])) return false;
      }
    }
  }
  return true;
}

function place() {
  for(let y=0; y<current.shape.length; y++){
    for(let x=0; x<current.shape[0].length; x++){
      if(current.shape[y][x]){
        let gy = current.y + y;
        let gx = current.x + x;
        if(gy>=0) grid[gy][gx] = 1;
      }
    }
  }
  checkRows();
  spawn();
}

function checkRows() {
  let cleared = 0;
  for(let y=H-1; y>=0; y--){
    if(grid[y].every(v => v)){
      grid.splice(y, 1);
      grid.unshift(Array(W).fill(0));
      cleared++;
      y++;
    }
  }
  if(cleared > 0){
    rowsCleared += cleared;
    score += cleared * 100 * cleared;
    showToast(cleared + " ROW" + (cleared>1?'S':'') + " CLEARED!");
    updateInfo();
  }
}

function tick() {
  if(gameOver) return;
  if(canMove(current, 0, 1)) {
    current.y++;
  } else {
    place();
  }
  draw();
}

function move(dx) {
  if(gameOver) return;
  if(canMove(current, dx, 0)) current.x += dx;
  draw();
}
function rotate() {
  if(gameOver) return;
  let s = current.shape;
  let newS = s[0].map((_, i) => s.map(row => row[i]).reverse());
  let old = current.shape;
  current.shape = newS;
  if(!canMove(current, 0, 0)) current.shape = old;
  draw();
}

function drop() {
  if(gameOver) return;
  while(canMove(current, 0, 1)) current.y++;
  place();
  draw();
}

function draw() {
  let b = document.getElementById('board');
  b.innerHTML = '';
  for(let y=0; y<H; y++){
    for(let x=0; x<W; x++){
      let cell = document.createElement('div');
      cell.className = 'cell';
      if(grid[y][x]) cell.classList.add('filled');

      if(current){
        for(let sy=0; sy<current.shape.length; sy++){
          for(let sx=0; sx<current.shape[0].length; sx++){
            if(current.shape[sy][sx] && current.y+sy===y && current.x+sx===x){
              cell.classList.add('current');
            }
          }
        }
      }
      b.appendChild(cell);
    }
  }
}

function showToast(text) {
  let t = document.getElementById('toast');
  t.innerText = text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1000);
}

function updateInfo() {
  document.getElementById('score').innerText = score;
  document.getElementById('rows').innerText = rowsCleared;
}

function gameOverNow() {
  gameOver = true;
  clearInterval(gameLoop);
  document.getElementById('finalScore').innerText = score;
  document.getElementById('endScreen').style.display = 'flex';
}

let gameLoop;
window.onload = start;
</script>
</body>
</html>
