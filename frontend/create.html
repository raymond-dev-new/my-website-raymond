<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create - 40s Clear</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px}
.preview{width:100%;min-height:260px;background:#111;border:1px solid #333;border-radius:12px;margin:10px 0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.preview video,.preview img{width:100%;max-height:550px;object-fit:contain}
input,textarea{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
button{width:100%;background:#0095f6;border:0;color:#fff;padding:14px;border-radius:8px;font-weight:700}
#info,#status{font-size:12px;color:#aaa;word-break:break-all}
#progressBar{width:100%;height:5px;background:#222;border-radius:3px;margin-top:8px;display:none}
#progressFill{height:100%;width:0;background:#0095f6;transition:width.2s}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select - 40s max for TikTok clear</div>
<div id="info"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Ready - 40s = clear, no hook</p>
<div id="progressBar"><div id="progressFill"></div></div>
<canvas id="c" hidden></canvas>
</div>
<script>
const BASE_URL="https://raymonddomain.dev";
let token=localStorage.getItem('token');
if(!token) location.replace('login.html');
if(token.startsWith('Bearer ')) token=token.slice(7);

const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const btn=document.getElementById('btn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
const canvas=document.getElementById('c');

let curDur=0, previewUrl=null, previewVideo=null, busy=false;
const MAX_SEC=40; // 40s = clear inside 4.5MB
const MAX_BYTES=4.5*1024*1024;

fileInput.addEventListener('change',()=>{
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  if(previewVideo){ try{previewVideo.pause();}catch{} }
  const f=fileInput.files[0]; if(!f) return;
  previewUrl=URL.createObjectURL(f);
  if(f.type.startsWith('video/')){
    preview.innerHTML='';
    previewVideo=document.createElement('video');
    previewVideo.src=previewUrl; previewVideo.controls=true; previewVideo.playsInline=true; previewVideo.preload='metadata';
    preview.appendChild(previewVideo);
    previewVideo.onloadedmetadata=()=>{
      curDur=previewVideo.duration;
      info.textContent=`${curDur.toFixed(1)}s / ${MAX_SEC}s • ${(f.size/1048576).toFixed(2)}MB`;
      if(curDur>MAX_SEC){
        alert(`For CLEAR TikTok quality use ${MAX_SEC}s max. Your video ${curDur.toFixed(0)}s will be blurry. Trim it.`);
        statusEl.textContent=`Too long for clear - ${curDur.toFixed(0)}s. Use ${MAX_SEC}s`;
      }else{
        statusEl.textContent='✅ Perfect length for clear HD';
      }
    };
  }else{
    preview.innerHTML=`<img src="${previewUrl}">`;
  }
});

// FIXED - NO HOOK - muted play first
function compress40s(file, onProgress){
  return new Promise((resolve,reject)=>{
    if(previewVideo){ try{previewVideo.pause(); previewVideo.muted=true;}catch{} }
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.src=url; v.muted=true; v.playsInline=true; v.preload='auto'; v.loop=false;
    v.style.display='none'; document.body.appendChild(v);

    let recorder,chunks=[],cStream,micStream,combined,finished=false,anim;
    const cleanup=()=>{ cancelAnimationFrame(anim); try{v.pause(); v.remove();}catch{} URL.revokeObjectURL(url); if(cStream) cStream.getTracks().forEach(t=>t.stop()); if(combined) combined.getTracks().forEach(t=>t.stop()); };
    const fail=m=>{ if(finished) return; finished=true; cleanup(); reject(new Error(m)); };

    v.onloadedmetadata=async()=>{
      canvas.width=720; let h=Math.round(720*(v.videoHeight/v.videoWidth)); if(h%2) h++; canvas.height=h||480;
      const ctx=canvas.getContext('2d',{alpha:false});
      ctx.imageSmoothingQuality='high';

      // UNLOCK PLAY - muted first, always works
      try{
        await v.play();
        v.pause(); v.currentTime=0;
      }catch(e){ return fail('Use Chrome - play blocked'); }

      // Now get streams after unlock
      try{ cStream=canvas.captureStream(24); }catch{ return fail('Browser no canvas capture'); }
      let cap=null;
      try{ cap=v.captureStream? v.captureStream() : v.mozCaptureStream(); }catch{}
      let audioTracks = cap? cap.getAudioTracks() : [];

      if(!audioTracks.length){
        // Fallback: no audio track = use video muted but will still have video
        console.log('No audio track in capture, will try anyway');
      }

      combined=new MediaStream();
      combined.addTrack(cStream.getVideoTracks()[0]);
      audioTracks.forEach(t=>combined.addTrack(t));

      const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
      recorder=new MediaRecorder(combined,{mimeType:mime, videoBitsPerSecond:850000, audioBitsPerSecond:96000});
      chunks=[];
      recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{
        if(finished) return; finished=true; cleanup();
        const blob=new Blob(chunks,{type:'video/webm'});
        resolve(new File([blob],'video.mp4',{type:'video/mp4'}));
      };
      recorder.start(100);

      // Draw + play with audio - full length, no cut
      v.muted=false;
      try{ await v.play(); }catch{ v.muted=true; await v.play().catch(()=>{}); }

      function draw(){
        if(finished) return;
        if(v.ended || v.currentTime>=v.duration-0.01){
          setTimeout(()=>{ try{recorder.stop();}catch{} },200);
          return;
        }
        try{ ctx.drawImage(v,0,0,canvas.width,canvas.height); }catch{}
        if(onProgress) onProgress(Math.floor((v.currentTime/v.duration)*100));
        anim=requestAnimationFrame(draw);
      }
      draw();
    };
    v.onerror=()=>fail('Video load failed - try different video');
    setTimeout(()=>{ if(!finished){ try{recorder.stop();}catch{} } }, 70000); // force stop after 70s max
  });
}

async function startUpload(){
  if(busy) return;
  const f=fileInput.files[0]; if(!f) return alert('Select file');
  if(previewVideo){ try{previewVideo.pause(); previewVideo.muted=true;}catch{} }
  busy=true; btn.disabled=true; progressBar.style.display='block'; progressFill.style.width='5%';
  let upFile=f;
  try{
    if(f.type.startsWith('video/')){
      if(f.size>MAX_BYTES || curDur>40){
        statusEl.textContent='Compressing 40s - clear + synced - no hook...';
        upFile=await compress40s(f,p=>{
          progressFill.style.width=(p*0.7)+'%';
          btn.textContent=`Compressing ${p}%`;
        });
        const mb=upFile.size/1048576;
        if(mb>4.5) throw new Error(`Still ${mb.toFixed(2)}MB - record 30s video`);
        statusEl.textContent=`✅ ${mb.toFixed(2)}MB - CLEAR HD`;
      }
    }
    const fd=new FormData(); fd.append('file',upFile); fd.append('caption',document.getElementById('caption').value);
    btn.textContent='Uploading...'; progressFill.style.width='80%';
    const res=await fetch(`${BASE_URL}/api/posts`,{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:fd});
    const txt=await res.text(); console.log(res.status,txt);
    if(!res.ok) throw new Error(txt);
    progressFill.style.width='100%'; location.href='feed.html';
  }catch(e){ alert(e.message); btn.disabled=false; busy=false; btn.textContent='Share'; statusEl.textContent=e.message; progressFill.style.width='0%'; }
}
</script>
</body>
</html>
