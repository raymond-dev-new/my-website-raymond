<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }
   .container { width: 100%; max-width: 480px; margin: auto; padding: 18px; }
    h2 { text-align: center; }
    label { display: block; margin: 16px 0 8px; }
    input[type="file"], textarea { width: 100%; padding: 12px; background: #151515; border: 1px solid #333; border-radius: 8px; color: #fff; }
    textarea { min-height: 90px; resize: vertical; }
   .preview { width: 100%; max-height: 400px; margin-top: 14px; background: #111; border-radius: 10px; object-fit: contain; }
    button { width: 100%; margin-top: 18px; padding: 14px; background: #ff3040; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
   .progress-container { display: none; margin-top: 18px; }
    progress { width: 100%; height: 18px; }
    #status { margin-top: 14px; overflow-wrap: anywhere; line-height: 1.5; }
   .note { color: #aaa; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Post</h2>
    <form id="uploadForm">
      <label for="file">Select an image or video</label>
      <input id="file" name="file" type="file" accept="image/*,video/*" required>
      <p class="note">Maximum file size: 200 MB.</p>
      <video id="videoPreview" class="preview" controls playsinline style="display:none"></video>
      <img id="imagePreview" class="preview" alt="Image preview" style="display:none">
      <label for="caption">Caption</label>
      <textarea id="caption" name="caption" maxlength="2000" placeholder="Write a caption..."></textarea>
      <button id="uploadButton" type="submit">Upload Post</button>
    </form>
    <div id="progressContainer" class="progress-container">
      <p id="progressText">Preparing upload...</p>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script>
    const API_URL = 'https://raymonddomain.dev';
    const MAX_FILE_SIZE = 200 * 1024 * 1024;
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const captionInput = document.getElementById('caption');
    const uploadButton = document.getElementById('uploadButton');
    const videoPreview = document.getElementById('videoPreview');
    const imagePreview = document.getElementById('imagePreview');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const status = document.getElementById('status');
    let previewUrl = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError? '#ff5964' : '#40dc8b';
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      videoPreview.style.display = 'none';
      imagePreview.style.display = 'none';
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      if (!file) return;
      if (file.size > MAX_FILE_SIZE) {
        showStatus('File exceeds the 200 MB limit.', true);
        fileInput.value = '';
        return;
      }
      previewUrl = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        videoPreview.src = previewUrl;
        videoPreview.style.display = 'block';
      } else if (file.type.startsWith('image/')) {
        imagePreview.src = previewUrl;
        imagePreview.style.display = 'block';
      } else {
        showStatus('Your phone returned an unsupported file type.', true);
      }
      showStatus('Selected: ' + file.name + ' (' + (file.size / (1024 * 1024)).toFixed(2) + ' MB)');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) {
        showStatus('Please select a video or image.', true);
        return;
      }
      if (file.size > MAX_FILE_SIZE) {
        showStatus('Maximum file size is 200 MB.', true);
        return;
      }
      const token = localStorage.getItem('token');
      if (!token) {
        showStatus('Please log in first. Your authentication token was not found.', true);
        return;
      }

      uploadButton.disabled = true;
      progressContainer.style.display = 'block';
      progressBar.value = 0;
      progressText.textContent = 'Getting Cloudinary signature...';
      showStatus('Preparing upload...');

      try {
        const sigRes = await fetch(API_URL + '/api/cloudinary-signature', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!sigRes.ok) {
          const err = await sigRes.json();
          throw new Error(err.msg || 'Could not get signature');
        }
        const sigData = await sigRes.json();
        const { timestamp, signature, cloudName, apiKey, folder } = sigData;

        const isVideo = file.type.startsWith('video/') || file.name.toLowerCase().endsWith('.mp4');
        const resourceType = isVideo? 'video' : 'image';

        progressText.textContent = 'Uploading to Cloudinary directly... 0%';
        showStatus('Uploading directly to Cloudinary... Please keep page open.');

        const cloudData = await new Promise((resolve, reject) => {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('api_key', apiKey);
          formData.append('timestamp', timestamp);
          formData.append('signature', signature);
          formData.append('folder', folder);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', 'https://api.cloudinary.com/v1_0/' + cloudName + '/' + resourceType + '/upload');
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              progressBar.value = percent;
              progressText.textContent = 'Uploading: ' + percent + '%';
            } else {
              progressText.textContent = 'Uploading video...';
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                resolve(JSON.parse(xhr.responseText));
              } catch (e) {
                reject(new Error('Invalid Cloudinary response'));
              }
            } else {
              try {
                const err = JSON.parse(xhr.responseText);
                reject(new Error(err.error?.message || 'Cloudinary upload failed'));
              } catch {
                reject(new Error('Cloudinary upload failed with status ' + xhr.status));
              }
            }
          };
          xhr.onerror = () => reject(new Error('Network error during Cloudinary upload'));
          xhr.send(formData);
        });

        progressText.textContent = 'Saving post...';
        showStatus('Finalizing...');

        const postRes = await fetch(API_URL + '/api/posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({
            mediaUrl: cloudData.secure_url,
            publicId: cloudData.public_id,
            type: resourceType,
            caption: captionInput.value.trim(),
            filename: file.name
          })
        });

        let postData = {};
        try {
          postData = await postRes.json();
        } catch (_) {}

        if (!postRes.ok) {
          throw new Error(postData.msg || postData.error || 'Could not save post');
        }

        progressBar.value = 100;
        progressText.textContent = 'Upload complete!';
        showStatus('Post uploaded successfully!');
        form.reset();
        videoPreview.pause();
        videoPreview.removeAttribute('src');
        videoPreview.load();
        imagePreview.removeAttribute('src');
        videoPreview.style.display = 'none';
        imagePreview.style.display = 'none';
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        uploadButton.disabled = false;
      } catch (err) {
        uploadButton.disabled = false;
        showStatus('Upload failed: ' + err.message, true);
        progressText.textContent = 'Upload failed';
      }
    });
  </script>
</body>
</html>
