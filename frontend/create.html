<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px;box-sizing:border-box}
.preview{width:100%;background:#111;min-height:250px;display:flex;justify-content:center;align-items:center;border-radius:12px;border:1px solid #262626;margin:10px 0;overflow:hidden}
.preview video,img{width:100%;max-height:520px}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0;box-sizing:border-box}
button{width:100%;background:#0095f6;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700}
#status{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video (max 2:00)</div>
<div id="info" style="font-size:12px;color:#888"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status"> Create Post ss </p>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script src="upload-manager.js"></script>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='login.html';
let fileInput=document.getElementById('file'), preview=document.getElementById('preview'), info=document.getElementById('info'), statusEl=document.getElementById('status');

fileInput.onchange=()=>{
  const f=fileInput.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    preview.innerHTML=`<video id="vp" src="${url}" controls playsinline muted></video>`;
    document.getElementById('vp').onloadedmetadata=e=>{
      const d=e.target.duration;
      info.innerText=`${Math.floor(d/60)}:${String(Math.floor(d%60)).padStart(2,'0')} / 2:00 - Raw ${(f.size/1024/1024).toFixed(1)}MB`;
      if(d>120){ alert('Max 2 mins'); fileInput.value=''; }
    };
  } else { preview.innerHTML=`<img src="${url}">`; }
};

// FASTEST COMPRESS - 3.5x speed, 15fps, 240p, 100kbps video + 24k audio
function ultraFastCompress(file, onProgress){
 return new Promise((res,rej)=>{
  const v=document.createElement('video');
  v.src=URL.createObjectURL(file);
  v.muted=true; v.playsInline=true; v.crossOrigin="anonymous";
  v.preload="auto";
  const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
  v.onloadedmetadata=()=>{

   // canvas.width=240; canvas.height=Math.round(v.videoHeight*(240/v.videoWidth));
       
     canvas.width=480; canvas.height=Math.round(v.videoHeight*(480/v.videoWidth));

    const canvasStream=canvas.captureStream(24); // 15fps = half CPU = 2x faster
    let audioTracks=[];
    try{ const s=v.captureStream(); audioTracks=s.getAudioTracks(); }catch{}
    const combined=new MediaStream();
    canvasStream.getVideoTracks().forEach(t=>combined.addTrack(t));
    audioTracks.forEach(t=>combined.addTrack(t));

    const chunks=[];
    // 100k video + 24k audio = ULTRA SMALL

    /*const rec=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp8,opus', videoBitsPerSecond:100000, audioBitsPerSecond:24000}); 
     const rec=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp8,opus', videoBitsPerSecond:600000, audioBitsPerSecond:64000}); 
    */

    const rec=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp8,opus', videoBitsPerSecond:250000, audioBitsPerSecond:64000});

    

    rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'}); res(new File([blob],'f.webm',{type:'video/webm'})); };
    rec.start(50);
    v.playbackRate=1.1; // 1:03 = 18 sec to compress
    v.play().then(()=>{
      let last=0;
      function draw(now){
        if(v.ended || v.paused) return;
        if(now-last>66){ // 15fps = draw every 66ms
          ctx.drawImage(v,0,0,canvas.width,canvas.height);
          last=now;
          if(onProgress) onProgress(Math.round((v.currentTime/v.duration)*100));
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    });
    v.onended=()=>setTimeout(()=>rec.stop(),80);
  };
  v.onerror=rej;
 });
}

async function startUpload(){
 const f=fileInput.files[0]; if(!f) return alert('Select file');
 const btn=document.getElementById('btn'); btn.disabled=true; btn.innerText='Preparing...';
 UploadManager.showBar(5,'Preparing fast upload...');

 let up=f;
 if(f.type.startsWith('video')){
   if(f.size > 1.5*1024*1024){ // compress anything over 1.5MB
     statusEl.innerText='Compressing FAST 3.5x with sound...';
     up=await ultraFastCompress(f, (p)=>{
       UploadManager.showBar(5 + Math.round(p*0.5), `Compressing ${p}% (3.5x fast)...`);
     });
     const saved = ((1 - up.size/f.size)*100).toFixed(0);
     statusEl.innerText=`Compressed ${(f.size/1024/1024).toFixed(1)}MB → ${(up.size/1024/1024).toFixed(2)}MB (-${saved}%)`;
   }
 }

 // IMMEDIATE BACKGROUND - go to feed instantly
 const fd=new FormData(); fd.append('file',up); fd.append('caption',document.getElementById('caption').value);
 UploadManager.showBar(70,'Uploading in background... you can leave');
 localStorage.setItem('uploading', JSON.stringify({progress:70, status:'Uploading in background...'}));

 // Go to feed immediately - upload continues
 //location.href='feed.html';

 try{
   await UploadManager.uploadWithProgress(fd, token, (p)=>{
     UploadManager.showBar(70 + Math.round(p*0.3), `Uploading ${p}% (top bar)`);
     localStorage.setItem('uploading', JSON.stringify({progress:70+p*0.3, status:`Uploading ${p}%...`}));
   });
   localStorage.removeItem('uploading');
 }catch(e){
   localStorage.setItem('uploading', JSON.stringify({progress:0, status:'Failed: '+e.message}));
 }
}
</script>
</body>
</html>
