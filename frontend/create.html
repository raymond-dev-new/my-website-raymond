<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px;box-sizing:border-box}
.preview{width:100%;background:#111;min-height:250px;display:flex;justify-content:center;align-items:center;border-radius:12px;border:1px solid #262626;margin:10px 0;overflow:hidden;text-align:center;color:#777;font-size:13px}
.preview video,img{width:100%;max-height:520px}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0;box-sizing:border-box}
button{width:100%;background:#0095f6;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700}
#status{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video max 2:00<br>4MB max synced</div>
<div id="info" style="font-size:12px;color:#888"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">4MB - voice synced fix</p>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script src="upload-manager.js"></script>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='login.html';
let fileInput=document.getElementById('file'), preview=document.getElementById('preview'), info=document.getElementById('info'), statusEl=document.getElementById('status');

fileInput.onchange=()=>{
  const f=fileInput.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    preview.innerHTML=`<video id="vp" src="${url}" controls playsinline></video>`;
    document.getElementById('vp').onloadedmetadata=e=>{
      const d=e.target.duration;
      info.innerText=`${Math.floor(d/60)}:${String(Math.floor(d%60)).padStart(2,'0')} - ${(f.size/1024/1024).toFixed(1)}MB → ~4MB`;
      if(d>120){ alert('Max 2 min'); fileInput.value=''; }
    };
  } else { preview.innerHTML=`<img src="${url}">`; }
};

function compressSynced(file, onProgress){
 return new Promise((res,rej)=>{
  const v=document.createElement('video');
  v.src=URL.createObjectURL(file);
  v.muted=false; // MUST false for synced voice
  v.volume=1;
  v.playsInline=true;
  v.preload="auto";
  const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');

  v.onloadedmetadata=async()=>{
    canvas.width=360; canvas.height=Math.round(v.videoHeight*(360/v.videoWidth));
    if(canvas.height%2) canvas.height++;

    // Wait user gesture already done (Share click) so audio allowed
    try{ await v.play(); v.pause(); v.currentTime=0; }catch(e){}

    // Get ONE stream that has both video+audio together = perfect sync
    let stream;
    try{
      if(v.captureStream) stream=v.captureStream(24);
      else if(v.mozCaptureStream) stream=v.mozCaptureStream(24);
      else throw new Error('no captureStream');
    }catch(e){ return rej(new Error('Phone does not support compress - will upload original')); }

    // Replace video track with canvas track (for 360p)
    const canvasStream=canvas.captureStream(24);
    const vTrack=canvasStream.getVideoTracks()[0];
    const aTracks=stream.getAudioTracks();
    const combined=new MediaStream();
    combined.addTrack(vTrack);
    aTracks.forEach(t=>combined.addTrack(t));

    const chunks=[];
    const rec=new MediaRecorder(combined,{
      mimeType:'video/webm;codecs=vp8,opus',
      videoBitsPerSecond:220000, // 220k + 48k = 4MB max for 120s
      audioBitsPerSecond:48000
    });
    rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop=()=> res(new File([new Blob(chunks)],'video.webm',{type:'video/webm'}));

    rec.start(100);
    // Start together
    v.playbackRate=1;
    v.currentTime=0;
    v.play().catch(rej);

    function draw(){
      if(v.ended) return;
      ctx.drawImage(v,0,0,canvas.width,canvas.height);
      onProgress(Math.round((v.currentTime/v.duration)*100));
      if(!v.ended) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    v.onended=()=> setTimeout(()=>rec.stop(), 200);
  };
  v.onerror=()=>rej(new Error('load failed'));
 });
}

async function startUpload(){
 const f=fileInput.files[0]; if(!f) return alert('Select file');
 const btn=document.getElementById('btn'); btn.disabled=true;
 UploadManager.showBar(5,'Preparing...');

 let up=f;
 if(f.type.startsWith('video')){
   // If file already <4.5MB, skip compress = instant perfect sync
   if(f.size <= 4.5*1024*1024){
     statusEl.innerText=`${(f.size/1024/1024).toFixed(2)}MB already under 4MB - uploading directly perfect sync`;
     up=f;
   } else {
     try{
       statusEl.innerText='Compressing to 4MB - normal voice synced (1x speed - 2min takes 2min)';
       up=await compressSynced(f, (p)=>{
         UploadManager.showBar(5+Math.round(p*0.6), `Compressing ${p}% - voice synced`);
         statusEl.innerText=`Compressing ${p}% - voice locked to video`;
         btn.innerText=`${p}%`;
       });
     }catch(e){
       console.log(e.message);
       statusEl.innerText='Phone blocked compression, uploading original with perfect sync';
       up=f;
     }
   }
 }

 const fd=new FormData(); fd.append('file',up); fd.append('caption',document.getElementById('caption').value);
 UploadManager.showBar(70,'Uploading...');
 try{
   await UploadManager.uploadWithProgress(fd, token, p=>{
     UploadManager.showBar(70+Math.round(p*0.3), `Uploading ${p}%`);
     statusEl.innerText=`Uploading ${p}% - ${(up.size/1024/1024).toFixed(2)}MB`;
   });
   UploadManager.showBar(100,'Done ✅');
   setTimeout(()=>location.href='feed.html',600);
 }catch(e){ btn.disabled=false; btn.innerText='Share'; statusEl.innerText='Fail: '+e.message; }
}
</script>
</body>
</html>
