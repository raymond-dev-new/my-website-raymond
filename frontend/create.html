<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px}
.preview{width:100%;min-height:250px;background:#111;border:1px solid #262626;border-radius:12px;margin:10px 0;overflow:hidden;display:flex;justify-content:center;align-items:center;text-align:center;color:#888;font-size:13px}
.preview video,.preview img{display:block;width:100%;max-height:520px;object-fit:contain}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
button{width:100%;background:#0095f6;border:0;color:#fff;padding:14px;border-radius:8px;font-weight:700}
button:disabled{opacity:.6}
#status,#info{font-size:12px;color:#999;overflow-wrap:anywhere}
#progressBar{width:100%;height:5px;background:#262626;border-radius:3px;margin-top:8px;overflow:hidden;display:none}
#progressFill{height:100%;width:0;background:#0095f6;transition:width.2s}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video - MAX 2:00 - Compress to 3MB</div>
<div id="info"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Max 2min - auto compress to 3MB - voice synced</p>
<div id="progressBar"><div id="progressFill"></div></div>
<canvas id="canvas" hidden></canvas>
</div>
<script>
'use strict';
const BASE_URL = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.replace('login.html');

const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const info = document.getElementById('info');
const statusEl = document.getElementById('status');
const btn = document.getElementById('btn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const canvas = document.getElementById('canvas');

let currentDuration = 0;
let previewUrl = null;
let busy = false;

function setStatus(m,c='#999'){statusEl.textContent=m;statusEl.style.color=c;}
function clearPreviewUrl(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;}}

fileInput.addEventListener('change',()=>{
  clearPreviewUrl(); info.textContent=''; currentDuration=0;
  const file=fileInput.files[0]; if(!file) return;
  previewUrl=URL.createObjectURL(file);
  if(file.type.startsWith('video/')){
    preview.replaceChildren();
    const video=document.createElement('video');
    video.src=previewUrl; video.controls=true; video.playsInline=true; video.preload='metadata';
    preview.appendChild(video);
    video.addEventListener('loadedmetadata',()=>{
      currentDuration=video.duration;
      if(currentDuration>120){
        fileInput.value=''; currentDuration=0; clearPreviewUrl();
        preview.textContent='❌ Too long - 2min max';
        setStatus('❌ VIDEO TOO LONG - 2 MINUTES ONLY','#ff453a');
        alert('VIDEO TOO LONG - 2 MINUTES ONLY');
        return;
      }
      const d=Math.floor(currentDuration/60)+':'+String(Math.floor(currentDuration%60)).padStart(2,'0');
      info.textContent=`${d} / 2:00 • Original ${(file.size/1048576).toFixed(2)}MB → will compress to ~2.5MB`;
      setStatus('Ready - will compress to 3MB');
    });
  }else{
    const img=document.createElement('img'); img.src=previewUrl; preview.replaceChildren(img);
    info.textContent=`Image ${(file.size/1048576).toFixed(2)}MB`;
    setStatus('Image ready');
  }
});

// 2 MIN → 3MB COMPRESS - NO FFMPEG - FAST - VOICE SYNCED
function compressTo3MB(file,onProgress){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    const a=document.createElement('audio');
    v.src=url; a.src=url;
    v.muted=true; a.muted=false;
    v.playsInline=true; a.playsInline=true;
    v.preload='auto'; a.preload='auto';
    v.crossOrigin='anonymous'; a.crossOrigin='anonymous';

    let recorder=null,canvasStream=null,audioStream=null,anim=0,finished=false,ready=0,chunks=[];

    const cleanup=()=>{
      cancelAnimationFrame(anim);
      if(canvasStream) canvasStream.getTracks().forEach(t=>t.stop());
      if(audioStream) audioStream.getTracks().forEach(t=>t.stop());
      URL.revokeObjectURL(url);
    };

    const fail=(m)=>{
      if(finished) return;
      finished=true;
      try{if(recorder && recorder.state!=='inactive') recorder.stop();}catch{}
      cleanup();
      reject(new Error(m));
    };

    function tryStart(){
      ready++; if(ready<2 || finished) return;

      // 320p - tiny size for 2min
      canvas.width=320;
      let h=Math.round(320*(v.videoHeight||320)/(v.videoWidth||320));
      if(h%2) h++; canvas.height=h||320;

      const ctx=canvas.getContext('2d');
      if(!ctx){fail('Canvas fail');return;}

      canvasStream=canvas.captureStream(20);

      try{
        if(typeof a.captureStream==='function') audioStream=a.captureStream();
        else if(typeof a.mozCaptureStream==='function') audioStream=a.mozCaptureStream();
      }catch(e){}

      if(!audioStream ||!audioStream.getAudioTracks().length){
        fail('Audio capture blocked - use Chrome Android');
        return;
      }

      const combined=new MediaStream([...canvasStream.getVideoTracks(),...audioStream.getAudioTracks()]);

      // vp8 + opus = smallest for Vercel
      const mime=['video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';

      try{
        recorder=new MediaRecorder(combined,{
          mimeType:mime,
          videoBitsPerSecond:120000, // 120k = 2min = 1.8MB video
          audioBitsPerSecond:32000 // 32k = 2min = 0.5MB audio = total ~2.3MB
        });
      }catch(e){fail('Recorder not supported');return;}

      chunks=[];
      recorder.ondataavailable=e=>{if(e.data && e.data.size>0) chunks.push(e.data);};

      recorder.onstop=()=>{
        if(finished) return; finished=true;
        const blob=new Blob(chunks,{type:mime});
        cleanup();
        if(!blob.size){reject(new Error('Empty video'));return;}
        // Send as mp4 mimetype to match your backend contentType: 'video/mp4'
        resolve(new File([blob],'video.mp4',{type:'video/mp4',lastModified:Date.now()}));
      };

      function draw(){
        if(finished || v.ended || a.ended) return;
        try{ctx.drawImage(v,0,0,canvas.width,canvas.height);}catch{}
        if(onProgress) onProgress(Math.min(99,Math.floor((v.currentTime/v.duration)*100)));
        anim=requestAnimationFrame(draw);
      }

      recorder.start(100);
      Promise.all([v.play().catch(()=>{}), a.play().catch(()=>{})]).then(()=>draw()).catch(()=>fail('Play blocked - tap screen'));

      const stop=()=>{if(recorder && recorder.state!=='inactive') try{recorder.stop();}catch{}};
      v.onended=stop; a.onended=stop;
    }

    v.onloadedmetadata=tryStart;
    a.onloadedmetadata=tryStart;
    v.onerror=()=>fail('Video load fail');
    a.onerror=()=>fail('Audio load fail');
    setTimeout(()=>{if(!finished && ready<2) fail('Load timeout - try smaller video');},15000);
  });
}

async function startUpload(){
  if(busy) return;
  const file=fileInput.files[0];
  if(!file){alert('Select file');return;}
  if(file.type.startsWith('video/') && currentDuration>120){alert('VIDEO TOO LONG - 2 MINUTES ONLY');return;}

  busy=true; btn.disabled=true; btn.textContent='Preparing...';
  progressBar.style.display='block'; progressFill.style.width='0%';

  let uploadFile=file;

  try{
    if(file.type.startsWith('video/')){
      setStatus('Compressing to 3MB - voice synced...');
      uploadFile=await compressTo3MB(file,p=>{
        progressFill.style.width=Math.round(p*0.5)+'%';
        btn.textContent=`Compressing ${p}%`;
        setStatus(`Compressing ${p}% → 3MB max`);
      });

      const mb=uploadFile.size/1048576;
      if(mb>4){throw new Error(`Still ${mb.toFixed(2)}MB - try shorter video (max 2min)`);}
      setStatus(`✅ ${(file.size/1048576).toFixed(1)}MB → ${mb.toFixed(2)}MB - OK`,'#0f0');
      progressFill.style.width='60%';
    }

    const fd=new FormData();
    fd.append('file', uploadFile, uploadFile.name);
    fd.append('caption', document.getElementById('caption').value.trim());

    btn.textContent='Uploading...';

    const res = await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      xhr.open('POST', `${BASE_URL}/api/posts`, true);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      xhr.upload.onprogress=e=>{
        if(e.lengthComputable){
          const per=Math.round((e.loaded/e.total)*100);
          progressFill.style.width=(60+Math.round(per*0.4))+'%';
          btn.textContent=`Uploading ${per}%`;
          setStatus(`Uploading ${per}% - ${(uploadFile.size/1048576).toFixed(2)}MB ✅`);
          if(per>95) setStatus('Saving...');
        }
      };
      xhr.onload=()=>{
        if(xhr.status>=200 && xhr.status<300){
          try{resolve(JSON.parse(xhr.responseText));}catch{resolve({});}
        }else{
          reject(new Error(xhr.responseText||`Failed ${xhr.status}`));
        }
      };
      xhr.onerror=()=>reject(new Error('Network error - check internet'));
      xhr.send(fd);
    });

    progressFill.style.width='100%';
    setStatus('Done!','#0f0');
    btn.textContent='Done';
    setTimeout(()=>location.href='feed.html',700);

  }catch(e){
    console.error(e);
    let msg=e.message;
    try{const j=JSON.parse(msg); if(j.msg) msg=j.msg;}catch{}
    setStatus('Failed: '+msg,'#ff453a');
    btn.disabled=false; btn.textContent='Share'; busy=false;
  }
}
</script>
</body>
</html>
