<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;min-height:100vh}
.box{width:100%;max-width:480px;padding:16px;box-sizing:border-box}
h3{margin:10px 0}
input[type=file]{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:10px 0;box-sizing:border-box}
textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:10px 0;min-height:70px;box-sizing:border-box}
button.postBtn{width:100%;background:#0095f6;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
button.postBtn:disabled{background:#004a7a}
.preview{width:100%;background:#111;min-height:250px;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;margin:10px 0;flex-direction:column;border:1px solid #262626}
.preview video,.preview img{width:100%;max-height:520px;object-fit:contain}
#status{font-size:13px;color:#aaa;margin-top:12px;white-space:pre-line;word-break:break-all}
#durInfo{font-size:13px;color:#888;margin:8px 0}
</style>
</head>
<body>
<div class="box">
<h3>Create Post ss</h3>
<input type="file" id="file" accept="image/*,video/*">
<div class="preview" id="preview">No file selected</div>
<div id="durInfo"></div>
<textarea id="caption" placeholder="Write a caption..."></textarea>
<button class="postBtn" id="shareBtn" onclick="upload()">Share</button>
<p id="status"></p>
<canvas id="canvas" style="display:none"></canvas>
</div>

<script>
const BASE = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.href = "login.html";

const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const durInfo = document.getElementById('durInfo');
const statusEl = document.getElementById('status');
let videoDuration = 0;

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  if(file.type.startsWith('video')){
    preview.innerHTML = `<video id="vPrev" src="${url}" controls playsinline style="width:100%"></video>`;
    const v = document.getElementById('vPrev');
    v.onloadedmetadata = () => {
      videoDuration = v.duration;
      const mins = Math.floor(videoDuration/60);
      const secs = Math.floor(videoDuration%60);
      const sizeMB = (file.size/1024/1024).toFixed(1);
      durInfo.innerText = `Duration: ${mins}:${String(secs).padStart(2,'0')} / 2:00 max - Raw: ${sizeMB}MB`;
      if(videoDuration > 120){
        durInfo.innerHTML = `<span style="color:#ff3040">❌ Too long ${mins}:${String(secs).padStart(2,'0')} - Max 2:00</span>`;
        fileInput.value = '';
        preview.innerHTML = 'Choose video under 2 minutes';
      }
    };
  }else{
    videoDuration = 0;
    preview.innerHTML = `<img src="${url}">`;
    durInfo.innerText = `Image: ${(file.size/1024/1024).toFixed(2)}MB`;
  }
};

function compressTo4MB(file){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.crossOrigin = "anonymous";
    video.src = URL.createObjectURL(file);
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    video.onloadedmetadata = () => {
      const targetWidth = 480;
      const ratio = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * ratio;

      const stream = canvas.captureStream(24);
      const chunks = [];

      let mime = 'video/webm;codecs=vp9';
      if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      const recorder = new MediaRecorder(stream, {
        mimeType: mime,
        videoBitsPerSecond: 300000
      });

      recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, {type:'video/webm'});
        const newFile = new File([blob], 'compressed.webm', {type:'video/webm'});
        resolve(newFile);
      };

      recorder.start(100);
      video.play();

      function draw(){
        if(!video.paused &&!video.ended){
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          requestAnimationFrame(draw);
        } else {
          setTimeout(()=>{ if(recorder.state!=='inactive') recorder.stop(); }, 300);
        }
      }
      draw();
      video.onended = () => { if(recorder.state!=='inactive') recorder.stop(); };
    };
    video.onerror = () => reject(new Error('Video load failed'));
    video.load();
  });
}

async function upload(){
  const file = fileInput.files[0];
  if(!file) return alert('Select file first');
  if(file.type.startsWith('video') && videoDuration > 120) return alert('Max 2 minutes allowed');

  const btn = document.getElementById('shareBtn');
  btn.disabled = true;
  btn.innerText = 'Processing...';

  let fileToUpload = file;

  try{
    if(file.type.startsWith('video')){
      statusEl.innerText = `Compressing to <4MB for Vercel...\nOriginal: ${(file.size/1024/1024).toFixed(2)}MB`;
      fileToUpload = await compressTo4MB(file);
      statusEl.innerText = `Compressed: ${(file.size/1024/1024).toFixed(2)}MB → ${(fileToUpload.size/1024/1024).toFixed(2)}MB\nUploading...`;
    }else{
      statusEl.innerText = `Uploading image...`;
    }

    const fd = new FormData();
    fd.append('file', fileToUpload);
    fd.append('caption', document.getElementById('caption').value);

    const res = await fetch(BASE + '/api/posts', {
      method: 'POST',
      headers: { authorization: token },
      body: fd
    });

    const text = await res.text();
    let data;
    try{ data = JSON.parse(text); }catch{ data = {msg:text}; }

    if(!res.ok) throw new Error(data.msg || text.slice(0,150));

    statusEl.innerText = 'Posted successfully!';
    setTimeout(()=> location.href='feed.html', 800);

  }catch(e){
    console.error(e);
    let msg = e.message;
    if(msg.includes('Request Entity') || msg.includes('Too Large')) msg = 'Vercel limit 4.5MB exceeded. Compression failed, try shorter video.';
    statusEl.innerText = 'Error: ' + msg;
    btn.disabled = false;
    btn.innerText = 'Share';
  }
}
</script>
</body>
</html>
