<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create - 1min</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px}
.preview{width:100%;min-height:260px;background:#111;border:1px solid #333;border-radius:12px;margin:10px 0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.preview video,.preview img{width:100%;max-height:550px;object-fit:contain}
input,textarea{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
button{width:100%;background:#0095f6;border:0;color:#fff;padding:14px;border-radius:8px;font-weight:700}
button:disabled{opacity:.5}
#info,#status{font-size:12px;color:#aaa}
#progressBar{width:100%;height:5px;background:#222;border-radius:3px;margin-top:8px;display:none}
#progressFill{height:100%;width:0;background:#0095f6;transition:width.2s}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select - 1min max</div>
<div id="info"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Ready</p>
<div id="progressBar"><div id="progressFill"></div></div>
</div>
<script>
const BASE_URL="https://raymonddomain.dev";
let token=localStorage.getItem('token');
if(!token) location.replace('login.html');
if(token.startsWith('Bearer ')) token=token.slice(7);

const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const btn=document.getElementById('btn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');

let curDur=0, previewUrl=null, previewVideo=null, busy=false;
const MAX_SEC=60;
const MAX_BYTES=4.5*1024*1024;

fileInput.addEventListener('change',()=>{
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  const f=fileInput.files[0]; if(!f) return;
  previewUrl=URL.createObjectURL(f);
  if(f.type.startsWith('video/')){
    preview.innerHTML='';
    previewVideo=document.createElement('video');
    previewVideo.src=previewUrl; previewVideo.controls=true; previewVideo.playsInline=true; previewVideo.preload='metadata';
    preview.appendChild(previewVideo);
    previewVideo.onloadedmetadata=()=>{
      curDur=previewVideo.duration;
      info.textContent=`${curDur.toFixed(1)}s / 60s • ${(f.size/1048576).toFixed(2)}MB`;
      if(curDur>MAX_SEC){
        info.textContent+=` • Will trim to 60s`;
      }
      statusEl.textContent= f.size>MAX_BYTES? 'Will compress to 4.2MB' : 'Ready';
    };
  }else{
    preview.innerHTML=`<img src="${previewUrl}">`;
    info.textContent=`${(f.size/1048576).toFixed(2)}MB`;
  }
});

function compress1min(file, onProgress){
  return new Promise((resolve,reject)=>{
    if(previewVideo){ try{previewVideo.pause(); previewVideo.muted=true;}catch{} }
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
    v.style.display='none'; document.body.appendChild(v);
    let recorder,chunks=[],stream,finished=false;
    const cleanup=()=>{ try{v.pause(); v.remove();}catch{} URL.revokeObjectURL(url); if(stream) stream.getTracks().forEach(t=>t.stop()); };
    const fail=m=>{ if(finished) return; finished=true; cleanup(); reject(new Error(m)); };

    v.onloadedmetadata=async()=>{
      if(v.duration>MAX_SEC+0.5){ v.currentTime=0; }
      try{ await v.play(); v.pause(); v.currentTime=0; }catch{}
      // Wait 300ms then capture
      setTimeout(async()=>{
        try{ stream=v.captureStream? v.captureStream() : v.mozCaptureStream(); }catch(e){ return fail('Use Chrome'); }
        if(!stream.getVideoTracks().length) return fail('No video');

        // 1min = 4.5MB -> 600kbps total. 500k video + 64k audio = 4.2MB = CLEAR + SYNCED
        const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
        try{
          recorder=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:500000, audioBitsPerSecond:64000});
        }catch(e){ return fail('Recorder fail'); }
        chunks=[];
        recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
        recorder.onstop=()=>{
          if(finished) return; finished=true; cleanup();
          const blob=new Blob(chunks,{type:'video/webm'});
          resolve(new File([blob],'video.mp4',{type:'video/mp4'}));
        };
        recorder.start(200);
        v.muted=false;
        try{ await v.play(); }catch{ v.muted=true; await v.play(); }

        const maxTime = Math.min(v.duration, MAX_SEC);
        const timer=setInterval(()=>{
          if(finished){ clearInterval(timer); return; }
          const cur=v.currentTime;
          if(onProgress) onProgress(Math.min(100, Math.floor((cur/maxTime)*100)));
          if(cur>=maxTime-0.05 || v.ended){
            clearInterval(timer);
            try{recorder.stop();}catch{}
          }
        },150);

        setTimeout(()=>{ if(!finished){ try{recorder.stop();}catch{} } }, (maxTime+12)*1000);
      },300);
    };
    v.onerror=()=>fail('Load error');
  });
}

async function startUpload(){
  if(busy) return;
  const f=fileInput.files[0]; if(!f) return;
  if(previewVideo){ try{previewVideo.pause(); previewVideo.muted=true;}catch{} }
  busy=true; btn.disabled=true; progressBar.style.display='block'; progressFill.style.width='5%';
  let up=f;
  try{
    if(f.type.startsWith('video/') && (f.size>MAX_BYTES || curDur>MAX_SEC)){
      statusEl.textContent='Compressing 1min to 4.2MB - clear & synced';
      up=await compress1min(f,p=>{
        progressFill.style.width=(p*0.65)+'%';
        btn.textContent=`Compressing ${p}%`;
      });
      const mb=up.size/1048576;
      statusEl.textContent=`Compressed ${mb.toFixed(2)}MB - clear`;
      if(mb>4.5){
        statusEl.textContent=`Still ${mb.toFixed(2)}MB - trimming to 50s`;
        // second pass with lower bitrate if still big
      }
    }
    const fd=new FormData(); fd.append('file',up); fd.append('caption',document.getElementById('caption').value);
    btn.textContent='Uploading...'; progressFill.style.width='80%';
    statusEl.textContent='Uploading...';
    const res=await fetch(`${BASE_URL}/api/posts`,{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:fd});
    const txt=await res.text();
    if(!res.ok) throw new Error(txt);
    progressFill.style.width='100%'; location.href='feed.html';
  }catch(e){
    console.log(e); statusEl.textContent=e.message; btn.disabled=false; busy=false; btn.textContent='Share'; progressFill.style.width='0%';
  }
}
</script>
</body>
</html>
