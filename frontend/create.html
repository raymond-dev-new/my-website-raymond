<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Post</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px}
.preview{width:100%;min-height:260px;background:#111;border:1px solid #262626;border-radius:12px;margin:10px 0;overflow:hidden;display:flex;justify-content:center;align-items:center;color:#888}
.preview video,.preview img{width:100%;max-height:540px;object-fit:contain;display:block}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
button{width:100%;background:#0095f6;border:0;color:#fff;padding:14px;border-radius:8px;font-weight:700}
button:disabled{opacity:.6}
#info,#status{font-size:12px;color:#999;overflow-wrap:anywhere}
#progressBar{width:100%;height:5px;background:#262626;border-radius:3px;margin-top:8px;overflow:hidden;display:none}
#progressFill{height:100%;width:0;background:#0095f6;transition:width.2s}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video - MAX 3:00 - Clear + Synced Voice</div>
<div id="info"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Ready</p>
<div id="progressBar"><div id="progressFill"></div></div>
<canvas id="canvas" hidden></canvas>
</div>
<script>
const BASE_URL="https://raymonddomain.dev";
let token=localStorage.getItem('token');
if(!token) location.replace('login.html');
if(token.startsWith('Bearer ')) token=token.slice(7);

const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const btn=document.getElementById('btn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
const canvas=document.getElementById('canvas');

let currentDuration=0, previewUrl=null, busy=false;
const MAX_SECONDS=180;
const setStatus=(m,c='#999')=>{statusEl.textContent=m; statusEl.style.color=c;};

fileInput.addEventListener('change',()=>{
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  const file=fileInput.files[0]; if(!file) return;
  previewUrl=URL.createObjectURL(file);
  if(file.type.startsWith('video/')){
    preview.innerHTML='';
    const v=document.createElement('video');
    v.src=previewUrl; v.controls=true; v.playsInline=true; v.preload='metadata';
    preview.appendChild(v);
    v.onloadedmetadata=()=>{
      currentDuration=v.duration;
      if(currentDuration>MAX_SECONDS){
        alert('VIDEO TOO LONG - 3 MINUTES ONLY');
        fileInput.value=''; preview.textContent='Too long';
        return;
      }
      info.textContent=`${Math.floor(currentDuration/60)}:${String(Math.floor(currentDuration%60)).padStart(2,'0')} / 3:00 • ${(file.size/1048576).toFixed(1)}MB`;
      setStatus('Ready');
    };
  } else {
    preview.innerHTML=`<img src="${previewUrl}">`;
    info.textContent=`${(file.size/1048576).toFixed(1)}MB image`;
  }
});

function compressTo3MB(file,onProgress){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const video=document.createElement('video');
    video.src=url; video.muted=false; video.playsInline=true; video.preload='auto'; video.crossOrigin='anonymous';
    let recorder,chunks=[],canvasStream,anim,finished=false;
    const cleanup=()=>{cancelAnimationFrame(anim); if(canvasStream) canvasStream.getTracks().forEach(t=>t.stop()); URL.revokeObjectURL(url);};
    const fail=m=>{if(finished) return; finished=true; try{if(recorder&&recorder.state!=='inactive') recorder.stop();}catch{} cleanup(); reject(new Error(m));};

    video.onloadedmetadata=()=>{
      canvas.width=640;
      let h=Math.round(640*(video.videoHeight/video.videoWidth));
      if(h%2) h++; canvas.height=h||360;
      const ctx=canvas.getContext('2d',{alpha:false});
      let cap;
      try{ cap=video.captureStream? video.captureStream() : video.mozCaptureStream(); }catch{ return fail('Use Chrome / Edge'); }
      const audioTracks=cap.getAudioTracks();
      if(!audioTracks.length) return fail('No audio track - re-record video with sound');
      canvasStream=canvas.captureStream(30);
      const combined=new MediaStream([canvasStream.getVideoTracks()[0],...audioTracks]);

      let vBps=220000, aBps=64000;
      if(video.duration>90) vBps=140000;
      if(video.duration>150) vBps=100000;

      const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
      recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:vBps,audioBitsPerSecond:aBps});
      recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data);};
      recorder.onstop=()=>{if(finished) return; finished=true; cleanup(); const blob=new Blob(chunks,{type:'video/webm'}); resolve(new File([blob],'video.mp4',{type:'video/mp4'}));};
      function draw(){
        if(finished) return;
        if(video.ended){ recorder.stop(); return; }
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        if(onProgress) onProgress(Math.floor((video.currentTime/video.duration)*100));
        anim=requestAnimationFrame(draw);
      }
      recorder.start(100);
      video.play().then(draw).catch(()=>fail('Play blocked'));
    };
    video.onerror=()=>fail('Video load failed');
  });
}

async function startUpload(){
  if(busy) return;
  const file=fileInput.files[0]; if(!file) return alert('Select file');
  if(file.type.startsWith('video/')&&currentDuration>MAX_SECONDS) return alert('3 MINUTES ONLY');
  busy=true; btn.disabled=true; progressBar.style.display='block'; progressFill.style.width='0%';
  let uploadFile=file;
  try{
    if(file.type.startsWith('video/')){
      setStatus('Compressing - clear + synced...');
      uploadFile=await compressTo3MB(file,p=>{
        progressFill.style.width=(p*0.5)+'%';
        btn.textContent=`Compressing ${p}%`;
        setStatus(`Compressing ${p}% - audio synced`);
      });
      const mb=uploadFile.size/1048576;
      if(mb>4) throw new Error(`Still ${mb.toFixed(2)}MB - try 2min`);
      setStatus(`✅ ${mb.toFixed(2)}MB - ready to upload`,'#0f0');
      progressFill.style.width='60%';
    }
    const fd=new FormData();
    fd.append('file',uploadFile);
    fd.append('caption',document.getElementById('caption').value);
    btn.textContent='Uploading...';
    const res=await fetch(`${BASE_URL}/api/posts`,{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:fd});
    const txt=await res.text(); console.log(res.status,txt);
    if(!res.ok) throw new Error(txt);
    progressFill.style.width='100%'; setStatus('Uploaded!','#0f0');
    location.href='feed.html';
  }catch(e){
    console.error(e); setStatus(e.message,'#ff453a'); alert(e.message);
    btn.disabled=false; busy=false; btn.textContent='Share';
  }
}
</script>
</body>
</html>
