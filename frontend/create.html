<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px;box-sizing:border-box}
.preview{width:100%;background:#111;min-height:250px;display:flex;justify-content:center;align-items:center;border-radius:12px;border:1px solid #262626;margin:10px 0;overflow:hidden;text-align:center;color:#777;font-size:13px}
.preview video,img{width:100%;max-height:520px}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0;box-sizing:border-box}
button{width:100%;background:#0095f6;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700}
#status{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video max 2:00 → 4MB.</div>
<div id="info" style="font-size:12px;color:#888"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Phone fixed - 4MB - synced</p>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script src="upload-manager.js"></script>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='login.html';

let fileInput=document.getElementById('file'), preview=document.getElementById('preview'), info=document.getElementById('info'), statusEl=document.getElementById('status');

fileInput.onchange=()=>{
  const f=fileInput.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    preview.innerHTML=`<video id="vp" src="${url}" controls playsinline></video>`;
    document.getElementById('vp').onloadedmetadata=e=>{
      const d=e.target.duration;
      info.innerText=`${Math.floor(d/60)}:${String(Math.floor(d%60)).padStart(2,'0')} - ${(f.size/1024/1024).toFixed(1)}MB → ~4MB`;
      if(d>120){ alert('Max 2 min'); fileInput.value=''; }
    };
  } else { preview.innerHTML=`<img src="${url}">`; }
};

// PHONE FIXED: separate video and audio elements
function compressPhoneFixed(file, onProgress){
 return new Promise((res,rej)=>{
  const url = URL.createObjectURL(file);
  const v = document.createElement('video'); // for picture only - MUTED
  const a = document.createElement('audio'); // for voice only - NORMAL
  v.src=url; a.src=url;
  v.muted=true; a.muted=false;
  v.playsInline=true; a.playsInline=true;
  v.preload="auto"; a.preload="auto";
  v.crossOrigin="anonymous"; a.crossOrigin="anonymous";

  const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');

  let loaded=0;
  function tryStart(){
    loaded++;
    if(loaded<2) return;

    canvas.width=360;
    canvas.height=Math.round(v.videoHeight*(360/v.videoWidth))||360;
    if(canvas.height%2) canvas.height++;

    const canvasStream=canvas.captureStream(20);
    let audioStream;
    try{ audioStream=a.captureStream(); }catch(e){ audioStream=a.mozCaptureStream? a.mozCaptureStream() : null; }

    if(!audioStream ||!audioStream.getAudioTracks().length){
      return rej(new Error('Audio capture blocked'));
    }

    const combined=new MediaStream();
    combined.addTrack(canvasStream.getVideoTracks()[0]);
    audioStream.getAudioTracks().forEach(t=>combined.addTrack(t));

    const chunks=[];
    const rec=new MediaRecorder(combined,{
      mimeType:'video/webm;codecs=vp8,opus',
      videoBitsPerSecond:200000, // 200k = 4MB max for 2min
      audioBitsPerSecond:48000
    });
    rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop=()=> res(new File([new Blob(chunks,{type:'video/webm'})],'video.webm',{type:'video/webm'}));
    rec.start(100);

    // sync start
    v.currentTime=0; a.currentTime=0;
    v.playbackRate=1; a.playbackRate=1;

    Promise.all([v.play(), a.play()]).then(()=>{
      function draw(){
        if(v.ended || a.ended) return;
        ctx.drawImage(v,0,0,canvas.width,canvas.height);
        const pct=Math.round((v.currentTime/v.duration)*100)||0;
        if(onProgress) onProgress(pct);
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }).catch(rej);

    v.onended = a.onended = ()=> setTimeout(()=>{ try{rec.stop();}catch{} },300);
  }

  v.onloadedmetadata=tryStart;
  a.onloadedmetadata=tryStart;
  v.onerror=()=>rej(new Error('video load fail'));
  a.onerror=()=>rej(new Error('audio load fail'));

  // timeout if phone still blocks
  setTimeout(()=>rej(new Error('timeout')), 15000);
 });
}

async function startUpload(){
 const f=fileInput.files[0]; if(!f) return alert('Select file');
 const btn=document.getElementById('btn'); btn.disabled=true;

 let up=f;
 if(f.type.startsWith('video')){
   statusEl.innerText='Compressing to 4MB - phone fixed method...';
   UploadManager.showBar(5,'Compressing...');
   try{
     up=await compressPhoneFixed(f, p=>{
       UploadManager.showBar(5+Math.round(p*0.6), `Compressing ${p}% - ${Math.round(p*0.04*10)/10}MB`);
       statusEl.innerText=`Compressing ${p}% - voice synced normal - not stuck`;
       btn.innerText=`${p}% compressing`;
     });
     statusEl.innerText=`${(f.size/1024/1024).toFixed(1)}MB → ${(up.size/1024/1024).toFixed(2)}MB ✅`;
   }catch(e){
     console.log('compress failed', e);
     // last fallback: try canvas-only (no audio) then add original file audio via quick upload?
     // For now upload original so it doesn't stuck forever
     statusEl.innerText='Compress blocked by phone, uploading original - still normal voice';
     up=f;
   }
 }

 const fd=new FormData(); fd.append('file',up); fd.append('caption',document.getElementById('caption').value);
 UploadManager.showBar(70,'Uploading...');
 try{
   await UploadManager.uploadWithProgress(fd, token, p=>{
     UploadManager.showBar(70+Math.round(p*0.3), `Uploading ${p}%`);
     btn.innerText=`Uploading ${p}%`;
   });
   UploadManager.showBar(100,'Done ✅');
   setTimeout(()=>location.href='feed.html',600);
 }catch(e){ btn.disabled=false; btn.innerText='Share'; statusEl.innerText='Fail: '+e.message; }
}
</script>
</body>
</html>
