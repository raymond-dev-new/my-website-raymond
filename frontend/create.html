<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:470px;padding:16px}
input, textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:10px 0}
button.postBtn{width:100%;background:#0095f6;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer}
.preview{width:100%;background:#111;min-height:300px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;margin:10px 0;flex-direction:column}
.preview video,.preview img{width:100%;max-height:500px;object-fit:contain}
</style>
</head>
<body>
<div class="box">
<h3>Create Post! Max upload 2 minutes</h3>
<input type="file" id="file" accept="image/*,video/*">
<div class="preview" id="preview">No file selected</div>
<textarea id="caption" placeholder="Write a caption..."></textarea>
<button class="postBtn" id="shareBtn" onclick="upload()">Share</button>
<p id="status"></p>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script>
const BASE = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.href = "login.html";
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
let videoDuration = 0;
let originalFile = null;

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if(!file) return;
  originalFile = file;
  const url = URL.createObjectURL(file);
  if(file.type.startsWith('video')){
    preview.innerHTML = `<video id="vPrev" src="${url}" controls playsinline></video><p id="durInfo" style="color:#888;font-size:13px">Checking...</p>`;
    const v = document.getElementById('vPrev');
    v.onloadedmetadata = () => {
      videoDuration = v.duration;
      const mins = Math.floor(videoDuration/60);
      const secs = Math.floor(videoDuration%60);
      document.getElementById('durInfo').innerText = `Duration: ${mins}:${String(secs).padStart(2,'0')} / 2:00 max - Raw: ${(file.size/1024/1024).toFixed(1)}MB`;
      if(videoDuration > 120){
        document.getElementById('durInfo').innerHTML = `<span style="color:#ff3040">❌ Too long ${mins}:${String(secs).padStart(2,'0')} - Max 2:00</span>`;
        fileInput.value = ''; preview.innerHTML = 'Choose video under 2 minutes';
      }
    };
  }else{
    videoDuration = 0;
    preview.innerHTML = `<img src="${url}">`;
  }
};

async function compressWithCanvas(file){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.muted = true;
    video.src = URL.createObjectURL(file);
    video.crossOrigin = "anonymous";

    video.onloadedmetadata = async () => {
      const canvas = document.getElementById('canvas');
      const targetWidth = 720;
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;
      const ctx = canvas.getContext('2d');

      const stream = canvas.captureStream(24); // 24 fps
      const audioCtx = new AudioContext();
      const source = audioCtx.createMediaElementSource(video);
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(dest);
      source.connect(audioCtx.destination);

      dest.stream.getAudioTracks().forEach(t=> stream.addTrack(t));

      const chunks = [];
      const recorder = new MediaRecorder(stream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 600000, // 600kbps = 2 mins ~9MB
        audioBitsPerSecond: 64000
      });

      recorder.ondataavailable = e=> { if(e.data.size>0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, {type:'video/webm'});
        const compressed = new File([blob], 'compressed.webm', {type:'video/webm'});
        document.getElementById('status').innerText = `Compressed: ${(file.size/1024/1024).toFixed(1)}MB → ${(compressed.size/1024/1024).toFixed(1)}MB`;
        resolve(compressed);
      };

      recorder.start();
      video.play();

      const draw = () => {
        if(!video.paused &&!video.ended){
          ctx.drawImage(video, 0,0, canvas.width, canvas.height);
          requestAnimationFrame(draw);
        }
      };
      draw();

      video.onended = () => {
        setTimeout(()=> recorder.stop(), 500);
      };
    };
    video.onerror = reject;
    video.load();
  });
}

// FAST FALLBACK: If compression not supported, just upload raw if <16MB
async function upload(){
  const file = fileInput.files[0];
  if(!file) return alert('Select file');
  if(file.type.startsWith('video') && videoDuration > 120) return alert('Max 2 mins');

  document.getElementById('shareBtn').disabled = true;
  let fileToUpload = file;

  if(file.type.startsWith('video')){
    // If raw < 15MB, upload directly (your 1:03 = 5.3MB = OK)
    if(file.size < 14*1024*1024){
      document.getElementById('status').innerText = `File is ${(file.size/1024/1024).toFixed(1)}MB < 16MB, uploading directly...`;
      fileToUpload = file;
    }else{
      try{
        document.getElementById('status').innerText = 'Compressing 2 min to ~9MB... playing video silently';
        fileToUpload = await compressWithCanvas(file);
      }catch(e){
        // If compression fails, try raw if small
        console.log(e);
        document.getElementById('status').innerText = 'Compression fallback to raw...';
        fileToUpload = file;
      }
    }
  }

  document.getElementById('status').innerText += '\nUploading...';
  const fd = new FormData();
  fd.append('file', fileToUpload);
  fd.append('caption', document.getElementById('caption').value);
  try{
    const res = await fetch(BASE+'/api/posts',{
      method:'POST',
      headers:{ authorization: token },
      body: fd
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.msg||'Failed');
    document.getElementById('status').innerText = 'Posted!';
    setTimeout(()=> location.href='feed.html', 800);
  }catch(e){
    document.getElementById('status').innerText = 'Error: '+e.message;
    document.getElementById('shareBtn').disabled = false;
  }
}
</script>
</body>
</html>
