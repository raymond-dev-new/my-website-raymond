<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create - Clear</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px}
.preview{width:100%;min-height:260px;background:#111;border:1px solid #333;border-radius:12px;margin:10px 0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.preview video,.preview img{width:100%;max-height:550px;object-fit:contain}
input,textarea{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:8px 0}
button{width:100%;background:#0095f6;border:0;color:#fff;padding:14px;border-radius:8px;font-weight:700}
#info,#status{font-size:12px;color:#aaa}
#progressBar{width:100%;height:5px;background:#222;border-radius:3px;margin-top:8px;display:none}
#progressFill{height:100%;width:0;background:#0095f6}
.warn{color:#ff453a;font-size:12px;margin:6px 0}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select - 40s max for clear TikTok quality</div>
<div id="info"></div>
<div id="warn"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">Ready - original quality, no processing</p>
<div id="progressBar"><div id="progressFill"></div></div>
</div>
<script>
const BASE_URL="https://raymonddomain.dev";
let token=localStorage.getItem('token');
if(!token) location.replace('login.html');
if(token.startsWith('Bearer ')) token=token.slice(7);

const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const info=document.getElementById('info');
const warnEl=document.getElementById('warn');
const statusEl=document.getElementById('status');
const btn=document.getElementById('btn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');

let curDur=0, previewUrl=null, previewVideo=null, busy=false;
const MAX_SEC=40;
const MAX_BYTES=4.5*1024*1024;

fileInput.addEventListener('change',()=>{
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  warnEl.textContent=''; warnEl.className='';
  const f=fileInput.files[0]; if(!f) return;
  previewUrl=URL.createObjectURL(f);
  if(f.type.startsWith('video/')){
    preview.innerHTML='';
    previewVideo=document.createElement('video');
    previewVideo.src=previewUrl; previewVideo.controls=true; previewVideo.playsInline=true; previewVideo.preload='metadata';
    preview.appendChild(previewVideo);
    previewVideo.onloadedmetadata=()=>{
      curDur=previewVideo.duration;
      info.textContent=`${curDur.toFixed(1)}s • ${(f.size/1048576).toFixed(2)}MB`;
      if(curDur>MAX_SEC){
        warnEl.className='warn';
        warnEl.textContent=`⚠️ ${curDur.toFixed(0)}s too long for clear. Trim to ${MAX_SEC}s in gallery for TikTok quality`;
      }
      if(f.size>MAX_BYTES){
        warnEl.className='warn';
        warnEl.textContent+=`\n⚠️ ${(f.size/1048576).toFixed(1)}MB > 4.5MB Vercel limit. Record at 480p or trim shorter.`;
        statusEl.textContent='File too big - will fail on Vercel. Record shorter.';
      }else{
        statusEl.textContent='✅ Perfect - will upload original - clear & synced';
      }
    };
  }else{
    preview.innerHTML=`<img src="${previewUrl}">`;
    info.textContent=`${(f.size/1048576).toFixed(2)}MB`;
  }
});

async function startUpload(){
  if(busy) return;
  const f=fileInput.files[0]; if(!f) return alert('Select file');
  if(previewVideo){ try{previewVideo.pause(); previewVideo.muted=true;}catch{} }

  if(f.size>MAX_BYTES){
    alert(`File is ${(f.size/1048576).toFixed(2)}MB > 4.5MB\n\nVercel will reject it.\n\nFix: Open phone camera settings -> set to 480p, record 30s video. That file will be ~3MB and CLEAR like TikTok.\n\nOr trim this video in your gallery to 20-30 seconds.`);
    return;
  }
  if(f.type.startsWith('video/') && curDur>MAX_SEC){
    if(!confirm(`${curDur.toFixed(0)}s is long. For TikTok clear quality use ${MAX_SEC}s. Upload anyway?`)) return;
  }

  busy=true; btn.disabled=true; progressBar.style.display='block'; progressFill.style.width='10%';
  statusEl.textContent='Uploading original - no blur, no desync...';

  const fd=new FormData(); fd.append('file',f); fd.append('caption',document.getElementById('caption').value);

  const xhr=new XMLHttpRequest();
  xhr.open('POST', `${BASE_URL}/api/posts`);
  xhr.setRequestHeader('Authorization', `Bearer ${token}`);
  xhr.upload.onprogress=e=>{
    if(e.lengthComputable){
      const p=Math.floor((e.loaded/e.total)*100);
      progressFill.style.width=p+'%';
      btn.textContent=`Uploading ${p}%`;
      statusEl.textContent=`Uploading ${p}% - ${(e.loaded/1048576).toFixed(1)}MB / ${(e.total/1048576).toFixed(1)}MB - Original quality`;
    }
  };
  xhr.onload=()=>{
    if(xhr.status>=200 && xhr.status<300){ progressFill.style.width='100%'; statusEl.textContent='Done - clear & synced'; location.href='feed.html'; }
    else{ alert('Upload failed: '+xhr.responseText); btn.disabled=false; busy=false; btn.textContent='Share'; }
  };
  xhr.onerror=()=>{ alert('Server error - is localhost:8000 running?'); btn.disabled=false; busy=false; };
  xhr.send(fd);
}
</script>
</body>
</html>
