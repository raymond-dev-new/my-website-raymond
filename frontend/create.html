<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center}
.box{width:100%;max-width:480px;padding:16px;box-sizing:border-box}
.preview{width:100%;background:#111;min-height:250px;display:flex;justify-content:center;align-items:center;border-radius:12px;border:1px solid #262626;margin:10px 0;overflow:hidden;text-align:center;color:#777;font-size:13px}
.preview video,img{width:100%;max-height:520px}
input,textarea{width:100%;background:#121212;border:1px solid #262626;color:#fff;padding:12px;border-radius:8px;margin:8px 0;box-sizing:border-box}
button{width:100%;background:#0095f6;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700}
button:disabled{background:#0a4a78}
#status{font-size:12px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<input type="file" id="file" accept="video/*,image/*">
<div class="preview" id="preview">Select video (max 2:00)<br>Target 4MB max</div>
<div id="info" style="font-size:12px;color:#888"></div>
<textarea id="caption" placeholder="Caption..."></textarea>
<button id="btn" onclick="startUpload()">Share</button>
<p id="status">4MB max - normal voice - anti-stuck</p>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script src="upload-manager.js"></script>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='login.html';
let fileInput=document.getElementById('file'), preview=document.getElementById('preview'), info=document.getElementById('info'), statusEl=document.getElementById('status');

fileInput.onchange=()=>{
  const f=fileInput.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    preview.innerHTML=`<video id="vp" src="${url}" controls playsinline muted></video>`;
    document.getElementById('vp').onloadedmetadata=e=>{
      const d=e.target.duration;
      info.innerText=`${Math.floor(d/60)}:${String(Math.floor(d%60)).padStart(2,'0')} / 2:00 - ${(f.size/1024/1024).toFixed(1)}MB → ~4MB`;
      if(d>120){ alert('Max 2 mins'); fileInput.value=''; preview.innerHTML='Select video'; info.innerText=''; }
    };
  } else { preview.innerHTML=`<img src="${url}">`; }
};

function compressTo4MB(file, onProgress){
 return new Promise((res,rej)=>{
  const v=document.createElement('video');
  v.src=URL.createObjectURL(file);
  v.crossOrigin="anonymous";
  v.muted=true; // muted=true to avoid phone audio block - we add audio separately
  v.playsInline=true;
  v.preload="auto";
  const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
  let audioCtx, source, dest;

  v.onloadedmetadata=()=>{
    canvas.width=360;
    canvas.height=Math.round(v.videoHeight*(360/v.videoWidth));
    if(canvas.height%2) canvas.height++;

    // WebAudio for normal voice
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      dest=audioCtx.createMediaStreamDestination();
      source=audioCtx.createMediaElementSource(v);
      source.connect(dest);
      source.connect(audioCtx.destination);
    }catch(e){ console.log('audio ctx fail', e); }

    const canvasStream=canvas.captureStream(20);
    const combined=new MediaStream();
    canvasStream.getVideoTracks().forEach(t=>combined.addTrack(t));
    if(dest && dest.stream.getAudioTracks().length){
      dest.stream.getAudioTracks().forEach(t=>combined.addTrack(t));
    } else {
      // fallback try captureStream audio
      try{ v.captureStream().getAudioTracks().forEach(t=>combined.addTrack(t)); }catch{}
    }

    const chunks=[];
    const rec=new MediaRecorder(combined,{mimeType:'video/webm;codecs=vp8,opus', videoBitsPerSecond:200000, audioBitsPerSecond:48000});
    rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    rec.onstop=()=>{
      if(audioCtx) audioCtx.close();
      res(new File([new Blob(chunks,{type:'video/webm'})],'video.webm',{type:'video/webm'}));
    };

    rec.start(100);
    v.currentTime=0;
    v.playbackRate=1;

    let lastPct=0, stuckTimer=0;
    const stuckInterval=setInterval(()=>{
      const pct=Math.round((v.currentTime/v.duration)*100)||0;
      if(pct===lastPct){ stuckTimer++; } else { stuckTimer=0; lastPct=pct; }
      if(stuckTimer>12){ // 12 sec stuck = abort
        clearInterval(stuckInterval);
        rec.stop();
        rej(new Error('Compression stuck at '+pct+'% - phone blocked it, using original'));
      }
    },1000);

    v.onended=()=>{
      clearInterval(stuckInterval);
      setTimeout(()=>rec.stop(),300);
    };

    v.play().then(()=>{
      function draw(){
        if(v.ended || v.paused) return;
        ctx.drawImage(v,0,0,canvas.width,canvas.height);
        const pct=Math.round((v.currentTime/v.duration)*100);
        if(onProgress && pct%1===0) onProgress(pct);
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }).catch(e=>{ clearInterval(stuckInterval); rej(e); });
  };
  v.onerror=()=>rej(new Error('Video load failed'));
  setTimeout(()=>rej(new Error('Load timeout - file too large')), 15000);
 });
}

async function startUpload(){
 const f=fileInput.files[0]; if(!f) return alert('Select file');
 const btn=document.getElementById('btn'); btn.disabled=true;
 UploadManager.showBar(5,'Compressing to 4MB...');
 statusEl.innerText='Compressing... if stuck >15sec will auto upload original';

 let up=f;
 if(f.type.startsWith('video')){
   try{
     up=await compressTo4MB(f, (p)=>{
       UploadManager.showBar(5 + Math.round(p*0.6), `Compressing ${p}%`);
       statusEl.innerText=`Compressing ${p}% - target 4MB`;
       btn.innerText=`${p}% compressing...`;
     });
     statusEl.innerText=`${(f.size/1024/1024).toFixed(1)}MB → ${(up.size/1024/1024).toFixed(2)}MB ✅`;
   }catch(e){
     console.log(e.message);
     statusEl.innerText=e.message+' - uploading original (still normal voice)';
     up=f; // fallback to original so it NEVER gets stuck
   }
 }

 const fd=new FormData(); fd.append('file',up); fd.append('caption',document.getElementById('caption').value);
 UploadManager.showBar(70,'Uploading...');

 try{
   await UploadManager.uploadWithProgress(fd, token, (p)=>{
     UploadManager.showBar(70 + Math.round(p*0.3), `Uploading ${p}%`);
     statusEl.innerText=`Uploading ${p}% - ${(up.size/1024/1024).toFixed(2)}MB`;
     btn.innerText=`Uploading ${p}%`;
   });
   UploadManager.showBar(100,'Done!');
   setTimeout(()=> location.href='feed.html', 700);
 }catch(e){
   btn.disabled=false; btn.innerText='Share';
   statusEl.innerText='Upload failed: '+e.message;
 }
}
</script>
</body>
</html>
