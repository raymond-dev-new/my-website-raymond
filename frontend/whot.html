<!DOCTYPE html><html lang="en"><head>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WHOT - Real Card Game</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle,#0a5c36,#063d24);font-family:Arial;color:#fff;touch-action:manipulation}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.table{width:100%;height:100dvh;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;overflow:hidden}

.start,.picker,.result{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}.picker,.result{display:none}.start h1{color:#ffd700;font-size:27px;margin-bottom:10px}.start p{text-align:center;font-size:14px;margin:0 20px 14px}.stats{background:#123b29;padding:12px 22px;border-radius:14px;text-align:center;margin-bottom:13px}.stats b{color:#ffd700}.statsrow{display:flex;gap:35px;margin-top:7px}.w{color:#55efc4}.l{color:#ff7675}.startbtn,.sharebtn{width:190px;padding:11px;border-radius:11px;color:#fff;font-weight:bold;font-size:15px;margin:4px}.startbtn{background:#ff4500}.sharebtn{background:#25d366}.reset{margin-top:9px;padding:6px 12px;border-radius:7px;background:#555;color:#fff}.picker h2{color:#ffd700;margin-bottom:18px}.shapes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.shapebtn{width:65px;height:65px;background:#fff;border:3px solid #000;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:34px}.cross{position:relative;width:35px;height:35px}.cross:before,.cross:after{content:"";position:absolute;background:#f9a825;border-radius:3px}.cross:before{width:100%;height:10px;top:12px}.cross:after{height:100%;width:10px;left:12px}

.top{width:100%;min-height:76px;display:flex;justify-content:center;align-items:flex-start;gap:3px;flex-wrap:nowrap;overflow:hidden;position:absolute;top:60px}

.alert{position:fixed;top:25%;left:50%;transform:translate(-50%,-50%) scale(.9);width:max-content;max-width:90%;padding:13px 18px;background:rgba(255,215,0,.98);border-radius:15px;color:#000;font-weight:900;font-size:16px;text-align:center;display:none;box-shadow:0 0 30px #ffd700,0 4px 20px #000;border:3px solid #fff;z-index:1000;transition:transform.2s;pointer-events:none}

.center{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:30px 0}

.deck,.pile{width:60px;height:85px;border-radius:10px;box-shadow:0 4px 12px #000;flex-shrink:0}.deck{background:linear-gradient(135deg,#1a3a52,#2c5f7f);border:3px solid #fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;font-size:13px}.pile{background:#fff;border:3px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden}

.hand{width:100%;min-height:108px;display:flex;justify-content:center;align-items:flex-end;gap:0;flex-wrap:wrap;padding:5px 3px 7px;background:#0006;border-radius:13px;overflow:hidden;margin-top:50px}

.card{width:calc((100vw - 42px)/7);max-width:52px;height:76px;background:#fff;color:#000;border:2px solid #000;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;font-weight:900;font-size:10px;box-shadow:0 3px 8px #000;user-select:none}.card.shape{font-size:25px;line-height:1}.back{background:linear-gradient(135deg,#1a3a52,#2c5f7f);color:#fff;justify-content:center}.red{color:#c62828}.circle{color:#c62828}.triangle{color:#1565c0}.star{color:#c62828}.square{color:#2e7d32}.crossc{color:#f9a825}.info{position:fixed;top:6px;left:6px;background:rgba(0,0,0,.88);padding:6px 8px;border-radius:8px;font-size:10px;z-index:5;line-height:1.35}.turn{font-size:13px;font-weight:bold;color:#ffd700}.new{position:fixed;right:7px;bottom:7px;background:#ff4500;color:#fff;padding:8px 11px;border-radius:9px;font-weight:bold;font-size:13px;z-index:20;box-shadow:0 3px 10px #000}.resultbox{background:#123b29;border:2px solid #ffd700;border-radius:18px;padding:25px;text-align:center}.resultbox h2{color:#ffd700;margin-bottom:12px}.playagain{margin-top:15px;background:#ff4500;color:#fff;padding:10px 20px;border-radius:9px;font-weight:bold}@media(max-width:370px){.top{gap:2px;top:50px}.alert{top:23%}.top.card{width:calc((100vw - 24px)/7);height:63px;font-size:9px}.top.card.shape{font-size:20px}.deck,.pile{width:53px;height:76px}.hand{gap:0;margin-top:40px}.center{margin:22px 0}.card{width:calc((100vw - 24px)/7);height:70px;font-size:9px}.card.shape{font-size:22px}.info{font-size:9px;padding:5px 7px}.turn{font-size:12px}.new{font-size:12px;padding:7px 9px}}@media(max-width:330px){.top.card{height:59px}.card{height:65px}.deck,.pile{width:49px;height:70px}.new{font-size:11px;padding:6px 8px}}
</style></head><body>

<div class="start" id="start"><h1>♟ WHOT GAME</h1><p>Play WHOT against the CPU.</p><div class="stats"><div>🏆 YOUR RECORD</div><div class="statsrow"><div class="w">WINS<br><b id="wins">0</b></div><div class="l">LOSSES<br><b id="losses">0</b></div></div><button class="reset" id="reset">♻ Reset Records</button></div><button class="startbtn" id="startBtn">▶ START GAME</button><button class="sharebtn" id="shareBtn">📤 SHARE GAME</button></div>

<div class="picker" id="picker"><h2>Choose a Shape</h2><div class="shapes"><button class="shapebtn circle" data-shape="circle">●</button><button class="shapebtn triangle" data-shape="triangle">▲</button><button class="shapebtn star" data-shape="star">★</button><button class="shapebtn square" data-shape="square">■</button><button class="shapebtn crossc" data-shape="cross"><i class="cross"></i></button></div></div>

<div class="result" id="result"><div class="resultbox"><h2 id="resultText"></h2><div>🏆 Wins: <span id="rw">0</span></div><div>❌ Losses: <span id="rl">0</span></div><button class="playagain" id="again">🔄 PLAY AGAIN</button></div></div>

<div class="info"><div class="turn" id="turn">Your Turn</div><div>You: <span id="pc">7</span> | CPU: <span id="cc">7</span></div><div>Needed: <span id="needed">-</span></div></div>

<div class="table"><div class="top" id="cpuHand"></div><div class="alert" id="alert"></div><div class="center"><button class="deck" id="deck">DECK<br><span id="deckCount">0</span></button><div class="pile" id="pile"></div></div><div class="hand" id="playerHand"></div></div><button class="new" id="newGame">🔄 New Game</button>

<script>
(function(){
'use strict';
const S=['circle','triangle','star','square','cross'],E={circle:'●',triangle:'▲',star:'★',square:'■'},N={circle:'Circle',triangle:'Triangle',star:'Star',square:'Square',cross:'Cross'},SAVE='whot_save_v22',STATS='whot_stats_v21';
let deck=[],player=[],cpu=[],pile=[],currentShape='',currentNumber=0,turn='player',pick2=0,general=0,waiting=false,started=false,over=false,recorded=false,stats={wins:0,losses:0},timer=null,alertTimer=null,audio=null;
const $=id=>document.getElementById(id);
function sound(t){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),f=500,d=.08;if(t==='pick'){f=250;d=.13}if(t==='special'){f=700;d=.16}if(t==='whot'){f=900;d=.22}if(t==='win'){f=1000;d=.45}if(t==='lose'){f=180;d=.4}o.frequency.value=f;o.type='sine';o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.15,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d+.02)}catch(e){}}
function loadStats(){try{let x=JSON.parse(localStorage.getItem(STATS));if(x){stats.wins=Math.max(0,+x.wins||0);stats.losses=Math.max(0,+x.losses||0)}}catch(e){}updateStats()}
function saveStats(){try{localStorage.setItem(STATS,JSON.stringify(stats))}catch(e){}updateStats()}
function updateStats(){$('wins').textContent=stats.wins;$('losses').textContent=stats.losses;$('rw').textContent=stats.wins;$('rl').textContent=stats.losses}
function resetStats(){if(confirm('Reset Wins and Losses to 0?')){stats={wins:0,losses:0};saveStats();sound('pick')}}
function record(w){if(recorded)return;recorded=true;if(w==='player'){stats.wins++;sound('win')}else{stats.losses++;sound('lose')}saveStats()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function createDeck(){deck=[];
  // NO DUPLICATES: 1 copy of each shape + number
  [1,2,3,4,5,7,10,11,12,13,14].forEach(n=>S.forEach(s=>{
    deck.push({shape:s,number:n})
  }));
  // Only WHOT gets 5 copies
  for(let i=0;i<5;i++)deck.push({shape:'whot',number:20});
  shuffle(deck)
}
function deal(){player=[];cpu=[];pile=[];for(let i=0;i<7;i++){player.push(deck.pop());cpu.push(deck.pop())}let f;do{f=deck.pop();if(f.shape==='whot'){deck.unshift(f);shuffle(deck)}}while(f.shape==='whot');pile.push(f);currentShape=f.shape;currentNumber=f.number}
function canPlay(c){if(!c)return false;if(pick2>0)return c.number===2;if(general>0)return false;return c.shape==='whot'||c.shape===currentShape||c.number===currentNumber}
function recycle(){if(deck.length)return true;if(pile.length<=1)return false;let t=pile[pile.length-1];deck=pile.slice(0,-1);pile=[t];shuffle(deck);return!!deck.length}
function takeCards(h,n){let g=0;for(let i=0;i<n;i++){if(!recycle())break;let c=deck.pop();if(c){h.push(c);g++}}return g}
function shapeHTML(s){return s==='cross'?'<i class="cross"></i>':'<span class="shape '+s+'">'+E[s]+'</span>'}
function cardHTML(c,hide){if(hide)return'<div class="card back">WHOT</div>';if(c.shape==='whot')return'<div class="card"><b>WHOT</b><span class="shape star">★</span><b>20</b></div>';return'<div class="card '+((c.shape==='circle'||c.shape==='star')?'red':'')+'"><b>'+c.number+'</b>'+shapeHTML(c.shape)+'<b>'+c.number+'</b></div>'}
function needed(){if(pick2>0)return'PICK '+pick2+' — PLAY 2 OR PICK';if(general>0)return'GENERAL MARKET — PICK 1';return N[currentShape]+' OR '+currentNumber}
function update(){$('deckCount').textContent=deck.length;$('pc').textContent=player.length;$('cc').textContent=cpu.length;$('needed').textContent=needed();$('turn').textContent=turn==='player'?'Your Turn':turn==='cpu'?'CPU Thinking...':'Game Over';$('cpuHand').innerHTML=cpu.map(()=>cardHTML(null,true)).join('');$('playerHand').innerHTML=player.map((c,i)=>'<div data-card="'+i+'" style="opacity:'+(canPlay(c)?1:.35)+'">'+cardHTML(c,false)+'</div>').join('');let t=pile[pile.length-1];$('pile').innerHTML=t?cardHTML(t,false):''}
function saveGame(){if(!started||over)return;try{localStorage.setItem(SAVE,JSON.stringify({deck,player,cpu,pile,currentShape,currentNumber,turn,pick2,general,waiting}))}catch(e){}}
function loadGame(){try{let r=localStorage.getItem(SAVE);if(!r)return false;let d=JSON.parse(r);if(!d||!Array.isArray(d.deck)||!Array.isArray(d.player)||!Array.isArray(d.cpu)||!Array.isArray(d.pile))return false;({deck,player,cpu,pile,currentShape,currentNumber,turn,pick2,general,waiting}=d);currentNumber=+currentNumber||0;turn=turn||'player';pick2=+pick2||0;general=+general||0;waiting=!!waiting;return true}catch(e){localStorage.removeItem(SAVE);return false}}
function message(t){clearTimeout(alertTimer);let e=$('alert');e.textContent=t;e.style.display='block';e.style.transform='translate(-50%,-50%) scale(1)';sound('special');alertTimer=setTimeout(()=>{e.style.transform='translate(-50%,-50%) scale(.9)';setTimeout(()=>e.style.display='none',200)},5500)}
function startGame(){$('start').style.display='none';started=true;over=false;recorded=false;if(loadGame()){update();if(waiting)$('picker').style.display='flex';if(turn==='cpu'&&!waiting)timer=setTimeout(cpuTurn,700)}else newGame();try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function shareGame(){if(navigator.share)navigator.share({title:'WHOT Game',text:'Come play WHOT with me!',url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('Game link copied!')).catch(()=>alert('Sharing is not supported.'));else alert('Sharing is not supported.')}
function playCard(i){if(!started||over||turn!=='player'||waiting)return;let c=player[i];if(!c)return;if(!canPlay(c)){if(pick2)message('PICK '+pick2+' — PLAY A 2 OR PICK '+pick2);else if(general)message('GENERAL MARKET — YOU MUST PICK 1');else message('YOU NEED '+N[currentShape].toUpperCase()+' OR '+currentNumber);return}sound('play');player.splice(i,1);pile.push(c);if(c.shape==='whot'){waiting=true;sound('whot');$('picker').style.display='flex';update();saveGame();return}currentShape=c.shape;currentNumber=c.number;if(c.number===2){pick2+=2;general=0;sound('special');if(!player.length)return endGame('YOU WIN! 🎉','player');turn='cpu';update();saveGame();timer=setTimeout(cpuTurn,750);return}if(c.number===14){general=1;pick2=0;sound('special');if(!player.length)return endGame('YOU WIN! 🎉','player');turn='cpu';update();saveGame();timer=setTimeout(cpuTurn,750);return}if(c.number===1){sound('special');if(!player.length)return endGame('YOU WIN! 🎉','player');turn='player';message('1 — HOLD ON! YOU PLAY AGAIN');update();saveGame();return}if(!player.length)return endGame('YOU WIN! 🎉','player');turn='cpu';update();saveGame();timer=setTimeout(cpuTurn,750)}
function chooseShape(s){if(!waiting)return;waiting=false;$('picker').style.display='none';currentShape=s;currentNumber=20;sound('whot');if(!player.length)return endGame('YOU WIN! 🎉','player');turn='cpu';update();saveGame();timer=setTimeout(cpuTurn,800)}
function drawCard(){if(!started||over||turn!=='player'||waiting)return;let n=pick2||1;if(pick2)pick2=0;else if(general)general=0;let g=takeCards(player,n);sound('pick');if(!g)return message('NO CARDS LEFT');message(g===1?'YOU PICKED 1 CARD':'YOU PICKED '+g+' CARDS');turn='cpu';update();saveGame();timer=setTimeout(cpuTurn,800)}
function cpuOptions(){return cpu.map((c,i)=>({card:c,index:i})).filter(x=>canPlay(x.card))}
function cpuChoose(o){if(!o.length)return null;if(pick2)return o.find(x=>x.card.number===2)||null;let b=null,sc=-999;o.forEach(x=>{let c=x.card,s=0;if(c.shape===currentShape)s+=10;if(c.number===currentNumber)s+=5;if(c.number===2)s+=7;if(c.number===14)s+=6;if(c.number===1)s+=6;if(c.shape==='whot')s+=5;if(cpu.length<=3)s+=20;s+=Math.random()*4;if(s>sc){sc=s;b=x}});return b}
function cpuTurn(){if(!started||over||turn!=='cpu')return;if(pick2){let o=cpuChoose(cpuOptions());if(o){let c=o.card;cpu.splice(o.index,1);pile.push(c);currentShape=c.shape;currentNumber=c.number;pick2+=2;sound('play');sound('special');if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='player';update();saveGame();message('CPU PLAYED 2 — YOU MUST PLAY 2 OR PICK '+pick2);return}let g=takeCards(cpu,pick2);pick2=0;sound('pick');message(g+' CARD'+(g===1?'':'S')+' PICKED BY CPU');turn='player';update();saveGame();return}if(general){general=0;let g=takeCards(cpu,1);sound('pick');message('CPU PICKED '+g+' CARD — GENERAL MARKET');turn='player';update();saveGame();return}let o=cpuOptions();if(!o.length){let g=takeCards(cpu,1);if(g){sound('pick');message('CPU PICKED 1 CARD')}else message('CPU HAS NO CARD TO PLAY');turn='player';update();saveGame();return}let ch=cpuChoose(o);if(!ch)return;let c=ch.card;cpu.splice(ch.index,1);pile.push(c);sound('play');if(c.shape==='whot'){sound('whot');let count={};S.forEach(s=>count[s]=0);cpu.forEach(x=>{if(x.shape!=='whot')count[x.shape]++});let b=S[0];S.forEach(s=>{if(count[s]>count[b])b=s});currentShape=b;currentNumber=20;if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='player';update();saveGame();message('CPU PLAYED WHOT — NEED '+N[b].toUpperCase());return}currentShape=c.shape;currentNumber=c.number;if(c.number===2){pick2=2;sound('special');if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='player';update();saveGame();message('CPU PLAYED 2 — YOU MUST PLAY 2 OR PICK 2');return}if(c.number===14){general=1;sound('special');if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='player';update();saveGame();message('CPU PLAYED 14 — GENERAL MARKET • PICK 1');return}if(c.number===1){sound('special');if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='cpu';update();saveGame();message('CPU PLAYED 1 — HOLD ON! CPU PLAYS AGAIN');timer=setTimeout(cpuTurn,750);return}if(!cpu.length)return endGame('CPU WINS! 😭','cpu');turn='player';update();saveGame();message('CPU PLAYED '+c.number+' — NEED '+N[currentShape].toUpperCase()+' OR '+currentNumber)}
function endGame(t,w){if(over)return;over=true;turn='over';clearTimeout(timer);clearTimeout(alertTimer);record(w);localStorage.removeItem(SAVE);$('resultText').textContent=t;updateStats();$('result').style.display='flex';update()}
function newGame(){clearTimeout(timer);clearTimeout(alertTimer);$('result').style.display='none';$('picker').style.display='none';$('alert').style.display='none';createDeck();deal();turn='player';pick2=0;general=0;waiting=false;over=false;recorded=false;started=true;update();saveGame()}
$('startBtn').onclick=startGame;$('shareBtn').onclick=shareGame;$('reset').onclick=resetStats;$('newGame').onclick=newGame;$('again').onclick=newGame;$('deck').onclick=drawCard;document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>chooseShape(b.dataset.shape));$('playerHand').onclick=e=>{let b=e.target.closest('[data-card]');if(b)playCard(+b.dataset.card)};loadStats();
})();
</script></body></html>
