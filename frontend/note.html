<!DOCTYPE html>
<html lang="en">
<head>

   <script>
   const tokenn = localStorage.getItem('token');

    if (!tokenn) {
      // Not logged in? Kick out immediately
      window.location.replace('/login.html');
    }  
   </script> 

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<style>
  body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    padding: 20px;
    max-width: 700px;
    margin: auto;
  }
  h1 { text-align: center; color: #8b5cf6; }
 .login-box,.notes-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; }
  input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #6366f1;
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  button.danger { background: #ef4444; }
 .note {
    background: #0f172a;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    border: 1px solid #334155;
    white-space: pre-wrap;
  }
 .note small { color: #9ca3af; }
 .row { display: flex; gap: 8px; }
  #status { text-align: center; color: #22c55e; margin: 8px 0; }
</style>
</head>
<body>

<h1>📝 My Private Notes</h1>

<div id="login" class="login-box">
  <h3>Login to access your notes</h3>
  <input type="email" id="email" placeholder="Enter any email">
  <button onclick="login()">Login</button>
</div>

<div id="app" class="notes-box" style="display:none;">
  <h3>Write your note</h3>
  <textarea id="noteText" rows="8" placeholder="Start typing..."></textarea>
  <button onclick="saveNote()">Save Note</button>
  <div id="status"></div>
  <button class="danger" onclick="logout()">Logout</button>

  <h3 style="margin-top:20px;">Your Saved Notes</h3>
  <div id="notesList"></div>
</div>

<script>
const API_URL = 'https://my-website-raymond.vercel.app'; // CHANGE THIS WHEN YOU DEPLOY
const API = API_URL + '/api';

let token = localStorage.getItem('token');

// CHECK LOGIN ON LOAD
window.addEventListener('DOMContentLoaded', () => {
  if(token){
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadNotes();
  }
})

// LOGIN
async function login(){
  const email = document.getElementById('email').value.trim();
  if(!email) return alert('Enter email');
  const res = await fetch(API + '/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email})
  });
  const data = await res.json();
  token = data.token;
  localStorage.setItem('token', token);
  location.reload(); // reload to show notes
}

// LOGOUT
function logout(){
  localStorage.removeItem('token');
  location.reload();
}

// LOAD NOTES FROM DB
async function loadNotes(){
  const res = await fetch(API + '/notes', {
    headers: {'Authorization': 'Bearer ' + token}
  });
  if(res.status === 401) return logout();
  const notes = await res.json();
  document.getElementById('notesList').innerHTML = notes.map(n => `
    <div class="note">
      <small>${new Date(n.createdAt).toLocaleString()}</small>
      <p>${n.text}</p>
      <button class="danger" onclick="deleteNote('${n._id}')">Delete</button>
    </div>
  `).join('');
}

// SAVE NOTE
async function saveNote(){
  const text = document.getElementById('noteText').value.trim();
  if(!text) return alert('Write something first');
  document.getElementById('status').innerText = 'Saving...';
  await fetch(API + '/notes', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({text})
  });
  document.getElementById('noteText').value = '';
  document.getElementById('status').innerText = 'Saved!';
  setTimeout(() => document.getElementById('status').innerText = '', 2000);
  loadNotes();
}

// DELETE NOTE
async function deleteNote(id){
  if(!confirm('Delete this note?')) return;
  await fetch(API + '/notes/' + id, {
    method: 'DELETE',
    headers: {'Authorization': 'Bearer ' + token}
  });
  loadNotes();
}
</script>
</body>
</html>
