<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; overflow:hidden; }
.reel-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; }
.reel { height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#111; }
.reel video { height:100%; width:100%; object-fit:cover; }
.info { position:absolute; bottom:135px; left:12px; right:85px; z-index:5; line-height:1.4; font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
.info b{cursor:pointer;font-size:15px}
.actions { position:absolute; right:10px; bottom:135px; display:flex; flex-direction:column; gap:22px; font-size:24px; text-align:center; z-index:5; }
.actions small{font-size:12px;display:block;margin-top:2px}
.view-badge{position:absolute;top:18px;left:12px;background:rgba(0,0,0,.65);padding:6px 12px;border-radius:20px;font-size:12px;z-index:5;display:flex;gap:6px;align-items:center}
.bottom-nav { position:fixed; bottom:0; width:100%; background:#000; border-top:1px solid #222; display:flex; justify-content:space-around; padding:14px 0; padding-bottom:20px; z-index:10; }
.bottom-nav a { color:#fff; text-decoration:none; font-size:20px; position:relative }
.msg-badge{position:absolute;top:-6px;right:-8px;background:#ff3040;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hide{display:none}
.comment-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:50;justify-content:flex-end;align-items:flex-end}
.comment-box{background:#121212;width:100%;max-width:500px;height:65vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;margin:0 auto}
.cmt-head{padding:12px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;font-weight:bold}
.cmt-list{flex:1;overflow-y:auto;padding:10px}
.cmt-row{display:flex;gap:10px;margin-bottom:12px}
.cmt-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex-shrink:0;cursor:pointer}
.cmt-text{font-size:14px;line-height:1.3}
.cmt-text b{cursor:pointer}
.cmt-input-area{padding:10px;border-top:1px solid #262626;display:flex;gap:8px}
.cmt-input-area input{flex:1;background:#262626;border:none;color:#fff;padding:10px;border-radius:20px;outline:none}
.cmt-input-area button{background:none;border:none;color:#0095f6;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="reel-container" id="reels"></div>
<div class="bottom-nav">
<a href="feed.html">🏠</a><a href="explore.html">🔍</a><a href="create.html">➕</a>
<a href="message.html">💬<span id="msgCount" class="msg-badge hide">0</span></a>
<a href="reels.html">🎬</a><a href="profile.html">👤</a>
</div>
<div class="comment-modal" id="cmtModal" onclick="if(event.target===this) closeComments()">
<div class="comment-box">
<div class="cmt-head"><span id="cmtCount">Comments</span><span style="cursor:pointer" onclick="closeComments()">✕</span></div>
<div class="cmt-list" id="cmtList"></div>
<div class="cmt-input-area">
<input id="cmtInput" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') sendComment()">
<button onclick="sendComment()">Post</button>
</div>
</div>
</div>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href="login.html";
function getCache(k){ try{ return JSON.parse(localStorage.getItem(k)||'null')}catch{return null} }
function setCache(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function fixUrl(u){ if(!u) return ""; if(u.startsWith('data:')) return u; if(u.startsWith('/api/')) return BASE+u; if(u.startsWith('/uploads')) return BASE+u; if(u.startsWith('http')) return u; return BASE+u; }
function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }

let reelsData=[];
let activeReelId="";
let viewedSet=new Set(JSON.parse(localStorage.getItem('viewed_reels')||'[]'));

function renderReels(reels){
 const container=document.getElementById('reels');
 if(!reels.length){ container.innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column"><p>No reels yet</p><a href="create.html" style="color:#0095f6;margin-top:10px">Create Reel</a></div>`; return; }
 container.innerHTML=reels.map(r=>{
  const url=fixUrl(r.mediaUrl);
  const likes=r.likes||[];
  const isLiked=likes.includes(getMyId())||likes.some(l=> (l._id||l)==getMyId());
  const views=r.views||0;
  return `<div class="reel" data-id="${r._id}">
   <div class="view-badge">👁️ <span id="view-${r._id}">${views}</span> views</div>
   <video src="${url}" loop muted playsinline preload="metadata" onclick="this.muted=!this.muted; addView('${r._id}')" ></video>
   <div class="info">
    <b onclick="location.href='profile.html?id=${r.user?._id}'">@${r.user?.username||'user'}</b><br>
    ${r.caption||''}
   </div>
   <div class="actions">
    <div onclick="like('${r._id}')" style="cursor:pointer">${isLiked?'❤️':'🤍'}<br><small id="like-${r._id}">${likes.length}</small></div>
    <div onclick="openComments('${r._id}')" style="cursor:pointer">💬<br><small>${(r.comments||[]).length}</small></div>
    <div onclick="shareReel('${r._id}')" style="cursor:pointer">↗️<br><small>${r.shares||0}</small></div>
   </div>
  </div>`;
 }).join('');
 observeViews();
}

async function loadReels(){
 const cached=getCache('reels_cache');
 if(cached){ reelsData=cached; renderReels(cached); }
 try{
  const res=await fetch(BASE+'/api/posts/reels',{headers:{authorization:token}});
  let reels=await res.json();
  reels=reels.filter(r=>{
   const url=(r.mediaUrl||"").toLowerCase();
   return r.type==='video'||r.type==='reel'||url.includes('/api/media-file')||url.endsWith('.mp4')||url.endsWith('.mov')||url.endsWith('.webm');
  });
  reelsData=reels;
  setCache('reels_cache', reels);
  renderReels(reels);
 }catch(e){
  if(!cached) document.getElementById('reels').innerHTML=`<div style="padding:40px;text-align:center">Error: ${e.message}</div>`;
 }
}

async function addView(id){
 if(viewedSet.has(id)) return;
 viewedSet.add(id);
 localStorage.setItem('viewed_reels', JSON.stringify([...viewedSet]));
 const el=document.getElementById('view-'+id);
 if(el) el.innerText=parseInt(el.innerText||0)+1;
 let cache=getCache('reels_cache')||[];
 let r=cache.find(x=>x._id===id);
 if(r){ r.views=(r.views||0)+1; setCache('reels_cache', cache); }
 try{ await fetch(BASE+`/api/posts/${id}/view`,{method:'POST',headers:{authorization:token}}); }catch{}
}

// FIXED - STOP FIRST VIDEO WHEN SLIDE TO NEXT
function observeViews(){
 const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
   const vid=e.target.querySelector('video');
   if(!vid) return;
   if(e.isIntersecting){
    // Pause all other videos first
    document.querySelectorAll('.reel video').forEach(v=>{
     if(v!==vid){
      v.pause();
      v.currentTime=0;
     }
    });
    addView(e.target.dataset.id);
    vid.play().catch(()=>{});
   } else {
    // When out of view, stop it
    vid.pause();
   }
  });
 },{threshold:0.7});
 document.querySelectorAll('.reel').forEach(el=>obs.observe(el));
}

async function like(id){
 let cache=getCache('reels_cache')||[];
 let r=cache.find(x=>x._id===id);
 if(r){
  const my=getMyId();
  if(r.likes.includes(my)) r.likes=r.likes.filter(x=>x!==my); else r.likes.push(my);
  setCache('reels_cache', cache);
  renderReels(cache);
 }
 await fetch(BASE+`/api/posts/${id}/like`,{method:'POST',headers:{authorization:token}});
}

async function shareReel(id){ try{ await fetch(BASE+`/api/posts/${id}/share`,{method:'POST',headers:{authorization:token}}); alert('Link copied!'); }catch{} }

async function openComments(id){
 activeReelId=id;
 // pause current video when opening comments
 const currentVid=document.querySelector(`.reel[data-id="${id}"] video`);
 if(currentVid) currentVid.pause();
 try{
  const res=await fetch(BASE+'/api/posts/'+id,{headers:{authorization:token}});
  const post=await res.json();
  document.getElementById('cmtCount').innerText=post.comments.length+' comments • '+ (post.views||0) +' views';
  const list=document.getElementById('cmtList');
  list.innerHTML=!post.comments.length?`<p style="color:#777;text-align:center;padding:20px">No comments</p>`:
  post.comments.map(c=>{
   const name=c.user?.username||'user'; const uid=c.user?._id||'';
   return `<div class="cmt-row"><div class="cmt-avatar" onclick="location.href='profile.html?id=${uid}'">${name[0].toUpperCase()}</div><div class="cmt-text"><b onclick="location.href='profile.html?id=${uid}'">${name}</b> ${c.text}</div></div>`;
  }).join('');
  document.getElementById('cmtModal').style.display='flex';
 }catch(e){ console.log(e); }
}
function closeComments(){
 document.getElementById('cmtModal').style.display='none';
 // resume video when closing comments
 if(activeReelId){
  const v=document.querySelector(`.reel[data-id="${activeReelId}"] video`);
  if(v) v.play().catch(()=>{});
 }
 activeReelId="";
}
async function sendComment(){
 const text=document.getElementById('cmtInput').value.trim(); if(!text||!activeReelId) return;
 await fetch(BASE+`/api/posts/${activeReelId}/comment`,{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text})});
 document.getElementById('cmtInput').value=''; openComments(activeReelId);
}

async function loadMsgBadge(){ try{ let r=await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}}); let map=await r.json(); let total=Object.values(map).reduce((a,b)=>a+b,0); let el=document.getElementById('msgCount'); if(total>0){el.innerText=total; el.classList.remove('hide');} else el.classList.add('hide'); }catch{} }

loadReels(); loadMsgBadge();
</script>
</body>
</html>
