 
 

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; overflow:hidden; }
.reel-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
.reel { height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#111; }
.reel video { height:100%; width:100%; object-fit:cover; }
.info { position:absolute; bottom:135px; left:12px; right:85px; z-index:5; line-height:1.4; font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
.info b{cursor:pointer;font-size:15px;text-decoration:underline}
.actions { position:absolute; right:10px; bottom:135px; display:flex; flex-direction:column; gap:22px; font-size:24px; text-align:center; z-index:5; }
.actions small{font-size:12px;display:block;margin-top:2px}
.view-badge{position:absolute;top:18px;left:12px;background:rgba(0,0,0,.65);padding:6px 12px;border-radius:20px;font-size:12px;z-index:5;display:flex;gap:6px;align-items:center}
.bottom-nav { position:fixed; bottom:0; width:100%; background:#000; border-top:1px solid #222; display:flex; justify-content:space-around; padding:14px 0; padding-bottom:20px; z-index:10; }
.bottom-nav a { color:#fff; text-decoration:none; font-size:20px; position:relative }
.msg-badge{position:absolute;top:-6px;right:-8px;background:#ff3040;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hide{display:none}
.loader-wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000}
.spinner{width:44px;height:44px;border:3px solid #222;border-top:3px solid #fff;border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer-reel{height:100vh;position:relative;background:#0a0a0a;overflow:hidden}
.shimmer-reel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.shimmer-line{position:absolute;left:12px;right:85px;bottom:160px;height:12px;background:#1a1a1a;border-radius:6px}
.shimmer-line.small{bottom:135px;width:50%;height:10px}
.comment-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:50;justify-content:flex-end;align-items:flex-end}
.comment-box{background:#121212;width:100%;max-width:500px;height:65vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;margin:0 auto}
.cmt-head{padding:12px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;font-weight:bold}
.cmt-list{flex:1;overflow-y:auto;padding:10px}
.cmt-row{display:flex;gap:10px;margin-bottom:12px}
.cmt-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex-shrink:0;cursor:pointer}
.cmt-text{font-size:14px;line-height:1.3}
.cmt-text b{cursor:pointer}
.cmt-input-area{padding:10px;border-top:1px solid #262626;display:flex;gap:8px}
.cmt-input-area input{flex:1;background:#262626;border:none;color:#fff;padding:10px;border-radius:20px;outline:none}
.cmt-input-area button{background:none;border:none;color:#0095f6;font-weight:bold;cursor:pointer}
.follow-btn{margin-left:8px;border:1px solid #fff;padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;background:transparent;color:#fff}
</style>
</head>
<body>
<div class="reel-container" id="reels">
  <div class="loader-wrap"><div class="spinner"></div><div style="font-size:13px;color:#777">Loading reels...</div></div>
</div>

<div class="bottom-nav">
<a href="feed.html" onclick="saveState()">🏠</a><a href="explore.html" onclick="saveState()">🔍</a><a href="create.html" onclick="saveState()">➕</a>
<a href="message.html" onclick="saveState()">💬<span id="msgCount" class="msg-badge hide">0</span></a>
<a href="reels.html">🎬</a> <a href="notification.html" onclick="saveState()">🔔</a> <a href="profile.html" onclick="saveState()">👤</a>
</div>

<div class="comment-modal" id="cmtModal" onclick="if(event.target===this) closeComments()">
<div class="comment-box">
<div class="cmt-head"><span id="cmtCount">Comments</span><span style="cursor:pointer" onclick="closeComments()">✕</span></div>
<div class="cmt-list" id="cmtList"></div>
<div class="cmt-input-area">
<input id="cmtInput" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') sendComment()">
<button onclick="sendComment()">Post</button>
</div>
</div>
</div>

<script src="upload-manager.js"></script>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href="login.html";
function fixUrl(u){ if(!u) return ""; if(u.startsWith('data:')) return u; if(u.startsWith('/api/')) return BASE+u; if(u.startsWith('/uploads')) return BASE+u; if(u.startsWith('http')) return u; return BASE+u; }
function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }

let reelsData=[], activeReelId="", currentPage=1, isLoadingMore=false, hasMore=true, observer=null;

function saveState(){
  const container=document.getElementById('reels');
  if(container && reelsData.length>0){
    sessionStorage.setItem('reels_html', container.innerHTML);
    sessionStorage.setItem('reels_scroll', container.scrollTop.toString());
    sessionStorage.setItem('reels_time', Date.now().toString());
    sessionStorage.setItem('reels_page', currentPage.toString());
    sessionStorage.setItem('reels_data', JSON.stringify(reelsData));
  }
}
function restoreState(){
  const html=sessionStorage.getItem('reels_html');
  const scroll=sessionStorage.getItem('reels_scroll');
  const time=parseInt(sessionStorage.getItem('reels_time')||'0');
  const page=parseInt(sessionStorage.getItem('reels_page')||'1');
  const data=sessionStorage.getItem('reels_data');
  if(html && Date.now()-time < 10*60*1000){
    document.getElementById('reels').innerHTML=html;
    if(data){ try{ reelsData=JSON.parse(data); }catch{} }
    currentPage=page;
    document.getElementById('reels').scrollTop=parseInt(scroll||'0');
    observeViews();
    return true;
  }
  return false;
}
function goToProfile(uid){
  saveState();
  if(uid) location.href='profile.html?id='+uid;
  else location.href='profile.html';
}
function showShimmer(){
  document.getElementById('reels').innerHTML=`
    <div class="shimmer-reel"><div class="shimmer-line"></div><div class="shimmer-line small"></div></div>
    <div class="shimmer-reel"><div class="shimmer-line"></div><div class="shimmer-line small"></div></div>`;
}
function appendReels(reels){
 const container=document.getElementById('reels');
 if(reels.length===0 && currentPage===1){
   container.innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px"><p>No reels yet</p><a href="create.html" style="color:#0095f6">Create Reel</a></div>`;
   return;
 }
 const html=reels.map(r=>{
  const url=fixUrl(r.mediaUrl);
  const likes=r.likes||[];
  const isLiked=likes.includes(getMyId())||likes.some(l=> (l._id||l)==getMyId());
  const views=r.views||0;
  const userId=r.user?._id||r.user;
  const username=r.user?.username||'user';
  return `<div class="reel" data-id="${r._id}">
   <div class="view-badge">👁️ <span id="view-${r._id}">${views}</span> views</div>
   <video src="${url}" loop playsinline preload="metadata" onclick="toggleMute(this, '${r._id}')"></video>
   <div class="info">
    <b onclick="goToProfile('${userId}')">@${username}</b>
    <button class="follow-btn" onclick="goToProfile('${userId}')">View Profile</button><br>
    ${r.caption||''}
   </div>
   <div class="actions">
    <div onclick="like('${r._id}')" style="cursor:pointer">${isLiked?'❤️':'🤍'}<br><small id="like-${r._id}">${likes.length}</small></div>
    <div onclick="openComments('${r._id}')" style="cursor:pointer">💬<br><small>${(r.comments||[]).length}</small></div>
    <div onclick="shareReel('${r._id}')" style="cursor:pointer">↗️<br><small>${r.shares||0}</small></div>
   </div>
  </div>`;
 }).join('');
 if(currentPage===1) container.innerHTML=html;
 else container.insertAdjacentHTML('beforeend', html);
 observeViews();
}
function toggleMute(vid, id){ vid.muted=!vid.muted; addView(id); }
async function addView(id){
 const el=document.getElementById('view-'+id);
 if(el) el.innerText=parseInt(el.innerText||0)+1;
 try{ await fetch(BASE+`/api/posts/${id}/view`,{method:'POST',headers:{authorization:token}}); }catch{}
}
function observeViews(){
 if(observer) observer.disconnect();
 observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
   const vid=e.target.querySelector('video');
   if(!vid) return;
   if(e.isIntersecting){
    document.querySelectorAll('.reel video').forEach(v=>{ if(v!==vid) v.pause(); });
    addView(e.target.dataset.id);
    vid.play().catch(()=>{});
    const all=document.querySelectorAll('.reel');
    if(e.target===all[all.length-2]) loadReels(true);
   } else { vid.pause(); }
  });
 },{threshold:0.7});
 document.querySelectorAll('.reel').forEach(el=>observer.observe(el));
}
async function loadReels(isNext=false){
  if(isNext){
    if(isLoadingMore||!hasMore) return;
    isLoadingMore=true;
    currentPage++;
  }else{
    if(restoreState()){ loadMsgBadge(); return; }
    showShimmer();
    currentPage=1; reelsData=[]; hasMore=true;
  }
  try{
    const res=await fetch(`${BASE}/api/posts/reels?page=${currentPage}&limit=8`,{headers:{authorization:token}});
    let reels=await res.json();
    if(!Array.isArray(reels)) reels=reels.posts||reels.data||[];
    if(reels.length<12) hasMore=false;
    if(isNext) reelsData=[...reelsData,...reels];
    else reelsData=reels;
    appendReels(reels);
    saveState();
  }catch(e){
    if(!isNext) document.getElementById('reels').innerHTML=`<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div>⚠️ Failed</div><button onclick="loadReels(false)" style="background:#222;color:#fff;border:1px solid #333;padding:10px 20px;border-radius:20px">Retry</button></div>`;
    else currentPage--;
  }
  isLoadingMore=false;
}
async function like(id){
 const r=reelsData.find(x=>x._id===id);
 if(r){
  const my=getMyId();
  const has = r.likes.includes(my) || r.likes.some(x=> (x._id||x)==my);
  if(has) r.likes=r.likes.filter(x=> (x._id||x)!==my && x!==my); else r.likes.push(my);
  const el=document.getElementById('like-'+id);
  if(el) el.innerText=r.likes.length;
  saveState();
 }
 try{ await fetch(BASE+`/api/posts/${id}/like`,{method:'POST',headers:{authorization:token}}); }catch{}
}
async function shareReel(id){ try{ await fetch(BASE+`/api/posts/${id}/share`,{method:'POST',headers:{authorization:token}}); }catch{} if(navigator.share){ navigator.share({url: location.origin+'/reels.html?id='+id}) } }
async function openComments(id){
 activeReelId=id;
 const v=document.querySelector(`.reel[data-id="${id}"] video`);
 if(v) v.pause();
 document.getElementById('cmtModal').style.display='flex';
 document.getElementById('cmtList').innerHTML=`<div style="display:flex;justify-content:center;padding:20px"><div class="spinner" style="width:24px;height:24px"></div></div>`;
 try{
  const res=await fetch(BASE+'/api/posts/'+id,{headers:{authorization:token}});
  const post=await res.json();
  document.getElementById('cmtCount').innerText=post.comments.length+' comments';
  document.getElementById('cmtList').innerHTML=!post.comments.length?`<p style="color:#777;text-align:center;padding:20px">No comments</p>`:
  post.comments.map(c=>{
   const name=c.user?.username||'user'; const uid=c.user?._id||c.user||'';
   return `<div class="cmt-row"><div class="cmt-avatar" onclick="goToProfile('${uid}')">${name[0].toUpperCase()}</div><div class="cmt-text"><b onclick="goToProfile('${uid}')">${name}</b> ${c.text}</div></div>`;
  }).join('');
 }catch{}
}
function closeComments(){ document.getElementById('cmtModal').style.display='none'; if(activeReelId){ const v=document.querySelector(`.reel[data-id="${activeReelId}"] video`); if(v) v.play().catch(()=>{}); } activeReelId=""; }
async function sendComment(){ const text=document.getElementById('cmtInput').value.trim(); if(!text||!activeReelId) return; document.getElementById('cmtInput').value=''; await fetch(BASE+`/api/posts/${activeReelId}/comment`,{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text})}); openComments(activeReelId); }
async function loadMsgBadge(){ try{ let r=await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}}); let map=await r.json(); let total=Object.values(map).reduce((a,b)=>a+b,0); let el=document.getElementById('msgCount'); if(total>0){el.innerText=total; el.classList.remove('hide');} else el.classList.add('hide'); }catch{} }

window.addEventListener('pagehide', saveState);
window.addEventListener('beforeunload', saveState);
document.getElementById('reels').addEventListener('scroll', ()=>{ clearTimeout(window._rt); window._rt=setTimeout(saveState,300); });

const upData = localStorage.getItem('uploading');
if(upData){ try{ const d=JSON.parse(upData); if(window.UploadManager) UploadManager.showBar(d.progress||20, d.status||'Uploading...'); }catch{} }

loadReels(false); loadMsgBadge();
</script>
</body>
</html>
