<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Football</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff}
.top-title{padding:20px;text-align:center}
.top-title h1{font-size:26px}
.top-title p{color:#aaa;font-size:13px;margin-top:5px}
.tabs{display:flex;gap:10px;padding:15px}
.tabs button{flex:1;padding:14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.tab-upcoming{background:#1a4d2e;color:#6b8a7a}.tab-upcoming.active{background:#22c55e;color:#000}
.tab-finished{background:#5a1a1a;color:#999}.tab-finished.active{background:#ef4444;color:#fff}
.date-header{padding:10px 15px;color:#3b82f6}
.match-card{background:#1c1c1e;border-radius:16px;margin:0 12px 14px;padding:16px;border:1px solid #2a2a2c}
.league-name{color:#f59e0b;font-weight:bold;font-size:14px}
.match-time{color:#888;font-size:12px;margin-bottom:10px}
.teams-row{display:flex;align-items:center;justify-content:space-between}
.team{flex:1;text-align:center}.team img{width:50px;height:50px}
.team span{font-size:13px;display:block;margin-top:5px}
.score-center{text-align:center;flex:0.8}.score-text{font-size:30px;font-weight:bold}
.status-badge{display:inline-block;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:bold;background:#333;color:#aaa;margin-top:5px}
.btn-watch{width:100%;background:#ef4444;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:bold;margin-top:12px;cursor:pointer}
.empty{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>
<div class="top-title"><h1>Live Football ⚽</h1><p>Finish Match Will Show In Finished Tab within Some Hours</p></div>
<div class="tabs">
<button id="btnUpcoming" class="tab-upcoming active" onclick="switchTab('upcoming')">Upcoming & Live</button>
<button id="btnFinished" class="tab-finished" onclick="switchTab('finished')">Finished</button>
</div>
<div class="date-header" id="dateHeader">📅 Loading...</div>
<div id="list"><div class="empty">Loading...</div></div>

<script>
const API_URL = 'https://raymonddomain.dev/apii/matches';
let allMatches = [];
let currentTab = 'upcoming';

async function loadMatches(){
  document.getElementById('dateHeader').innerHTML = `📅 ${new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
  try{
    const res = await fetch(`${API_URL}?tab=${currentTab}&t=${Date.now()}`);
    const json = await res.json();
    // CRITICAL FIX - NEVER CRASHES
    if(Array.isArray(json)) allMatches = json;
    else if(json && Array.isArray(json.matches)) allMatches = json.matches;
    else allMatches = [];
    if(!Array.isArray(allMatches)) allMatches = [];
    render();
  }catch(e){
    document.getElementById('list').innerHTML = `<div class="empty">Error: ${e.message}<br><button onclick="loadMatches()" style="margin-top:10px;padding:8px 16px;background:#22c55e;border:0;border-radius:6px">Retry</button></div>`;
  }
}

function render(){
  const list = document.getElementById('list');
  if(!Array.isArray(allMatches)) allMatches = [];
  const filtered = allMatches.filter(m=>m && m.home && m.away);
  if(filtered.length===0){
    list.innerHTML = `<div class="empty">No ${currentTab} country matches found<br>Last 3 days + Next 3 days<br><br>Open <a href="https://raymonddomain.dev/api/fetch-now" target="_blank" style="color:#3b82f6">fetch-now</a> to sync</div>`;
    return;
  }
  list.innerHTML = filtered.map(m=>{
    const d = new Date(m.date);
    const isLive = m.status==='IN_PLAY';
    const score = m.status==='SCHEDULED' ? 'VS' : `${m.homeScore??0} - ${m.awayScore??0}`;
    return `<div class="match-card">
      <div class="league-name">${m.league}</div>
      <div class="match-time">${d.toLocaleString()} ${m.elapsed ? m.elapsed+"'" : ''} ${m.rawStatus||''}</div>
      <div class="teams-row">
        <div class="team"><img src="${m.home.logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.home.name}</span></div>
        <div class="score-center"><div class="score-text">${score}</div><div class="status-badge">${m.status}</div></div>
        <div class="team"><img src="${m.away.logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.away.name}</span></div>
      </div>
      <button class="btn-watch" onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('${m.home.name} vs ${m.away.name} live'),'_blank')">▶ Watch Live</button>
    </div>`;
  }).join('');
}

function switchTab(t){
  currentTab=t;
  document.getElementById('btnUpcoming').className = t==='upcoming'?'tab-upcoming active':'tab-upcoming';
  document.getElementById('btnFinished').className = t==='finished'?'tab-finished active':'tab-finished';
  loadMatches();
}
loadMatches();
setInterval(loadMatches, 30000);
</script>
</body>
</html>
