
   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Football - Raymond Directory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.top-title{padding:18px 15px 5px;text-align:center}
.top-title h1{font-size:24px;font-weight:800}
.top-title p{color:#888;font-size:12px;margin-top:6px}
.tabs{display:flex;gap:10px;padding:14px}
.tabs button{flex:1;padding:14px;border:0;border-radius:10px;font-weight:800;cursor:pointer;transition:0.2s}
.tab-upcoming{background:#1a2e1f;color:#6b8a7a}.tab-upcoming.active{background:#22c55e;color:#000}
.tab-finished{background:#2e1a1a;color:#7a6b6b}.tab-finished.active{background:#ef4444;color:#fff}
.date-header{padding:12px 15px;color:#3b82f6;font-weight:700;font-size:14px}
.match-card{background:#141416;border-radius:16px;margin:0 12px 14px;padding:16px;border:1px solid #232326}
.league-name{color:#f59e0b;font-weight:700;font-size:13px;margin-bottom:2px}
.match-time{color:#666;font-size:11px;margin-bottom:12px}
.teams-row{display:flex;align-items:center;justify-content:space-between}
.team{flex:1;text-align:center}
.team img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.team span{font-size:12px;display:block;margin-top:8px;font-weight:600;line-height:1.2}
.score-center{text-align:center;flex:0.9}
.score-text{font-size:32px;font-weight:900;letter-spacing:1px}
.status-badge{min-width:64px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;margin-top:6px;display:inline-block;text-align:center}
.btn-lineup{width:100%;background:#1e293b;color:#e2e8f0;border:0;padding:12px;border-radius:10px;font-weight:700;margin-top:14px;cursor:pointer}
.btn-watch{width:100%;background:#dc2626;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer}
.empty{text-align:center;padding:40px;color:#666;font-size:13px}
</style>
</head>
<body>

<div class="top-title">
  <h1>Live Football ⚽</h1>
  <p>Finish Match Will Show In Finished Tab within Some Hours</p>
</div>

<div class="tabs">
  <button id="btnUpcoming" class="tab-upcoming active" onclick="switchTab('upcoming')">Upcoming & Live</button>
  <button id="btnFinished" class="tab-finished" onclick="switchTab('finished')">Finished</button>
</div>

<div class="date-header" id="dateHeader">📅 Loading...</div>
<div id="list"><div class="empty">Loading matches...</div></div>

<script>
const API_URL = 'https://raymonddomain.dev/apii/matches'; // FIXED: was /apii/
let allMatches = [];
let currentTab = 'upcoming';

async function loadMatches(){
  const list = document.getElementById('list');
  try{
    const res = await fetch(`${API_URL}?tab=${currentTab}&t=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    
    if(Array.isArray(json)) allMatches = json;
    else if(json && Array.isArray(json.matches)) allMatches = json.matches;
    else allMatches = [];
    
    if(!Array.isArray(allMatches)) allMatches = [];
    
    render();
  }catch(e){
    console.error(e);
    allMatches = [];
    list.innerHTML = `<div class="empty">Error loading: ${e.message}<br><br><button onclick="loadMatches()" style="padding:8px 18px;background:#22c55e;border:0;border-radius:8px;font-weight:800">Retry</button></div>`;
  }
}

function render(){
  const list = document.getElementById('list');
  const header = document.getElementById('dateHeader');
  
  header.innerHTML = `📅 ${new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;

  if(!Array.isArray(allMatches)) allMatches = [];
  let filtered = allMatches.filter(m => m && m.home && m.away);

  // === YOUR REQUEST: RECENT FINISH FIRST AT TOP ===
  if(currentTab === 'finished'){
    filtered.sort((a,b) => new Date(b.date) - new Date(a.date)); // Most recent first
  } else {
    filtered.sort((a,b) => new Date(a.date) - new Date(b.date)); // Upcoming soonest first, live first
    // Push live to top
    filtered.sort((a,b) => (b.status === 'IN_PLAY' ? 1 : 0) - (a.status === 'IN_PLAY' ? 1 : 0));
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">No ${currentTab} matches found</div>`;
    return;
  }

  list.innerHTML = filtered.map(m=>{
    const d = new Date(m.date);
    const kickTime = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
    const dayStr = d.toLocaleDateString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    const isLive = m.status === 'IN_PLAY';
    const isFinished = m.status === 'FINISHED';
    
    const scoreText = `${m.homeScore ?? 0} - ${m.awayScore ?? 0}`;

    let badgeHTML = '';
    if(isLive){
      badgeHTML = `<div class="status-badge" style="background:#22c55e;color:#000;">${m.elapsed ? "INPLAY" : ''} </div>`;
    } else if(isFinished){
      badgeHTML = `<div class="status-badge" style="background:#333;color:#888;">FINISH</div>`;
    } else {
      badgeHTML = `<div class="status-badge" style="background:#2a3441;color:#e2e8f0;">${kickTime}</div>`;
    }

    return `
    <div class="match-card">
      <div class="league-name">${m.league}</div>
      <div class="match-time">${dayStr} • ${kickTime}</div>
      <div class="teams-row">
        <div class="team"><img src="${m.home.logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.home.name}</span></div>
        <div class="score-center">
          <div class="score-text">${scoreText}</div>
          ${badgeHTML}
        </div>
        <div class="team"><img src="${m.away.logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.away.name}</span></div>
      </div>
      <button class="btn-lineup" onclick="alert('Lineups for ${m.home.name} vs ${m.away.name}')">Line Up</button>
      <button class="btn-watch" onclick="window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(m.home.name+' vs '+m.away.name+' live')}','_blank')">▶ Watch Live</button>
    </div>`;
  }).join('');
}

function switchTab(t){
  currentTab = t;
  document.getElementById('btnUpcoming').className = t==='upcoming' ? 'tab-upcoming active' : 'tab-upcoming';
  document.getElementById('btnFinished').className = t==='finished' ? 'tab-finished active' : 'tab-finished';
  loadMatches();
}

loadMatches();
setInterval(loadMatches, 30000);
</script>
</body>
</html>
