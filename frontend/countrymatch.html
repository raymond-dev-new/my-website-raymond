<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Football</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
  body{background:#0a0a0a;color:#fff;min-height:100vh}
.top-title{padding:20px;text-align:center}
.top-title h1{font-size:26px;font-weight:bold;margin-bottom:8px}
.top-title p{font-size:14px;color:#aaa;line-height:1.4}
.tabs{display:flex;gap:10px;padding:15px}
.tabs button{flex:1;padding:14px;border:0;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.tab-upcoming{background:#1a4d2e;color:#6b8a7a}
.tab-upcoming.active{background:#22c55e;color:#000}
.tab-finished{background:#5a1a1a;color:#999}
.tab-finished.active{background:#ef4444;color:#fff}
.date-header{padding:10px 15px;color:#3b82f6;font-size:15px}
.match-card{background:#1c1c1e;border-radius:16px;margin:0 12px 14px 12px;padding:16px;border:1px solid #2a2a2c}
.league-name{color:#f59e0b;font-size:14px;font-weight:bold;margin-bottom:2px}
.match-time{color:#888;font-size:12px;margin-bottom:14px}
.teams-row{display:flex;align-items:center;justify-content:space-between}
.team{flex:1;text-align:center}
.team img{width:50px;height:50px;object-fit:contain;margin-bottom:8px}
.team span{font-size:13px;display:block;line-height:1.2}
.score-center{text-align:center;flex:0.8}
.score-text{font-size:32px;font-weight:bold;margin-bottom:8px}
.status-badge{display:inline-block;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:bold}
.status-live{background:#ef4444;color:#fff;animation:blink 1s infinite}
.status-ht{background:#f59e0b;color:#000}
.status-ft{background:#22c55e;color:#000}
.status-ns{background:#333;color:#aaa}
.elapsed{font-size:11px;color:#ef4444;margin-top:4px;font-weight:bold}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.card-buttons{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn-lineup{background:#2a2a2e;color:#fff;border:0;padding:12px;border-radius:10px;font-size:14px;cursor:pointer}
.btn-watch{background:#ef4444;color:#fff;border:0;padding:12px;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
.empty{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>

<div class="top-title">
  <h1>Live Football ⚽</h1>
  <p>Finish Match Will Show In Finished Tab<br>within Some Hours</p>
</div>

<div class="tabs">
  <button id="btnUpcoming" class="tab-upcoming active" onclick="switchTab('upcoming')">Upcoming & Live</button>
  <button id="btnFinished" class="tab-finished" onclick="switchTab('finished')">Finished</button>
</div>

<div class="date-header" id="dateHeader">📅 Loading...</div>
<div id="list"><div class="empty">Loading country matches...</div></div>

<script>
// ===== CONFIG - matches your backend port 8000 =====
const API_URL = 'https://raymonddomain.dev/api/country-matches';
// =====================================================

let allMatches = []; // Store all matches
let currentTab = 'upcoming'; // Current active tab

// --- Load matches using async/await (not.then) ---
async function loadMatches() {
  try {
    const res = await fetch(API_URL); // Fetch from DB
    const matches = await res.json(); // Parse JSON with await
    allMatches = matches; // Save globally
    renderMatches(); // Render
  } catch (err) {
    document.getElementById('list').innerHTML = `<div class="empty">Error: ${err.message}<br>Is server.js running on 8000?</div>`;
    console.log('Error:', err);
  }
}

// --- Switch tab ---
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('btnUpcoming').className = tab==='upcoming'? 'tab-upcoming active' : 'tab-upcoming';
  document.getElementById('btnFinished').className = tab==='finished'? 'tab-finished active' : 'tab-finished';
  renderMatches();
}

// --- Render with live minutes, HT, FINISH ---
function renderMatches() {
  const list = document.getElementById('list');
  const dateHeader = document.getElementById('dateHeader');
  const today = new Date();
  dateHeader.innerHTML = `📅 ${today.toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}`;

  let filtered = [];
  if(currentTab === 'upcoming') {
    filtered = allMatches.filter(m => ['NS','1H','HT','2H','ET','P','LIVE','TBD'].includes(m.status));
  } else {
    filtered = allMatches.filter(m => ['FT','AET','PEN'].includes(m.status));
  }

  if(filtered.length === 0) {
    list.innerHTML = `<div class="empty">No ${currentTab} matches<br><small>7 days range</small></div>`;
    return;
  }

  list.innerHTML = filtered.map(m => {
    const date = new Date(m.match_date);
    const isLive = ['1H','2H','ET','P','LIVE'].includes(m.status);
    const isHT = m.status === 'HT';
    const isFT = ['FT','AET','PEN'].includes(m.status);
    const isNS = m.status === 'NS';

    let scoreText = 'vs';
    if(!isNS && m.score_home!== null) scoreText = `${m.score_home} - ${m.score_away}`;

    let statusText = m.status;
    let statusClass = 'status-ns';
    let elapsedText = '';

    if(isLive) {
      statusText = m.elapsed? `${m.elapsed}'` : 'LIVE';
      statusClass = 'status-live';
      elapsedText = `${m.status} • ${m.elapsed? m.elapsed + "'" : ''}`;
    } else if(isHT) {
      statusText = 'HALF TIME';
      statusClass = 'status-ht';
      elapsedText = `HT • ${m.elapsed? m.elapsed + "'" : ''}`;
    } else if(isFT) {
      statusText = 'FINISH';
      statusClass = 'status-ft';
    } else if(isNS) {
      statusText = date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      statusClass = 'status-ns';
    }

    return `
      <div class="match-card">
        <div class="league-name">${m.league}</div>
        <div class="match-time">${date.toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long'})} • ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
        <div class="teams-row">
          <div class="team"><img src="${m.home_logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.home_team}</span></div>
          <div class="score-center"><div class="score-text" style="${isNS? 'font-size:18px;color:#666' : ''}">${scoreText}</div><div class="status-badge ${statusClass}">${statusText}</div>${isLive || isHT? `<div class="elapsed">${elapsedText}</div>` : ''}</div>
          <div class="team"><img src="${m.away_logo}" onerror="this.src='https://via.placeholder.com/50'"><span>${m.away_team}</span></div>
        </div>
        <div class="card-buttons"><button class="btn-lineup">Line Up</button><button class="btn-watch">▶ Watch Live</button></div>
      </div>
    `;
  }).join('');
}

// Initial load
loadMatches();

// Auto refresh every 60 sec using async
setInterval(async () => {
  await loadMatches();
}, 60000);
</script>

</body>
</html>
