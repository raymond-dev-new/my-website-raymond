<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real Draughts vs Defensive CPU</title><style>
*{box-sizing:border-box}body{margin:0;background:#151515;color:#fff;font:16px Arial;text-align:center}h2{margin:12px 0 5px}.turn{font-weight:bold;font-size:18px}.score{display:flex;justify-content:center;gap:35px;margin:8px}.red{color:#f44}.board{width:94vw;max-width:480px;margin:12px auto;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #555}.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center}.light{background:#dbc297}.dark{background:#765334}.piece{width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 7px #0008,0 3px 5px #000;cursor:pointer;font-size:24px}.rp{background:#d83232}.wp{background:#eee;color:#222}.king:after{content:"♛";font-size:25px;color:#FFD700}.selected{outline:4px solid #ffe500}.can{box-shadow:inset 0 0 0 5px #38e638}.msg{min-height:24px;margin:8px;font-weight:bold}.btn{padding:11px 22px;border:0;border-radius:8px;font-weight:bold;margin:5px;background:#f45010;color:white;cursor:pointer}.note{font-size:12px;color:#aaa;margin:8px}
</style></head><body>
<h2>♟ DRAUGHTS vs CPU</h2><div class="turn" id="turn"></div><div class="score"><span class="red">🔴 You: <b id="rc">12</b></span><span>🤖 CPU: <b id="wc">12</b></span></div><div class="msg" id="msg"></div><div class="board" id="board"></div><button class="btn" onclick="newGame()">🔄 New Game</button><div class="note">Flying Kings</div>
<script>
const KEY="draughts_v9_defensive",B=board,T=turn,M=msg,RC=rc,WC=wc,YOU="r",CPU="w",D=[[-1,-1],[-1,1],[1,-1],[1,1]];
let a=[],p=YOU,sel=null,over=0,multi=0,thinking=0;

function save(){localStorage.setItem(KEY,JSON.stringify({a,p,over,multi}))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x||!Array.isArray(x.a)||x.a.length!=64)return 0;a=x.a;p=x.p||YOU;over=!!x.over;multi=!!x.multi;sel=null;return 1}catch(e){return 0}}
function newGame(){localStorage.removeItem(KEY);a=Array(64).fill(null);p=YOU;sel=null;over=multi=thinking=0;for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r*8+c]={p:"w",k:0};for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r*8+c]={p:"r",k:0};M.textContent="Your turn: Select a piece";save();draw()}
function dirs(x){return x.k?D:x.p=="r"?D.slice(0,2):D.slice(2)}
function moves(i,b=a){let x=b[i],o=[];if(!x)return o;let r=i>>3,c=i&7;
if(x.k)D.forEach(d=>{for(let n=1;n<8;n++){let R=r+d[0]*n,C=c+d[1]*n;if(R<0||R>7||C<0||C>7)break;let j=R*8+C;if(!b[j])o.push({to:j,cap:-1});else break}})
else dirs(x).forEach(d=>{let R=r+d[0],C=c+d[1];if(R>=0&&R<8&&C>=0&&C<8&&!b[R*8+C])o.push({to:R*8+C,cap:-1})});
D.forEach(d=>{if(x.k){let hit=-1;for(let n=1;n<8;n++){let R=r+d[0]*n,C=c+d[1]*n;if(R<0||R>7||C<0||C>7)break;let j=R*8+C;if(!b[j]){if(hit>=0)o.push({to:j,cap:hit})}else if(b[j].p!=x.p&&hit<0)hit=j;else break}}
else{let R=r+d[0],C=c+d[1],R2=r+d[0]*2,C2=c+d[1]*2;if(R>=0&&R<8&&C>=0&&C<8&&R2>=0&&R2<8&&C2>=0&&C2<8){let q=R*8+C,j=R2*8+C2;if(b[q]&&b[q].p!=x.p&&!b[j])o.push({to:j,cap:q})}}});return o}

function caps(pl,b=a){let o=[];for(let i=0;i<64;i++)if(b[i]&&b[i].p==pl)moves(i,b).forEach(m=>{if(m.cap>=0)o.push({from:i,to:m.to,cap:m.cap})});return o}

function apply(b,m){let z=b.slice(),x={...z[m.from]};z[m.from]=null;z[m.to]=x;if(m.cap>=0)z[m.cap]=null;let r=m.to>>3;if((x.p=="r"&&r==0)||(x.p=="w"&&r==7))x.k=1;return z}

function danger(i,b,pl=YOU){return caps(pl,b).some(m=>m.to==i)}
function captureCount(pl,b){return caps(pl,b).length}
function pieceCount(pl,b){return b.filter(x=>x&&x.p==pl).length}
function mobility(pl,b){let n=0;for(let i=0;i<64;i++)if(b[i]&&b[i].p==pl)n+=moves(i,b).length;return n}

function trapScore(m,b,x){
 let s=0,n=apply(b,m);

 /* IMMEDIATE CAPTURE TEST */
 let enemyCaps=caps(YOU,n);
 if(enemyCaps.length){
  let lose=0;
  enemyCaps.forEach(q=>{
   let after=apply(n,q);
   let more=caps(CPU,after).length;
   lose+=1+more*4;
  });
  s-=lose*180;
 }

 /* CHECK IF THE MOVED PIECE ITSELF IS OFFERED */
 if(danger(m.to,n,YOU))s-=700;

 /* DON'T SACRIFICE A KING */
 if(x.k&&danger(m.to,n,YOU))s-=900;

 /* PROTECT FRIENDLY PIECES */
 let protectedN=0;
 for(let i=0;i<64;i++)if(n[i]&&n[i].p==CPU){
  if(caps(YOU,n).some(q=>q.to==i))s-=100;
  else protectedN++;
 }
 s+=protectedN*8;

 /* FAVOR SAFE CAPTURES */
 if(m.cap>=0){
  s+=danger(m.to,n,YOU)?30:450;
  let follow=caps(CPU,n).length;
  s+=follow*100;
 }

 /* KEEP CPU BACK */
 let r=m.to>>3,c=m.to&7;
 if(!x.k)s+=(7-r)*9;

 /* CENTER, BUT NOT IF IT IS A TRAP */
 if(r>=2&&r<=5&&c>=2&&c<=5&&!danger(m.to,n,YOU))s+=18;

 /* KEEP PIECES TOGETHER */
 D.forEach(d=>{
  let j=m.to+d[0]*8+d[1];
  if(j>=0&&j<64&&n[j]&&n[j].p==CPU)s+=18;
 });

 /* BACK ROW DEFENSE */
 if(r<3)s+=15;

 /* MATERIAL */
 s+=(pieceCount(CPU,n)-pieceCount(YOU,n))*25;

 /* MOBILITY */
 s+=Math.min(40,mobility(CPU,n)*2);

 return s;
}

/* DEEP TRAP CHECK:
   CPU imagines its move, then your best capture,
   then checks whether another CPU capture is available. */
function deepScore(m,b,x){
 let s=trapScore(m,b,x),n=apply(b,m),ec=caps(YOU,n);
 if(!ec.length)return s+80;

 let worst=99999;
 ec.forEach(e=>{
  let after=apply(n,e),v=0;
  let cc=caps(CPU,after);
  v+=cc.length*90;
  v+=(pieceCount(YOU,after)-pieceCount(CPU,after))*180;
  for(let i=0;i<64;i++)if(after[i]&&after[i].p==CPU&&danger(i,after,YOU))v-=120;
  worst=Math.min(worst,v);
 });
 return s-worst*1.7;
}

function draw(){B.innerHTML="";for(let i=0;i<64;i++){let s=document.createElement("div");s.className="sq "+(((i>>3)+(i&7))%2?"dark":"light");if(sel==i)s.classList.add("selected");if(sel!=null&&moves(sel).some(m=>m.to==i))s.classList.add("can");if(a[i]){let q=document.createElement("div");q.className="piece "+(a[i].p=="r"?"rp":"wp")+(a[i].k?" king":"");q.onclick=e=>{e.stopPropagation();if(p==YOU&&!thinking)tap(i)};s.appendChild(q)}s.onclick=()=>{if(p==YOU&&!thinking)tap(i)};B.appendChild(s)}RC.textContent=a.filter(x=>x&&x.p=="r").length;WC.textContent=a.filter(x=>x&&x.p=="w").length;T.textContent=over?"GAME OVER":p==YOU?"🔴 Your Turn":"🤖 CPU is thinking..."}

function tap(i){if(over||thinking||p!=YOU)return;if(sel==null){if(!a[i]||a[i].p!=p)return;let c=caps(p);if(c.length&&!c.some(x=>x.from==i)){M.textContent="You must select a piece that can capture!";return}sel=i;M.textContent=c.length?"Capture an opponent!":"Choose a move";save();draw();return}
let m=moves(sel).find(x=>x.to==i);if(!m){if(a[i]&&a[i].p==p&&!multi){let c=caps(p);if(!c.length||c.some(x=>x.from==i)){sel=i;save();draw();return}}M.textContent="Invalid move.";return}
if(caps(p).length&&m.cap<0){M.textContent="You must capture!";return}play(sel,m.to,m.cap)}

function play(from,to,cap){let x=a[from];a[from]=null;a[to]=x;if(cap>=0)a[cap]=null;let r=to>>3;if((x.p=="r"&&r==0)||(x.p=="w"&&r==7))x.k=1;
if(cap>=0){let n=moves(to).filter(z=>z.cap>=0);if(n.length){sel=to;multi=1;M.textContent="Another capture available!";save();draw();if(p==CPU)setTimeout(cpuChain,350);return}}endTurn()}

function endTurn(){sel=null;multi=0;let e=p=="r"?"w":"r";if(!a.some(x=>x&&x.p==e)||!a.some((x,i)=>x&&x.p==e&&moves(i).length)){finish(p);return}p=e;M.textContent=caps(p).length?"CPU must capture!":"CPU is thinking...";save();draw();if(p==CPU)setTimeout(cpuMove,500)}

function cpuChain(){if(p!=CPU||over)return;let z=moves(sel).filter(x=>x.cap>=0);if(!z.length){endTurn();return}let x=a[sel],best=z[0],bs=-Infinity;z.forEach(m=>{m.from=sel;let q=deepScore(m,a,x);if(q>bs){bs=q;best=m}});play(sel,best.to,best.cap)}

function cpuMove(){if(over||p!=CPU)return;thinking=1;draw();setTimeout(()=>{
 let list=[];for(let i=0;i<64;i++)if(a[i]&&a[i].p==CPU)moves(i).forEach(m=>{m.from=i;m.score=deepScore(m,a,a[i]);list.push(m)});
 let c=caps(CPU);if(c.length)list=list.filter(m=>m.cap>=0);
 if(!list.length){finish(YOU);return}
 list.sort((x,y)=>y.score-x.score);

 /* CPU usually chooses one of the safest top moves,
    but will not randomly choose a clearly bad trap. */
 let safe=list.filter(x=>x.score>=list[0].score-35);
 let top=safe.slice(0,Math.min(3,safe.length));
 let m=top[Math.random()*top.length|0];

 thinking=0;play(m.from,m.to,m.cap);if(!over)draw()
},550)}

function finish(w){over=1;sel=null;thinking=0;M.textContent=w==YOU?"🔴 YOU WIN! 🎉":"🤖 CPU WINS!";save();draw()}
if(!load())newGame();else draw();
</script></body></html>
