<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feed</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a12;color:#fff;font-family:Arial;padding-bottom:90px}

.top{max-width:935px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(10,10,18,.95);backdrop-filter:blur(12px);z-index:10}

.logo{font-family:cursive;font-size:26px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.section{max-width:935px;margin:0 auto;padding:14px 16px 4px}

.section h3{margin:0}

.grid{max-width:935px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 16px}

.card{background:#16161f;border:1px solid #26262f;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}

.card:active{transform:scale(.97)}

.cover{position:relative;width:100%;height:220px;background:#222}

.cover img{width:100%;height:100%;object-fit:cover}

.noimg{width:100%;height:100%;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:56px}

.pin{position:absolute;top:10px;left:10px;background:#f59e0b;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.4)}

.body{padding:12px}

.title{font-size:14px;font-weight:800;line-height:1.3;min-height:36px}

.meta{font-size:12px;color:#999;margin-top:8px;display:flex;gap:10px}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,18,.95);backdrop-filter:blur(12px);border-top:1px solid #262626;display:flex;justify-content:space-around;padding:14px 0}

.nav a{color:#fff;text-decoration:none;font-size:22px}

.nav a.active{transform:scale(1.25)}

button{
  color: #ec4899;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
}

.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:#14141d;border-right:1px solid #262626;z-index:100;transition:left .3s;padding:20px}

.sidebar.open{left:0}

.sidebar a{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;padding:13px 12px;border-radius:12px;font-size:15px;font-weight:700;margin-top:6px}

.sidebar a:hover,.sidebar a.active{background:#26262f}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}

.sidebar-overlay.open{display:block}

.side-link{padding:14px 16px;background:#1a1a1a;border:1px solid #262626;border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer}

/* FIXED - menu button must NOT look / act like Logout button */
.menuBtn{background:none!important;border:none!important;color:#fff!important;font-size:22px!important;padding:0 8px 0 0!important;cursor:pointer}

/* ============================================================ */
/* ADDED ONLY - MESSAGE NOTIFICATION BADGE STYLES               */
/* Copy this whole block to any other page you want badge on    */
/* ============================================================ */
/* Makes the 💬 link able to hold a badge on top of it */
.navMsg{position:relative}
/* The red circle with number, e.g. 1, 2, 99+ */
.msgBadge{
  position:absolute;
  top:-8px;
  right:-10px;
  background:#ff3b30;
  color:#fff;
  font-size:11px;
  font-weight:800;
  min-width:18px;
  height:18px;
  border-radius:999px;
  display:none; /* hidden when 0 unread, JS will show it */
  align-items:center;
  justify-content:center;
  padding:0 4px;

      <div class="side-link"><span>📊</span> <a href="info.html"> Contact us </a></div>
      <div class="side-link"><span>🗝️🔐</span> <a href="resetpassword.html"> Reset Password </a></div>
      <div class="side-link"><span>📊</span> <a href="next.html"> Games </a></div>
</div>

<div class="top">
  <!-- FIXED - type="button" + id, so it only opens sidebar, never logs out -->

<div class="section" id="pinSec" style="display:none">
  <h3>📌 Pinned For You</h3>

</div>

</div>

  <p style="grid-column:1/3;text-align:center;color:#777">Loading stories...</p>
</div>

<div class="nav">

  <!-- ADDED ONLY - Added class="navMsg" + <span id="msgBadge"> so badge can show on 💬 -->
  <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
  <a href="diary.html">📖</a>

</div>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href="login.html";
// ADDED ONLY - Open / Close sidebar only, no redirect
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

// NEW: cover is already full image from DB, use directly - no BASE +
function shuffle(a){ 
  let arr = [...a];
   for(let i = arr.length-1; i > 0 ; i--){ 
    let j = Math.floor(Math.random()*(i+1));
     [arr[i],arr[j]] = [arr[j],arr[i]]; 
  } 
  return arr; 
}

function getPinned(all){
  const THREE=3*24*60*60*1000;
  let saved=null; 
  try{
     saved = JSON.parse(localStorage.getItem('pinned_novels')||'null'); 
  }catch{}

  if(saved && saved.time && Date.now()-saved.time < THREE && saved.ids.length===3){
    let p = all.filter(x => saved.ids.includes(x._id));
    if(p.length===3) 
    
    return p;
  }

  let np = shuffle(all).slice(0,3);

  localStorage.setItem('pinned_novels', JSON.stringify({ids: np.map(x => x._id), time: Date.now()}));

  return np;
}

function card(p, isPin) {
  let cover = p.cover ? '<img src="'+p.cover+'">' : '<div class="noimg">📖</div>';

 return '<div class="card" onclick="location.href=\'read.html?id='+p._id+'\'"> <div class="cover">'+(isPin?'<span class="pin">📌 PINNED</span>':'')+cover+' </div> <div class="body"> <div class="title">'+p.title+'</div> <div class="meta"> <span>@'+(p.user?.username||'author')+'</span> <span>❤️ '+(p.likes?.length||0)+'</span> <span>💬 '+(p.comments?.length||0)+'</span> </div> </div> </div>';
}

async function load(){
  const res = await fetch(BASE+'/api/posts/feed?page=1&limit=20',{
    headers:{authorization:token}
});

  let posts = await res.json();

  if(!posts.length){ 
    document.getElementById('feedGrid').innerHTML = '<p style="grid-column:1/3;text-align:center">No novels yet. Be the first! ✍️</p>'; 
   
    return; 
 }

  let pinned = getPinned(posts);

  let pinnedIds = pinned.map(p => p._id );
  let rest = shuffle(posts.filter(p => !pinnedIds.includes(p._id)));
  document.getElementById('pinnedGrid').innerHTML = pinned.map(p=>card(p,true)).join('');
  document.getElementById('pinSec').style.display='block';
  document.getElementById('feedGrid').innerHTML = rest.map(p=>card(p,false)).join('');
}

load();

// FIXED - Was document.querySelector('button') which picked the ☰ button. Now picks Logout by ID only.
 const button = document.getElementById('logoutBtn')

 button.addEventListener('click', () => {
  localStorage.removeItem('token')
  location.href="dashboard.html"
 })

 const ball=document.querySelector('.ball'); 
 const Country=document.querySelector('.Country');

  if(ball) ball.addEventListener('click', async () => { 
      fetch(BASE+'/api/sync'); 
       location.href="football.html"; 
  });

  if(Country) Country.addEventListener('click', async () => { 
     fetch(BASE+'/api/fetch-now'); 
      location.href="countrymatch.html"; 
  });

// ====================================================================
// ADDED ONLY - MESSAGE NOTIFICATION FOR THIS PAGE (FEED)
// Copy this WHOLE block to any other page to get same badge there.
// It uses the SAME localStorage keys as message.html, so they stay in sync.
// ====================================================================

// --- STEP 1: Get my own ID from token ---
// We need my ID to build the "read_" key and to know if a message is from me or from them
function getMyIdForBadge(){
  try{
    // Token is like xxx.YYY.zzz, the middle part holds my id
    return JSON.parse(atob(token.split('.')[1])).id;
  }catch{
    return "";
  }
}

// --- STEP 2: Helpers to remember what I have already read ---
// We save: read_MYID_OTHERID = ID of last message I saw from that person
// Example: read_123_456 = "msg789"
// If server has a newer message ID after that one, and it's from THEM, it's unread.
function getReadKeyForBadge(otherId){
  return 'read_' + getMyIdForBadge() + '_' + otherId;
}
function getLastReadIdForBadge(otherId){
  return localStorage.getItem(getReadKeyForBadge(otherId)) || '';
}

// --- STEP 3: Show / hide the red badge on 💬 button ---
function updateMsgBadge(count){
  // Find the badge span in the bottom nav
  const badge = document.getElementById('msgBadge');
  if(!badge) return; // If this page has no badge, do nothing
  if(count > 0){
    badge.style.display = 'flex'; // Show badge
    badge.innerText = count > 99 ? '99+' : count; // 99+ if too many
  }else{
    badge.style.display = 'none'; // Hide badge when 0 unread
  }
}

// --- STEP 4: Check server for new messages ---
async function checkMsgNotifications(){
  try{
    // 4a. Get my profile to know who I follow / who follows me = people who can message me
    const meRes = await fetch(BASE + '/api/users/' + getMyIdForBadge(), { headers: { authorization: token } });
    const meData = await meRes.json();
    const me = meData.user || meData;
    let people = [...(me.followers || []), ...(me.following || [])];

    // 4b. Remove duplicates + remove myself
    let seen = {};
    people = people.filter(p => {
      let id = p._id || p;
      if(seen[id]) return false;
      seen[id] = true;
      return id !== getMyIdForBadge();
    });

    let totalUnread = 0; // Total unread across all chats

    // 4c. For each person, fetch our chat and count unread
    for(const p of people){
      const otherId = p._id || p;
      const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
      const msgs = await res.json();
      if(!Array.isArray(msgs) || !msgs.length) continue; // No messages with this person

      const lastReadId = getLastReadIdForBadge(otherId);

      // If I have NEVER opened this chat before, treat all old messages as already read
      // (so old chats don't suddenly show as unread on first load)
      // We save the last message as "read" and continue
      if(!lastReadId){
        localStorage.setItem(getReadKeyForBadge(otherId), msgs[msgs.length-1]._id);
        continue;
      }

      // Find where I stopped reading
      const idx = msgs.findIndex(m => m._id === lastReadId);

      if(idx === -1){
        // My last read message was deleted, so check last message:
        // If last message is new AND from them, count it as 1 unread
        const lastMsg = msgs[msgs.length-1];
        const fromId = lastMsg.from?._id || lastMsg.from;
        if(lastMsg._id !== lastReadId && fromId !== getMyIdForBadge()){
          totalUnread += 1;
        }
      }else{
        // Count messages AFTER my last read one that are FROM THEM (not from me)
        const after = msgs.slice(idx + 1);
        for(const m of after){
          const fromId = m.from?._id || m.from;
          if(fromId !== getMyIdForBadge()) totalUnread++;
        }
      }
    }

    // 4d. Update the badge on screen
    updateMsgBadge(totalUnread);

  }catch(e){
    // If internet fails, just ignore, will try again in 3 seconds
  }
}

// --- STEP 5: Start checking ---
// Check immediately when page loads
checkMsgNotifications();
// Then check every 3 seconds, so new message shows fast while you are on Feed
setInterval(checkMsgNotifications, 3000);
</script>
