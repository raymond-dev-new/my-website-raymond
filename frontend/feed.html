<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feed</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;height:100vh;height:100dvh}
    a{color:inherit;text-decoration:none}

   .top{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(to bottom, rgba(0,0,0,.8), transparent);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
   .top *{pointer-events:auto}
   .logo{font-family:cursive;font-size:22px;font-weight:bold}
   .wrap{max-width:470px;margin:0 auto;width:100%}

    /* TIKTOK CONTAINER - VERTICAL SWIPE */
    #feed{
      height:100vh;
      height:100dvh;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
      scrollbar-width:none;
    }
    #feed::-webkit-scrollbar{display:none}

   .post{
      height:100vh;
      height:100dvh;
      width:100%;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      position:relative;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

   .media{
      width:100%;
      height:100%;
      position:absolute;
      inset:0;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
    }
   .media img,.media video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* BIG HEART */
   .big-heart{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%) scale(0);
      font-size:90px;
      color:#ff2d55;
      pointer-events:none;
      opacity:0;
      z-index:5;
    }
   .big-heart.show{animation:bigHeart 0.9s ease-out forwards}
    @keyframes bigHeart{
      0%{transform:translate(-50%,-50%) scale(0);opacity:0}
      15%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
      30%{transform:translate(-50%,-50%) scale(1);opacity:1}
      80%{transform:translate(-50%,-50%) scale(1);opacity:1}
      100%{transform:translate(-50%,-50%) scale(0);opacity:0}
    }

    /* RIGHT SIDE ACTIONS LIKE TIKTOK */
   .right-actions{
      position:absolute;
      right:10px;
      bottom:120px;
      display:flex;
      flex-direction:column;
      gap:22px;
      align-items:center;
      z-index:4;
    }
   .action-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      cursor:pointer;
      user-select:none;
    }
   .action-circle{
      width:48px;height:48px;
      border-radius:50%;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      transition:transform 0.15s;
    }
   .action-circle:active{transform:scale(0.85)}
   .action-circle.liked{
      background:#ff2d55;
      animation:likePop 0.35s cubic-bezier(.17,.89,.32,1.49);
    }
    @keyframes likePop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
   .action-count{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}

   .avatar-tiktok{
      width:48px;height:48px;
      border-radius:50%;
      border:2px solid #fff;
      overflow:hidden;
      background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);
      display:flex;align-items:center;justify-content:center;
      font-weight:bold;
      cursor:pointer;
    }
   .avatar-tiktok img{width:100%;height:100%;object-fit:cover}

    /* BOTTOM CAPTION */
   .bottom-info{
      position:absolute;
      left:0;right:70px;
      bottom:80px;
      padding:0 12px;
      z-index:4;
      background:linear-gradient(to top, rgba(0,0,0,.7), transparent);
    }
   .username{font-weight:700;font-size:16px;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:pointer}
   .caption{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.8)}
   .music{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px;opacity:.9}
   .date{font-size:11px;color:#ccc;margin-top:4px}

    /* BOTTOM NAV */
   .bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;z-index:20}
   .bottom a{position:relative;font-size:22px;padding:4px 12px}
   .msg-badge{position:absolute;top:-6px;right:-2px;background:#ff3040;color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 4px}
   .msg-badge.hide{display:none}

   .loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
   .spinner{width:36px;height:36px;border:3px solid #262626;border-top:3px solid #fff;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* COMMENT SHEET */
   .comment-sheet{
      position:fixed;
      bottom:-100%;
      left:0;right:0;
      height:70vh;
      background:#121212;
      border-radius:20px 20px 0 0;
      z-index:100;
      transition:bottom 0.35s cubic-bezier(.4,0,.2,1);
      display:flex;
      flex-direction:column;
      max-width:470px;
      margin:0 auto;
    }
   .comment-sheet.open{bottom:0}
   .sheet-head{padding:16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
   .sheet-body{flex:1;overflow-y:auto;padding:12px}
   .sheet-input{display:flex;gap:8px;padding:12px;border-top:1px solid #262626;background:#000;border-radius:0 0 0 0}
   .sheet-input input{flex:1;background:#1a1a1a;border:none;border-radius:20px;padding:10px 16px;color:#fff;outline:none}
   .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;display:none}
   .overlay.show{display:block}

   .sidebar{position:fixed;top:0;left:-100%;width:85%;max-width:340px;height:100vh;background:#121212;z-index:99;transition:left 0.35s cubic-bezier(.4,0,.2,1);border-right:1px solid #262626;display:flex;flex-direction:column}
   .sidebar.open{left:0}
   .sidebar-top{padding:20px 16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
   .close{font-size:28px;cursor:pointer}
   .sidebar-links{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
   .side-link{padding:14px 16px;background:#1a1a1a;border:1px solid #262626;border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
   .logout{cursor:pointer;font-size:14px;color:#fff;background:#262626;padding:6px 12px;border-radius:6px}
   .hamburger{font-size:26px;cursor:pointer;margin-right:12px}
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeAll()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top"><b>RAyMoNd Menu</b><span class="close" onclick="closeAll()">×</span></div>
    <div class="sidebar-links">
      <div class="side-link ball"><span>🏆</span> League Match </div>
      <div class="side-link Country"><span>🌍</span> Country Match </div>
      <div class="side-link"><span>🖼️</span> <a href="media.html"> Saved Pictures </a></div>
      <div class="side-link"><span>📝</span> <a href="note.html"> Saved Note </a></div>
      <div class="side-link"><span>📊</span> <a href="info.html"> Contact us </a></div>
      <div class="side-link"><span>📊</span> <a href="next.html"> Games </a></div>
    </div>
    <div style="margin-top:auto;padding:16px;border-top:1px solid #262626">
      <div class="side-link" onclick="logout()"><span>🚪</span> Logout</div>
    </div>
  </div>

  <div class="top">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;width:100%">
      <div style="display:flex;align-items:center"><span class="hamburger" onclick="openSidebar()">☰</span><span class="logo">RAyMoNd</span></div>
      <div style="display:flex;gap:14px;align-items:center"><a href="notification.html" style="font-size:22px">🔔</a><span class="logout" onclick="logout()">Logout</span></div>
    </div>
  </div>

  <div id="feed"></div>

  <!-- COMMENT SHEET -->
  <div class="comment-sheet" id="commentSheet">
    <div class="sheet-head"><b id="sheetTitle">Comments</b><span onclick="closeComments()" style="font-size:24px;cursor:pointer">×</span></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-input"><input id="sheetInput" placeholder="Add comment..." onkeydown="if(event.key==='Enter') postSheetComment()"><button onclick="postSheetComment()" style="color:#0095f6;background:none;border:none;font-weight:700;cursor:pointer">Post</button></div>
  </div>

  <div class="bottom"><a href="feed.html">🏠</a><a href="explore.html">🔍</a><a href="create.html" style="font-size:28px">➕</a><a href="message.html">💬<span id="msgCount" class="msg-badge hide">0</span></a><a href="profile.html">👤</a></div>

<script>
  const BASE = "https://raymonddomain.dev";
  const token = localStorage.getItem('token');
  if(!token) location.href = "login.html";

  function getCache(k){ try{ return JSON.parse(localStorage.getItem(k)||'null')}catch{return null} }
  function setCache(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  function fixUrl(u){ if(!u) return ""; if(u.startsWith('data:')) return u; if(u.startsWith('http')) return u; if(u.startsWith('/api/')) return BASE+u; if(u.startsWith('/uploads')) return BASE+u; return u; }
  function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }
  function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
  function closeAll(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); document.getElementById('commentSheet').classList.remove('open'); }
  function goToProfile(userId){ if(!userId) return; location.href='profile.html?id='+userId; }

  function formatDate(d){
    if(!d) return "";
    const date=new Date(d);
    const now=new Date();
    const diff=Math.floor((now-date)/1000);
    if(diff<60) return diff+"s ago";
    if(diff<3600) return Math.floor(diff/60)+"m ago";
    if(diff<86400) return Math.floor(diff/3600)+"h ago";
    return date.toLocaleDateString();
  }

  async function loadMsgBadge(){
    try{
      let r=await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}});
      if(!r.ok) return;
      let map=await r.json();
      let total=Object.values(map).reduce((a,b)=>a+b,0);
      let el=document.getElementById('msgCount');
      if(total>0){el.innerText=total; el.classList.remove('hide');} else el.classList.add('hide');
    }catch{}
  }

  let currentPosts=[];
  let currentCommentPostId=null;

  function renderFeed(posts){
    currentPosts=posts;
    const f=document.getElementById('feed');
    if(!posts ||!posts.length){
      f.innerHTML="<div class='loading-screen'><p>No posts yet</p><button onclick='load()' style='background:#0095f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;margin-top:10px'>Retry</button></div>";
      return;
    }

    // Sort like TikTok FYP - most likes + newest first
    posts.sort((a,b)=>{
      const scoreA=(a.likes?.length||0)*2 + (a.comments?.length||0)*3 + (new Date(a.createdAt).getTime()/100000000);
      const scoreB=(b.likes?.length||0)*2 + (b.comments?.length||0)*3 + (new Date(b.createdAt).getTime()/100000000);
      return scoreB-scoreA;
    });

    f.innerHTML=posts.map(p=>{
      const raw=p.mediaUrl||"";
      const mediaUrl=fixUrl(raw);
      const isVid=p.type==='video'||raw.includes('/api/media-file')||raw.includes('video');
      const mediaHtml=isVid?`<video src="${mediaUrl}" loop playsinline preload="metadata" muted></video>`:`<img src="${mediaUrl}" loading="lazy" decoding="async" />`;
      const userId=p.user?._id||p.user;
      const username=p.user?.username||'user';
      const avatarUrl=fixUrl(p.user?.avatar);
      const avatarHtml=avatarUrl?`<img src="${avatarUrl}">`:username[0].toUpperCase();
      const likes=p.likes||[];
      const isLiked=likes.includes(getMyId());
      return `<div class="post" id="post-${p._id}" data-id="${p._id}">
        <div class="media" ondblclick="like('${p._id}', true)">
          ${mediaHtml}
          <div class="big-heart" id="big-heart-${p._id}">❤️</div>
        </div>

        <div class="right-actions">
          <div class="action-item" onclick="goToProfile('${userId}')">
            <div class="avatar-tiktok">${avatarHtml}</div>
          </div>
          <div class="action-item" onclick="like('${p._id}', true)">
            <div class="action-circle ${isLiked?'liked':''}" id="like-btn-${p._id}">${isLiked?'❤️':'🤍'}</div>
            <div class="action-count" id="likes-${p._id}">${likes.length}</div>
          </div>
          <div class="action-item" onclick="openComments('${p._id}')">
            <div class="action-circle">💬</div>
            <div class="action-count">${(p.comments||[]).length}</div>
          </div>
          <div class="action-item" onclick="saveP('${p._id}')">
            <div class="action-circle">🔖</div>
          </div>
          <div class="action-item" onclick="sharePost('${p._id}')">
            <div class="action-circle">↗️</div>
          </div>
        </div>

        <div class="bottom-info">
          <div class="username" onclick="goToProfile('${userId}')">@${username}</div>
          <div class="caption">${p.caption||''}</div>
          <div class="music">♫ Original sound - ${username}</div>
          <div class="date">${formatDate(p.createdAt)}</div>
        </div>
      </div>`;
    }).join('');

    // Setup auto-play observer like TikTok
    setupAutoPlay();
  }

  function setupAutoPlay(){
    const posts=document.querySelectorAll('.post');
    const observer=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        const video=entry.target.querySelector('video');
        if(!video) return;
        if(entry.isIntersecting){
          video.muted=true;
          video.play().catch(()=>{});
        }else{
          video.pause();
          video.currentTime=0;
        }
      });
    }, {threshold:0.7});

    posts.forEach(p=>{
      observer.observe(p);
      // Preload next video
      const vid=p.querySelector('video');
      if(vid) vid.load();
    });

    // Auto play first video
    const first=posts[0]?.querySelector('video');
    if(first){ first.muted=true; first.play().catch(()=>{}); }
  }

  function showSpinner(){
    document.getElementById('feed').innerHTML=`<div class='loading-screen'><div class='spinner'></div><div style='color:#aaa'>Loading For You...</div></div>`;
  }

  async function load(){
    const cached=getCache('feed_posts');
    if(cached && Array.isArray(cached) && cached.length>0){
      renderFeed(cached);
      fetchFresh();
    }else{
      showSpinner();
      await fetchFresh();
    }
  }

  async function fetchFresh(){
    try{
      const r=await fetch(BASE+'/api/posts/feed',{headers:{authorization:token}});
      if(!r.ok){
        if(r.status===401){ localStorage.removeItem('token'); location.href='login.html'; return; }
        throw new Error('API error '+r.status);
      }
      const text=await r.text();
      let posts;
      try{ posts=JSON.parse(text); }catch{ throw new Error('Invalid JSON'); }
      if(!Array.isArray(posts)){ posts=posts.posts||posts.data||[]; }
      const cached=getCache('feed_posts');
      if(JSON.stringify(cached||[])!==JSON.stringify(posts||[]) ||!cached){
        renderFeed(posts);
      }
      setCache('feed_posts', posts);
    }catch(e){
      console.log('fetch error', e);
      const cached2=getCache('feed_posts');
      if(!cached2 ||!cached2.length){
        document.getElementById('feed').innerHTML="<div class='loading-screen'><p>Failed to load</p><button onclick='load()' style='background:#0095f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;margin-top:10px'>Retry</button></div>";
      }
    }
  }

  async function like(id, showBigHeart){
    const btn=document.getElementById('like-btn-'+id);
    const likesEl=document.getElementById('likes-'+id);
    const bigHeart=document.getElementById('big-heart-'+id);
    if(!btn) return;
    const wasLiked=btn.classList.contains('liked');

    if(wasLiked){
      btn.classList.remove('liked'); btn.innerText='🤍';
      likesEl.innerText=Math.max(0, parseInt(likesEl.innerText||'0')-1);
    }else{
      btn.classList.add('liked'); btn.innerText='❤️';
      likesEl.innerText=(parseInt(likesEl.innerText||'0')+1);
      btn.style.animation='none'; btn.offsetHeight; btn.style.animation='likePop 0.35s cubic-bezier(.17,.89,.32,1.49)';
    }
    if(showBigHeart &&!wasLiked && bigHeart){
      bigHeart.classList.remove('show'); void bigHeart.offsetWidth; bigHeart.classList.add('show');
      if(navigator.vibrate) navigator.vibrate(50);
    }

    let posts=getCache('feed_posts')||[];
    let p=posts.find(x=>x._id===id);
    if(p){
      if(wasLiked) p.likes=p.likes.filter(x=>x!==getMyId());
      else p.likes.push(getMyId());
      setCache('feed_posts', posts);
    }
    fetch(BASE+'/api/posts/'+id+'/like',{method:'POST',headers:{authorization:token}});
  }

  function openComments(id){
    currentCommentPostId=id;
    const post=currentPosts.find(x=>x._id===id);
    const sheet=document.getElementById('commentSheet');
    const body=document.getElementById('sheetBody');
    const comments=post?.comments||[];
    document.getElementById('overlay').classList.add('show');
    body.innerHTML=comments.length? comments.map(c=>`<div style='padding:8px 0;border-bottom:1px solid #1a1a1a'><b style='font-size:14px'>${c.user?.username||'user'}</b> <span style='font-size:14px'>${c.text}</span></div>`).join('') : `<p style='color:#777;text-align:center;padding:20px'>No comments yet</p>`;
    sheet.classList.add('open');
  }

  function closeComments(){
    document.getElementById('commentSheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  async function postSheetComment(){
    const input=document.getElementById('sheetInput');
    const t=input.value.trim();
    if(!t ||!currentCommentPostId) return;
    input.value='';
    const body=document.getElementById('sheetBody');
    body.insertAdjacentHTML('beforeend', `<div style='padding:8px 0;border-bottom:1px solid #1a1a1a'><b>You</b> ${t}</div>`);
    try{
      await fetch(BASE+'/api/posts/'+currentCommentPostId+'/comment',{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text:t})});
      let posts=getCache('feed_posts')||[];
      let p=posts.find(x=>x._id===currentCommentPostId);
      if(p){ if(!p.comments) p.comments=[]; p.comments.push({user:{username:'You'}, text:t}); setCache('feed_posts', posts); }
    }catch{}
  }

  async function saveP(id){
    await fetch(BASE+'/api/posts/'+id+'/save',{method:'POST',headers:{authorization:token}});
    alert('Saved to bookmarks');
  }

  function sharePost(id){
    if(navigator.share){
      navigator.share({title:'RAyMoNd', url:location.origin+'/profile.html?id='+id});
    }else{
      navigator.clipboard.writeText(location.origin+'/feed.html');
      alert('Link copied!');
    }
  }

  function logout(){ localStorage.removeItem('token'); location.href='login.html'; }

  load();
  loadMsgBadge();
  setInterval(loadMsgBadge,5000);

  const ball=document.querySelector('.ball')
  const Country=document.querySelector('.Country')
  ball.addEventListener('click', async()=>{ fetch('https://raymonddomain.dev/api/sync'); window.location.href="football.html"; });
  Country.addEventListener('click', ()=>{ fetch('https://raymonddomain.dev/api/fetch-now'); window.location.href="countrymatch.html"; })
</script>

<script src="upload-manager.js"></script>
<script>
  const upData=localStorage.getItem('uploading');
  if(upData){
    const d=JSON.parse(upData);
    UploadManager.showBar(d.progress||20, d.status||'Uploading in background...');
    const check=setInterval(async()=>{
      try{
        const r=await fetch(BASE+'/api/posts/feed',{headers:{authorization:token}});
        if(r.ok){ UploadManager.hideBar(); clearInterval(check); fetchFresh(); }
      }catch{}
    },3000);
    setTimeout(()=>{ UploadManager.hideBar(); clearInterval(check); },30000);
  }
</script>

</body>
</html>
