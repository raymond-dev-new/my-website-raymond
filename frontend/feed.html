<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram • Feed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #262626;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:cursive;font-size:24px}
.wrap{max-width:470px;margin:0 auto;width:100%}
.post{background:#000;border-bottom:1px solid #262626;padding-bottom:12px}
.post-head{padding:12px 12px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-weight:bold}
.media{width:100%;background:#111;min-height:300px;display:flex;align-items:center;justify-content:center}
.media img,.media video{width:100%;max-height:580px;object-fit:contain;display:block}
.cap{padding:8px 12px}
.actions{display:flex;gap:16px;padding:8px 12px;font-size:24px}
.actions span{cursor:pointer}
.likes{padding:0 12px;font-weight:600;font-size:14px}
.comment{padding:4px 12px;font-size:14px}
.comment b{cursor:pointer}
.comment b:hover{text-decoration:underline}
.comment b.comment-user{color:#fff}
.input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1a1a1a}
.input-row input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.input-row button{color:#0095f6;background:none;border:none;font-weight:600;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;padding:10px 0;z-index:20}
.bottom a{position:relative;font-size:22px}
.msg-badge{position:absolute;top:-6px;right:-10px;background:#ff3040;color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 4px}
.msg-badge.hide{display:none}
@media(min-width:768px){.post{border:1px solid #262626;border-radius:8px;margin:20px 0}.bottom{max-width:470px;margin:0 auto}}
.logout{cursor:pointer;font-size:14px;color:#fff;background:#262626;padding:6px 12px;border-radius:6px}

/* ===== SIDEBAR LEFT ===== */
.hamburger{font-size:26px;cursor:pointer;margin-right:12px}
.sidebar{position:fixed;top:0;left:-100%;width:85%;max-width:340px;height:100vh;background:#121212;z-index:99;transition:left 0.35s cubic-bezier(.4,0,.2,1);border-right:1px solid #262626;display:flex;flex-direction:column}
.sidebar.open{left:0}
.sidebar-top{padding:20px 16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
.sidebar-top b{font-size:20px}
.close{font-size:28px;cursor:pointer}
.sidebar-links{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side-link{padding:14px 16px;background:#1a1a1a;border:1px solid #262626;border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:0.2s;font-size:15px;font-weight:500}
.side-link:hover{background:#262626;transform:translateX(4px)}
.side-link span{font-size:20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;display:none}
.overlay.show{display:block}

/* FULL PAGE SLIDE FROM LEFT */
.full-page{position:fixed;top:0;left:-100%;width:100%;height:100vh;background:#000;z-index:95;transition:left 0.4s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.full-page.open{left:0}
.full-head{position:sticky;top:0;background:#000;border-bottom:1px solid #262626;padding:14px 16px;display:flex;align-items:center;gap:16px;z-index:2}
.full-head button{background:#262626;border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:18px}
.full-body{max-width:470px;margin:0 auto;padding:16px}
.card{background:#121212;border:1px solid #262626;border-radius:12px;padding:14px;margin-bottom:12px}
</style>
</head>
<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-top"><b>RAyMoNd Menu</b><span class="close" onclick="closeAll()">×</span></div>
  <div class="sidebar-links">
    <div class="side-link" onclick="openPage('league')"><span>🏆</span> <a href="football.html"> League Match</a> 
    </div>
    <div class="side-link" onclick="openPage('country')"><span>🌍</span> <a href="countrymatch.html"> Country Match </a>
    </div>
    <div class="side-link" onclick="openPage('savedPics')"><span>🖼️</span> <a href="media.html"> Saved Pictures </a> 
    </div>
    <div class="side-link" onclick="openPage('savedNote')"><span>📝</span> <a href="note.html"> Saved Note </a>
    </div>
    <div class="side-link" onclick="openPage('dashboard')"><span>📊</span> <a href="next.html"> Games </a> 
    </div>
  </div>
  <div style="margin-top:auto;padding:16px;border-top:1px solid #262626">
    <div class="side-link" onclick="logout()"><span>🚪</span> Logout</div>
  </div>
</div>

<!-- FULL PAGES THAT SLIDE FROM LEFT -->
<div class="full-page" id="page-league">
  <div class="full-head"><button onclick="closeAll()">←</button><b>League Match</b></div>
  <div class="full-body" id="leagueBody"><p>Loading leagues...</p></div>
</div>
<div class="full-page" id="page-country">
  <div class="full-head"><button onclick="closeAll()">←</button><b>Country Match</b></div>
  <div class="full-body" id="countryBody"><p>Loading country matches...</p></div>
</div>
<div class="full-page" id="page-savedPics">
  <div class="full-head"><button onclick="closeAll()">←</button><b>Saved Pictures</b></div>
  <div class="full-body" id="savedPicsBody"></div>
</div>
<div class="full-page" id="page-savedNote">
  <div class="full-head"><button onclick="closeAll()">←</button><b>Saved Note</b></div>
  <div class="full-body"><div class="card"><textarea id="noteArea" style="width:100%;height:200px;background:#000;color:#fff;border:1px solid #262626;border-radius:8px;padding:10px" placeholder="Write your note..."></textarea><br><br><button onclick="saveNote()" style="background:#0095f6;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600">Save Note</button></div><div id="notesList"></div></div>
</div>
<div class="full-page" id="page-dashboard">
  <div class="full-head"><button onclick="closeAll()">←</button><b>Dashboard</b></div>
  <div class="full-body" id="dashBody"></div>
</div>

<div class="top">
  <div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center"><span class="hamburger" onclick="openSidebar()">☰</span><span class="logo">RAyMoNd</span></div>
    <div style="display:flex;gap:14px;align-items:center">
      <a href="notifications.html" style="font-size:22px">🤍</a>
      <span class="logout" onclick="logout()">Logout</span>
    </div>
  </div>
</div>

<div class="wrap" id="feed">Loading...</div>

<div class="bottom">
  <a href="feed.html">🏠</a>
  <a href="explore.html">🔍</a>
  <a href="create.html">➕</a>
  <a href="message.html" style="font-size:22px">💬<span id="msgCount" class="msg-badge hide">0</span></a>
  <a href="reels.html">🎬</a>
  <a href="notification.html"> 🔔 </a>
  <a href="profile.html">👤</a>
</div>

<script>
const BASE = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.href = "login.html";
function fixUrl(u){ if(!u) return ""; if(u.startsWith('/uploads')) return BASE+u; return u; }
function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }
function isVideoFile(url){ if(!url) return false; return url.endsWith('.mp4') || url.endsWith('.mov') || url.endsWith('.webm'); }

// SIDEBAR FUNCTIONS
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeAll(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); document.querySelectorAll('.full-page').forEach(p=>p.classList.remove('open')); }
function openPage(name){ closeAll(); setTimeout(()=>{ document.getElementById('page-'+name).classList.add('open'); document.getElementById('overlay').classList.add('show'); if(name==='savedPics') loadSavedPics(); if(name==='dashboard') loadDash(); if(name==='league') loadLeague(); if(name==='country') loadCountry(); if(name==='savedNote') loadNotes(); }, 200); }

async function loadLeague(){ document.getElementById('leagueBody').innerHTML = `<div class="card">🏆 Premier League - Live Scores</div><div class="card">🇪🇸 La Liga - Today</div><div class="card">🇮🇹 Serie A - Results</div>`; }
async function loadCountry(){ document.getElementById('countryBody').innerHTML = `<div class="card">🌍 World Cup Qualifiers</div><div class="card">🇳🇬 Nigeria vs Ghana</div><div class="card">🏴󐁧󐁢󐁥󐁮󐁧󐁿 England vs France</div>`; }
async function loadSavedPics(){
  try{
    let r = await fetch(BASE+'/api/users/me/profile',{headers:{authorization:token}});
    let d = await r.json();
    let posts = d.user.savedPosts || [];
    if(!posts.length){ document.getElementById('savedPicsBody').innerHTML = "<p>No saved pictures yet</p>"; return; }
    // fetch full saved posts if only IDs - for now show message
    document.getElementById('savedPicsBody').innerHTML = posts.map(id=>`<div class="card">Saved Post ID: ${id}</div>`).join('');
  }catch(e){ document.getElementById('savedPicsBody').innerHTML = "No saved yet"; }
}
function saveNote(){ let txt = document.getElementById('noteArea').value; if(!txt) return; let notes = JSON.parse(localStorage.getItem('myNotes')||'[]'); notes.unshift({text:txt,date:new Date().toLocaleString()}); localStorage.setItem('myNotes',JSON.stringify(notes)); document.getElementById('noteArea').value=''; loadNotes(); }
function loadNotes(){ let notes = JSON.parse(localStorage.getItem('myNotes')||'[]'); document.getElementById('notesList').innerHTML = notes.map((n,i)=>`<div class="card"><small style="color:#999">${n.date}</small><p>${n.text}</p><button onclick="delNote(${i})" style="color:#ff3040;background:none;border:none;cursor:pointer">Delete</button></div>`).join(''); }
function delNote(i){ let notes = JSON.parse(localStorage.getItem('myNotes')||'[]'); notes.splice(i,1); localStorage.setItem('myNotes',JSON.stringify(notes)); loadNotes(); }
async function loadDash(){
  let r = await fetch(BASE+'/api/users/me/profile',{headers:{authorization:token}});
  let d = await r.json();
  document.getElementById('dashBody').innerHTML = `
  <div class="card"><b>Username:</b> ${d.user.username}</div>
  <div class="card"><b>Followers:</b> ${d.followersCount} | <b>Following:</b> ${d.followingCount}</div>
  <div class="card"><b>Total Posts:</b> ${d.posts.length}</div>
  <div class="card"><b>Email:</b> ${d.user.email}</div>
  `;
}

async function loadMsgBadge(){
 try{
  let r = await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}});
  let map = await r.json();
  let total = Object.values(map).reduce((a,b)=>a+b,0);
  let el = document.getElementById('msgCount');
  if(total>0){ el.innerText = total>99?'99+':total; el.classList.remove('hide'); }
  else el.classList.add('hide');
 }catch(e){ console.log(e); }
}

async function load(){
 const r = await fetch(BASE+'/api/posts/feed',{headers:{authorization:token}});
 const posts = await r.json();
 const f = document.getElementById('feed');
 if(!posts.length){ f.innerHTML="<p style='text-align:center;padding:40px'>No posts yet<br><a href='create.html' style='color:#0095f6'>Create your first post</a></p>"; return; }
 f.innerHTML = posts.map(p=>{
  const mediaUrl = fixUrl(p.mediaUrl);
  const isVid = p.type === 'video' || p.type === 'reel' || isVideoFile(p.mediaUrl);
  const mediaHtml = isVid? `<video src="${mediaUrl}" controls playsinline></video>` : `<img src="${mediaUrl}" />`;
  return `
  <div class="post">
   <div class="post-head"><div class="avatar">${(p.user?.username||'R')[0].toUpperCase()}</div><a href="profile.html?id=${p.user?._id}"><b>${p.user?.username||'raymond'}</b></a><span style="margin-left:auto;cursor:pointer" onclick="delPost('${p._id}')">⋯</span></div>
   <div class="media">${mediaHtml}</div>
   <div class="actions"><span onclick="like('${p._id}')">${p.likes.includes(getMyId())?'❤️':'🤍'} </span><span>💬</span><span onclick="share('${p._id}')">✈️</span><span style="margin-left:auto" onclick="saveP('${p._id}')">🔖</span></div>
   <div class="likes">${p.likes.length} likes</div>
   <div class="cap"><a href="profile.html?id=${p.user?._id}"><b>${p.user?.username}</b></a> ${p.caption||''}</div>
   <div id="c-${p._id}">${p.comments.map(c=>`<div class="comment"><a href="profile.html?id=${c.user?._id}"><b class="comment-user">${c.user?.username||'user'}</b></a> ${c.text}</div>`).join('')}</div>
   <div class="input-row"><input id="i-${p._id}" placeholder="Add a comment..."><button onclick="comment('${p._id}')">Post</button></div>
  </div>`;
 }).join('');
}
async function like(id){ await fetch(BASE+'/api/posts/'+id+'/like',{method:'POST',headers:{authorization:token}}); load(); }
async function comment(id){ const t=document.getElementById('i-'+id).value; if(!t)return; await fetch(BASE+'/api/posts/'+id+'/comment',{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text:t})}); load(); }
async function share(id){ await fetch(BASE+'/api/posts/'+id+'/share',{method:'POST',headers:{authorization:token}}); }
async function saveP(id){ await fetch(BASE+'/api/posts/'+id+'/save',{method:'POST',headers:{authorization:token}}); alert('Saved!'); }
async function delPost(id){ if(!confirm('Delete?'))return; await fetch(BASE+'/api/posts/'+id,{method:'DELETE',headers:{authorization:token}}); load(); }
function logout(){ localStorage.removeItem('token'); location.href='login.html'; }

load();
loadMsgBadge();
setInterval(loadMsgBadge,3000);
</script>
</body>
</html>
