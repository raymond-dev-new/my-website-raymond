<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
    a{color:inherit;text-decoration:none}
  .top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #262626;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:cursive;font-size:24px}
  .wrap{max-width:470px;margin:0 auto;width:100%}
  .post{background:#000;border-bottom:1px solid #262626;padding-bottom:12px}
  .post-head{padding:12px 12px;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;cursor:pointer}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .post-head b{cursor:pointer}
  .media{width:100%;background:#111;min-height:300px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .media img,.media video{width:100%;max-height:580px;object-fit:contain;display:block}
  .cap{padding:8px 12px}
  .actions{display:flex;gap:16px;padding:8px 12px;font-size:24px;align-items:center}
  .actions span{cursor:pointer;user-select:none}
  .likes{padding:0 12px;font-weight:600;font-size:14px}
  .comment{padding:4px 12px;font-size:14px}
  .input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1a1a1a}
  .input-row input{flex:1;background:transparent;border:none;color:#fff;outline:none}
  .input-row button{color:#0095f6;background:none;border:none;font-weight:600;cursor:pointer}
  .bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;padding:10px 0;z-index:20}
  .bottom a{position:relative;font-size:22px}
  .msg-badge{position:absolute;top:-6px;right:-10px;background:#ff3040;color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .msg-badge.hide{display:none}
    @media(min-width:768px){.post{border:1px solid #262626;border-radius:8px;margin:20px 0}.bottom{max-width:470px;margin:0 auto}}
  .logout{cursor:pointer;font-size:14px;color:#fff;background:#262626;padding:6px 12px;border-radius:6px}
  .hamburger{font-size:26px;cursor:pointer;margin-right:12px}
  .sidebar{position:fixed;top:0;left:-100%;width:85%;max-width:340px;height:100vh;background:#121212;z-index:99;transition:left 0.35s cubic-bezier(.4,0,.2,1);border-right:1px solid #262626;display:flex;flex-direction:column}
  .sidebar.open{left:0}
  .sidebar-top{padding:20px 16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
  .close{font-size:28px;cursor:pointer}
  .sidebar-links{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .side-link{padding:14px 16px;background:#1a1a1a;border:1px solid #262626;border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;display:none}
  .overlay.show{display:block}
  .card{background:#121212;border:1px solid #262626;border-radius:12px;padding:14px;margin-bottom:12px}
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
  .spinner{width:36px;height:36px;border:3px solid #262626;border-top:3px solid #fff;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
   /* TIKTOK LIKE ANIMATION */
  .like-btn{font-size:28px;transition:transform 0.15s; display:inline-block}
  .like-btn.liked{color:#ff2d55; animation:likePop 0.35s cubic-bezier(.17,.89,.32,1.49)}
  .like-btn:active{transform:scale(0.8)}
    @keyframes likePop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
  .big-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;color:#ff2d55;pointer-events:none;opacity:0}
  .big-heart.show{animation:bigHeart 0.8s ease-out forwards}
    @keyframes bigHeart{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.2);opacity:1}30%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-top"><b>RAyMoNd Menu</b><span class="close" onclick="closeAll()">×</span></div>
    <div class="sidebar-links">
      <div class="side-link ball"><span>🏆</span> League Match </div>
      <div class="side-link Country"><span>🌍</span> Country Match </div>
      <div class="side-link"><span>🖼️</span> <a href="media.html"> Saved Pictures </a></div>
      <div class="side-link"><span>📝</span> <a href="note.html"> Saved Note </a></div>
      <div class="side-link"><span>📊</span> <a href="info.html"> Contact us </a></div>
      <div class="side-link"><span>📊</span> <a href="next.html"> Games </a></div>
    </div>
    <div style="margin-top:auto;padding:16px;border-top:1px solid #262626">
      <div class="side-link" onclick="logout()"><span>🚪</span> Logout</div>
    </div>
  </div>

  <div class="top">
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center"><span class="hamburger" onclick="openSidebar()">☰</span><span class="logo">RAyMoNd</span></div>
      <div style="display:flex;gap:14px;align-items:center"><a href="notification.html" style="font-size:22px">🤍</a><span class="logout" onclick="logout()">Logout</span></div>
    </div>
  </div>

  <div class="wrap" id="feed">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div style="color:#aaa;font-size:14px">Loading feed...</div>
    </div>
  </div>

  <div class="bottom"><a href="feed.html">🏠</a><a href="explore.html">🔍</a><a href="create.html">➕</a><a href="message.html">💬<span id="msgCount" class="msg-badge hide">0</span></a><a href="reels.html">🎬</a><a href="notification.html"> 🔔 </a><a href="profile.html">👤</a></div>

<script>
  const BASE = "https://raymonddomain.dev";
  const token = localStorage.getItem('token');
  if(!token) location.href = "login.html";

  function getCache(k){ try{ return JSON.parse(localStorage.getItem(k)||'null')}catch{return null} }
  function setCache(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  function fixUrl(u){ if(!u) return ""; if(u.startsWith('data:')) return u; if(u.startsWith('http')) return u; if(u.startsWith('/api/')) return BASE+u; if(u.startsWith('/uploads')) return BASE+u; return u; }
  function getMyId(){ try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""} }
  function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
  function closeAll(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
  function goToProfile(userId){ if(!userId) return; location.href='profile.html?id='+userId; }

  function formatDate(d){
    if(!d) return "";
    const date = new Date(d);
    const now = new Date();
    const diff = Math.floor((now - date)/1000);
    if(diff < 60) return diff + "s ago";
    if(diff < 3600) return Math.floor(diff/60) + "m ago";
    if(diff < 86400) return Math.floor(diff/3600) + "h ago";
    if(diff < 604800) return Math.floor(diff/86400) + "d ago";
    return date.toLocaleDateString();
  }

  async function loadMsgBadge(){
    try{
      let r=await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}});
      if(!r.ok) return;
      let map=await r.json();
      let total=Object.values(map).reduce((a,b)=>a+b,0);
      let el=document.getElementById('msgCount');
      if(total>0){el.innerText=total; el.classList.remove('hide');} else el.classList.add('hide');
    }catch{}
  }

  function renderFeed(posts){
    const f=document.getElementById('feed');
    if(!posts ||!Array.isArray(posts) ||!posts.length){
      f.innerHTML="<p style='text-align:center;padding:40px'>No posts yet <br><br><button onclick='load()' style='background:#0095f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer'>Retry</button></p>";
      return;
    }
    f.innerHTML=posts.map(p=>{
      const raw=p.mediaUrl||"";
      const mediaUrl=fixUrl(raw);
      const isVid=p.type==='video'||raw.includes('/api/media-file')||raw.includes('video');
      const mediaHtml=isVid?`<video src="${mediaUrl}" controls playsinline preload="metadata"></video>`:`<img src="${mediaUrl}" loading="lazy" decoding="async" />`;
      const userId=p.user?._id||p.user;
      const username=p.user?.username||'user';
      const avatarUrl=fixUrl(p.user?.avatar);
      const avatarHtml=avatarUrl?`<img src="${avatarUrl}" onclick="goToProfile('${userId}')" loading="lazy">`:username[0].toUpperCase();
      const likes = p.likes || [];
      const isLiked = likes.includes(getMyId());
      return `<div class="post" id="post-${p._id}">
        <div class="post-head">
          <div class="avatar" onclick="goToProfile('${userId}')">${avatarHtml}</div>
          <div style="display:flex;flex-direction:column">
            <b onclick="goToProfile('${userId}')">${username}</b>
            <span style="font-size:11px;color:#8e8e8e">${formatDate(p.createdAt)}</span>
          </div>
        </div>
        <div class="media" ondblclick="like('${p._id}', true)">
          ${mediaHtml}
          <div class="big-heart" id="big-heart-${p._id}">❤️</div>
        </div>
        <div class="actions">
          <span class="like-btn ${isLiked?'liked':''}" id="like-btn-${p._id}" onclick="like('${p._id}', false)">${isLiked?'❤️':'🤍'}</span>
          <span onclick="document.getElementById('i-${p._id}').focus()">💬</span>
          <span onclick="saveP('${p._id}')">🔖</span>
        </div>
        <div class="likes" id="likes-${p._id}">${likes.length} likes</div>
        <div class="cap"><b style="cursor:pointer" onclick="goToProfile('${userId}')">${username}</b> ${p.caption||''}</div>
        <div style="padding:0 12px;font-size:12px;color:#8e8e8e">${formatDate(p.createdAt)} • ${new Date(p.createdAt).toLocaleDateString()}</div>
        <div id="c-${p._id}">${(p.comments||[]).map(c=>`<div class="comment"><b style="cursor:pointer" onclick="goToProfile('${c.user?._id||''}')">${c.user?.username||'user'}</b> ${c.text}</div>`).join('')}</div>
        <div class="input-row"><input id="i-${p._id}" placeholder="Add comment..." onkeydown="if(event.key==='Enter') comment('${p._id}')"><button onclick="comment('${p._id}')">Post</button></div>
      </div>`;
    }).join('');
  }

  async function load(){
    const cached = getCache('feed_posts');
    if(cached && Array.isArray(cached) && cached.length>0){
      renderFeed(cached);
    }
    try{
      const r=await fetch(BASE+'/api/posts/feed',{headers:{authorization:token}});
      if(!r.ok){
        if(r.status===401){ localStorage.removeItem('token'); location.href='login.html'; return; }
        throw new Error('API error '+r.status);
      }
      const text = await r.text();
      let posts;
      try{ posts = JSON.parse(text); }catch{ throw new Error('Invalid JSON'); }
      if(!Array.isArray(posts)){ posts = posts.posts || posts.data || []; }
      renderFeed(posts);
      setCache('feed_posts', posts);
    }catch(e){
      console.log('load error', e);
      const cached2 = getCache('feed_posts');
      if(!cached2 ||!cached2.length){
        document.getElementById('feed').innerHTML="<p style='text-align:center;padding:40px;color:#aaa'>Failed to load feed<br><br><button onclick='load()' style='background:#0095f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer'>Retry</button></p>";
      }
    }
  }

  // TIKTOK LIKE - NO REFRESH
  async function like(id, showBigHeart){
    const btn = document.getElementById('like-btn-'+id);
    const likesEl = document.getElementById('likes-'+id);
    const bigHeart = document.getElementById('big-heart-'+id);
    if(!btn ||!likesEl) return;

    const wasLiked = btn.classList.contains('liked');

    // Instant UI update - no refresh
    if(wasLiked){
      btn.classList.remove('liked');
      btn.innerText='🤍';
      likesEl.innerText = Math.max(0, parseInt(likesEl.innerText||'0')-1) + ' likes';
    }else{
      btn.classList.add('liked');
      btn.innerText='❤️';
      likesEl.innerText = (parseInt(likesEl.innerText||'0')+1) + ' likes';
      // Trigger pop
      btn.style.animation='none';
      btn.offsetHeight;
      btn.style.animation='likePop 0.35s cubic-bezier(.17,.89,.32,1.49)';
    }

    if(showBigHeart &&!wasLiked && bigHeart){
      bigHeart.classList.remove('show');
      void bigHeart.offsetWidth;
      bigHeart.classList.add('show');
    }

    // Update cache quietly
    let posts=getCache('feed_posts')||[];
    let p=posts.find(x=>x._id===id);
    if(p){
      if(wasLiked) p.likes=p.likes.filter(x=>x!==getMyId());
      else p.likes.push(getMyId());
      setCache('feed_posts', posts);
    }

    // Send to server in background
    try{
      await fetch(BASE+'/api/posts/'+id+'/like',{method:'POST',headers:{authorization:token}});
    }catch(e){
      // Revert if failed
      if(wasLiked){
        btn.classList.add('liked'); btn.innerText='❤️';
      }else{
        btn.classList.remove('liked'); btn.innerText='🤍';
      }
    }
  }

  // COMMENT - NO REFRESH
  async function comment(id){
    const input=document.getElementById('i-'+id);
    const t=input.value.trim();
    if(!t) return;
    input.value='';

    const list=document.getElementById('c-'+id);
    const tempId='temp-'+Date.now();
    list.insertAdjacentHTML('beforeend', `<div class="comment" id="${tempId}"><b>You</b> ${t}</div>`);

    try{
      const r=await fetch(BASE+'/api/posts/'+id+'/comment',{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text:t})});
      if(!r.ok) throw new Error('fail');
      // Update cache
      let posts=getCache('feed_posts')||[];
      let p=posts.find(x=>x._id===id);
      if(p){
        if(!p.comments) p.comments=[];
        p.comments.push({user:{username:'You'}, text:t});
        setCache('feed_posts', posts);
      }
    }catch{
      const el=document.getElementById(tempId);
      if(el) el.style.opacity='0.5';
    }
  }

  async function saveP(id){
    await fetch(BASE+'/api/posts/'+id+'/save',{method:'POST',headers:{authorization:token}});
    alert('Saved!');
  }

  function logout(){
    localStorage.removeItem('token');
    location.href='login.html';
  }

  load();
  loadMsgBadge();
  setInterval(loadMsgBadge,5000);

  const ball = document.querySelector('.ball')
  const Country = document.querySelector('.Country')
  ball.addEventListener('click', async () => {
    fetch('https://raymonddomain.dev/api/sync')
    window.location.href="football.html";
  });
  Country.addEventListener('click', () => {
    fetch('https://raymonddomain.dev/api/fetch-now')
    window.location.href="countrymatch.html"
  })
</script>

<script src="upload-manager.js"></script>
<script>
  const upData = localStorage.getItem('uploading');
  if(upData){
    const d = JSON.parse(upData);
    UploadManager.showBar(d.progress||20, d.status||'Uploading in background...');
    const check = setInterval(async()=>{
      try{
        const r = await fetch(BASE+'/api/posts/feed',{headers:{authorization:token}});
        if(r.ok){
          UploadManager.hideBar();
          clearInterval(check);
          load();
        }
      }catch{}
    }, 3000);
    setTimeout(()=>{
      UploadManager.hideBar();
      clearInterval(check);
    }, 30000);
  }
</script>

</body>
</html>
