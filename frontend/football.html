<!DOCTYPE html>
<html>
<head>
<title>Premier League 2025/2026</title>
<style>
body { background: #0a0e1a; color: white; font-family: Arial; padding: 20px; max-width: 900px; margin: auto; }
h1 { text-align: center; color: #22c55e; margin-bottom: 20px; }
.tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs button { background: #1e293b; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
.tabs button.active { background: #22c55e; }
.match-card { background: #1e293b; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; }
.teams { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
.teams span { display: flex; align-items: center; gap: 8px; }
.teams img { width: 25px; height: 25px; }
.score { font-size: 22px; }
.time { color: #94a3b8; font-size: 12px; margin-top: 5px; text-align: center; }
.status { text-align: center; color: #facc15; font-size: 12px; font-weight: bold; margin-top: 3px; }
.buttons { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
.btn { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 6px; font-weight: bold; }
.btn:hover { background: #475569; }
.watch-btn { background: #ef4444; text-decoration: none; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; }
.watch-btn:hover { background: #dc2626; }
.lineup { background: #0f172a; padding: 12px; margin-top: 10px; border-radius: 8px; font-size: 14px; border-left: 3px solid #22c55e; }
.hidden { display: none; }
.loading { text-align: center; padding: 30px; color: #94a3b8; }
</style>
</head>
<body>
<h1>Premier League 2025/2026</h1>

<div class="tabs">
  <button onclick="loadMatches('today', event)" class="active">Today</button>
  <button onclick="loadMatches('upcoming', event)">Upcoming</button>
  <button onclick="loadMatches('finished', event)">Finished</button>
  <button onclick="loadMatches('', event)">All Season</button>
</div>

<div id="matches"><div class="loading">Loading matches...</div></div>

<script>
async function loadMatches(tab, e){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  
  const container = document.getElementById('matches');
  container.innerHTML = '<div class="loading">Loading matches...</div>';

  try{
    const res = await fetch(`https://my-website-raymond.vercel.app/api/matches?tab=${tab}`);
    if(!res.ok) throw new Error("Server error");
    const matches = await res.json();
    container.innerHTML = '';

    if(matches.length === 0){
      container.innerHTML = '<p style="text-align:center; padding:20px;">No matches found for this tab</p>';
      return;
    }

    matches.forEach(match => {
      container.innerHTML += `
        <div class="match-card">
          <div class="teams">
            <span><img src="${match.homeLogo}" onerror="this.src='https://via.placeholder.com/25'"> ${match.homeTeam}</span>
            <span class="score"><b>${match.homeGoals ?? '-'}</b> : <b>${match.awayGoals ?? '-'}</b></span>
            <span>${match.awayTeam} <img src="${match.awayLogo}" onerror="this.src='https://via.placeholder.com/25'"></span>
          </div>
          <div class="time">${new Date(match.date).toLocaleString()}</div>
          <div class="status">${match.status}</div>
          
          <div class="buttons">
            <button class="btn" onclick="toggleLineup(${match.fixtureId})">Lineup</button>
            <a href="${match.streamUrl}" target="_blank" class="watch-btn">Watch YouTube</a>
          </div>

          <div id="lineup-${match.fixtureId}" class="lineup hidden">
            <b style="color:#22c55e">${match.homeTeam}:</b> ${match.homeLineup.join(', ')} <br><br>
            <b style="color:#22c55e">${match.awayTeam}:</b> ${match.awayLineup.join(', ')}
          </div>
        </div>
      `;
    });
  }catch(err){
    container.innerHTML = '<p style="text-align:center; color:red; padding:20px;">Error: Is server running on port 8000?</p>';
  }
}

function toggleLineup(id){
  document.getElementById(`lineup-${id}`).classList.toggle('hidden');
}

// Load today on start
loadMatches('today');
</script>
</body>
</html>
