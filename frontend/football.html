<title>Football Scores</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
.div{ justify-self: center; width: 80%; margin-top: 100px;}
body { background: #000; color: #fff; padding: 15px; }
.header-text { text-align: center; color: #fff; font-size: 25px; margin-bottom: 15px; }
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
.tab.upcoming { background: #16a34a; color: #fff; }
.tab.finished { background: #dc2626; color: #fff; }
.tab.inactive { opacity: 0.5; }
.date-header { display: flex; align-items: center; gap: 8px; color: #3b82f6; font-size: 16px; font-weight: 700; margin: 20px 0 12px 0; }
.match-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
.league { color: #f59e0b; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.match-date { color: #9ca3af; font-size: 13px; margin-bottom: 15px; }
.teams { display: flex; align-items: center; justify-content: space-between; text-align: center; margin-bottom: 12px; }
.team { flex: 1; }
.team img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
.team-name { font-size: 14px; font-weight: 600; }
.score-area { flex: 0 0 90px; }
.score { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.badge { padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; display: inline-block; background: #2563eb; color: white; }
.btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-adverts { background: #f59e0b; color: #000; }
.btn-watch { background: #dc2626; color: #fff; }
.no-matches { text-align: center; color: #666; padding: 40px 0; }
.loading { text-align: center; color: #888; padding: 30px; }
small{ font-weight: 700; padding-bottom: 3px; display: grid; font-size: 15px; justify-content: center; }
.small{ font-weight: 700; padding-bottom: 15px; display: grid; font-size: 15px; justify-content: center; }
.div{
  margin-top: 10px;
  margin-left: 22px;
  height: 70px;
}
@media screen and (max-width: 900px) {.div{ width: 100%; margin-top: -80px;} }

<body>

<div class="div">
<h1 class="header-text"> Live Football ⚽ </h1>
<small> Finish Match Will Show In Finished Tab</small>
<small class="small"> within Some Hours </small>
<div class="tabs">
<button class="tab upcoming active" onclick="loadMatches('upcoming', this)">Upcoming</button>
<button class="tab finished" onclick="loadMatches('finished', this)">Finished</button>
</div>
<div id="matches"></div>
</div>

<script>
// THIS AD WILL FIRE WHEN CLICK WATCH ADVERTS
function watchAdverts(){
  (function(s){s.dataset.zone='11825137',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))
}

function watchLiveDirect(link){
  window.open(link, '_blank');
}

const API = "https://my-website-raymond.vercel.app/api/matches";

function formatDateHeader(dateStr){
  const d = new Date(dateStr);
  return `📅 ${d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})}`;
}
function formatFullDate(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}) + " • " + d.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit', hour12: false});
}
function getStatusBadge(match){
  if(match.status === "IN_PLAY") return `<span class="badge">LIVE<br>${match.minute || 0}'</span>`
  if(match.status === "PAUSED") return `<span class="badge">HALF<br>TIME</span>`
  if(match.status === "FINISHED") return `<span class="badge">FINISH</span>`
  return `<span class="badge" style="background:#374151">${new Date(match.date).toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit', hour12: false})}</span>`
}
function getYouTubeLink(match){
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(match.home.name + ' vs ' + match.away.name + ' live stream')}`;
}
function cleanLeagueName(name){
  if(!name) return name;
  if(name.toLowerCase().includes("primera division")) return "LaLiga EA ";
  return name;
}
function renderMatch(match){
  const youtubeLink = getYouTubeLink(match);
  return `<div class="match-card">
    <div class="league">${cleanLeagueName(match.league)}</div>
    <div class="match-date">${formatFullDate(match.date)}</div>
    <div class="teams">
      <div class="team"><img src="${match.home.logo}" onerror="this.src='https://via.placeholder.com/50'"><div class="team-name">${match.home.name}</div></div>
      <div class="score-area"><div class="score">${match.homeScore} - ${match.awayScore}</div>${getStatusBadge(match)}</div>
      <div class="team"><img src="${match.away.logo}" onerror="this.src='https://via.placeholder.com/50'"><div class="team-name">${match.away.name}</div></div>
    </div>
    <button class="btn btn-adverts" onclick="watchAdverts()">📢 Watch Adverts</button>
    <button class="btn btn-watch" onclick="watchLiveDirect('${youtubeLink}')">▶ Watch Live</button>
  </div>`;
}
function groupMatchesByDate(matches){
  const groups = {};
  matches.forEach(m => {
    const k = new Date(m.date).toISOString().split('T')[0];
    if(!groups[k]) groups[k] = [];
    groups[k].push(m);
  });
  return groups;
}
async function loadMatches(tab, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.add('inactive'));
  btn.classList.remove('inactive');
  const c = document.getElementById('matches');
  c.innerHTML = `<div class="loading">Loading matches...</div>`;
  try {
    const res = await fetch(`${API}?tab=${tab}`, { cache: "no-store" });
    const data = await res.json();
    if(!data.success ||!data.matches || data.matches.length === 0){
      c.innerHTML = `<div class="no-matches">No matches found</div>`; return;
    }
    const grouped = groupMatchesByDate(data.matches);
    let html = '';
    let dates = Object.keys(grouped).sort();
    if(tab === 'finished') dates = dates.reverse();
    dates.forEach(d => {
      html += `<div class="date-header">${formatDateHeader(grouped[d][0].date)}</div>`;
      grouped[d].forEach(m => { html += renderMatch(m); });
    });
    c.innerHTML = html;
  } catch(e){ c.innerHTML = `<div class="no-matches">Could not load matches</div>`; }
}
const firstBtn = document.querySelector('.tab.upcoming');
loadMatches('upcoming', firstBtn);
</script>
</body>
</html>
