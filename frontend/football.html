<!DOCTYPE html>
<html lang="en">
<head>
   <script>
   const tokenN = localStorage.getItem('token');

    if (!tokenN) {
      // Not logged in? Kick out immediately
      window.location.replace('/login.html');
    }  
    </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scores</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial}
button:hover{
  background-color: green;
}
header{text-align:center;padding:25px 10px;color:orange;font-size:28px;font-weight:bold}
nav{display:flex;gap:8px;max-width:900px;margin:auto;padding:10px}
nav button{flex:1;padding:13px;border:0;border-radius:10px;background:#e70707;color:#aaa;cursor:pointer;font-weight:bold;font-size:15px}
#matches{max-width:900px;margin:auto;padding:10px}
.day{color:#398cff;font-weight:bold;margin:20px 5px 10px}
.card{background:#111;border:1px solid #292929;border-radius:16px;padding:15px;margin-bottom:15px}
.league{color:orange;font-weight:bold}
.date{color:#999;font-size:13px;margin-top:5px}
.teams{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:8px;margin:20px 0}
.team{text-align:center;font-weight:bold}
.team img{width:45px;height:45px;object-fit:contain;display:block;margin:auto auto 8px}
.score{text-align:center;font-size:24px;font-weight:bold}
.status{display:block;margin-top:5px;padding:4px;border-radius:6px;background:#286be0;font-size:10px;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button,.watch{padding:13px;border:0;border-radius:9px;background:#252525;color:white;text-align:center;text-decoration:none;cursor:pointer;font-weight:600}
.watch{background:#e52525}
#loading,#error{text-align:center;padding:35px;color:#888}
@media(max-width:500px){
  header{font-size:24px}
  .teams{grid-template-columns:1fr 65px 1fr}
  .team{font-size:13px}
  .team img{width:35px;height:35px}
  .score{font-size:20px}
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>⚽ Football Scores</header>
<p> Tap upcoming to display match </p>

<nav>
  <button onclick="loadMatches('upcoming')">Upcoming</button>
  <button onclick="loadMatches('finished')">Finished</button>
</nav>

<div id="loading">Loading matches...</div>
<div id="error"></div>
<div id="matches"></div>

<script>
const box = document.getElementById("matches");
const loading = document.getElementById("loading");
const error = document.getElementById("error");

function dateText(v){ return new Date(v).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"}) }
function timeText(v){ return new Date(v).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) }

async function loadMatches(type){
  box.innerHTML = "";
  error.innerHTML = "";
  loading.style.display = "block";

  try{
    const res = await fetch(`https://my-website-raymond.vercel.app/api/matches?tab=${type}`);
    const data = await res.json();
    if(!data.success) throw new Error(data.error);
    render(data.matches);
  }catch(err){
    error.innerHTML = "❌ " + err.message;
  }
  loading.style.display = "none";
}

function render(matches){
  if(!matches.length){
    box.innerHTML = "<p>No matches found.</p>";
    return;
  }

  let lastDay = "";
  matches.forEach(match=>{
    const day = dateText(match.date);
    if(day !== lastDay){
      box.innerHTML += `<div class="day">📅 ${day}</div>`;
      lastDay = day;
    }

    const score = match.homeScore === null ? "VS" : `${match.homeScore} - ${match.awayScore}`;
    const status = match.status === 'IN_PLAY' ? 'LIVE' : match.status === 'FT' ? 'FT' : 'SCHEDULED';
    const youtube = `https://www.youtube.com/results?search_query=${encodeURIComponent(match.home.name + ' vs ' + match.away.name + ' live')}`;

    box.innerHTML += `
      <div class="card">
        <div class="league">${match.league}</div>
        <div class="date">${day} • ${timeText(match.date)}</div>
        <div class="teams">
          <div class="team"><img src="${match.home.logo}" alt="">${match.home.name}</div>
          <div class="score">${score}<span class="status">${status}</span></div>
          <div class="team"><img src="${match.away.logo}" alt="">${match.away.name}</div>
        </div>
        <div class="actions">
          <button onclick="details('${match._id}')">Show Details</button>
          <a class="watch" href="${youtube}" target="_blank" rel="noopener">▶ Watch Live</a>
        </div>
      </div>`;
  });
}

async function details(id){
  try{
    const res = await fetch(`https://my-website-raymond.vercel.app/api/matches/${id}`);
    const data = await res.json();
    const m = data.match;
    if(!m) return alert("Match not found");
    alert(`${m.home.name} vs ${m.away.name}\n\nStatus: ${m.status}\nDate: ${dateText(m.date)}\nTime: ${timeText(m.date)}\nLeague: ${m.league}`);
  }catch(err){ alert(err.message); }
}

// load today by default
loadMatches('today');
</script>
</body>
</html>
