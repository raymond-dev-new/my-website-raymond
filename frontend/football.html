<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Football Scores</title>
<style>
  body { font-family: Arial; background: #0a0a0a; color: #fff; margin: 0; padding: 10px; }
  h1 { text-align: center; color: #00ff88; }
 .match { background: #1a1a1a; margin: 10px 0; padding: 12px; border-radius: 10px; border-left: 4px solid #00ff88; }
 .teams { font-size: 18px; font-weight: bold; }
 .info { font-size: 14px; color: #aaa; margin: 5px 0; }
 .lineup { font-size: 13px; color: #ccc; margin-top: 8px; }
 .youtube { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #ff0000; color: #fff; text-decoration: none; border-radius: 5px; font-size: 13px; }
 .loading { text-align: center; padding: 20px; }
</style>
</head>
<body>
<h1>⚽ Live Football</h1>
<div id="matches" class="loading">Loading matches...</div>

<script>
const API_KEY = "449f6dc5fbf34ba82d9e636c7598ccab"; // YOUR KEY
const TEAMS = [33, 50, 529, 541, 40, 49, 42]; // Arsenal, Man City, Real Madrid, Barca, Liverpool, Man U, Bayern

async function getMatches() {
  const today = new Date();
  const from = new Date(today); from.setDate(today.getDate() - 3); // past 3 days
  const to = new Date(today); to.setDate(today.getDate() + 3); // next 3 days
  
  const fromStr = from.toISOString().split('T')[0];
  const toStr = to.toISOString().split('T')[0];
  
  let url = `https://v3.football.api-sports.io/fixtures?from=${fromStr}&to=${toStr}&league=39,140,135,78,61&status=NS,1H,HT,2H,FT`;
  
  const res = await fetch(url, {
    headers: { "x-api-sports-key": API_KEY }
  });
  const data = await res.json();
  
  // Filter for big teams only
  const matches = data.response.filter(m => 
    TEAMS.includes(m.teams.home.id) || TEAMS.includes(m.teams.away.id)
  );
  
  displayMatches(matches);
}

async function displayMatches(matches) {
  const container = document.getElementById("matches");
  if(matches.length === 0) {
    container.innerHTML = "No matches found for big teams in last 3 + next 3 days";
    return;
  }
  
  let html = "";
  for(let m of matches) {
    const date = new Date(m.fixture.date).toLocaleString();
    const score = m.goals.home!== null? `${m.goals.home} - ${m.goals.away}` : "vs";
    const status = m.fixture.status.short;
    
    // Get lineup
    let lineupHtml = "";
    try {
      const lineupRes = await fetch(`https://v3.football.api-sports.io/fixtures/lineups?fixture=${m.fixture.id}`, {
        headers: { "x-api-sports-key": API_KEY }
      });
      const lineupData = await lineupRes.json();
      if(lineupData.response.length > 0) {
        lineupHtml = `<div class="lineup"><b>Lineup:</b> ${lineupData.response[0].team.name} - ${lineupData.response[0].formation}</div>`;
      }
    } catch(e) {}
    
    // YouTube search link
    const ytSearch = encodeURIComponent(`${m.teams.home.name} vs ${m.teams.away.name} highlights`);
    const ytLink = `https://www.youtube.com/results?search_query=${ytSearch}`;
    
    html += `
      <div class="match">
        <div class="teams">${m.teams.home.name} ${score} ${m.teams.away.name}</div>
        <div class="info">📅 ${date} | 🏆 ${m.league.name} | Status: ${status}</div>
        ${lineupHtml}
        <a class="youtube" href="${ytLink}" target="_blank">▶ Watch Highlights on YouTube</a>
      </div>
    `;
  }
  container.innerHTML = html;
}

getMatches();
</script>
</body>
</html>
