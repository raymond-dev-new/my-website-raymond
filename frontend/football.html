<!DOCTYPE html>
<html lang="en">
<head>

 <script>
  const tokenN = localStorage.getItem('token');
    if (!tokenN) {
      window.location.replace('/login.html');
    }
    </script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scores</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
body { background: #000; color: #fff; padding: 15px; }

.header-text { text-align: center; color: #fff; font-size: 25px; margin-bottom: 15px; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab {
  flex: 1; padding: 14px; border: none; border-radius: 12px;
  font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s;
}
.tab.upcoming { background: #16a34a; color: #fff; }
.tab.finished { background: #dc2626; color: #fff; }
.tab.inactive { opacity: 0.5; }

.date-header {
  display: flex; align-items: center; gap: 8px;
  color: #3b82f6; font-size: 16px; font-weight: 700;
  margin: 20px 0 12px 0;
}

.match-card {
  background: #111; border: 1px solid #222;
  border-radius: 16px; padding: 15px; margin-bottom: 15px;
}
.league { color: #f59e0b; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.match-date { color: #9ca3af; font-size: 13px; margin-bottom: 15px; }

.teams { display: flex; align-items: center; justify-content: space-between; text-align: center; margin-bottom: 12px; }
.team { flex: 1; }
.team img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
.team-name { font-size: 14px; font-weight: 600; line-height: 1.3; }

.score-area { flex: 0 0 90px; }
.score { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.badge {
  padding: 6px 10px; border-radius: 8px; font-size: 12px;
  font-weight: 700; display: inline-block; background: #2563eb; color: white;
  line-height: 1.3;
}

.btn {
  width: 100%; padding: 12px; margin-top: 10px; border: none;
  border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;
}
.btn-details { background: #1f2937; color: #fff; }
.btn-watch { background: #dc2626; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }

/* NEW: Lineup details */
.lineup-box { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
.lineup-box.show { display: block; }
.lineup-grid { display: flex; gap: 15px; }
.lineup-team { flex: 1; }
.lineup-title { font-weight: 700; color: #f59e0b; margin-bottom: 8px; font-size: 14px; }
.lineup-player { font-size: 13px; color: #d1d5db; padding: 4px 0; }
.no-lineup { text-align: center; color: #666; padding: 10px 0; font-size: 13px; }

.no-matches { text-align: center; color: #666; padding: 40px 0; }
.loading { text-align: center; color: #888; padding: 30px; }
</style>
</head>
<body>

  <h1 class="header-text"> ⚽ Football Scores </h1>

<div class="tabs">
  <button class="tab upcoming active" onclick="loadMatches('upcoming', this)">Upcoming</button>
  <button class="tab finished" onclick="loadMatches('finished', this)">Finished</button>
</div>

<div id="matches"></div>

<script>
const API = "https://my-website-raymond.vercel.app/api/matches";

function formatDateHeader(dateStr){
  const d = new Date(dateStr);
  return `📅 ${d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})}`;
}

function formatFullDate(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}) +
  " • " + d.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit', hour12: false});
}

function getStatusBadge(match){
  if(match.status === "IN_PLAY"){
    const minute = match.minuteText || (match.minute? `${match.minute}'` : "");
    return `<span class="badge">LIVE<br>${minute}</span>`
  }
  if(match.status === "PAUSED") return `<span class="badge">HALF<br>TIME</span>`
  if(match.status === "FINISHED") return `<span class="badge">FINISH</span>`
  return `<span class="badge" style="background:#374151">${new Date(match.date).toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit', hour12: false})}</span>`
}

function getYouTubeLink(match){
  const query = `${match.home.name} vs ${match.away.name} live stream`;
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
}

function cleanLeagueName(name){
  if(!name) return name;
  if(name.toLowerCase().includes("primera division")) return "LaLiga EA Sports";
  return name;
}

function toggleDetails(id){
  document.getElementById(`details-${id}`).classList.toggle('show');
}

function renderLineup(match, id){
  const homeLineup = match.homeLineup || [];
  const awayLineup = match.awayLineup || [];
  const hasLineup = homeLineup.length > 0 || awayLineup.length > 0;

  let lineupHtml = '';
  if(hasLineup){
    lineupHtml = `
    <div class="lineup-grid">
      <div class="lineup-team">
        <div class="lineup-title">${match.home.name}</div>
        ${homeLineup.map(p => `<div class="lineup-player">${p}</div>`).join('')}
      </div>
      <div class="lineup-team">
        <div class="lineup-title">${match.away.name}</div>
        ${awayLineup.map(p => `<div class="lineup-player">${p}</div>`).join('')}
      </div>
    </div>
    `
  } else {
    lineupHtml = `<div class="no-lineup">Lineups not available yet</div>`
  }

  return `<div id="details-${id}" class="lineup-box">${lineupHtml}</div>`
}

function renderMatch(match, index){
  const youtubeLink = getYouTubeLink(match);
  const matchId = `${match.home.name}-${match.away.name}-${index}`.replace(/\s/g, '');
  return `
  <div class="match-card">
    <div class="league">${cleanLeagueName(match.league)}</div>
    <div class="match-date">${formatFullDate(match.date)}</div>

    <div class="teams">
      <div class="team">
        <img src="${match.home.logo}" onerror="this.src='https://via.placeholder.com/50'" alt="${match.home.name}">
        <div class="team-name">${match.home.name}</div>
      </div>
      <div class="score-area">
        <div class="score">${match.homeScore} - ${match.awayScore}</div>
        ${getStatusBadge(match)}
      </div>
      <div class="team">
        <img src="${match.away.logo}" onerror="this.src='https://via.placeholder.com/50'" alt="${match.away.name}">
        <div class="team-name">${match.away.name}</div>
      </div>
    </div>

    <button class="btn btn-details" onclick="toggleDetails('${matchId}')">Show Details</button>
    ${renderLineup(match, matchId)}
    <button class="btn btn-watch" onclick="window.open('${youtubeLink}', '_blank')">▶ Watch Live</button>
  </div>
  `
}

function groupMatchesByDate(matches){
  const groups = {};
  matches.forEach(match => {
    const dateKey = new Date(match.date).toISOString().split('T')[0];
    if(!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(match);
  });
  return groups;
}

async function loadMatches(tab, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.add('inactive'));
  btn.classList.remove('inactive');

  const container = document.getElementById('matches');
  container.innerHTML = `<div class="loading">Loading matches...</div>`;

  try {
    const res = await fetch(`${API}?tab=${tab}`, { cache: "no-store" });
    const data = await res.json();

    if(!data.success ||!data.matches || data.matches.length === 0){
      container.innerHTML = `<div class="no-matches">No matches found</div>`;
      return;
    }

    const grouped = groupMatchesByDate(data.matches);
    let html = '';
    let matchIndex = 0;

    let dates = Object.keys(grouped).sort();
    if(tab === 'finished') dates = dates.reverse(); // Recent finished matches at top

    dates.forEach(dateKey => {
      html += `<div class="date-header">${formatDateHeader(grouped[dateKey][0].date)}</div>`;
      grouped[dateKey].forEach(match => {
        html += renderMatch(match, matchIndex++);
      });
    });

    container.innerHTML = html;
  } catch(err) {
    container.innerHTML = `<div class="no-matches">Could not load matches</div>`;
  }
}

loadMatches('upcoming', document.querySelector('.tab.upcoming'));
</script>

</body>
</html>
