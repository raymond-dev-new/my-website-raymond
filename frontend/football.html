<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scores</title>
<style>
* { box-sizing: border-box; }
body { 
  background: #0a0a0a; 
  color: white; 
  font-family: 'Segoe UI', Arial; 
  padding: 10px; 
  max-width: 800px; 
  margin: auto; 
}
h1 { 
  text-align: center; 
  color: #ff8c00; 
  margin-bottom: 20px; 
  font-size: 24px; 
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

.tabs { 
  display: flex; 
  justify-content: center; 
  gap: 8px; 
  margin-bottom: 20px; 
  overflow-x: auto;
  padding-bottom: 5px;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button { 
  background: #1a1a1a; 
  color: #aaa; 
  border: none; 
  padding: 10px 18px; 
  cursor: pointer; 
  border-radius: 8px; 
  font-weight: bold; 
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 14px;
}
.tabs button.active { background: #00c853; color: white; }

.date-header { 
  color: #3b82f6; 
  font-weight: bold; 
  margin: 25px 0 10px 0; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  font-size: 14px;
  border-bottom: 1px solid #222;
  padding-bottom: 8px;
}

.match-card { 
  background: #111; 
  padding: 15px; 
  margin: 12px 0; 
  border-radius: 10px; 
  border: 1px solid #222; 
}
.league-name { 
  color: #ff8c00; 
  font-size: 13px; 
  font-weight: bold; 
  margin-bottom: 8px;
}
.teams { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  font-size: 16px; 
  font-weight: bold; 
  margin-bottom: 5px;
}
.teams span { 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  text-align: center;
  flex: 1;
}
.teams img { width: 24px; height: 24px; }
.score { font-size: 20px; flex: 0 0 auto!important; }
.time-row { 
  color: #3b82f6; 
  font-size: 13px; 
  margin-bottom: 12px; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
}
.status-badge { 
  background: #2563eb; 
  padding: 3px 8px; 
  border-radius: 5px; 
  color: white; 
  font-size: 11px; 
  font-weight: bold; 
}
.btn { 
  background: #222; 
  color: white; 
  border: none; 
  padding: 12px; 
  cursor: pointer; 
  font-weight: bold; 
  width: 100%; 
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 15px;
}
.btn:hover { background: #333; }
.watch-btn { 
  background: #dc2626; 
  text-decoration: none; 
  color: white; 
  padding: 12px; 
  font-weight: bold; 
  width: 100%; 
  display: block; 
  text-align: center; 
  border-radius: 6px;
  font-size: 15px;
}
.watch-btn:hover { background: #b91c1c; }

.lineup { 
  background: #0a0a0a; 
  padding: 15px; 
  margin-top: 10px; 
  border-radius: 8px; 
  font-size: 13px; 
  border-left: 3px solid #22c55e; 
  line-height: 1.6;
}
.hidden { display: none; }
.loading { text-align: center; padding: 30px; color: #94a3b8; }

/* MOBILE */
@media (max-width: 600px) {
  body { padding: 8px; }
  h1 { font-size: 20px; }
 .teams { font-size: 15px; }
 .score { font-size: 22px; }
}
</style>
</head>
<body>
<h1>⚽ Football Scores</h1>

<div class="tabs">
  <button onclick="loadMatches('', event)">All Matches</button>
  <button onclick="loadMatches('today', event)" class="active">Today</button>
  <button onclick="loadMatches('upcoming', event)">Upcoming</button>
  <button onclick="loadMatches('finished', event)">Finished</button>
</div>

<div id="matches"><div class="loading">Loading matches...</div></div>

<script>
const API_URL = "https://my-website-raymond.vercel.app";

async function loadMatches(tab, e){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  if(e) e.target.classList.add('active');
  
  const container = document.getElementById('matches');
  container.innerHTML = '<div class="loading">Loading matches...</div>';

  try{
    const res = await fetch(`${API_URL}/api/matches?tab=${tab}`);
    const matches = await res.json();
    container.innerHTML = '';

    if(matches.length === 0){
      container.innerHTML = '<p style="text-align:center; padding:20px;">No matches found</p>';
      return;
    }

    let currentDate = "";
    matches.forEach(match => {
      const matchDate = new Date(match.date).toISOString().split('T')[0];
      const prettyDate = new Date(match.date).toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
      
      if(matchDate!== currentDate){
        currentDate = matchDate;
        container.innerHTML += `<div class="date-header">📅 ${matchDate} - ${prettyDate}</div>`;
      }

      const time = new Date(match.date).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      const scoreDisplay = (match.status === 'SCHEDULED')? time + ' WAT' : `${match.homeGoals?? '-'} - ${match.awayGoals?? '-'}`;
      const statusDisplay = (match.minute)? match.minute : match.status;

      container.innerHTML += `
        <div class="match-card">
          <div class="league-name">${match.league}</div>
          <div class="teams">
            <span>${match.homeTeam}</span>
            <span class="score">${scoreDisplay}</span>
            <span>${match.awayTeam}</span>
          </div>
          <div class="time-row">
            ${match.status === 'SCHEDULED'? '' : scoreDisplay}
            <span class="status-badge">${statusDisplay}</span>
          </div>
          
          <button class="btn" onclick="toggleLineup(${match.fixtureId})">Show Details</button>
          <a href="${match.streamUrl}" target="_blank" class="watch-btn">▶ Watch Live</a>

          <div id="lineup-${match.fixtureId}" class="lineup hidden">
            <b style="color:#22c55e">${match.homeTeam}:</b> ${match.homeLineup.length? match.homeLineup.join(', ') : 'TBA'} <br><br>
            <b style="color:#22c55e">${match.awayTeam}:</b> ${match.awayLineup.length? match.awayLineup.join(', ') : 'TBA'}
          </div>
        </div>
      `;
    });
  }catch(err){
    container.innerHTML = '<p style="text-align:center; color:red; padding:20px;">Error: Check API</p>';
  }
}

function toggleLineup(id){
  document.getElementById(`lineup-${id}`).classList.toggle('hidden');
}

// Load today on start
loadMatches('today');
</script>
</body>
</html>
