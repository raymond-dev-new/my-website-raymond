<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scores</title>
<style>
  body { font-family: Arial; background: #0a0a0a; color: #fff; margin: 0; padding: 0; }
  .header { text-align: center; padding: 15px; background: #111; }
  .header h1 { color: #ff8800; font-size: 20px; margin: 0; }
  
  .tabs { display: flex; background: #111; padding: 10px; gap: 8px; overflow-x: auto; }
  .tab { padding: 8px 14px; background: #222; border: none; color: #aaa; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .tab.active { background: #00aa44; color: #fff; }
  
  .container { padding: 10px; }
  .date-header { color: #4488ff; font-size: 15px; margin: 20px 5px 10px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
  
  .match { background: #1a1a1a; margin: 10px 0; padding: 12px; border-radius: 10px; }
  .league { color: #ff8800; font-size: 12px; margin-bottom: 5px; }
  .teams { font-size: 16px; font-weight: bold; margin: 5px 0; }
  .time { color: #4488ff; font-size: 13px; }
  .status { background: #1e3a8a; color: #60a5fa; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px; }
  
  /* LINEUP STYLES */
  .lineup { font-size: 12px; color: #ccc; margin: 8px 0; padding: 10px; background: #222; border-radius: 5px; display: none; }
  .team-lineup { margin-bottom: 10px; }
  .team-lineup b { color: #00ff88; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 5px; }
  
  .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
  .btn-details { background: #333; color: #fff; }
  .btn-watch { background: #ff0000; color: #fff; }
  .btn-watch:hover { background: #cc0000; }
  .empty { text-align: center; color: #666; padding: 30px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚽ Football Scores</h1>
</div>

<div class="tabs">
  <button class="tab" onclick="filterTab('all')">All Matches</button>
  <button class="tab" onclick="filterTab('live')">Live Now</button>
  <button class="tab active" onclick="filterTab('today')">Today</button>
  <button class="tab" onclick="filterTab('upcoming')">Upcoming</button>
  <button class="tab" onclick="filterTab('finished')">Finished</button>
</div>

<div class="container" id="matches">Loading...</div>

<script>
let allData = [];
let currentFilter = 'today';

const API_URL = "https://my-website-raymond.vercel.app/api/matches";

async function getMatches() {
  const container = document.getElementById("matches");
  try {
    const res = await fetch(API_URL);
    allData = await res.json();
    if(allData.error) throw new Error(allData.error);
    renderMatches();
  } catch(e) {
    container.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function filterTab(type) {
  currentFilter = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById("matches");
  const now = new Date();
  
  let filtered = allData.filter(m => {
    const matchDate = new Date(m.fixture.date);
    if(currentFilter === 'live') return ["1H","2H","HT"].includes(m.fixture.status.short);
    if(currentFilter === 'finished') return m.fixture.status.short === "FT";
    if(currentFilter === 'today') return matchDate.toDateString() === now.toDateString();
    if(currentFilter === 'upcoming') return matchDate > now && m.fixture.status.short === "NS";
    return true;
  });

  if(filtered.length === 0) {
    container.innerHTML = `<div class="empty">No matches</div>`;
    return;
  }

  // GROUP BY DATE
  const grouped = {};
  filtered.forEach(m => {
    const dateKey = new Date(m.fixture.date).toISOString().split('T')[0];
    if(!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(m);
  });

  let html = "";
  
  Object.keys(grouped).sort().forEach(dateKey => {
    const dateObj = new Date(dateKey);
    const prettyDate = dateObj.toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'});
    html += `<div class="date-header">📅 ${dateKey} - ${prettyDate}</div>`;
    
    grouped[dateKey].forEach(m => {
      const time = new Date(m.fixture.date).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
      const score = m.goals.home !== null ? `${m.goals.home} - ${m.goals.away}` : time + " WAT";
      const statusText = m.fixture.status.short === "NS" ? "Scheduled" : m.fixture.status.short;
      const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(m.teams.home.name+' vs '+m.teams.away.name+' live')}`;
      
      html += `<div class="match">
        <div class="league">${m.league.name}</div>
        <div class="teams">${m.teams.home.name} vs ${m.teams.away.name}</div>
        <div class="time">${score} <span class="status">${statusText}</span></div>
        
        <div class="lineup" id="lineup-${m.fixture.id}">Loading lineup...</div>
        
        <button class="btn btn-details" onclick="toggleDetails(${m.fixture.id})">Show Details</button>
        <a href="${yt}" target="_blank"><button class="btn btn-watch">▶ Watch Live</button></a>
      </div>`;
    });
  });
  
  container.innerHTML = html;
  filtered.forEach(m => fetchLineup(m.fixture.id));
}

function toggleDetails(id) {
  const div = document.getElementById(`lineup-${id}`);
  div.style.display = div.style.display === 'block' ? 'none' : 'block';
}

// FULL LINEUP CODE ADDED HERE
async function fetchLineup(fixtureId) {
  try {
    const res = await fetch(`https://my-website-raymond.vercel.app/api/lineup/${fixtureId}`);
    const data = await res.json();
    const div = document.getElementById(`lineup-${fixtureId}`);
    
    if(!div) return;
    if(data.length === 0) {
      div.innerHTML = `<b>Lineup:</b> Not available yet`;
      return;
    }
    
    let html = `<b>Starting XI</b>`;
    data.forEach(team => {
      html += `<div class="team-lineup">
        <b>${team.team.name} - ${team.formation}</b>
        <div class="players">`;
      
      team.startXI.slice(0,11).forEach(p => {
        html += `<div>${p.player.number}. ${p.player.name}</div>`;
      });
      
      html += `</div></div>`;
    });
    
    div.innerHTML = html;
  } catch(e) {
    const div = document.getElementById(`lineup-${fixtureId}`);
    if(div) div.innerHTML = `<b>Lineup:</b> Error loading`;
  }
}

getMatches();
setInterval(getMatches, 60000);
</script>
</body>
</html>
