<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Football</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff;padding:15px}
.container{width:80%;margin:0 auto}
.header-text{text-align:center;font-size:25px;margin-bottom:15px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.tab.upcoming{background:#16a34a;color:#fff}
.tab.finished{background:#dc2626;color:#fff}
.tab.inactive{opacity:.5}

/* BIG LEAGUE BREAK NOTICE */
.break-notice{
    border:3px solid #f59e0b;
    background:#1a1a1a;
    border-radius:24px;
    padding:28px 20px;
    margin:15px 0 25px;
    text-align:center;
}
.break-title{
    color:#f59e0b;
    font-size:20px;
    font-weight:800;
    margin-bottom:14px;
}
.break-text{
    color:#d1d5db;
    font-size:16px;
    line-height:1.45;
}
.break-resume{
    color:#16a34a;
    font-weight:800;
    margin-top:12px;
}

.date-header{
    display:flex;
    align-items:center;
    gap:8px;
    color:#3b82f6;
    font-size:16px;
    font-weight:700;
    margin:20px 0 12px
}
.match-card{
    background:#111;
    border:1px solid #222;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px
}
.league{color:#f59e0b;font-weight:700;font-size:15px;margin-bottom:6px}
.match-date{color:#9ca3af;font-size:13px;margin-bottom:15px}
.teams{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-bottom:12px}
.team{flex:1}
.team img{width:50px;height:50px;object-fit:contain;margin-bottom:8px}
.team-name{font-size:14px;font-weight:600}
.score-area{flex:0 0 90px;text-align:center}
.score{font-size:28px;font-weight:800;margin-bottom:8px}
.badge{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;display:inline-block;background:#2563eb;color:#fff}
.badge.live{background:#dc2626;animation:pulse 1s infinite}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.6}
100%{opacity:1}
}

.btn{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    cursor:pointer
}
.btn-watch{background:#dc2626;color:#fff}
.no-matches{text-align:center;color:#666;padding:40px 0}
.loading{text-align:center;color:#888;padding:30px}

@media(max-width:900px){
.container{width:90%}
}
@media(max-width:600px){
.container{width:100%}
}
</style>
</head>

<body>

<div class="container">

<h1 class="header-text">Live Football ⚽</h1>

<div class="tabs">
<button class="tab upcoming active" onclick="loadMatches('upcoming',this)">
Upcoming & Live
</button>

<button class="tab finished inactive" onclick="loadMatches('finished',this)">
Finished
</button>
</div>

<div id="matches"></div>

</div>

<script>

const BASE_URL="https://raymonddomain.dev";
const API_MATCHES=`${BASE_URL}/api/matches`;
const API_LIVE=`${BASE_URL}/api/live`;

let currentTab='upcoming';
let currentBtn=null;
let liveInterval=null;

/* LOCAL CACHE */
let cache={
    upcoming:JSON.parse(localStorage.getItem('cache_upcoming')||'[]'),
    finished:JSON.parse(localStorage.getItem('cache_finished')||'[]')
};


/* BIG LEAGUES */
const BIG_LEAGUES=[
    'Premier League',
    'LaLiga',
    'Serie A',
    'Bundesliga',
    'Ligue 1',
    'UEFA Champions League',
    'Champions League'
];


/* BREAK NOTICE */
function bigLeagueBreakNotice(){

return `
<div class="break-notice">

<div class="break-title">
⚠️ Big Leagues on International Break
</div>

<div class="break-text">
Premier League, LaLiga, Serie A, Bundesliga,
Ligue 1 and Champions League matches have
finished for now.
</div>

<div class="break-resume">
They will resume on Friday 10th October 2026
</div>

</div>
`;

}


/* CHECK BIG LEAGUE */
function isBigLeague(league){

if(!league)return false;

const x=league.toLowerCase();

return BIG_LEAGUES.some(l=>
x.includes(l.toLowerCase())
);

}


function formatDateHeader(d){

return `📅 ${new Date(d).toLocaleDateString('en-GB',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
})}`;

}


function formatFullDate(d){

const x=new Date(d);

return x.toLocaleDateString('en-GB',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
})+
" • "+
x.toLocaleTimeString('en-GB',{
hour:'2-digit',
minute:'2-digit',
hour12:false
});

}


function getStatusBadge(m){

if(["IN_PLAY","LIVE"].includes(m.status)){

return `<span class="badge live">
LIVE<br>${m.minuteText||(m.minute?m.minute+"'":"LIVE")}
</span>`;

}

if(m.status==="PAUSED"){

return `<span class="badge" style="background:#eab308;color:#000">HT</span>`;

}

if(m.status==="FINISHED"){

return `<span class="badge" style="background:#16a34a">FINISH</span>`;

}

return `<span class="badge" style="background:#374151">
${new Date(m.date).toLocaleTimeString('en-GB',{
hour:'2-digit',
minute:'2-digit',
hour12:false
})}
</span>`;

}


function renderMatch(m){

return `

<div class="match-card">

<div class="league">${m.league||''}</div>

<div class="match-date">
${formatFullDate(m.date)}
</div>

<div class="teams">

<div class="team">
<img src="${m.home.logo}"
onerror="this.src='https://via.placeholder.com/50'">
<div class="team-name">${m.home.name}</div>
</div>

<div class="score-area">

<div class="score">
${m.homeScore??0} - ${m.awayScore??0}
</div>

${getStatusBadge(m)}

</div>

<div class="team">

<img src="${m.away.logo}"
onerror="this.src='https://via.placeholder.com/50'">

<div class="team-name">
${m.away.name}
</div>

</div>

</div>

<button class="btn btn-watch"
onclick="window.open(
'https://www.youtube.com/results?search_query='+
encodeURIComponent('${m.home.name} vs ${m.away.name} live'),
'_blank')">

▶ Watch Live

</button>

</div>

`;

}


function groupByDate(matches){

const g={};

matches.forEach(m=>{

const d=new Date(m.date);

const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

if(!g[k])g[k]=[];

g[k].push(m);

});

return g;

}


/* RENDER MATCHES + BREAK NOTICE */
function renderGrouped(matches,tab){

const c=document.getElementById('matches');

matches=matches||[];


/*
   Show the big-league notice FIRST.
   It does not remove other matches.
*/
let html='';

if(tab==='upcoming'){

const hasBigLeague=matches.some(m=>isBigLeague(m.league));

if(!hasBigLeague){

html+=bigLeagueBreakNotice();

}

}


/* NO MATCHES */
if(matches.length===0){

html+=`<div class="no-matches">
Checked Your Internet Connection.
</div>`;

c.innerHTML=html;
return;

}


const grouped=groupByDate(matches);

let dates=Object.keys(grouped).sort(
(a,b)=>new Date(grouped[a][0].date)-new Date(grouped[b][0].date)
);

if(tab==='finished')dates=dates.reverse();


dates.forEach(k=>{

html+=`
<div class="date-header">
${formatDateHeader(grouped[k][0].date)}
</div>
`;

grouped[k]
.sort((a,b)=>{

const la=["IN_PLAY","LIVE","PAUSED"].includes(a.status);
const lb=["IN_PLAY","LIVE","PAUSED"].includes(b.status);

if(la&&!lb)return -1;
if(!la&&lb)return 1;

return 0;

})
.forEach(m=>html+=renderMatch(m));

});


c.innerHTML=html;

}


/* LOAD MATCHES */
async function loadMatches(tab,btn){

currentTab=tab;
currentBtn=btn;

document.querySelectorAll('.tab')
.forEach(t=>t.classList.add('inactive'));

btn.classList.remove('inactive');

const container=document.getElementById('matches');


/* SHOW CACHE FIRST */
if(cache[tab]&&cache[tab].length>0){

renderGrouped(cache[tab],tab);

}else{

container.innerHTML=
`<div class="loading">Loading matches...</div>`;

}


if(liveInterval)clearInterval(liveInterval);


try{

const controller=new AbortController();

setTimeout(()=>controller.abort(),25000);

let matches=[];


if(tab==='upcoming'){

/* GET MATCHES FROM DATABASE */
const resDB=await fetch(
`${API_MATCHES}?tab=${tab}`,
{
cache:"no-store",
signal:controller.signal
}
);

const dataDB=await resDB.json();

let dbMatches=dataDB.success?
(dataDB.matches||[]):[];


/* GET LIVE MATCHES */
try{

const resLive=await fetch(
API_LIVE,
{
cache:"no-store",
signal:controller.signal
}
);

const dataLive=await resLive.json();

if(dataLive.success&&dataLive.matches.length>0){

const liveMap=new Map(
dataLive.matches.map(m=>[m._id,m])
);

dbMatches=dbMatches.filter(
m=>!liveMap.has(m._id)
);

matches=[
...dataLive.matches,
...dbMatches
];

}else{

matches=dbMatches;

}

}catch(e){

matches=dbMatches;

}


}else{

/* FINISHED = DATABASE ONLY */
const res=await fetch(
`${API_MATCHES}?tab=${tab}`,
{
cache:"no-store",
signal:controller.signal
}
);

const data=await res.json();

matches=data.matches||[];

}


/* SAVE CACHE */
cache[tab]=matches;

localStorage.setItem(
'cache_'+tab,
JSON.stringify(matches)
);


/* DISPLAY */
renderGrouped(matches,tab);


/* LIVE REFRESH */
const hasLive=matches.some(
m=>["IN_PLAY","LIVE","PAUSED"]
.includes(m.status)
);

if(hasLive&&tab==="upcoming"){

liveInterval=setInterval(
()=>loadMatches(tab,btn),
60000
);

}


}catch(err){

console.log(err);

}

}


/* AUTO LOAD */
window.onload=()=>{

const firstBtn=
document.querySelector('.tab.upcoming');

loadMatches('upcoming',firstBtn);

};

</script>

</body>
</html>
