<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,Roboto;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#121212;border:1px solid #262626;border-radius:16px;padding:24px;width:100%;max-width:380px}
h2{margin:0 0 8px}small{color:#888}
input{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:13px;color:#fff;margin-top:12px;outline:none}
button{width:100%;background:#0095f6;border:none;border-radius:10px;padding:13px;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}
.back{margin-top:12px;text-align:center;display:block;color:#888;text-decoration:none;font-size:13px}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:13px;display:none}
.msg.ok{display:block;background:#0a2a12;color:#8f8;border:1px solid #1a5a1a}
.msg.err{display:block;background:#2a0a0a;color:#f88;border:1px solid #5a1a1a}
</style>
</head>
<body>
<div class="card">
  <h2>Change password</h2><small>You must know old password</small>
  <input id="oldPass" type="password" placeholder="Current password">
  <input id="newPass" type="password" placeholder="New password">
  <input id="confirm" type="password" placeholder="Confirm new password">
  <button id="btn" onclick="changePass()">Update password</button>
  <div id="msg" class="msg"></div>
  <a href="profile.html" class="back">Back to profile</a>
</div>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='login.html';
function showMsg(t,ok){const el=document.getElementById('msg');el.innerText=t;el.className='msg '+(ok?'ok':'err');}
async function changePass(){
  const oldPassword=document.getElementById('oldPass').value.trim();
  const newPassword=document.getElementById('newPass').value.trim();
  const confirm=document.getElementById('confirm').value.trim();
  if(!oldPassword||!newPassword) return showMsg('Fill all',false);
  if(newPassword!==confirm) return showMsg('New passwords not match',false);
  if(newPassword.length<6) return showMsg('Min 6 chars',false);
  const b=document.getElementById('btn'); b.disabled=true; b.innerText='Updating...';
  try{
    let r=await fetch(BASE+'/api/users/change-password',{method:'PUT',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({oldPassword,newPassword,currentPassword:oldPassword,password:newPassword})});
    // fallback endpoints
    if(!r.ok){
      r=await fetch(BASE+'/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({oldPassword,newPassword})});
    }
    let d=await r.json();
    if(!r.ok) throw new Error(d.message||'Failed');
    showMsg('Password updated successfully!',true);
    setTimeout(()=> location.href='profile.html',1200);
  }catch(e){ showMsg(e.message,false); }
  b.disabled=false; b.innerText='Update password';
}
</script>
</body>
</html>
