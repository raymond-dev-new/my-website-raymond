<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Football</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff;padding:15px}.container{width:80%;margin:0 auto}
.header-text{text-align:center;font-size:25px;margin-bottom:15px}
.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{flex:1;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.tab.upcoming{background:#16a34a;color:#fff}.tab.finished{background:#dc2626;color:#fff}.tab.inactive{opacity:.5}
.break-notice{border:3px solid #f59e0b;background:#1a1a1a;border-radius:24px;padding:28px 20px;margin:15px 0 25px;text-align:center}
.break-title{color:#f59e0b;font-size:20px;font-weight:800;margin-bottom:14px}.date-header{display:flex;align-items:center;gap:8px;color:#3b82f6;font-size:16px;font-weight:700;margin:20px 0 12px}
.match-card{background:#111;border:1px solid #222;border-radius:16px;padding:15px;margin-bottom:15px}
.league{color:#f59e0b;font-weight:700;font-size:15px;margin-bottom:6px}.match-date{color:#9ca3af;font-size:13px;margin-bottom:15px}
.teams{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-bottom:12px}.team{flex:1}.team img{width:50px;height:50px;object-fit:contain;margin-bottom:8px}.team-name{font-size:14px;font-weight:600}

.break-notice{
  border: 2.5px solid #ff9d00;
  background: #161616;
  border-radius: 16px;
  padding: 18px 16px;
  margin: 14px 12px;
  text-align: center;
}
.break-title{
  color: #ff9d00;
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;
}
.break-text{
  color: #d1d5db;
  font-size: 14px;
  line-height: 1.4;
  margin-bottom: 12px;
}
.break-resume{
  color: #16a34a;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.45;
}

.score-area{flex:0 0 90px;text-align:center}.score{font-size:28px;font-weight:800;margin-bottom:8px}
.badge{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;display:inline-block;background:#2563eb;color:#fff}.badge.live{background:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.btn{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}.btn-watch{background:#dc2626;color:#fff}
.loading-wrap{text-align:center;padding:50px 0}.spinner{width:40px;height:40px;border:4px solid #222;border-top:4px solid #22c55e;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}.loading-text{color:#888;font-size:14px}
.top-loader{height:3px;background:#22c55e;width:0%;animation:loadbar 1.5s infinite;position:fixed;top:0;left:0;z-index:999}
@keyframes loadbar{0%{width:0%}50%{width:70%}100%{width:100%}}
@media(max-width:900px){.container{width:90%}}@media(max-width:600px){.container{width:100%}}
</style>
</head>
<body>

<div class="top-loader" id="topLoader" style="display:none"></div>
<div class="container">
<h1 class="header-text">Live Football ⚽</h1>
<div class="tabs">
<button class="tab upcoming" id="b1-up" onclick="switchTab('upcoming',this)">Upcoming & Live</button>
<button class="tab finished inactive" id="b1-fin" onclick="switchTab('finished',this)">Finished</button>
</div>

  <!-- BREAK NOTICE - Put this inside body above -->
<div class="break-notice">
  <div class="break-title">⚠️ Big Leagues on International Break</div>
  <div class="break-text">
    Premier League, LaLiga, Serie A, Bundesliga,<br>
    Ligue 1 and Champions League matches have<br>
    finished for now.
  </div>
  <div class="break-resume">
    They will resume on Friday 10th October 2026<br>
    — Liverpool vs Man City, Arsenal vs Leeds,<br>
    Real Madrid vs Villarreal, Barcelona vs Getafe.
  </div>
</div>

<div id="matches"></div>
</div>
<script>
const API_MATCHES="https://raymonddomain.dev/api/matches";
const API_LIVE="https://raymonddomain.dev/api/live";
let currentTab='upcoming';

function getCache(tab){try{const r=localStorage.getItem('c1_'+tab);return r?JSON.parse(r).matches||[]:[];}catch(e){return[];}}
function saveCache(tab,m){localStorage.setItem('c1_'+tab,JSON.stringify({time:Date.now(),matches:m}));}

function showLoading(){
  document.getElementById('topLoader').style.display='block';
  const cached=getCache(currentTab);
  if(cached.length===0){
    document.getElementById('matches').innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading matches...</div></div>`;
  }
}
function hideLoading(){document.getElementById('topLoader').style.display='none';}

function formatDate(d){return new Date(d).toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function getBadge(m){
  if(["IN_PLAY","LIVE","1H","2H"].includes(m.status)) return `<span class="badge live">${m.minute?m.minute+"'":'LIVE'}</span>`;
  if(m.status==="HT") return `<span class="badge" style="background:#eab308;color:#000">HT</span>`;
  if(["FT","FINISHED"].includes(m.status)) return `<span class="badge" style="background:#16a34a">FT</span>`;
  return `<span class="badge" style="background:#333">${new Date(m.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>`;
}
function render(matches){
  const c=document.getElementById('matches');
  if(!matches||matches.length===0){c.innerHTML=`<div style="text-align:center;padding:40px;color:#666">No past matches within the past 7 days<br><button onclick="loadTab(currentTab)" style="margin-top:15px;padding:10px 20px;background:#22c55e;border:0;border-radius:8px;font-weight:800">Retry</button></div>`;return;}
  const g={}; matches.forEach(m=>{const d=new Date(m.date);const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(!g[k])g[k]=[];g[k].push(m);});
  let html=''; Object.keys(g).sort((a,b)=>currentTab==='finished'?new Date(g[b][0].date)-new Date(g[a][0].date):new Date(g[a][0].date)-new Date(g[b][0].date)).forEach(k=>{
    html+=`<div class="date-header">📅 ${new Date(g[k][0].date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>`;
    g[k].sort((a,b)=>{const la=["IN_PLAY","LIVE","1H","2H"].includes(a.status)?1:0;const lb=["IN_PLAY","LIVE","1H","2H"].includes(b.status)?1:0;return lb-la;}).forEach(m=>{
      html+=`<div class="match-card"><div class="league">${m.league||''}</div><div class="match-date">${formatDate(m.date)}</div><div class="teams"><div class="team"><img src="${m.home.logo}" loading="eager" onerror="this.src='https://via.placeholder.com/50'"><div class="team-name">${m.home.name}</div></div><div class="score-area"><div class="score">${m.homeScore??0}-${m.awayScore??0}</div>${getBadge(m)}</div><div class="team"><img src="${m.away.logo}" loading="eager" onerror="this.src='https://via.placeholder.com/50'"><div class="team-name">${m.away.name}</div></div></div><button class="btn btn-watch" onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(m.home.name+' vs '+m.away.name+' live'),'_blank')">▶ Watch Live</button></div>`;
    });
  });
  c.innerHTML=html;
}

async function fastFetch(tab){
  const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),5000);
  if(tab==='upcoming'){
    const [r1,r2]=await Promise.all([
      fetch(`${API_MATCHES}?tab=${tab}&t=${Date.now()}`,{cache:'no-store',signal:ctrl.signal}).then(r=>r.json()).catch(()=>({matches:[]})),
      fetch(`${API_LIVE}?t=${Date.now()}`,{cache:'no-store',signal:ctrl.signal}).then(r=>r.json()).catch(()=>({matches:[]}))
    ]);
    let db=r1.matches||r1||[]; let live=r2.matches||[];
    if(live.length>0){const map=new Map(live.map(x=>[x.fixtureId||x._id,x])); db=db.filter(x=>!map.has(x.fixtureId||x._id)); return [...live,...db];}
    return db;
  }else{
    const r=await fetch(`${API_MATCHES}?tab=${tab}&t=${Date.now()}`,{cache:'no-store',signal:ctrl.signal});
    const j=await r.json(); return j.matches||j||[];
  }
}

async function loadTab(tab){
  currentTab=tab;
  const cached=getCache(tab);
  if(cached.length>0) render(cached); // show cache instantly
  showLoading(); // show loading bar + spinner if no cache
  try{
    const fresh=await fastFetch(tab);
    if(fresh.length>0){saveCache(tab,fresh); render(fresh);}
    else if(cached.length===0) render([]);
  }catch(e){
    if(cached.length>0) render(cached);
    else document.getElementById('matches').innerHTML=`<div style="text-align:center;padding:40px;color:#888">Network error<br><button onclick="loadTab('${tab}')" style="margin-top:10px;padding:10px 20px;background:#22c55e;border:0;border-radius:8px">Retry</button></div>`;
  }finally{hideLoading();}
}
function switchTab(tab,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.add('inactive'));if(btn)btn.classList.remove('inactive');loadTab(tab);}
window.onload=()=>loadTab('upcoming');
</script>
</body>
</html>
