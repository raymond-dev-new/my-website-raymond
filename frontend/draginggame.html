<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wave Defender V5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial, sans-serif;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

h1 {
  font-size: clamp(16px, 4vw, 28px);
  padding: 8px 0;
  text-align: center;
}

#hud {
  display: flex;
  gap: 6px;
  padding: 5px;
  font-size: clamp(12px, 3vw, 18px);
  font-weight: bold;
  width: 80%;
  max-width: 800px;
  justify-content: center;
}
.hudBox {
  background: #222;
  padding: 6px;
  border-radius: 6px;
  flex: 1;
  text-align: center;
  min-width: 0;
}
.healthBar {
  width: 100%;
  height: 8px;
  background: #444;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 3px;
}
.healthFill { height: 100%; background: #2ecc71; transition: width 0.2s; }

#game {
  background: #1a1a1a;
  border: 2px solid #555;
  width: 90%;
  max-width: 700px;
  aspect-ratio: 7 / 5;
  touch-action: none;
}

#mobileControls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  width: 80%;
  max-width: 500px;
}
.btn {
  background: #3498db;
  color: #fff;
  border: none;
  font-size: clamp(20px, 6vw, 30px);
  padding: 15px 0;
  border-radius: 12px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn:active { background: #2980b9; transform: scale(0.92); }
#up { grid-column: 2; }
#left { grid-column: 1; }
#down { grid-column: 2; }
#right { grid-column: 3; }
#shoot {
  background: #e74c3c;
  grid-column: 1 / 4;
  font-size: clamp(16px, 5vw, 24px);
  font-weight: bold;
}
#restart {
  background: #e74c3c;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

/* TABLET + LAPTOP: 50% WIDTH */
@media (min-width: 768px) {
  #hud, #game, #mobileControls {
    width: 50%;
  }
 .btn {
    padding: 10px 0;
    font-size: clamp(16px, 3vw, 24px);
  }
}
</style>
</head>
<body>

<h1>🔫 WAVE DEFENDER V5</h1>

<div id="hud">
  <div class="hudBox">HEALTH<div class="healthBar"><div id="health" class="healthFill" style="width:100%"></div></div></div>
  <div class="hudBox">WAVE: <span id="wave">1</span></div>
  <div class="hudBox">KILLS: <span id="kills">0</span></div>
  <div class="hudBox">SPEED: <span id="speed">0.5x</span></div>
</div>

<canvas id="game"></canvas>

<div id="mobileControls">
  <button class="btn" id="up">▲</button>
  <button class="btn" id="left">◀</button>
  <button class="btn" id="down">▼</button>
  <button class="btn" id="right">▶</button>
  <button class="btn" id="shoot">FIRE 🔫</button>
</div>

<button id="restart" onclick="start()">PLAY AGAIN</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 700;
canvas.height = 500;

let player, bullets = [], enemyBullets = [], enemies = [];
let wave = 1, kills = 0, gameOver = false, gameSpeed = 0.5; // START 0.5
let keys = {up: false, down: false, left: false, right: false};
let enemiesToSpawn = 1; // NEW: how many to spawn this wave
let spawning = false;

function start() {
  player = {x: 335, y: 440, w: 30, h: 30, health: 100, baseSpeed: 5};
  bullets = [];
  enemyBullets = [];
  enemies = [];
  wave = 1;
  kills = 0;
  gameSpeed = 0.5; // START SLOW
  enemiesToSpawn = 1; // START WITH 1 ENEMY
  gameOver = false;
  document.getElementById('restart').style.display = 'none';
  document.getElementById('speed').innerText = gameSpeed.toFixed(1) + 'x';
  spawnEnemy(); // spawn first one
  loop();
}

function spawnEnemy() {
  if(spawning) return;
  spawning = true;
  enemies.push({
    x: Math.random() * (canvas.width - 30),
    y: 20,
    w: 30, h: 30,
    health: 20 + wave * 5,
    shootTimer: Math.random() * 100,
    speed: (1 + wave * 0.15) * gameSpeed
  });

  setTimeout(() => { spawning = false; }, 800); // delay between spawns
}

function nextWave() {
  wave++;
  if(wave > 10) wave = 1; // RESET TO 1 AFTER 10
  enemiesToSpawn = wave; // 1,2,3...10
  document.getElementById('wave').innerText = wave;

  // spawn all enemies for this wave one by one
  let count = 0;
  const interval = setInterval(() => {
    spawnEnemy();
    count++;
    if(count >= enemiesToSpawn) clearInterval(interval);
  }, 1000); // 1 second between each enemy
}

function loop() {
  if(gameOver) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function update() {
  if(keys.left) player.x -= player.baseSpeed * gameSpeed;
  if(keys.right) player.x += player.baseSpeed * gameSpeed;
  if(keys.up) player.y -= player.baseSpeed * gameSpeed;
  if(keys.down) player.y += player.baseSpeed * gameSpeed;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(canvas.height/2, Math.min(canvas.height - player.h, player.y));

  bullets.forEach(b => b.y -= 10 * gameSpeed);
  enemyBullets.forEach(b => b.y += 5 * gameSpeed);
  bullets = bullets.filter(b => b.y > 0);
  enemyBullets = enemyBullets.filter(b => b.y < canvas.height);

  enemies.forEach(e => {
    e.y += e.speed * 0.4;
    e.shootTimer++;
    if(e.shootTimer > (120 - kills*2)) { // slower shooting at start
      enemyBullets.push({x: e.x + e.w/2, y: e.y + e.h});
      e.shootTimer = 0;
    }
  });

  for(let bi = bullets.length-1; bi >= 0; bi--) {
    let b = bullets[bi];
    for(let ei = enemies.length-1; ei >= 0; ei--) {
      let e = enemies[ei];
      if(b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        e.health -= 20;
        bullets.splice(bi,1);
        if(e.health <= 0) {
          enemies.splice(ei,1);
          kills++;
          gameSpeed = 0.5 + kills * 0.03; // speed increases slowly
          document.getElementById('kills').innerText = kills;
          document.getElementById('speed').innerText = gameSpeed.toFixed(1) + 'x';
        }
        break;
      }
    }
  }

  for(let i = enemyBullets.length-1; i >= 0; i--) {
    let b = enemyBullets[i];
    if(b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
      player.health -= 5;
      enemyBullets.splice(i,1);
      if(player.health <= 0) {
        gameOver = true;
        document.getElementById('restart').style.display = 'block';
      }
    }
  }

  enemies.forEach(e => {
    if(e.y + e.h > player.y) {
      player.health -= 15;
      e.y = -50;
    }
  });

  // WHEN ALL ENEMIES DEAD = NEXT WAVE
  if(enemies.length === 0 &&!spawning) {
    setTimeout(nextWave, 1500); // 1.5s pause before next wave
  }

  document.getElementById('health').style.width = player.health + '%';
}

function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#3498db';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillRect(player.x + 12, player.y - 8, 6, 8);

  ctx.fillStyle = '#e74c3c';
  enemies.forEach(e => {
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillRect(e.x + 12, e.y + e.h, 6, 8);
  });

  ctx.fillStyle = '#f1c40f';
  bullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 8));
  ctx.fillStyle = '#ff0000';
  enemyBullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 8));
}

function shoot() {
  if(gameOver) return;
  bullets.push({x: player.x + player.w/2, y: player.y});
}

// KEYBOARD
document.addEventListener('keydown', e => {
  if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
  if(e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
  if(e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
  if(e.key === 's' || e.key === 'ArrowDown') keys.down = true;
  if(e.key === ' ') shoot();
});
document.addEventListener('keyup', e => {
  if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
  if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
  if(e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
  if(e.key === 's' || e.key === 'ArrowDown') keys.down = false;
});

// BUTTONS
function setKey(dir, state, e) {
  if(e) e.preventDefault();
  keys[dir] = state;
}

['up','down','left','right'].forEach(dir => {
  const btn = document.getElementById(dir);
  btn.addEventListener('touchstart', e => setKey(dir, true, e), {passive: false});
  btn.addEventListener('touchend', e => setKey(dir, false, e), {passive: false});
  btn.addEventListener('mousedown', () => setKey(dir, true));
  btn.addEventListener('mouseup', () => setKey(dir, false));
  btn.addEventListener('mouseleave', () => setKey(dir, false));
});

const shootBtn = document.getElementById('shoot');
shootBtn.addEventListener('touchstart', e => { e.preventDefault(); shoot(); }, {passive: false});
shootBtn.addEventListener('click', shoot);
canvas.addEventListener('click', shoot);

start();
</script>
</body>
</html>
