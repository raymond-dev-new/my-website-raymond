<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a12; color: #fff; font-family: Arial; padding-bottom: 90px; }
    .top { max-width: 935px; margin: 0 auto; padding: 20px 16px; }
    .tabs { display: flex; gap: 8px; margin-top: 14px; }
    .tab { padding: 9px 18px; border-radius: 20px; background: #1e1e2a; border: 1px solid #333; color: #fff; cursor: pointer; font-size: 13px; }
    .tab.active { background: linear-gradient(90deg, #7c3aed, #ec4899); border: none; }
    .search { display: flex; gap: 8px; background: #1e1e2a; border: 1px solid #333; border-radius: 30px; padding: 13px 16px; margin-top: 14px; }
    .search input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; }
    .grid { max-width: 935px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 16px; }
    .card { background: #16161f; border: 1px solid #26262f; border-radius: 18px; overflow: hidden; cursor: pointer; }
    .cover { width: 100%; height: 200px; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .noimg { width: 100%; height: 100%; background: linear-gradient(135deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 45px; }
    .body { padding: 12px; }
    .title { font-size: 14px; font-weight: 800; }
    .userRow { display: flex; gap: 12px; padding: 14px; background: #16161f; border: 1px solid #26262f; border-radius: 16px; cursor: pointer; align-items: center; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(45deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 18, .95); border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 14px 0; }
    .nav a { color: #fff; text-decoration: none; font-size: 22px; }
    .loading { display: none; text-align: center; padding: 30px 0 10px; color: #a78bfa; font-size: 13px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #26262f;
      border-top: 3px solid #a78bfa;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .navMsg { position: relative; }
    .msgBadge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="top">
    <h2 style="margin:0">Search ✨</h2>
    <div class="tabs">
      <button class="tab active" id="tabNovel" onclick="setMode('novel')">📚 Novels</button>
      <button class="tab" id="tabUser" onclick="setMode('user')">👤 Users by Name</button>
    </div>
    <div class="search">🔍 <input id="q" placeholder="Search by title..." oninput="doSearch()"></div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    Searching...
  </div>

  <div class="grid" id="grid"><p style="grid-column:1/3;text-align:center;color:#777">Type to search...</p></div>

  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
    <a href="saved.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

  <script>
    const BASE = "https://raymond-web-psi.vercel.app";
    const token = localStorage.getItem('token');
    if (!token) location.href = "login.html";

    let all = [];
    let mode = 'novel';
    let loadPromise = null;

    function showLoading() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('grid').style.display = 'none';
    }
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('grid').style.display = 'grid';
    }

    function setMode(m) {
      mode = m;
      document.getElementById('tabNovel').className = 'tab' + (m === 'novel' ? ' active' : '');
      document.getElementById('tabUser').className = 'tab' + (m === 'user' ? ' active' : '');
      document.getElementById('q').placeholder = m === 'novel' ? 'Search by title...' : 'Search user by name...';
      document.getElementById('q').value = '';
      hideLoading();
      document.getElementById('grid').innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">Type to search...</p>';
    }

    async function load() {
      if (loadPromise) return loadPromise;
      loadPromise = (async () => {
        try {
          const res = await fetch(BASE + '/api/posts', { headers: { authorization: token } });
          const data = await res.json();
          all = Array.isArray(data) ? data : (data.posts || []);
        } catch(e) {
          all = [];
        }
      })();
      return loadPromise;
    }

    async function doSearch() {
      const q = document.getElementById('q').value.toLowerCase().trim();
      const grid = document.getElementById('grid');

      if (!q) {
        hideLoading();
        grid.innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">Type to search...</p>';
        return;
      }

      if (mode === 'novel') {
        showLoading();
        await load();
        hideLoading();

        const found = all.filter(p => (p.title || '').toLowerCase().includes(q));
        if (!found.length) {
          grid.innerHTML = '<p style="grid-column:1/3;text-align:center">No novel found</p>';
          return;
        }
        grid.innerHTML = found.map(p => {
          let cover = p.cover ? '<img src="' + p.cover + '">' : '<div class="noimg">📖</div>';
          return '<div class="card" onclick="location.href=\'read.html?id=' + p._id + '\'"><div class="cover">' + cover + '</div><div class="body"><div class="title">' + p.title + '</div><div style="font-size:12px;color:#888">@' + (p.user?.username || 'author') + '</div></div></div>';
        }).join('');
      } else {
        showLoading();
        try {
          const res = await fetch(BASE + '/api/users/find?name=' + encodeURIComponent(q), { headers: { authorization: token } });
          const users = await res.json();
          hideLoading();
          if (!users.length) {
            grid.innerHTML = '<p style="grid-column:1/3;text-align:center">No user with that name</p>';
            return;
          }
          grid.innerHTML = users.map(u => {
            const av = u.avatar ? '<img src="' + u.avatar + '">' : (u.username || 'U')[0].toUpperCase();
            return '<div class="userRow" style="grid-column:1/3" onclick="location.href=\'profile.html?id=' + u._id + '\'"><div class="avatar">' + av + '</div><div><b>' + u.username + '</b><div style="font-size:12px;color:#a78bfa">@' + u.username + '</div></div></div>';
          }).join('');
        } catch (e) {
          hideLoading();
          grid.innerHTML = '<p style="grid-column:1/3;text-align:center">Search failed, try again</p>';
        }
      }
    }

    load();

    // MESSAGE BADGE - SAME AS BEFORE
    function getMyIdForBadge() {
      try {
        return JSON.parse(atob(token.split('.')[1])).id;
      } catch {
        return "";
      }
    }
    function getReadKeyForBadge(otherId) {
      return 'read_' + getMyIdForBadge() + '_' + otherId;
    }
    function getLastReadIdForBadge(otherId) {
      return localStorage.getItem(getReadKeyForBadge(otherId)) || '';
    }
    function updateMsgBadge(count) {
      const badge = document.getElementById('msgBadge');
      if (!badge) return;
      if (count > 0) {
        badge.style.display = 'flex';
        badge.innerText = count > 99 ? '99+' : count;
      } else {
        badge.style.display = 'none';
      }
    }
    async function checkMsgNotifications() {
      try {
        const meRes = await fetch(BASE + '/api/users/' + getMyIdForBadge(), { headers: { authorization: token } });
        const meData = await meRes.json();
        const me = meData.user || meData;
        let people = [...(me.followers || []), ...(me.following || [])];
        let seen = {};
        people = people.filter(p => {
          let id = p._id || p;
          if (seen[id]) return false;
          seen[id] = true;
          return id !== getMyIdForBadge();
        });
        let totalUnread = 0;
        for (const p of people) {
          const otherId = p._id || p;
          const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
          const msgs = await res.json();
          if (!Array.isArray(msgs) || !msgs.length) continue;
          const lastReadId = getLastReadIdForBadge(otherId);
          if (!lastReadId) {
            localStorage.setItem(getReadKeyForBadge(otherId), msgs[msgs.length - 1]._id);
            continue;
          }
          const idx = msgs.findIndex(m => m._id === lastReadId);
          if (idx === -1) {
            const lastMsg = msgs[msgs.length - 1];
            const fromId = lastMsg.from?._id || lastMsg.from;
            if (lastMsg._id !== lastReadId && fromId !== getMyIdForBadge()) {
              totalUnread += 1;
            }
          } else {
            const after = msgs.slice(idx + 1);
            for (const m of after) {
              const fromId = m.from?._id || m.from;
              if (fromId !== getMyIdForBadge()) totalUnread++;
            }
          }
        }
        updateMsgBadge(totalUnread);
      } catch (e) {}
    }
    checkMsgNotifications();
    setInterval(checkMsgNotifications, 3000);
  </script>
</body>
</html>
