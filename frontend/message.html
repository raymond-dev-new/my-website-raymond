<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
.top{height:60px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 16px;justify-content:space-between;background:#000;position:sticky;top:0;z-index:5}
.top-user{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.top-user b{font-size:16px}
.top-user b:hover{text-decoration:underline}
.top-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden}
.top-avatar img{width:100%;height:100%;object-fit:cover}
.list{flex:1;overflow-y:auto;padding:12px;background:#000}
.row{padding:14px 12px;display:flex;gap:12px;align-items:center;background:#111;border-radius:16px;margin-bottom:10px;cursor:pointer;position:relative}
.row:hover{background:#1a1a1a}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#ff3040;color:#fff;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 7px}
.badge.hide{display:none}
.total-badge{background:#ff3040;color:#fff;padding:3px 8px;border-radius:12px;font-size:12px;margin-left:8px;font-weight:700}
.chat{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
.chat.open{display:flex}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:2px;background:#000}
.bubble-wrap{max-width:78%;display:flex;flex-direction:column;margin-bottom:2px}
.bubble-wrap.me{align-self:flex-end;align-items:flex-end}
.bubble-wrap.other{align-self:flex-start}
.b{padding:11px 16px;border-radius:22px;font-size:15px;line-height:19px;word-break:break-word;position:relative;cursor:pointer;max-width:100%}
.b.me{background:linear-gradient(135deg,#0095f6,#0064e0);color:#fff;border-bottom-right-radius:6px}
.b.other{background:#262626;color:#fff;border-bottom-left-radius:6px}
.time-row{display:flex;align-items:center;gap:6px;margin:4px 8px 12px;font-size:11px;color:#8a8a8a}
.time-row.me{justify-content:flex-end}
.tick{font-size:12px}
.tick.read{color:#0095f6}
.seen-text{font-size:11px;color:#8a8a8a;margin:0 8px 12px;text-align:right}
.bar{padding:12px;border-top:1px solid #1e1e1e;display:flex;gap:10px;align-items:center;background:#000}
.bar input{flex:1;background:#1e1e1e;border:none;color:#fff;padding:13px 18px;border-radius:24px;outline:none;font-size:15px}
.send-btn{width:44px;height:44px;border-radius:50%;background:#0095f6;border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#262626;border-radius:16px;padding:8px;min-width:240px;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);border:1px solid #333}
.menu.open{display:block}
.menu div{padding:14px 16px;border-radius:10px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:center}
.menu div:hover{background:#333}
.menu.del{color:#ff3040}
.edit-box{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:20px}
.edit-box.open{display:flex}
.edit-card{background:#1a1a1a;width:100%;max-width:360px;border-radius:20px;padding:20px;border:1px solid #333}
.edit-card input{width:100%;background:#262626;border:none;padding:14px 16px;border-radius:12px;color:#fff;font-size:15px;outline:none;margin:12px 0}
.edit-card button{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin-top:8px}
.btn-save{background:#0095f6;color:#fff}
.btn-cancel{background:#262626;color:#fff}
</style>
</head>
<body>
<div class="top"><b>Messages <span id="totalUnread" class="total-badge" style="display:none">0</span></b><span onclick="location.href='feed.html'" style="cursor:pointer;font-size:22px">←</span></div>
<div class="list" id="list">Loading...</div>

<div class="chat" id="chat">
<div class="top">
  <!-- CLICK USERNAME AT TOP → GOES TO USER PAGE LIKE INSTAGRAM -->
  <div class="top-user" onclick="goToProfile()">
    <div class="top-avatar" id="topAvatar">U</div>
    <div>
      <b id="cName"></b>
      <div style="font-size:11px;color:#888">Tap to view profile</div>
    </div>
  </div>
  <span onclick="closeChat()" style="cursor:pointer;font-size:22px">✕</span>
</div>
<div class="msgs" id="msgs"></div>
<div id="seenIndicator" class="seen-text" style="display:none"></div>
<div class="bar"><input id="inp" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"><button class="send-btn" onclick="send()">➤</button></div>
</div>

<div class="menu" id="menu">
<div id="editOpt" onclick="startEdit()">✏️ Edit message</div>
<div class="del" id="delOpt" onclick="deleteMsg()">🗑️ Unsend for everyone</div>
<div onclick="closeMenu()">Cancel</div>
</div>

<div class="edit-box" id="editBox">
<div class="edit-card">
<b>Edit message</b>
<input id="editInput">
<button class="btn-save" onclick="saveEdit()">Save</button>
<button class="btn-cancel" onclick="document.getElementById('editBox').classList.remove('open')">Cancel</button>
</div>
</div>

<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href='/blog/login.html';
function myId(){try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""}}
const socket=io(BASE);
socket.on('connect',()=>socket.emit('join',myId()));

let active="", activeName="", activeAvatar="", unreadMap={}, selectedMsg=null, selectedIsMe=false;

function goToProfile(){
  if(!active) return;
  location.href = 'profile.html?id=' + active;
}

function formatTime(dateStr){
 const d=new Date(dateStr);
 const now=new Date();
 const isToday=d.toDateString()===now.toDateString();
 const yesterday=new Date(now); yesterday.setDate(now.getDate()-1);
 const isYesterday=d.toDateString()===yesterday.toDateString();
 let time=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 if(isToday) return `Today ${time}`;
 if(isYesterday) return `Yesterday ${time}`;
 return `${d.toLocaleDateString()} ${time}`;
}

async function loadUnread(){
 try{
  let r=await fetch(BASE+'/api/messages/unread/counts',{headers:{authorization:token}});
  unreadMap=await r.json();
  updateBadges();
 }catch{}
}
function updateBadges(){
 let total=0; Object.values(unreadMap).forEach(c=>total+=c);
 const tot=document.getElementById('totalUnread');
 if(total>0){tot.style.display='inline'; tot.innerText=total>99?'99+':total;} else tot.style.display='none';
 Object.keys(unreadMap).forEach(uid=>{
   const b=document.getElementById('badge-'+uid);
   if(b){ const c=unreadMap[uid]; if(c>0){b.innerText=c; b.classList.remove('hide');} else b.classList.add('hide'); }
 });
}

async function load(){
 const el=document.getElementById('list');
 try{
  let r=await fetch(BASE+'/api/users/'+myId());
  let d=await r.json();
  let users=d.user.following||[];
  if(!users.length){ let r2=await fetch(BASE+'/api/messages/users',{headers:{authorization:token}}); users=await r2.json(); }
  if(!users.length){ el.innerHTML='<p style="text-align:center;color:#777;margin-top:50px">No chats yet</p>'; return; }
  await loadUnread();
  el.innerHTML=users.map(u=>{
    const id=u._id||u; const name=u.username||'user'; const letter=name[0].toUpperCase(); const count=unreadMap[id]||0;
    const avatar = u.avatar? `<img src="${BASE+u.avatar}">` : letter;
    return `<div class="row" onclick="openC('${id}','${name}','${u.avatar||''}')"><div class="av">${avatar}</div><div><b>${name}</b><br><small style="color:#999">Tap to chat</small></div><div id="badge-${id}" class="badge ${count?'':'hide'}">${count}</div></div>`;
  }).join('');
 }catch(e){ el.innerHTML='Error: open via http://localhost:5000/blog/messages.html';}
}

function renderMsg(m){
 const isMe=(m.sender._id||m.sender)==myId();
 const edited=m.edited?'<span style="font-size:10px;opacity:.7"> (edited)</span>':'';
 const time=formatTime(m.createdAt);
 let tick='';
 if(isMe){ tick=m.read?`<span class="tick read">✓✓</span>`:`<span class="tick">✓</span>`; }
 return `<div class="bubble-wrap ${isMe?'me':'other'}" id="wrap-${m._id}">
  <div class="b ${isMe?'me':'other'}" data-id="${m._id}" data-text="${(m.text||'').replace(/"/g,'&quot;')}" data-me="${isMe}" onmousedown="pressStart(this)" onmouseup="pressEnd()" ontouchstart="pressStart(this)" ontouchend="pressEnd()" onclick="openMenuTap(this)">${m.text}${edited}</div>
  <div class="time-row ${isMe?'me':''}"><span>${time}</span> ${tick}</div>
 </div>`;
}

let msgsCache=[];
async function openC(id,name,avatar){
 active=id; activeName=name; activeAvatar=avatar;
 document.getElementById('cName').innerText=name;
 const topAv = document.getElementById('topAvatar');
 if(avatar) topAv.innerHTML = `<img src="${BASE+avatar}">`;
 else topAv.innerText = name[0].toUpperCase();

 document.getElementById('chat').classList.add('open');
 await fetch(BASE+'/api/messages/'+id+'/read',{method:'POST',headers:{authorization:token}});
 unreadMap[id]=0; updateBadges();
 let r=await fetch(BASE+'/api/messages/'+id,{headers:{authorization:token}});
 msgsCache=await r.json();
 renderAll();
}

function renderAll(){
 const container=document.getElementById('msgs');
 if(!msgsCache.length){ container.innerHTML='<div style="color:#666;text-align:center;margin-top:100px">No messages yet<br>Say hi 👋</div>'; document.getElementById('seenIndicator').style.display='none'; return; }
 container.innerHTML=msgsCache.map(m=>renderMsg(m)).join('');
 container.scrollTop=container.scrollHeight;
 const lastMe=[...msgsCache].reverse().find(m=>(m.sender._id||m.sender)==myId());
 const seenEl=document.getElementById('seenIndicator');
 if(lastMe && lastMe.read){ seenEl.innerText='Seen '+formatTime(lastMe.updatedAt||lastMe.createdAt); seenEl.style.display='block'; } else seenEl.style.display='none';
}

function closeChat(){ document.getElementById('chat').classList.remove('open'); active=""; }

function send(){
 let t=document.getElementById('inp').value.trim(); if(!t||!active) return;
 socket.emit('sendMessage',{sender:myId(),receiver:active,text:t});
 document.getElementById('inp').value='';
}

let longPressTimer=null;
function pressStart(el){ longPressTimer=setTimeout(()=>{ openMenu(el); longPressTimer=null; },500); }
function pressEnd(){ clearTimeout(longPressTimer); }
function openMenuTap(el){ if(longPressTimer===null) return; openMenu(el); }

function openMenu(el){
 selectedMsg=el.dataset.id;
 selectedIsMe=el.dataset.me==='true';
 document.getElementById('editInput').value=el.dataset.text;
 const editOpt=document.getElementById('editOpt');
 const delOpt=document.getElementById('delOpt');
 if(selectedIsMe){
   editOpt.style.display='flex';
   delOpt.innerHTML='🗑️ Unsend for everyone';
 } else {
   editOpt.style.display='none';
   delOpt.innerHTML='🗑️ Delete for everyone';
 }
 document.getElementById('menu').classList.add('open');
}
function closeMenu(){ document.getElementById('menu').classList.remove('open'); }
function startEdit(){
 if(!selectedIsMe) return;
 closeMenu(); document.getElementById('editBox').classList.add('open');
}
async function saveEdit(){
 let newText=document.getElementById('editInput').value.trim(); if(!newText) return;
 await fetch(BASE+'/api/messages/msg/'+selectedMsg,{method:'PUT',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify({text:newText})});
 document.getElementById('editBox').classList.remove('open');
}
async function deleteMsg(){
 const msg = selectedIsMe? 'Unsend this message for everyone?' : 'Delete this message for everyone?';
 if(!confirm(msg)) return;
 closeMenu();
 await fetch(BASE+'/api/messages/msg/'+selectedMsg,{method:'DELETE',headers:{authorization:token}});
}

socket.on('receiveMessage',m=>{
 let senderId=m.sender._id||m.sender; let receiverId=m.receiver._id||m.receiver;
 if(senderId==active || receiverId==active){
  msgsCache.push(m);
  renderAll();
  if(senderId!=myId()) fetch(BASE+'/api/messages/'+active+'/read',{method:'POST',headers:{authorization:token}});
 } else if(receiverId==myId()){
  unreadMap[senderId]=(unreadMap[senderId]||0)+1; updateBadges();
 }
});
socket.on('messageEdited',m=>{
 let idx=msgsCache.findIndex(x=>x._id==m._id);
 if(idx>-1){ msgsCache[idx]=m; renderAll(); }
});
socket.on('messageDeleted',data=>{
 msgsCache=msgsCache.filter(x=>x._id!=data._id);
 renderAll();
});
socket.on('messagesSeen',()=>{
 msgsCache.forEach(m=>{ if((m.sender._id||m.sender)==myId()) m.read=true; });
 renderAll();
});

load();
setInterval(loadUnread,3000);
</script>
</body>
</html>
