now save the message to storage while its updating in backgroung so its does not have to show load people everytime that can be annoying and when i visit the message box let me see new message immediately <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0a12;
      color: #fff;
      font-family: Arial;
      padding-bottom: 90px;
    }
    .top {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list { max-width: 600px; margin: 0 auto; }
    .row {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      align-items: center;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat { max-width: 600px; margin: 0 auto; padding: 0 16px; display: none; }
    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 18px;
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.4;
    }
    .mine { background: linear-gradient(90deg, #7c3aed, #ec4899); margin-left: auto; }
    .theirs { background: #26262f; }
    .inputRow {
      position: fixed;
      bottom: 72px;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      display: none;
      gap: 8px;
      padding: 10px;
      background: #0a0a12;
    }
    .inputRow input {
      flex: 1;
      background: #1e1e2a;
      border: 1px solid #333;
      border-radius: 24px;
      color: #fff;
      padding: 13px;
      outline: none;
    }
    .inputRow button {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 0 20px;
      font-weight: 700;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 18, .95);
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
    }
    .nav a { color: #fff; text-decoration: none; font-size: 22px; }

    /* ADDED ONLY - delete, profile header, badge */
    .msgWrap { position: relative; display: flex; flex-direction: column; }
    .msgWrap.mine { align-items: flex-end; }
    .msgWrap.theirs { align-items: flex-start; }
    .delBtn {
      background: rgba(0, 0, 0, .25);
      color: #fff;
      border: none;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 3px;
      opacity: .7;
    }
    .chatHeaderInfo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .chatHeaderInfo .avatar { width: 36px; height: 36px; font-size: 14px; }
    .msgBadge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .navMsg { position: relative; }

    /* ADDED ONLY - For recent chat sorting + per-chat unread badge */
    .rowInfo { flex: 1; min-width: 0; }
    .rowTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rowPreview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .rowPreview.unread { color: #fff; font-weight: 700; }
    .rowTime { font-size: 11px; color: #777; flex-shrink: 0; }
    .chatUnread {
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      margin-left: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- TOP BAR : Shows "Messages" or the name of the person you are chatting with -->
  <div class="top">
    <!-- Clicking this name/avatar opens that person's profile page -->
    <div class="chatHeaderInfo" id="chatHeaderInfo" onclick="goToChatProfile()">
      <b id="topTitle">💬 Messages</b>
      <span id="chatHeaderAvatar" style="display: none;"></span>
    </div>
    <span onclick="showList()" style="cursor: pointer; display: none;" id="backBtn">← Back</span>
  </div>

  <!-- LIST OF PEOPLE YOU CAN CHAT WITH -->
  <div class="list" id="peopleList">
    <p style="text-align: center; color: #777; padding: 30px;">Loading people...</p>
  </div>

  <!-- CHAT MESSAGES WILL SHOW HERE -->
  <div class="chat" id="chatBox"></div>

  <!-- INPUT BOX AT BOTTOM TO TYPE MESSAGE -->
  <div class="inputRow" id="inputRow">
    <input id="msgInput" placeholder="Type private message..." onkeydown="if(event.key === 'Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <!-- 💬 button has a red badge that shows total unread messages -->
    <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
    <a href="diary.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

  <script>
    // ============================================================
    // 1. SETUP - Server address + login token
    // ============================================================
    const BASE = "https://raymonddomain.dev";
    const token = localStorage.getItem('token');
    if (!token) location.href = "login.html";

    // Get my own user ID from the token (token is like xxx.YYY.zzz, YYY holds my id)
    function getMyId() {
      try {
        return JSON.parse(atob(token.split('.')[1])).id;
      } catch {
        return "";
      }
    }

    // ============================================================
    // 2. VARIABLES WE USE TO REMEMBER STATE
    // ============================================================
    let chatWith = null; // ID of person I am currently chatting with, null = I am in list view
    let chatWithName = ''; // Name of person I am chatting with
    let chatWithAvatar = ''; // Avatar of person I am chatting with
    let peopleCache = []; // List of all followers + following (people I can chat with)
    let chatMeta = {}; // For each person: { lastText, lastTime, unread }
    // chatMeta example: { "user123": { lastText: "hello", lastTime: 123456, unread: 2 } }

    // We save "what I have already read" inside localStorage so it survives refresh.
    // Key = "read_" + myId + "_" + otherPersonId, Value = ID of last message I saw
    function getReadKey(otherId) {
      return 'read_' + getMyId() + '_' + otherId;
    }
    function getLastReadId(otherId) {
      return localStorage.getItem(getReadKey(otherId)) || '';
    }
    function saveLastReadId(otherId, msgId) {
      if (msgId) localStorage.setItem(getReadKey(otherId), msgId);
    }

    // ============================================================
    // 3. LOAD PEOPLE - Get followers + following from my profile
    // ============================================================
    async function loadPeople() {
      // Get my profile to find my followers and following
      const meRes = await fetch(BASE + '/api/users/' + getMyId(), { headers: { authorization: token } });
      const meData = await meRes.json();
      const me = meData.user || meData;

      // Combine followers + following into one list
      let people = [...(me.followers || []), ...(me.following || [])];

      // Remove duplicates and remove myself
      let seen = {};
      people = people.filter(p => {
        let id = p._id || p;
        if (seen[id]) return false;
        seen[id] = true;
        return id !== getMyId();
      });

      peopleCache = people;

      if (!people.length) {
        document.getElementById('peopleList').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No one yet.<br>Follow someone to chat privately.</p>';
        return;
      }

      // First show list quickly (without last message), then we will fetch last messages and re-sort
      renderPeopleList();

      // Now fetch last message for each person to sort by recent + show unread
      await refreshRecentAndUnread();

      // If I came from profile with ?to=USER_ID, open that chat directly
      const to = new URLSearchParams(location.search).get('to');
      if (to) {
        const found = people.find(p => (p._id || p) === to);
        openChat(to, found?.username || 'Chat');
      }
    }

    // ============================================================
    // 4. RENDER PEOPLE LIST - Sorted by most recent chat at top
    // ============================================================
    function renderPeopleList() {
      // Make a copy and sort it: person with newest lastTime comes first
      // If person has never chatted, lastTime = 0, so they stay at bottom
      let sorted = [...peopleCache].sort((a, b) => {
        const idA = a._id || a;
        const idB = b._id || b;
        const timeA = chatMeta[idA]?.lastTime || 0;
        const timeB = chatMeta[idB]?.lastTime || 0;
        return timeB - timeA; // biggest time first = most recent at top
      });

      document.getElementById('peopleList').innerHTML = sorted.map(p => {
        const id = p._id || p;
        const name = p.username || id;
        const av = p.avatar ? '<img src="' + p.avatar + '">' : name[0].toUpperCase();
        const meta = chatMeta[id] || {};
        const preview = meta.lastText || 'Tap to chat privately';
        const timeText = meta.lastTime ? formatTime(meta.lastTime) : '';
        const unread = meta.unread || 0;
        // Show red badge on this row if this person sent unread messages
        const unreadHtml = unread > 0 ? '<span class="chatUnread">' + unread + '</span>' : '';
        // Make preview bold if unread
        const previewClass = unread > 0 ? 'rowPreview unread' : 'rowPreview';

        // Avatar click = go to profile, Row click = open chat
        return '<div class="row" onclick="openChat(\'' + id + '\',\'' + name + '\')">'
          + '<div class="avatar" onclick="event.stopPropagation(); location.href=\'profile.html?id=' + id + '\'">' + av + '</div>'
          + '<div class="rowInfo"><div class="rowTop"><b>' + name + '</b><span class="rowTime">' + timeText + '</span></div>'
          + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="' + previewClass + '">' + escapeHtml(preview) + '</span>' + unreadHtml + '</div></div>'
          + '</div>';
      }).join('');
    }

    // Small helper: stop < > breaking the preview text
    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Small helper: show time like "10:45" if today, else "12 Nov"
    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    }

    // ============================================================
    // 5. OPEN CHAT - When I tap a person
    // ============================================================
    async function openChat(id, name) {
      chatWith = id;
      chatWithName = name;

      const found = peopleCache.find(p => (p._id || p) === id);
      chatWithAvatar = found?.avatar || '';

      // Hide list, show chat + input
      document.getElementById('peopleList').style.display = 'none';
      document.getElementById('chatBox').style.display = 'block';
      document.getElementById('inputRow').style.display = 'flex';
      document.getElementById('topTitle').innerText = '💬 ' + name;

      // Show avatar in top bar
      const avEl = document.getElementById('chatHeaderAvatar');
      avEl.style.display = 'flex';
      avEl.className = 'avatar';
      avEl.innerHTML = chatWithAvatar ? '<img src="' + chatWithAvatar + '">' : name[0].toUpperCase();

      document.getElementById('backBtn').style.display = 'block';

      // Mark this chat as read: unread = 0 for this person
      if (chatMeta[id]) chatMeta[id].unread = 0;
      updateBadge();

      // Load messages for this person
      await loadMessages();

      // After loading, save "I have read up to the last message" so badge does not come back
      const msgs = await getMessagesFor(id);
      if (msgs.length) {
        saveLastReadId(id, msgs[msgs.length - 1]._id);
        if (chatMeta[id]) chatMeta[id].unread = 0;
        updateBadge();
      }
    }

    // Helper: fetch messages for one person
    async function getMessagesFor(otherId) {
      try {
        const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
        const msgs = await res.json();
        return Array.isArray(msgs) ? msgs : [];
      } catch {
        return [];
      }
    }

    // ============================================================
    // 6. LOAD MESSAGES - Show all messages in open chat
    // ============================================================
    async function loadMessages() {
      if (!chatWith) return;
      const msgs = await getMessagesFor(chatWith);

      // Mark as read in our memory + localStorage
      if (msgs.length) {
        saveLastReadId(chatWith, msgs[msgs.length - 1]._id);
        if (chatMeta[chatWith]) chatMeta[chatWith].unread = 0;
        updateBadge();
      }

      document.getElementById('chatBox').innerHTML = msgs.length ? msgs.map(m => {
        const isMine = (m.from?._id || m.from) === getMyId();
        // Only my messages get a Delete button
        const del = isMine ? '<button class="delBtn" onclick="deleteMsg(event,\'' + m._id + '\')">🗑️ Delete</button>' : '';
        return '<div class="msgWrap ' + (isMine ? 'mine' : 'theirs') + '"><div class="msg ' + (isMine ? 'mine' : 'theirs') + '">' + m.text + '</div>' + del + '</div>';
      }).join('') : '<p style="text-align:center;color:#777;padding:30px">No messages yet. Say hello! 👋</p>';

      window.scrollTo(0, document.body.scrollHeight);
    }

    // ============================================================
    // 7. SEND MESSAGE
    // ============================================================
    async function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      // Send to server
      await fetch(BASE + '/api/messages/' + chatWith, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', authorization: token },
        body: JSON.stringify({ text })
      });

      // Reload messages + update recent list (so this chat jumps to top)
      await loadMessages();
      await refreshRecentAndUnread();
    }

    // ============================================================
    // 8. BACK TO LIST
    // ============================================================
    function showList() {
      document.getElementById('peopleList').style.display = 'block';
      document.getElementById('chatBox').style.display = 'none';
      document.getElementById('inputRow').style.display = 'none';
      document.getElementById('topTitle').innerText = '💬 Messages';
      document.getElementById('chatHeaderAvatar').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      chatWith = null;
      chatWithName = '';
      // Refresh list so order + unread are correct
      refreshRecentAndUnread();
    }

    // ============================================================
    // 9. DELETE MESSAGE - Deletes from chat AND from database
    // ============================================================
    async function deleteMsg(e, msgId) {
      e.stopPropagation();
      if (!confirm('Delete this message? It will be deleted for everyone.')) return;

      // 1. Remove instantly from screen so it feels fast
      const wrap = e.target.closest('.msgWrap');
      if (wrap) wrap.remove();

      // 2. Delete from DATABASE on server
      try {
        const res = await fetch(BASE + '/api/messages/' + msgId, {
          method: 'DELETE',
          headers: { authorization: token }
        });
        if (!res.ok) {
          alert('Could not delete from server. Please try again.');
          if (chatWith) loadMessages();
        } else {
          // Update recent list after delete (last message may have changed)
          refreshRecentAndUnread();
        }
      } catch (err) {
        alert('Could not delete. Check connection.');
        if (chatWith) loadMessages();
      }
    }

    // ============================================================
    // 10. CLICK PROFILE IN CHAT - Go to that person's profile page
    // ============================================================
    function goToChatProfile() {
      if (chatWith) location.href = 'profile.html?id=' + chatWith;
    }

    // ============================================================
    // 11. NOTIFICATION BADGE - Red number on 💬 button
    // ============================================================
    function updateBadge() {
      // Add up unread from all chats
      let total = 0;
      for (const id in chatMeta) {
        total += chatMeta[id].unread || 0;
      }
      const badge = document.getElementById('msgBadge');
      if (total > 0) {
        badge.style.display = 'flex';
        badge.innerText = total > 99 ? '99+' : total;
      } else {
        badge.style.display = 'none';
      }
    }

    // ============================================================
    // 12. RECENT + UNREAD - The heart of notification + sorting
    // How it works:
    // - For each person, we fetch their messages
    // - Last message tells us: preview text, time, and who sent it
    // - We compare last message ID with the ID we saved as "read"
    // - Any messages AFTER the saved ID that are FROM THEM = unread
    // - Then we re-sort list so most recent is at top
    // ============================================================
    async function refreshRecentAndUnread() {
      if (!peopleCache.length) return;

      for (const p of peopleCache) {
        const id = p._id || p;
        const msgs = await getMessagesFor(id);
        if (!msgs.length) {
          if (!chatMeta[id]) chatMeta[id] = { lastText: '', lastTime: 0, unread: 0 };
          continue;
        }

        const lastMsg = msgs[msgs.length - 1];
        const lastTime = lastMsg.createdAt ? new Date(lastMsg.createdAt).getTime() : Date.now();
        const lastText = (lastMsg.from?._id || lastMsg.from) === getMyId() ? 'You: ' + lastMsg.text : lastMsg.text;

        // Count unread: find where I last stopped reading, count messages after that from THEM
        const lastReadId = getLastReadId(id);
        let unread = 0;
        if (id === chatWith) {
          // If I am inside this chat right now, it is read = 0 unread
          unread = 0;
          saveLastReadId(id, lastMsg._id);
        } else if (!lastReadId) {
          // I have never opened this chat: if last message is from them, count it as unread?
          // To avoid old messages showing as new on first load, we treat first load as read
          // UNLESS we already have meta for this person (meaning new message arrived after first load)
          if (chatMeta[id] && chatMeta[id].lastText) {
            // We have seen this chat before, so this is a NEW message
            unread = msgs.filter(m => (m.from?._id || m.from) !== getMyId()).length;
            // Simpler: count only messages after our old last message
            // We use last seen message id stored in chatMeta
            const oldLastId = chatMeta[id].lastMsgId;
            if (oldLastId) {
              const idx = msgs.findIndex(m => m._id === oldLastId);
              if (idx !== -1) {
                unread = msgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
              }
            }
          } else {
            unread = 0;
            saveLastReadId(id, lastMsg._id);
          }
        } else {
          // Normal case: find my last read message, count messages after it from them
          const idx = msgs.findIndex(m => m._id === lastReadId);
          if (idx === -1) {
            // My last read message was deleted or not found, count all from them after?
            // If last message is from them and it's not the one I read, count 1+
            unread = msgs.filter(m => (m.from?._id || m.from) !== getMyId()).length > 0 && lastMsg._id !== lastReadId ? msgs.filter(m => (m.from?._id || m.from) !== getMyId()).length : 0;
            // Better: if last message is new and from them, at least 1 unread
            if (lastMsg._id !== lastReadId && (lastMsg.from?._id || lastMsg.from) !== getMyId()) {
              unread = Math.max(1, unread);
            } else {
              unread = 0;
            }
          } else {
            // Count messages after idx that are from THEM (not me)
            unread = msgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
          }
        }

        chatMeta[id] = {
          lastText: lastText,
          lastTime: lastTime,
          lastMsgId: lastMsg._id,
          unread: unread
        };
      }

      // Update badge + re-sort list if we are in list view
      updateBadge();
      if (!chatWith) renderPeopleList();
    }

    // ============================================================
    // 13. START + AUTO-REFRESH
    // ============================================================
    // Load people once at start
    loadPeople();

    // Every 3 seconds:
    // - If I am inside a chat, reload that chat (so new messages appear instantly)
    // - If I am in list, check for new messages + re-sort
    setInterval(async () => {
      if (chatWith) {
        await loadMessages();
        await refreshRecentAndUnread();
      } else {
        await refreshRecentAndUnread();
      }
    }, 3000);
  </script>
</body>
</html>
