<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0a12;
      color: #fff;
      font-family: Arial;
      padding-bottom: 90px;
    }
    .top {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list { max-width: 600px; margin: 0 auto; }
    .row {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      align-items: center;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat { max-width: 600px; margin: 0 auto; padding: 0 16px; display: none; }
    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 18px;
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.4;
    }
    .mine { background: linear-gradient(90deg, #7c3aed, #ec4899); margin-left: auto; }
    .theirs { background: #26262f; }
    .inputRow {
      position: fixed;
      bottom: 72px;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      display: none;
      gap: 8px;
      padding: 10px;
      background: #0a0a12;
    }
    .inputRow input {
      flex: 1;
      background: #1e1e2a;
      border: 1px solid #333;
      border-radius: 24px;
      color: #fff;
      padding: 13px;
      outline: none;
    }
    .inputRow button {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 0 20px;
      font-weight: 700;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 18, .95);
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
    }
    .nav a { color: #fff; text-decoration: none; font-size: 22px; }

    /* ADDED ONLY - delete, profile header, badge */
    .msgWrap { position: relative; display: flex; flex-direction: column; }
    .msgWrap.mine { align-items: flex-end; }
    .msgWrap.theirs { align-items: flex-start; }
    .delBtn {
      background: rgba(0, 0, 0, .25);
      color: #fff;
      border: none;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 3px;
      opacity: .7;
    }
    .chatHeaderInfo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .chatHeaderInfo .avatar { width: 36px; height: 36px; font-size: 14px; }
    .msgBadge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .navMsg { position: relative; }

    /* ADDED ONLY - For recent chat sorting + per-chat unread badge */
    .rowInfo { flex: 1; min-width: 0; }
    .rowTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rowPreview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .rowPreview.unread { color: #fff; font-weight: 700; }
    .rowTime { font-size: 11px; color: #777; flex-shrink: 0; }
    .chatUnread {
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      margin-left: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- TOP BAR : Shows "Messages" or the name of the person you are chatting with -->
  <div class="top">
    <!-- Clicking this name/avatar opens that person's profile page -->
    <div class="chatHeaderInfo" id="chatHeaderInfo" onclick="goToChatProfile()">
      <b id="topTitle">💬 Messages</b>
      <span id="chatHeaderAvatar" style="display: none;"></span>
    </div>
    <span onclick="showList()" style="cursor: pointer; display: none;" id="backBtn">← Back</span>
  </div>

  <!-- LIST OF PEOPLE YOU CAN CHAT WITH -->
  <div class="list" id="peopleList">
    <p style="text-align: center; color: #777; padding: 30px;">Loading people...</p>
  </div>

  <!-- CHAT MESSAGES WILL SHOW HERE -->
  <div class="chat" id="chatBox"></div>

  <!-- INPUT BOX AT BOTTOM TO TYPE MESSAGE -->
  <div class="inputRow" id="inputRow">
    <input id="msgInput" placeholder="Type private message..." onkeydown="if(event.key === 'Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <!-- 💬 button has a red badge that shows total unread messages -->
    <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
    <a href="diary.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

  <script>
    // ============================================================
    // 1. SETUP - Server address + login token
    // ============================================================
    const BASE = "https://raymonddomain.dev";
    const token = localStorage.getItem('token');
    if (!token) location.href = "login.html";

    // Get my own user ID from the token (token is like xxx.YYY.zzz, YYY holds my id)
    function getMyId() {
      try {
        return JSON.parse(atob(token.split('.')[1])).id;
      } catch {
        return "";
      }
    }

    // ============================================================
    // 2. VARIABLES WE USE TO REMEMBER STATE
    // ============================================================
    let chatWith = null; // ID of person I am currently chatting with, null = I am in list view
    let chatWithName = ''; // Name of person I am chatting with
    let chatWithAvatar = ''; // Avatar of person I am chatting with
    let peopleCache = []; // List of all followers + following (people I can chat with)
    let chatMeta = {}; // For each person: { lastText, lastTime, unread, lastMsgId }
    // chatMeta example: { "user123": { lastText: "hello", lastTime: 123456, unread: 2 } }
    let lastRenderedListHtml = ''; // To avoid re-rendering list if nothing changed (no flicker)
    let lastRenderedChatHtml = ''; // To avoid re-rendering chat if nothing changed

    // ============================================================
    // 2B. NEW - STORAGE / CACHE HELPERS
    // Idea: Save everything to localStorage so next visit shows INSTANTLY
    // without waiting for server. Then we update in background silently.
    // Keys are per-user so two accounts on same phone don't mix.
    // ============================================================

    // Key for people list, e.g. "msg_people_123"
    function getPeopleCacheKey() {
      return 'msg_people_' + getMyId();
    }
    // Key for chatMeta (last message + unread), e.g. "msg_meta_123"
    function getMetaCacheKey() {
      return 'msg_meta_' + getMyId();
    }
    // Key for messages of ONE person, e.g. "msg_chat_123_456"
    function getChatCacheKey(otherId) {
      return 'msg_chat_' + getMyId() + '_' + otherId;
    }

    // Save people list to storage
    function savePeopleToStorage() {
      try {
        localStorage.setItem(getPeopleCacheKey(), JSON.stringify(peopleCache));
      } catch (e) {}
    }

    // Save chatMeta (recent + unread) to storage
    function saveMetaToStorage() {
      try {
        localStorage.setItem(getMetaCacheKey(), JSON.stringify(chatMeta));
      } catch (e) {}
    }

    // Save messages of ONE chat to storage
    function saveMessagesToStorage(otherId, msgs) {
      try {
        localStorage.setItem(getChatCacheKey(otherId), JSON.stringify(msgs));
      } catch (e) {}
    }

    // Load saved messages for ONE chat from storage (instant, no internet needed)
    function loadMessagesFromStorage(otherId) {
      try {
        const raw = localStorage.getItem(getChatCacheKey(otherId));
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    // Load saved people + meta from storage at start, so screen shows immediately
    function loadCacheAtStart() {
      try {
        // 1. People
        const peopleRaw = localStorage.getItem(getPeopleCacheKey());
        if (peopleRaw) {
          const parsed = JSON.parse(peopleRaw);
          if (Array.isArray(parsed) && parsed.length) {
            peopleCache = parsed;
          }
        }
        // 2. Meta (last message, time, unread)
        const metaRaw = localStorage.getItem(getMetaCacheKey());
        if (metaRaw) {
          const parsed = JSON.parse(metaRaw);
          if (parsed && typeof parsed === 'object') {
            chatMeta = parsed;
          }
        }
      } catch (e) {}
    }

    // We save "what I have already read" inside localStorage so it survives refresh.
    // Key = "read_" + myId + "_" + otherPersonId, Value = ID of last message I saw
    function getReadKey(otherId) {
      return 'read_' + getMyId() + '_' + otherId;
    }
    function getLastReadId(otherId) {
      return localStorage.getItem(getReadKey(otherId)) || '';
    }
    function saveLastReadId(otherId, msgId) {
      if (msgId) localStorage.setItem(getReadKey(otherId), msgId);
    }

    // ============================================================
    // 3. LOAD PEOPLE - Get followers + following from my profile
    // NEW BEHAVIOUR:
    // - If we have saved people in storage, show them INSTANTLY (no "Loading...")
    // - Then fetch fresh people in BACKGROUND, update screen only if changed
    // ============================================================
    async function loadPeople() {
      // STEP A: Show saved cache instantly, if any
      loadCacheAtStart();
      if (peopleCache.length) {
        renderPeopleList();
        updateBadge();
        // If user came with ?to=ID, open that chat instantly from cache too
        const toEarly = new URLSearchParams(location.search).get('to');
        if (toEarly) {
          const foundEarly = peopleCache.find(p => (p._id || p) === toEarly);
          // Open chat now (it will show cached messages instantly), background will refresh after
          openChat(toEarly, foundEarly?.username || 'Chat');
        }
      }

      // STEP B: Fetch fresh people in BACKGROUND (no loading text, no flicker)
      try {
        const meRes = await fetch(BASE + '/api/users/' + getMyId(), { headers: { authorization: token } });
        const meData = await meRes.json();
        const me = meData.user || meData;

        // Combine followers + following into one list
        let people = [...(me.followers || []), ...(me.following || [])];

        // Remove duplicates and remove myself
        let seen = {};
        people = people.filter(p => {
          let id = p._id || p;
          if (seen[id]) return false;
          seen[id] = true;
          return id !== getMyId();
        });

        peopleCache = people;
        savePeopleToStorage(); // Save new list so next visit is instant

        if (!people.length) {
          document.getElementById('peopleList').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No one yet.<br>Follow someone to chat privately.</p>';
          return;
        }

        // Show list (will only re-render if changed, see renderPeopleList)
        renderPeopleList();

        // Now fetch last message for each person in background to sort by recent + show unread
        await refreshRecentAndUnread(true); // true = silent background mode

        // If I came from profile with ?to=USER_ID and we didn't already open from cache, open now
        const to = new URLSearchParams(location.search).get('to');
        if (to && !chatWith) {
          const found = people.find(p => (p._id || p) === to);
          openChat(to, found?.username || 'Chat');
        }
      } catch (e) {
        // If internet fails, we still have cache shown above, so just stay on cache
        if (!peopleCache.length) {
          document.getElementById('peopleList').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No connection. Pull to refresh.</p>';
        }
      }
    }

    // ============================================================
    // 4. RENDER PEOPLE LIST - Sorted by most recent chat at top
    // NEW: Only re-render if HTML actually changed, so no flicker
    // ============================================================
    function renderPeopleList() {
      // Make a copy and sort it: person with newest lastTime comes first
      // If person has never chatted, lastTime = 0, so they stay at bottom
      let sorted = [...peopleCache].sort((a, b) => {
        const idA = a._id || a;
        const idB = b._id || b;
        const timeA = chatMeta[idA]?.lastTime || 0;
        const timeB = chatMeta[idB]?.lastTime || 0;
        return timeB - timeA; // biggest time first = most recent at top
      });

      const html = sorted.map(p => {
        const id = p._id || p;
        const name = p.username || id;
        const av = p.avatar ? '<img src="' + p.avatar + '">' : name[0].toUpperCase();
        const meta = chatMeta[id] || {};
        const preview = meta.lastText || 'Tap to chat privately';
        const timeText = meta.lastTime ? formatTime(meta.lastTime) : '';
        const unread = meta.unread || 0;
        // Show red badge on this row if this person sent unread messages
        const unreadHtml = unread > 0 ? '<span class="chatUnread">' + unread + '</span>' : '';
        // Make preview bold if unread
        const previewClass = unread > 0 ? 'rowPreview unread' : 'rowPreview';

        // Avatar click = go to profile, Row click = open chat
        return '<div class="row" onclick="openChat(\'' + id + '\',\'' + name + '\')">'
          + '<div class="avatar" onclick="event.stopPropagation(); location.href=\'profile.html?id=' + id + '\'">' + av + '</div>'
          + '<div class="rowInfo"><div class="rowTop"><b>' + name + '</b><span class="rowTime">' + timeText + '</span></div>'
          + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="' + previewClass + '">' + escapeHtml(preview) + '</span>' + unreadHtml + '</div></div>'
          + '</div>';
      }).join('');

      // NEW: If HTML is same as before, don't touch DOM (prevents flicker / scroll jump)
      if (html === lastRenderedListHtml) return;
      lastRenderedListHtml = html;
      document.getElementById('peopleList').innerHTML = html;
    }

    // Small helper: stop < > breaking the preview text
    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Small helper: show time like "10:45" if today, else "12 Nov"
    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    }

    // ============================================================
    // 5. OPEN CHAT - When I tap a person
    // NEW: Shows saved messages INSTANTLY, then updates in background
    // ============================================================
    async function openChat(id, name) {
      chatWith = id;
      chatWithName = name;

      const found = peopleCache.find(p => (p._id || p) === id);
      chatWithAvatar = found?.avatar || '';

      // Hide list, show chat + input
      document.getElementById('peopleList').style.display = 'none';
      document.getElementById('chatBox').style.display = 'block';
      document.getElementById('inputRow').style.display = 'flex';
      document.getElementById('topTitle').innerText = '💬 ' + name;

      // Show avatar in top bar
      const avEl = document.getElementById('chatHeaderAvatar');
      avEl.style.display = 'flex';
      avEl.className = 'avatar';
      avEl.innerHTML = chatWithAvatar ? '<img src="' + chatWithAvatar + '">' : name[0].toUpperCase();

      document.getElementById('backBtn').style.display = 'block';

      // Mark this chat as read: unread = 0 for this person
      if (chatMeta[id]) chatMeta[id].unread = 0;
      updateBadge();
      saveMetaToStorage();

      // NEW STEP 1: Show cached messages INSTANTLY (no waiting for server)
      const cached = loadMessagesFromStorage(id);
      if (cached.length) {
        renderChatMessages(cached);
        // Mark cached as read too
        saveLastReadId(id, cached[cached.length - 1]._id);
      } else {
        // No cache yet, show empty state quickly while fetch runs
        document.getElementById('chatBox').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No messages yet. Say hello! 👋</p>';
        lastRenderedChatHtml = '';
      }

      // NEW STEP 2: Fetch fresh messages in BACKGROUND and update if new
      await loadMessages(true);
    }

    // Helper: fetch messages for one person from SERVER
    async function getMessagesFor(otherId) {
      try {
        const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
        const msgs = await res.json();
        return Array.isArray(msgs) ? msgs : [];
      } catch {
        return [];
      }
    }

    // Helper: draw messages on screen, only if changed (no flicker)
    function renderChatMessages(msgs) {
      const html = msgs.length ? msgs.map(m => {
        const isMine = (m.from?._id || m.from) === getMyId();
        // Only my messages get a Delete button
        const del = isMine ? '<button class="delBtn" onclick="deleteMsg(event,\'' + m._id + '\')">🗑️ Delete</button>' : '';
        return '<div class="msgWrap ' + (isMine ? 'mine' : 'theirs') + '"><div class="msg ' + (isMine ? 'mine' : 'theirs') + '">' + m.text + '</div>' + del + '</div>';
      }).join('') : '<p style="text-align:center;color:#777;padding:30px">No messages yet. Say hello! 👋</p>';

      if (html === lastRenderedChatHtml) return; // Nothing new, don't re-render
      lastRenderedChatHtml = html;
      document.getElementById('chatBox').innerHTML = html;

      // Only scroll to bottom if new message arrived or first load
      // We check if user is already near bottom, so reading old messages doesn't jump
      window.scrollTo(0, document.body.scrollHeight);
    }

    // ============================================================
    // 6. LOAD MESSAGES - Show all messages in open chat
    // silent = true means: update in background, don't show loading
    // ============================================================
    async function loadMessages(silent) {
      if (!chatWith) return;

      // Fetch fresh from server
      const msgs = await getMessagesFor(chatWith);
      if (!msgs) return;

      // If server returned empty but we have cache, keep cache (avoid wiping on error)
      // getMessagesFor already returns [] on error, so check: if msgs empty AND cache has data, keep cache
      const cached = loadMessagesFromStorage(chatWith);
      if (msgs.length === 0 && cached.length > 0) {
        // Could be real delete-all, or could be network hiccup.
        // We keep cache to avoid flash, next poll will confirm.
        return;
      }

      // Save fresh to storage so next visit is instant
      saveMessagesToStorage(chatWith, msgs);

      // Mark as read in our memory + localStorage
      if (msgs.length) {
        saveLastReadId(chatWith, msgs[msgs.length - 1]._id);
        if (chatMeta[chatWith]) {
          chatMeta[chatWith].unread = 0;
          chatMeta[chatWith].lastText = ((msgs[msgs.length - 1].from?._id || msgs[msgs.length - 1].from) === getMyId() ? 'You: ' : '') + msgs[msgs.length - 1].text;
          chatMeta[chatWith].lastTime = msgs[msgs.length - 1].createdAt ? new Date(msgs[msgs.length - 1].createdAt).getTime() : Date.now();
          chatMeta[chatWith].lastMsgId = msgs[msgs.length - 1]._id;
          saveMetaToStorage();
        }
        updateBadge();
      }

      renderChatMessages(msgs);
    }

    // ============================================================
    // 7. SEND MESSAGE
    // NEW: Show my message instantly (optimistic) + save to storage,
    // then send to server in background. Feels instant like WhatsApp.
    // ============================================================
    async function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      // STEP 1: Show my message instantly from local data
      const tempMsg = {
        _id: 'temp_' + Date.now(),
        from: getMyId(),
        text: text,
        createdAt: new Date().toISOString()
      };
      const cached = loadMessagesFromStorage(chatWith);
      cached.push(tempMsg);
      saveMessagesToStorage(chatWith, cached);
      renderChatMessages(cached);

      // STEP 2: Send to server in background
      try {
        await fetch(BASE + '/api/messages/' + chatWith, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', authorization: token },
          body: JSON.stringify({ text })
        });
      } catch (e) {}

      // STEP 3: Refresh from server to replace temp message with real one (with real _id)
      await loadMessages(true);
      await refreshRecentAndUnread(true);
    }

    // ============================================================
    // 8. BACK TO LIST
    // ============================================================
    function showList() {
      document.getElementById('peopleList').style.display = 'block';
      document.getElementById('chatBox').style.display = 'none';
      document.getElementById('inputRow').style.display = 'none';
      document.getElementById('topTitle').innerText = '💬 Messages';
      document.getElementById('chatHeaderAvatar').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      chatWith = null;
      chatWithName = '';
      lastRenderedChatHtml = ''; // Reset so next chat renders fresh
      // Refresh list so order + unread are correct (background, silent)
      refreshRecentAndUnread(true);
    }

    // ============================================================
    // 9. DELETE MESSAGE - Deletes from chat AND from database
    // NEW: Also removes from storage instantly
    // ============================================================
    async function deleteMsg(e, msgId) {
      e.stopPropagation();
      if (!confirm('Delete this message? It will be deleted for everyone.')) return;

      // 1. Remove instantly from screen so it feels fast
      const wrap = e.target.closest('.msgWrap');
      if (wrap) wrap.remove();
      lastRenderedChatHtml = ''; // Force re-render next time

      // 2. Remove from STORAGE instantly too
      if (chatWith) {
        const cached = loadMessagesFromStorage(chatWith);
        const filtered = cached.filter(m => m._id !== msgId);
        saveMessagesToStorage(chatWith, filtered);
      }

      // 3. Delete from DATABASE on server
      try {
        const res = await fetch(BASE + '/api/messages/' + msgId, {
          method: 'DELETE',
          headers: { authorization: token }
        });
        if (!res.ok) {
          alert('Could not delete from server. Please try again.');
          if (chatWith) loadMessages(true);
        } else {
          // Update recent list after delete (last message may have changed)
          refreshRecentAndUnread(true);
        }
      } catch (err) {
        alert('Could not delete. Check connection.');
        if (chatWith) loadMessages(true);
      }
    }

    // ============================================================
    // 10. CLICK PROFILE IN CHAT - Go to that person's profile page
    // ============================================================
    function goToChatProfile() {
      if (chatWith) location.href = 'profile.html?id=' + chatWith;
    }

    // ============================================================
    // 11. NOTIFICATION BADGE - Red number on 💬 button
    // ============================================================
    function updateBadge() {
      // Add up unread from all chats
      let total = 0;
      for (const id in chatMeta) {
        total += chatMeta[id].unread || 0;
      }
      const badge = document.getElementById('msgBadge');
      if (total > 0) {
        badge.style.display = 'flex';
        badge.innerText = total > 99 ? '99+' : total;
      } else {
        badge.style.display = 'none';
      }
    }

    // ============================================================
    // 12. RECENT + UNREAD - The heart of notification + sorting
    // How it works:
    // - For each person, we fetch their messages
    // - Last message tells us: preview text, time, and who sent it
    // - We compare last message ID with the ID we saved as "read"
    // - Any messages AFTER the saved ID that are FROM THEM = unread
    // - Then we re-sort list so most recent is at top
    // NEW: silent = true means background mode - also saves to storage + updates cache
    // ============================================================
    async function refreshRecentAndUnread(silent) {
      if (!peopleCache.length) return;

      let metaChanged = false;

      for (const p of peopleCache) {
        const id = p._id || p;

        // NEW: Try cache first for speed, but still fetch fresh in background below
        // For list view, we want fresh data, so we fetch server here.
        // If fetch fails, we keep old meta (no wipe).
        const msgs = await getMessagesFor(id);

        // If fetch failed (empty) but we have cached messages, use cache to keep list alive
        let useMsgs = msgs;
        if ((!msgs || !msgs.length) && loadMessagesFromStorage(id).length) {
          // Keep old meta, don't overwrite with empty
          continue;
        }
        if (!useMsgs.length) {
          if (!chatMeta[id]) {
            chatMeta[id] = { lastText: '', lastTime: 0, unread: 0 };
            metaChanged = true;
          }
          continue;
        }

        // Save fresh messages to storage too, so opening chat is instant next time
        saveMessagesToStorage(id, useMsgs);

        const lastMsg = useMsgs[useMsgs.length - 1];
        const lastTime = lastMsg.createdAt ? new Date(lastMsg.createdAt).getTime() : Date.now();
        const lastText = (lastMsg.from?._id || lastMsg.from) === getMyId() ? 'You: ' + lastMsg.text : lastMsg.text;

        // Count unread: find where I last stopped reading, count messages after that from THEM
        const lastReadId = getLastReadId(id);
        let unread = 0;
        if (id === chatWith) {
          // If I am inside this chat right now, it is read = 0 unread
          unread = 0;
          saveLastReadId(id, lastMsg._id);
        } else if (!lastReadId) {
          // I have never opened this chat: treat first load as read to avoid old messages showing as new
          if (chatMeta[id] && chatMeta[id].lastText) {
            const oldLastId = chatMeta[id].lastMsgId;
            if (oldLastId) {
              const idx = useMsgs.findIndex(m => m._id === oldLastId);
              if (idx !== -1) {
                unread = useMsgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
              }
            }
          } else {
            unread = 0;
            saveLastReadId(id, lastMsg._id);
          }
        } else {
          // Normal case: find my last read message, count messages after it from them
          const idx = useMsgs.findIndex(m => m._id === lastReadId);
          if (idx === -1) {
            if (lastMsg._id !== lastReadId && (lastMsg.from?._id || lastMsg.from) !== getMyId()) {
              unread = 1;
            } else {
              unread = 0;
            }
          } else {
            unread = useMsgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
          }
        }

        // Only update if changed, to avoid unnecessary re-render
        const old = chatMeta[id];
        if (!old || old.lastMsgId !== lastMsg._id || old.unread !== unread || old.lastText !== lastText) {
          chatMeta[id] = {
            lastText: lastText,
            lastTime: lastTime,
            lastMsgId: lastMsg._id,
            unread: unread
          };
          metaChanged = true;
        }
      }

      if (metaChanged) {
        saveMetaToStorage(); // Save so next visit shows recent + unread instantly
      }

      // Update badge + re-sort list if we are in list view
      updateBadge();
      if (!chatWith) renderPeopleList();
    }

    // ============================================================
    // 13. START + AUTO-REFRESH (BACKGROUND)
    // ============================================================
    // Load people once at start - shows cache instantly, then background refresh
    loadPeople();

    // Every 2 seconds (faster than before, but silent):
    // - If I am inside a chat, reload that chat in background (new message appears instantly, no flash)
    // - If I am in list, check for new messages + re-sort in background
    setInterval(async () => {
      if (chatWith) {
        await loadMessages(true);
        await refreshRecentAndUnread(true);
      } else {
        await refreshRecentAndUnread(true);
      }
    }, 2000);
  </script>
</body>
</html>
