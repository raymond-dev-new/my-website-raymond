
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <style>
    /* ============================= */
    /* BASIC PAGE SETUP              */
    /* ============================= */
    * {
      box-sizing: border-box;
    }
    

    body {
      margin: 0;
      background: #0a0a12;
      color: #fff;
      font-family: Arial;
      padding-bottom: 90px; /* Space for bottom nav */
    }

    /* ============================= */
    /* TOP BAR                       */
    /* ============================= */
    .top {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ============================= */
    /* PEOPLE LIST (CHAT LIST)      */
    /* ============================= */
    .list {
      max-width: 600px;
      margin: 0 auto;
    }

    /* One row in the list - one person */
    .row {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      align-items: center;
    }

    /* ============================= */
    /* AVATAR - CIRCLE PROFILE PIC   */
    /* ============================= */
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ============================= */
    /* CHAT BOX                      */
    /* ============================= */
    .chat {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px;
      display: none; /* Hidden until you open a chat */
    }

    /* ============================= */
    /* MESSAGE BUBBLE                */
    /* ============================= */
    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 18px;
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.4;
      /* CACHE ADDITION - ADDED ONLY - LINE BREAK FIX */
      /* This keeps Enter / line breaks + spaces in messages */
      /* Without this, \n is collapsed to one space */
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* My message - purple */
    .mine {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      margin-left: auto;
    }

    /* Their message - dark grey */
    .theirs {
      background: #26262f;
    }

    /* ============================= */
    /* INPUT ROW - TYPE MESSAGE      */
    /* ============================= */
    .inputRow {
      position: fixed;
      bottom: 48px;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      display: none; /* Hidden until chat is opened */
      gap: 8px;
      padding: 10px;
      background: #0a0a12;
    }

    .inputRow input {
      flex: 1;
      background: #1e1e2a;
      border: 1px solid #333;
      border-radius: 24px;
      color: #fff;
      padding: 13px;
      outline: none;
    }

    .inputRow button {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 0 20px;
      font-weight: 700;
    }

    /* ============================= */
    /* BOTTOM NAVIGATION             */
    /* ============================= */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 18, .95);
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      font-size: 22px;
    }

    /* ============================= */
    /* MESSAGE WRAPPER               */
    /* Fix: wrapper has NO color, only bubble has color */
    /* ============================= */
    .msgWrap {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      background: transparent !important;
      margin: 2px 0;
    }

    .msgWrap.mine {
      align-items: flex-end;
    }

    .msgWrap.theirs {
      align-items: flex-start;
    }

    /* Bubble inside wrapper */
    .msg {
      width: fit-content;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      /* CACHE ADDITION - ADDED ONLY - LINE BREAK FIX */
      /* Keeps admin Enter breaks + multiple spaces */
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .msg.mine {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .msg.theirs {
      background: #26262f;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    /* ============================= */
    /* DELETE BUTTON                 */
    /* ============================= */
    .delBtn {
      background: rgba(0, 0, 0, .25);
      color: #fff;
      border: none;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 3px;
      opacity: .7;
    }

    /* ============================= */
    /* CHAT HEADER - TOP OF CHAT     */
    /* ============================= */
    .chatHeaderInfo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chatHeaderInfo .avatar {
      width: 36px;
      height: 36px;
      font-size: 14px;
    }

    /* ============================= */
    /* RED BADGE - UNREAD COUNT      */
    /* ============================= */
    .msgBadge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .navMsg {
      position: relative;
    }

    /* ============================= */
    /* ROW INFO - NAME + PREVIEW     */
    /* ============================= */
    .rowInfo {
      flex: 1;
      min-width: 0;
    }

    .rowTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .rowPreview {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .rowPreview.unread {
      color: #fff;
      font-weight: 700;
    }

    .rowTime {
      font-size: 11px;
      color: #777;
      flex-shrink: 0;
    }

    .chatUnread {
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      margin-left: 6px;
      flex-shrink: 0;
    }

    /* ================================================= */
    /* ===== GROUP ONLY - ADDED - START ================= */
    /* ================================================= */

    /* Small yellow "GROUP" label */
    .groupBadge {
      background: #f59e0b;
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      margin-left: 4px;
    }

    /* Group avatar - megaphone, yellow color */
    .groupAvatar {
      background: linear-gradient(45deg, #f59e0b, #ec4899) !important;
      font-size: 22px !important;
    }

    /* Grey notice box inside group */
    .groupNotice {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 12px;
      margin: 10px 0;
      /* CACHE ADDITION - ADDED ONLY - LINE BREAK FIX */
      white-space: pre-wrap;
    }

    /* Buttons under group header: View Profile / Message Admin */
    .groupAdminBar {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }

    .groupAdminBar button {
      flex: 1;
      background: #26262f;
      color: #fff;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .groupAdminBar button.primary {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      border: none;
    }

    /* ===== GROUP ONLY - END =========================== */
  </style>
</head>
<body>

  <!-- ================= TOP BAR ================= -->
  <div class="top">
    <!-- Clicking this goes to profile of person you are chatting with -->
    <div class="chatHeaderInfo" id="chatHeaderInfo" onclick="goToChatProfile()">
      <b id="topTitle">💬 Messages</b>
      <span id="chatHeaderAvatar" style="display: none;"></span>
    </div>
    <!-- Back button - only shows inside a chat -->
    <span onclick="showList()" style="cursor: pointer; display: none;" id="backBtn">← Back</span>
  </div>

  <!-- ================= PEOPLE LIST ================= -->
  <div class="list" id="peopleList">
    <p style="text-align: center; color: #777; padding: 30px;">Loading people...</p>
  </div>

  <!-- ================= CHAT BOX ================= -->
  <!-- Messages appear here when you open a chat -->
  <div class="chat" id="chatBox"></div>

  <!-- ================= GROUP ACTIONS ================= -->
  <!-- Only shows inside the group: View Admin / Message Admin -->
  <div id="groupActions" style="display:none; max-width:600px; margin:0 auto; padding:0 16px;"></div>

  <!-- ================= INPUT ROW ================= -->
  <div class="inputRow" id="inputRow">
    <input id="msgInput" placeholder="Type private message..." onkeydown="if(event.key === 'Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>

  <!-- ================= BOTTOM NAV ================= -->
  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
    <a href="diary.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

  <script>
    // ============================================================
    // CACHE ADDITION - ADDED ONLY - FIXED
    // FIX 1: Removed <script src="wildreaders-db.js"> from <head>
    // Reason: That file + this inline block both declared const WRDB
    // -> "Identifier 'WRDB' has already been declared" -> loadPeople() never ran
    // Now WRDB exists ONLY here, so no clash.
    // FIX 2: Changed const WRDB = window.WRDB || {...} to const WRDB = {...}
    // FIX 3: WRDB.get() now has built-in 500ms timeout, so it can never
    // hang the chat list / chat open. If IndexedDB is slow, it returns null
    // and fetch from server continues.
    // ============================================================
    const WRDB = {
      dbName: 'WildReadersDB',
      storeName: 'cache',
      _open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(this.storeName)) {
              req.result.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async save(key, data) {
        try {
          const db = await this._open();
          return new Promise((resolve) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) { return false; }
      },
      async get(key) {
        // CACHE FIX: Race real get vs 500ms timeout
        const realGet = (async () => {
          try {
            const db = await this._open();
            return new Promise((resolve) => {
              const tx = db.transaction(this.storeName, 'readonly');
              const req = tx.objectStore(this.storeName).get(key);
              req.onsuccess = () => resolve(req.result ? req.result.data : null);
              req.onerror = () => resolve(null);
            });
          } catch (e) { return null; }
        })();
        const timeout = new Promise(r => setTimeout(() => r(null), 500));
        return Promise.race([realGet, timeout]);
      }
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    function formatMessageText(text) {
      const safe = String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return safe.replace(/\n/g, '<br>');
    }

    // ============================================================
    // 1. SETUP - BASE URL + LOGIN CHECK
    // ============================================================
    const BASE = "https://raymonddomain.dev";
    const token = localStorage.getItem('token');
    if (!token) location.href = "login.html";
    function getMyId() {
      try {
        return JSON.parse(atob(token.split('.')[1])).id;
      } catch {
        return "";
      }
    }
    function getMyEmailFromToken() {
      try {
        return (JSON.parse(atob(token.split('.')[1])).email || "").toLowerCase();
      } catch {
        return "";
      }
    }
    const ADMIN_EMAIL = "letswintrade@gmail.com";
    const GROUP_ID = "ADMIN_GROUP";
    const GROUP_NAME = "📢 WildReaders";
    let isAdmin = (getMyEmailFromToken() === ADMIN_EMAIL);
    let myEmail = getMyEmailFromToken();
    let adminUserId = "";
    let adminUserName = "LetsWin";
    let adminUserAvatar = "";
    let totalGroupMembers = 0;
    let isGroupChat = false;
    let chatWith = null;
    let chatWithName = '';
    let chatWithAvatar = '';
    let peopleCache = [];
    let chatMeta = {};
    let lastRenderedListHtml = '';
    let lastRenderedChatHtml = '';
    const MAX_MSGS_PER_CHAT = 30;
    const MAX_CHATS_SAVED = 15;
    const MAX_PEOPLE_SAVED = 50;
    function getPeopleCacheKey() {
      return 'msg_people_' + getMyId();
    }
    function getMetaCacheKey() {
      return 'msg_meta_' + getMyId();
    }
    function getChatCacheKey(otherId) {
      return 'msg_chat_' + getMyId() + '_' + otherId;
    }
    function getChatOrderKey() {
      return 'msg_order_' + getMyId();
    }
    function safeSetItem(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (e) {
        const freed = deleteOldestChatFromStorage();
        if (freed) {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch (e2) {}
        }
        try {
          clearAllMessageCache();
          localStorage.setItem(key, value);
          return true;
        } catch (e3) {
          return false;
        }
      }
    }
    function getChatOrder() {
      try {
        const raw = localStorage.getItem(getChatOrderKey());
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function touchChatInOrder(otherId) {
      let order = getChatOrder().filter(id => id !== otherId);
      order.push(otherId);
      if (order.length > MAX_CHATS_SAVED) {
        order = order.slice(order.length - MAX_CHATS_SAVED);
      }
      try {
        localStorage.setItem(getChatOrderKey(), JSON.stringify(order));
      } catch {}
    }
    function deleteOldestChatFromStorage() {
      const order = getChatOrder();
      if (!order.length) return false;
      const oldestId = order[0];
      try { localStorage.removeItem(getChatCacheKey(oldestId)); } catch {}
      const newOrder = order.slice(1);
      try { localStorage.setItem(getChatOrderKey(), JSON.stringify(newOrder)); } catch {}
      return true;
    }
    function clearAllMessageCache() {
      const order = getChatOrder();
      for (const id of order) {
        try { localStorage.removeItem(getChatCacheKey(id)); } catch {}
      }
      try { localStorage.removeItem(getChatOrderKey()); } catch {}
    }
    function trimMessages(msgs) {
      if (!Array.isArray(msgs)) return [];
      const last = msgs.slice(-MAX_MSGS_PER_CHAT);
      return last.map(m => ({
        _id: m._id,
        from: (m.from?._id || m.from),
        text: String(m.text || '').slice(0, 2000),
        createdAt: m.createdAt || ''
      }));
    }
    function savePeopleToStorage() {
      const slim = (peopleCache || []).slice(0, MAX_PEOPLE_SAVED).map(p => ({
        _id: p._id || p,
        username: p.username || '',
        avatar: p.avatar || ''
      }));
      safeSetItem(getPeopleCacheKey(), JSON.stringify(slim));
      WRDB.save(getPeopleCacheKey(), slim);
    }
    function saveMetaToStorage() {
      safeSetItem(getMetaCacheKey(), JSON.stringify(chatMeta));
      WRDB.save(getMetaCacheKey(), chatMeta);
    }
    function saveMessagesToStorage(otherId, msgs) {
      const trimmed = trimMessages(msgs);
      touchChatInOrder(otherId);
      let order = getChatOrder();
      if (order.length > MAX_CHATS_SAVED) {
        deleteOldestChatFromStorage();
      }
      safeSetItem(getChatCacheKey(otherId), JSON.stringify(trimmed));
      WRDB.save(getChatCacheKey(otherId), trimmed);
    }
    function loadMessagesFromStorage(otherId) {
      try {
        const raw = localStorage.getItem(getChatCacheKey(otherId));
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    async function loadMessagesFromWRDB(otherId) {
      const data = await WRDB.get(getChatCacheKey(otherId));
      return Array.isArray(data) ? data : [];
    }
    function loadCacheAtStart() {
      try {
        const peopleRaw = localStorage.getItem(getPeopleCacheKey());
        if (peopleRaw) {
          const parsed = JSON.parse(peopleRaw);
          if (Array.isArray(parsed) && parsed.length) peopleCache = parsed;
        }
        const metaRaw = localStorage.getItem(getMetaCacheKey());
        if (metaRaw) {
          const parsed = JSON.parse(metaRaw);
          if (parsed && typeof parsed === 'object') chatMeta = parsed;
        }
      } catch {}
    }
    async function loadCacheFromWRDBAtStart() {
      try {
        if (!peopleCache.length) {
          const p = await WRDB.get(getPeopleCacheKey());
          if (Array.isArray(p) && p.length) peopleCache = p;
        }
        const m = await WRDB.get(getMetaCacheKey());
        if (m && typeof m === 'object') {
          if (!Object.keys(chatMeta).length) chatMeta = m;
        }
      } catch {}
    }
    function getReadKey(otherId) {
      return 'read_' + getMyId() + '_' + otherId;
    }
    function getLastReadId(otherId) {
      return localStorage.getItem(getReadKey(otherId)) || '';
    }
    function saveLastReadId(otherId, msgId) {
      if (msgId) {
        safeSetItem(getReadKey(otherId), msgId);
      }
    }
    async function identifyAdminAndMembers() {
      try {
        const meRes = await fetch(BASE + '/api/users/' + getMyId(), { headers: { authorization: token } });
        const meData = await meRes.json();
        const me = meData.user || meData;
        if (me) {
          if (me.email) myEmail = String(me.email).toLowerCase();
          if (myEmail === ADMIN_EMAIL) {
            isAdmin = true;
            adminUserId = getMyId();
            adminUserName = me.username || "LetsWin";
            adminUserAvatar = me.avatar || "";
          }
        }
      } catch {}
      if (!isAdmin) {
        try {
          const r = await fetch(BASE + '/api/admin-user', { headers: { authorization: token } });
          if (r.ok) {
            const d = await r.json();
            const adm = d.user || d;
            if (adm && adm._id) {
              adminUserId = adm._id;
              adminUserName = adm.username || "LetsWin";
              adminUserAvatar = adm.avatar || "";
            }
          }
        } catch {}
      }
      if (isAdmin) {
        try {
          const r = await fetch(BASE + '/api/group-members-count', { headers: { authorization: token } });
          if (r.ok) {
            const d = await r.json();
            totalGroupMembers = d.count || 0;
          } else {
            totalGroupMembers = (peopleCache ? peopleCache.length : 0) + 1;
          }
        } catch {
          totalGroupMembers = (peopleCache ? peopleCache.length : 0) + 1;
        }
      }
      if (!chatMeta[GROUP_ID]) {
        chatMeta[GROUP_ID] = {
          lastText: 'Tap to view announcements',
          lastTime: 0,
          unread: 0,
          lastMsgId: ''
        };
        saveMetaToStorage();
      }
    }
    async function getGroupMessages() {
      try {
        const res = await fetch(BASE + '/api/group-messages', { headers: { authorization: token } });
        if (res.ok) {
          const msgs = await res.json();
          if (Array.isArray(msgs)) return msgs;
        }
      } catch {}
      const fromWRDB = await loadMessagesFromWRDB(GROUP_ID);
      if (fromWRDB.length) return fromWRDB;
      return loadMessagesFromStorage(GROUP_ID);
    }
    async function sendGroupMessage(text) {
      const res = await fetch(BASE + '/api/group-messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', authorization: token },
        body: JSON.stringify({ text })
      });
      return res.ok;
    }
    async function loadPeople() {
      loadCacheAtStart();
      await loadCacheFromWRDBAtStart();
      renderPeopleList();
      updateBadge();
      await identifyAdminAndMembers();
      renderPeopleList();
      updateBadge();
      const toEarly = new URLSearchParams(location.search).get('to');
      if (toEarly) {
        if (toEarly === GROUP_ID) {
          openGroupChat();
        } else {
          const foundEarly = peopleCache.find(p => (p._id || p) === toEarly);
          openChat(toEarly, foundEarly?.username || 'Chat');
        }
      }
      try {
        const meRes = await fetch(BASE + '/api/users/' + getMyId(), { headers: { authorization: token } });
        const meData = await meRes.json();
        const me = meData.user || meData;
        if (me && me.email && String(me.email).toLowerCase() === ADMIN_EMAIL) {
          isAdmin = true;
          adminUserId = getMyId();
        }
        let people = [...(me.followers || []), ...(me.following || [])];
        let seen = {};
        people = people.filter(p => {
          let id = p._id || p;
          if (seen[id]) return false;
          seen[id] = true;
          return id !== getMyId();
        });
        peopleCache = people;
        savePeopleToStorage();
        await identifyAdminAndMembers();
        renderPeopleList();
        await refreshRecentAndUnread(true);
        await refreshGroupMeta(true);
        const to = new URLSearchParams(location.search).get('to');
        if (to && !chatWith) {
          if (to === GROUP_ID) {
            openGroupChat();
          } else {
            const found = people.find(p => (p._id || p) === to);
            openChat(to, found?.username || 'Chat');
          }
        }
      } catch (e) {
        renderPeopleList();
      }
    }
    function renderPeopleList() {
      let sorted = [...peopleCache].sort((a, b) => {
        const idA = a._id || a;
        const idB = b._id || b;
        const timeA = chatMeta[idA]?.lastTime || 0;
        const timeB = chatMeta[idB]?.lastTime || 0;
        return timeB - timeA;
      });
      const gMeta = chatMeta[GROUP_ID] || { lastText: 'Tap to view announcements', lastTime: 0, unread: 0 };
      const gPreview = gMeta.lastText || 'Tap to view announcements';
      const gTime = gMeta.lastTime ? formatTime(gMeta.lastTime) : '';
      const gUnread = gMeta.unread || 0;
      const gUnreadHtml = gUnread > 0 ? '<span class="chatUnread">' + gUnread + '</span>' : '';
      const gPreviewClass = gUnread > 0 ? 'rowPreview unread' : 'rowPreview';
      const memberText = isAdmin ? ' • ' + totalGroupMembers + ' members' : '';
      const groupRow = '<div class="row" onclick="openGroupChat()" style="background:#1a1405;border-bottom:1px solid #2a2200">'
        + '<div class="avatar groupAvatar">📢</div>'
        + '<div class="rowInfo"><div class="rowTop"><b>' + GROUP_NAME + '<span class="groupBadge">GROUP</span></b><span class="rowTime">' + gTime + '</span></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="' + gPreviewClass + '">' + escapeHtml(gPreview) + (isAdmin ? ' (' + totalGroupMembers + ' members)' : '') + '</span>' + gUnreadHtml + '</div>'
        + '<div style="font-size:11px;color:#f59e0b">By Admin' + memberText + ' • Tap to view</div></div></div>';
      const htmlPeople = sorted.map(p => {
        const id = p._id || p;
        const name = p.username || id;
        const av = p.avatar ? '<img src="' + p.avatar + '">' : name[0].toUpperCase();
        const meta = chatMeta[id] || {};
        const preview = meta.lastText || 'Tap to chat privately';
        const timeText = meta.lastTime ? formatTime(meta.lastTime) : '';
        const unread = meta.unread || 0;
        const unreadHtml = unread > 0 ? '<span class="chatUnread">' + unread + '</span>' : '';
        const previewClass = unread > 0 ? 'rowPreview unread' : 'rowPreview';
        return '<div class="row" onclick="openChat(\'' + id + '\',\'' + name + '\')">'
          + '<div class="avatar" onclick="event.stopPropagation(); location.href=\'profile.html?id=' + id + '\'">' + av + '</div>'
          + '<div class="rowInfo"><div class="rowTop"><b>' + name + '</b><span class="rowTime">' + timeText + '</span></div>'
          + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="' + previewClass + '">' + escapeHtml(preview) + '</span>' + unreadHtml + '</div></div>'
          + '</div>';
      }).join('');
      const html = groupRow + (sorted.length ? htmlPeople : '<p style="text-align:center;color:#777;padding:20px"> Loading chat....<br>Follow someone to chat privately.</p>');
      if (html === lastRenderedListHtml) return;
      lastRenderedListHtml = html;
      document.getElementById('peopleList').innerHTML = html;
    }
    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    }
    async function openChat(id, name) {
      isGroupChat = false;
      document.getElementById('groupActions').style.display = 'none';
      chatWith = id;
      chatWithName = name;
      const found = peopleCache.find(p => (p._id || p) === id);
      chatWithAvatar = found?.avatar || '';
      document.getElementById('peopleList').style.display = 'none';
      document.getElementById('chatBox').style.display = 'block';
      document.getElementById('inputRow').style.display = 'flex';
      document.getElementById('msgInput').placeholder = "Type private message...";
      document.getElementById('topTitle').innerText = '💬 ' + name;
      const avEl = document.getElementById('chatHeaderAvatar');
      avEl.style.display = 'flex';
      avEl.className = 'avatar';
      avEl.innerHTML = chatWithAvatar ? '<img src="' + chatWithAvatar + '">' : name[0].toUpperCase();
      document.getElementById('backBtn').style.display = 'block';
      if (chatMeta[id]) chatMeta[id].unread = 0;
      updateBadge();
      saveMetaToStorage();
      const cached = loadMessagesFromStorage(id);
      if (cached.length) {
        renderChatMessages(cached);
        saveLastReadId(id, cached[cached.length - 1]._id);
      } else {
        const cachedWRDB = await loadMessagesFromWRDB(id);
        if (cachedWRDB.length) {
          renderChatMessages(cachedWRDB);
          saveLastReadId(id, cachedWRDB[cachedWRDB.length - 1]._id);
        } else {
          document.getElementById('chatBox').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No messages yet. Say hello! 👋</p>';
          lastRenderedChatHtml = '';
        }
      }
      await loadMessages(true);
    }
    async function openGroupChat() {
      isGroupChat = true;
      chatWith = GROUP_ID;
      chatWithName = GROUP_NAME;
      document.getElementById('peopleList').style.display = 'none';
      document.getElementById('chatBox').style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';
      document.getElementById('topTitle').innerText = GROUP_NAME;
      const avEl = document.getElementById('chatHeaderAvatar');
      avEl.style.display = 'flex';
      avEl.className = 'avatar groupAvatar';
      avEl.innerHTML = '📢';
      if (isAdmin) {
        document.getElementById('inputRow').style.display = 'flex';
        document.getElementById('msgInput').placeholder = "Send announcement to all users...";
      } else {
        document.getElementById('inputRow').style.display = 'none';
      }
      const ga = document.getElementById('groupActions');
      ga.style.display = 'block';
      let memberLine = '';
      if (isAdmin) {
        memberLine = '<div style="text-align:center;color:#f59e0b;font-size:12px;padding:6px">👥 ' + totalGroupMembers + ' members in this group (only you can see this)</div>';
      } else {
        memberLine = '<div style="text-align:center;color:#888;font-size:12px;padding:6px">Only admin can send messages here</div>';
      }
      ga.innerHTML = memberLine + '<div class="groupAdminBar">'
        + '<button onclick="viewAdminProfile()">👤 View Admin Profile</button>'
        + (isAdmin ? '<button onclick="alert(\'This is your group\')">⚙️ You are Admin</button>' : '<button class="primary" onclick="messageAdmin()">💬 Message Admin</button>')
        + '</div>'
        + '<div class="groupNotice"> </div>';
      if (chatMeta[GROUP_ID]) chatMeta[GROUP_ID].unread = 0;
      updateBadge();
      saveMetaToStorage();
      const cached = loadMessagesFromStorage(GROUP_ID);
      if (cached.length) {
        renderGroupMessages(cached);
        saveLastReadId(GROUP_ID, cached[cached.length - 1]._id);
      } else {
        const cachedWRDB = await loadMessagesFromWRDB(GROUP_ID);
        if (cachedWRDB.length) {
          renderGroupMessages(cachedWRDB);
          saveLastReadId(GROUP_ID, cachedWRDB[cachedWRDB.length - 1]._id);
        } else {
          document.getElementById('chatBox').innerHTML = '<p style="text-align:center;color:#777;padding:30px">No announcements yet.</p>';
          lastRenderedChatHtml = '';
        }
      }
      await loadGroupMessages(true);
    }
    function viewAdminProfile() {
      if (adminUserId) {
        location.href = 'profile.html?id=' + adminUserId;
      } else if (isAdmin) {
        location.href = 'profile.html';
      } else {
        alert('Admin profile loading... tap again');
      }
    }
    function messageAdmin() {
      if (adminUserId) {
        location.href = 'message.html?to=' + adminUserId;
      } else {
        alert('Admin loading... try again');
      }
    }
    function renderGroupMessages(msgs) {
      const html = msgs.length ? msgs.map(m => {
        const isMine = isAdmin && ((m.from?._id || m.from) === getMyId());
        const senderName = isAdmin ? 'You (Admin)' : (m.from?.username || adminUserName || 'Admin');
        const del = isAdmin ? '<button class="delBtn" onclick="deleteGroupMsg(event,\'' + m._id + '\')">🗑️ Delete</button>' : '';
        return '<div class="msgWrap ' + (isMine ? 'mine' : 'theirs') + '"><div style="font-size:11px;color:#aaa;margin-bottom:2px">' + escapeHtml(senderName) + ' • Admin</div><div class="msg ' + (isMine ? 'mine' : 'theirs') + '">' + formatMessageText(m.text) + '</div>' + del + '</div>';
      }).join('') : '<p style="text-align:center;color:#777;padding:30px">No announcements yet.</p>';
      if (html === lastRenderedChatHtml) return;
      lastRenderedChatHtml = html;
      document.getElementById('chatBox').innerHTML = html;
      window.scrollTo(0, document.body.scrollHeight);
    }
    async function loadGroupMessages(silent) {
      if (!isGroupChat) return;
      const msgs = await getGroupMessages();
      if (!msgs) return;
      if (msgs.length === 0) {
        saveMessagesToStorage(GROUP_ID, []);
        chatMeta[GROUP_ID] = {
          lastText: 'No announcements yet',
          lastTime: Date.now(),
          unread: 0,
          lastMsgId: ''
        };
        saveMetaToStorage();
        updateBadge();
        renderGroupMessages([]);
        return;
      }
      saveMessagesToStorage(GROUP_ID, msgs);
      if (msgs.length) {
        saveLastReadId(GROUP_ID, msgs[msgs.length - 1]._id);
        chatMeta[GROUP_ID] = {
          lastText: msgs[msgs.length - 1].text,
          lastTime: msgs[msgs.length - 1].createdAt ? new Date(msgs[msgs.length - 1].createdAt).getTime() : Date.now(),
          lastMsgId: msgs[msgs.length - 1]._id,
          unread: 0
        };
        saveMetaToStorage();
        updateBadge();
      }
      renderGroupMessages(msgs);
    }
    async function deleteGroupMsg(e, msgId) {
      e.stopPropagation();
      if (!confirm('Delete this announcement for everyone?')) return;
      if (String(msgId).startsWith('temp_')) {
        alert('Wait a second, message is still sending...');
        return;
      }
      try {
        const res = await fetch(BASE + '/api/group-messages/' + msgId, { method: 'DELETE', headers: { authorization: token } });
        if (!res.ok) {
          alert('Could not delete from server. Message still exists for users. Try again.');
          return;
        }
      } catch {
        alert('No connection. Could not delete from server.');
        return;
      }
      const wrap = e.target.closest('.msgWrap');
      if (wrap) wrap.remove();
      lastRenderedChatHtml = '';
      const cached = loadMessagesFromStorage(GROUP_ID);
      const filtered = cached.filter(m => m._id !== msgId);
      saveMessagesToStorage(GROUP_ID, filtered);
      await loadGroupMessages(true);
      await refreshGroupMeta(true);
    }
    async function refreshGroupMeta(silent) {
      const msgs = await getGroupMessages();
      if (!msgs || !msgs.length) return;
      const lastMsg = msgs[msgs.length - 1];
      const lastTime = lastMsg.createdAt ? new Date(lastMsg.createdAt).getTime() : Date.now();
      const lastReadId = getLastReadId(GROUP_ID);
      let unread = 0;
      if (isGroupChat) {
        unread = 0;
      } else if (!lastReadId) {
        unread = 0;
        saveLastReadId(GROUP_ID, lastMsg._id);
      } else {
        const idx = msgs.findIndex(m => m._id === lastReadId);
        if (idx === -1) {
          if (lastMsg._id !== lastReadId) unread = 1;
        } else {
          unread = msgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
        }
      }
      const old = chatMeta[GROUP_ID] || {};
      if (old.lastMsgId !== lastMsg._id || old.unread !== unread) {
        chatMeta[GROUP_ID] = { lastText: lastMsg.text, lastTime: lastTime, lastMsgId: lastMsg._id, unread: unread };
        saveMetaToStorage();
        updateBadge();
        if (!chatWith) renderPeopleList();
      }
    }
    async function getMessagesFor(otherId) {
      try {
        const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
        const msgs = await res.json();
        return Array.isArray(msgs) ? msgs : [];
      } catch {
        const fromWRDB = await loadMessagesFromWRDB(otherId);
        if (fromWRDB.length) return fromWRDB;
        return [];
      }
    }
    function renderChatMessages(msgs) {
      const html = msgs.length ? msgs.map(m => {
        const isMine = (m.from?._id || m.from) === getMyId();
        const del = isMine ? '<button class="delBtn" onclick="deleteMsg(event,\'' + m._id + '\')">🗑️ Delete</button>' : '';
        return '<div class="msgWrap ' + (isMine ? 'mine' : 'theirs') + '"><div class="msg ' + (isMine ? 'mine' : 'theirs') + '">' + formatMessageText(m.text) + '</div>' + del + '</div>';
      }).join('') : '<p style="text-align:center;color:#777;padding:30px">No messages yet. Say hello! 👋</p>';
      if (html === lastRenderedChatHtml) return;
      lastRenderedChatHtml = html;
      document.getElementById('chatBox').innerHTML = html;
      window.scrollTo(0, document.body.scrollHeight);
    }
    async function loadMessages(silent) {
      if (!chatWith || isGroupChat) return;
      const msgs = await getMessagesFor(chatWith);
      if (!msgs) return;
      const cached = loadMessagesFromStorage(chatWith);
      if (msgs.length === 0 && cached.length > 0) return;
      saveMessagesToStorage(chatWith, msgs);
      if (msgs.length) {
        saveLastReadId(chatWith, msgs[msgs.length - 1]._id);
        if (chatMeta[chatWith]) {
          chatMeta[chatWith].unread = 0;
          chatMeta[chatWith].lastText = ((msgs[msgs.length - 1].from?._id || msgs[msgs.length - 1].from) === getMyId() ? 'You: ' : '') + msgs[msgs.length - 1].text;
          chatMeta[chatWith].lastTime = msgs[msgs.length - 1].createdAt ? new Date(msgs[msgs.length - 1].createdAt).getTime() : Date.now();
          chatMeta[chatWith].lastMsgId = msgs[msgs.length - 1]._id;
          saveMetaToStorage();
        }
        updateBadge();
      }
      renderChatMessages(msgs);
    }
    async function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      if (isGroupChat) {
        if (!isAdmin) {
          alert('Only admin can send in this group');
          return;
        }
        input.value = '';
        const tempMsg = {
          _id: 'temp_' + Date.now(),
          from: getMyId(),
          text: text,
          createdAt: new Date().toISOString()
        };
        const cached = loadMessagesFromStorage(GROUP_ID);
        cached.push(tempMsg);
        saveMessagesToStorage(GROUP_ID, cached);
        renderGroupMessages(cached);
        chatMeta[GROUP_ID] = { lastText: text, lastTime: Date.now(), lastMsgId: tempMsg._id, unread: 0 };
        saveMetaToStorage();
        await sendGroupMessage(text);
        await loadGroupMessages(true);
        await refreshGroupMeta(true);
        return;
      }
      input.value = '';
      const tempMsg = {
        _id: 'temp_' + Date.now(),
        from: getMyId(),
        text: text,
        createdAt: new Date().toISOString()
      };
      const cached = loadMessagesFromStorage(chatWith);
      cached.push(tempMsg);
      saveMessagesToStorage(chatWith, cached);
      renderChatMessages(cached);
      try {
        await fetch(BASE + '/api/messages/' + chatWith, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', authorization: token },
          body: JSON.stringify({ text })
        });
      } catch (e) {}
      await loadMessages(true);
      await refreshRecentAndUnread(true);
    }
    function showList() {
      document.getElementById('peopleList').style.display = 'block';
      document.getElementById('chatBox').style.display = 'none';
      document.getElementById('inputRow').style.display = 'none';
      document.getElementById('groupActions').style.display = 'none';
      document.getElementById('topTitle').innerText = '💬 Messages';
      document.getElementById('chatHeaderAvatar').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      chatWith = null;
      chatWithName = '';
      isGroupChat = false;
      lastRenderedChatHtml = '';
      refreshRecentAndUnread(true);
      refreshGroupMeta(true);
    }
    async function deleteMsg(e, msgId) {
      e.stopPropagation();
      if (!confirm('Delete this message? It will be deleted for everyone.')) return;
      const wrap = e.target.closest('.msgWrap');
      if (wrap) wrap.remove();
      lastRenderedChatHtml = '';
      if (chatWith) {
        const cached = loadMessagesFromStorage(chatWith);
        const filtered = cached.filter(m => m._id !== msgId);
        saveMessagesToStorage(chatWith, filtered);
      }
      try {
        const res = await fetch(BASE + '/api/messages/' + msgId, {
          method: 'DELETE',
          headers: { authorization: token }
        });
        if (!res.ok) {
          alert('Could not delete from server. Please try again.');
          if (chatWith) loadMessages(true);
        } else {
          refreshRecentAndUnread(true);
        }
      } catch (err) {
        alert('Could not delete. Check connection.');
        if (chatWith) loadMessages(true);
      }
    }
    function goToChatProfile() {
      if (isGroupChat) {
        viewAdminProfile();
        return;
      }
      if (chatWith) location.href = 'profile.html?id=' + chatWith;
    }
    function updateBadge() {
      let total = 0;
      for (const id in chatMeta) {
        total += chatMeta[id].unread || 0;
      }
      const badge = document.getElementById('msgBadge');
      if (total > 0) {
        badge.style.display = 'flex';
        badge.innerText = total > 99 ? '99+' : total;
      } else {
        badge.style.display = 'none';
      }
    }
    async function refreshRecentAndUnread(silent) {
      if (!peopleCache.length) return;
      let metaChanged = false;
      for (const p of peopleCache) {
        const id = p._id || p;
        const msgs = await getMessagesFor(id);
        let useMsgs = msgs;
        if ((!msgs || !msgs.length) && loadMessagesFromStorage(id).length) {
          continue;
        }
        if (!useMsgs.length) {
          if (!chatMeta[id]) {
            chatMeta[id] = { lastText: '', lastTime: 0, unread: 0 };
            metaChanged = true;
          }
          continue;
        }
        saveMessagesToStorage(id, useMsgs);
        const lastMsg = useMsgs[useMsgs.length - 1];
        const lastTime = lastMsg.createdAt ? new Date(lastMsg.createdAt).getTime() : Date.now();
        const lastText = (lastMsg.from?._id || lastMsg.from) === getMyId() ? 'You: ' + lastMsg.text : lastMsg.text;
        const lastReadId = getLastReadId(id);
        let unread = 0;
        if (id === chatWith && !isGroupChat) {
          unread = 0;
          saveLastReadId(id, lastMsg._id);
        } else if (!lastReadId) {
          if (chatMeta[id] && chatMeta[id].lastText) {
            const oldLastId = chatMeta[id].lastMsgId;
            if (oldLastId) {
              const idx = useMsgs.findIndex(m => m._id === oldLastId);
              if (idx !== -1) {
                unread = useMsgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
              }
            }
          } else {
            unread = 0;
            saveLastReadId(id, lastMsg._id);
          }
        } else {
          const idx = useMsgs.findIndex(m => m._id === lastReadId);
          if (idx === -1) {
            if (lastMsg._id !== lastReadId && (lastMsg.from?._id || lastMsg.from) !== getMyId()) {
              unread = 1;
            } else {
              unread = 0;
            }
          } else {
            unread = useMsgs.slice(idx + 1).filter(m => (m.from?._id || m.from) !== getMyId()).length;
          }
        }
        const old = chatMeta[id];
        if (!old || old.lastMsgId !== lastMsg._id || old.unread !== unread || old.lastText !== lastText) {
          chatMeta[id] = { lastText: lastText, lastTime: lastTime, lastMsgId: lastMsg._id, unread: unread };
          metaChanged = true;
        }
      }
      if (metaChanged) saveMetaToStorage();
      updateBadge();
      if (!chatWith) renderPeopleList();
    }
    loadPeople();
    setInterval(async () => {
      if (chatWith) {
        if (isGroupChat) {
          await loadGroupMessages(true);
          await refreshGroupMeta(true);
        } else {
          await loadMessages(true);
          await refreshRecentAndUnread(true);
        }
      } else {
        await refreshRecentAndUnread(true);
        await refreshGroupMeta(true);
      }
    }, 2000);
  </script>
</body>
</html>
