<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Insta Clone</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; display:flex; flex-direction:column; height:100vh; }
.header { padding:12px; border-bottom:1px solid #222; display:flex; gap:10px; }
.msgs { flex:1; overflow-y:auto; padding:10px; }
.msg { margin:8px 0; max-width:70%; padding:8px 12px; border-radius:15px; }
.me { background:#0095f6; margin-left:auto; } /* my message */
.other { background:#222; } /* other message */
.input { display:flex; padding:10px; border-top:1px solid #222; }
.input input { flex:1; background:#222; border:none; color:#fff; padding:10px; border-radius:20px; }
.input button { background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer; margin-left:10px; }
</style>
</head>
<body>
<div class="header"><a href="messages.html" style="color:#fff; text-decoration:none;">←</a><b id="chatName"></b></div> <!-- back to inbox linked -->

<div id="msgs" class="msgs"></div> <!-- messages - keeps records -->

<div class="input">
<input id="text" placeholder="Message..."> <!-- message input -->
<button onclick="send()">Send</button> <!-- send linked to backend -->
</div>

<script>
const token = localStorage.getItem('token'); // token
const me = JSON.parse(localStorage.getItem('user') || '{}'); // me
const otherId = localStorage.getItem('chatUser'); // other user - linked from messages

async function loadChat() { // load chat messages - keeps records like Instagram
  const res = await fetch(`https://raymonddomain.dev/api/messages/${otherId}`, { headers:{ authorization: token } }); // call messages api
  const msgs = await res.json(); // messages
  const div = document.getElementById('msgs'); // msgs div
  div.innerHTML = msgs.map(m => `
    <div class="msg ${m.sender._id === me._id? 'me' : 'other'}">${m.text}</div> <!-- message bubble -->
  `).join('');
  div.scrollTop = div.scrollHeight; // scroll bottom
  if (msgs.length > 0) document.getElementById('chatName').innerText = msgs[0].sender._id === me._id? msgs[0].receiver.username : msgs[0].sender.username; // name
}
async function send() { // send message - keeps records + creates notification
  const text = document.getElementById('text').value; // text
  if (!text) return;
  await fetch('http://localhost:5000/api/messages', { // call send api
    method:'POST',
    headers:{ 'Content-Type':'application/json', authorization: token },
    body: JSON.stringify({ receiver: otherId, text }) // receiver + text - keeps records
  });
  document.getElementById('text').value=''; // clear
  loadChat(); // reload
}
setInterval(loadChat, 2000); // auto reload every 2 sec like real chat
loadChat(); // load
</script>
</body>
</html>
