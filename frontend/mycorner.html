<!DOCTYPE html>
<html lang="en">
<head>

    <script>
 const token = localStorage.getItem('token');
    if (!token) {
      window.location.replace('/login.html');
    } 
   </script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Private Space</title>
<style>
  :root {
    --bg: #0a0f1e; --card: #121a2f; --text: #e5e7eb; --muted: #9ca3af;
    --accent: #6366f1; --accent-2: #8b5cf6; --danger: #ef4444; --ok: #22c55e;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: linear-gradient(135deg, #0a0f1e, #1e1b4b); color: var(--text); padding: 16px; min-height: 100vh; }
.container { max-width: 900px; margin: auto; }
  h1 { text-align: center; margin: 10px 0 20px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
.tab { background: var(--card); border: 1px solid #334155; padding: 10px 14px; border-radius: 12px; cursor: pointer; user-select: none; }
.tab.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); border: none; }
.page { display: none; background: var(--card); padding: 18px; border-radius: 16px; border: 1px solid #334155; }
.page.show { display: block; }
  input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 16px; }
  button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; font-size: 16px; cursor: pointer; }
  button.danger { background: var(--danger); }
  button.ok { background: var(--ok); }
.card { background: #0f172a; padding: 12px; border-radius: 12px; margin-top: 12px; border: 1px solid #334155; }
.card img,.card video { width: 100%; border-radius: 10px; margin-top: 8px; }
.row { display: flex; gap: 8px; }

  /* CHANGED: 2 columns for media and memory */
 .grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media(min-width: 700px) {.grid2 { grid-template-columns: 1fr 1fr; } } /* 2 columns on desktop */
</style>
</head>
<body>
<div class="container">
  <h1>🔒 My Private Space</h1>

  <div class="tabs">
    <div class="tab active" id="tab-journal" onclick="openPage('journal')">📖 Journal</div>
    <div class="tab" id="tab-voice" onclick="openPage('voice')">🎤 Voice</div>
    <div class="tab" id="tab-memory" onclick="openPage('memory')">📸 Memory</div>
    <div class="tab" id="tab-media" onclick="openPage('media')">🖼️ Media</div>
    <div class="tab" id="tab-docs" onclick="openPage('docs')">📄 Docs</div>
    <div class="tab" id="tab-worry" onclick="openPage('worry')">🔥 Worry</div>
  </div>

  <div id="journal" class="page show">
    <h3>Daily Journal</h3>
    <input type="date" id="jDate">
    <textarea id="jText" rows="5" placeholder="Write here..."></textarea>
    <button onclick="saveJ()">Save Entry</button>
    <div id="jList"></div>
  </div>

  <div id="voice" class="page">
    <h3>Voice Notes</h3>
    <button id="recBtn" onclick="rec()">🎤 Start Recording</button>
    <div id="vList"></div>
  </div>

  <div id="memory" class="page">
    <h3>Memory Box</h3>
    <input type="date" id="mDate">
    <input type="text" id="mTitle" placeholder="Title">
    <textarea id="mText" rows="3" placeholder="Description"></textarea>
    <input type="file" id="mImg" accept="image/*">
    <button onclick="saveM()">Save Memory</button>
    <div id="mList" class="grid2"></div>
  </div>

  <div id="media" class="page">
    <h3>Images & Videos</h3>
    <input type="file" id="mediaFile" accept="image/*,video/*">
    <input type="text" id="mediaTitle" placeholder="Title for this file">
    <button onclick="saveMedia()">Save to Gallery</button>
    <div id="mediaList" class="grid2"></div> <!-- NOW 2 COLUMNS -->
  </div>

  <div id="docs" class="page">
    <h3>Documents</h3>
    <input type="file" id="docFile">
    <button onclick="saveDoc()">Upload Document</button>
    <div id="docList"></div>
  </div>
  <div id="worry" class="page">
    <h3>Worry Box</h3>
    <textarea id="wText" rows="4" placeholder="Get it off your chest..."></textarea>
    <button class="danger" onclick="burn()">🔥 Burn It</button>
    <div id="wList"></div>
  </div>

  <button class="ok" onclick="exportAll()">📤 Export Backup</button>
  <button class="danger" onclick="clearAll()">🗑️ Delete Everything</button>
</div>

<script>
let DATA = {journal:[], voice:[], memory:[], media:[], docs:[], worry:[]};
let REC, CHUNKS = [];

window.addEventListener('DOMContentLoaded', () => {
  try {
    const s = localStorage.getItem('vault');
    if(s) DATA = JSON.parse(s);
  } catch(e) { console.log("No saved data") }
  document.getElementById('jDate').valueAsDate = new Date();
  document.getElementById('mDate').valueAsDate = new Date();
  renderAll();
})

function save() {
  try { localStorage.setItem('vault', JSON.stringify(DATA)); }
  catch(e) { alert("Storage Full! Delete some files or Export and Clear."); }
}

// TABS - FIXED
function openPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('show');
  document.getElementById('tab-' + id).classList.add('active');
}

// CONFIRM HELPER
function confirmDelete(msg) {
  return confirm(msg);
}

// JOURNAL
function saveJ(){
  let d = document.getElementById('jDate').value;
  let t = document.getElementById('jText').value.trim();
  if(!t) return alert('Write something');
  DATA.journal = DATA.journal.filter(x => x.d!== d);
  DATA.journal.push({d,t});
  save(); renderJ(); document.getElementById('jText').value='';
}
function renderJ(){
  document.getElementById('jList').innerHTML = DATA.journal.sort((a,b)=>b.d.localeCompare(a.d)).map((x,i)=>
   ` <div class="card"><small>${x.d}</small><p>${x.t}</p><button class="danger" onclick="delJ(${i})">Delete</button></div> `
  ).join('');
}
function delJ(i){
  if(!confirmDelete("Delete this journal entry?")) return; // ADDED CONFIRM
  DATA.journal.splice(i,1); save(); renderJ();
}

// VOICE
async function rec(){
  let btn = document.getElementById('recBtn');
  if(!REC){
    try {
      let stream = await navigator.mediaDevices.getUserMedia({audio:true});
      REC = new MediaRecorder(stream);
      REC.ondataavailable = e => CHUNKS.push(e.data);
      REC.onstop = () => {
        let blob = new Blob(CHUNKS, {type: 'audio/webm'});
        let fr = new FileReader();
        fr.onload = () => { DATA.voice.push({d:new Date().toLocaleString(), data:fr.result}); save(); renderV(); }
        fr.readAsDataURL(blob);
        CHUNKS = [];
      }
    } catch(err) { return alert("Microphone access denied") }
  }
  if(REC.state === 'inactive'){ REC.start(); btn.innerText='⏹ Stop'; }
  else { REC.stop(); btn.innerText='🎤 Start Recording'; }
}
function renderV(){
  document.getElementById('vList').innerHTML = DATA.voice.map((x,i)=>
   ` <div class="card"><small>${x.d}</small><audio controls src="${x.data}"></audio><button class="danger" onclick="delV(${i})">Delete</button></div> `
  ).join('');
}
function delV(i){
  if(!confirmDelete("Delete this voice note?")) return; // ADDED CONFIRM
  DATA.voice.splice(i,1); save(); renderV();
}

// MEMORY
function saveM(){
  let f = document.getElementById('mImg').files[0];
  let obj = {d:document.getElementById('mDate').value, t:document.getElementById('mTitle').value.trim(), txt:document.getElementById('mText').value.trim(), img:''};
  if(!obj.t) return alert('Add title');
  if(f){
    let fr = new FileReader();
    fr.onload = () => { obj.img = fr.result; addM(obj); }
    fr.readAsDataURL(f);
  } else addM(obj);
}
function addM(obj){ DATA.memory.push(obj); save(); renderM(); document.getElementById('mTitle').value=''; document.getElementById('mText').value=''; document.getElementById('mImg').value=''; }
function renderM(){
  document.getElementById('mList').innerHTML = DATA.memory.map((x,i)=>
   ` <div class="card"><small>${x.d}</small><h4>${x.t}</h4><p>${x.txt}</p>${x.img? ` <img src="${x.img}"> ` :''}<button class="danger" onclick="delM(${i})">Delete</button></div>`
  ).join('');
}
function delM(i){
  if(!confirmDelete("Delete this memory?")) return; // ADDED CONFIRM
  DATA.memory.splice(i,1); save(); renderM();
}

// MEDIA
function saveMedia(){
  let f = document.getElementById('mediaFile').files[0];
  let t = document.getElementById('mediaTitle').value.trim();
  if(!f ||!t) return alert('Pick file and add title');
  let fr = new FileReader();
  fr.onload = () => {
    DATA.media.push({t, type:f.type, data:fr.result, d:new Date().toLocaleString()});
    save(); renderMedia(); document.getElementById('mediaTitle').value=''; document.getElementById('mediaFile').value='';
  }
  fr.readAsDataURL(f);
}
function renderMedia(){
  document.getElementById('mediaList').innerHTML = DATA.media.map((x,i)=>
   ` <div class="card"><h4>${x.t}</h4><small>${x.d}</small>${x.type.startsWith('image')? `<img src="${x.data}"> ` : `<video controls src="${x.data}"></video> `}<button class="danger" onclick="delMedia(${i})">Delete</button></div>`
  ).join('');
}
function delMedia(i){
  if(!confirmDelete("Delete this media file?")) return; // ADDED CONFIRM
  DATA.media.splice(i,1); save(); renderMedia();
}

// DOCS
function saveDoc(){
  let f = document.getElementById('docFile').files[0];
  if(!f) return alert('Pick a file');
  let fr = new FileReader();
  fr.onload = () => {
    DATA.docs.push({n:f.name, data:fr.result, d:new Date().toLocaleString()});
    save(); renderDoc(); document.getElementById('docFile').value='';
  }
  fr.readAsDataURL(f);
}
function renderDoc(){
  document.getElementById('docList').innerHTML = DATA.docs.map((x,i)=>
   ` <div class="card"><b>${x.n}</b><br><small>${x.d}</small><div class="row"><a href="${x.data}" download="${x.n}"><button>Download</button></a><button class="danger" onclick="delDoc(${i})">Delete</button></div></div>`
  ).join('');
}
function delDoc(i){
  if(!confirmDelete("Delete this document?")) return; // ADDED CONFIRM
  DATA.docs.splice(i,1); save(); renderDoc();
}

// WORRY
function burn(){
  let t = document.getElementById('wText').value.trim();
  if(!t) return;
  DATA.worry.push({d:new Date().toLocaleString(), t});
  save(); renderW(); document.getElementById('wText').value='';
}
function renderW(){
  document.getElementById('wList').innerHTML = DATA.worry.map((x,i)=>
    `<div class="card"><small>${x.d}</small><p>${x.t}</p><button class="danger" onclick="delW(${i})">Delete</button></div>`
  ).join('');
}
function delW(i){
  if(!confirmDelete("Delete this worry note?")) return; // ADDED CONFIRM
  DATA.worry.splice(i,1); save(); renderW();
}

// EXPORT
function exportAll(){
  let blob = new Blob([JSON.stringify(DATA)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup.json';
  a.click();
}

function clearAll(){
  if(confirm('⚠️ Delete EVERYTHING in your vault? This cannot be undone.')){ // UPDATED CONFIRM
    localStorage.removeItem('vault'); location.reload();
  }
}

function renderAll(){ renderJ(); renderV(); renderM(); renderMedia(); renderDoc(); renderW(); }
</script>
</body>
</html>
