<!DOCTYPE html>
<html lang="en">
<head>
  <script>
   const token = localStorage.getItem('token');
   if (!token) {
     window.location.replace('/login.html');
   }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Space Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                  url("photo_2026-07-27_08-21-15.jpg") center/cover no-repeat fixed;
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center; /* centers everything */
    }

    /* HEADER - ONLY BACK BUTTON */
  .topbar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: flex-start; /* back button to left */
      margin-bottom: 15px;
    }
 .btn-back {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
 .btn-back:hover { background: #e84118; }

    /* TITLE */
    h1 {
      color: white;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px; /* space below title */
    }

    /* SHOP GRID - CENTERED */
 .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 30px;
      justify-items: center;
    }

    /* BUTTONS - SMALL */
 .btn {
      font-size: 12px;
      font-weight: 700;
      padding: 14px 8px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 130px;
    }
 .btn:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    /* COLORS */
 .sale { background: gold; color: #000; }
 .sale-alt { background: #00c853; color: white; }
 .sale-blue { background: #2962ff; color: white; }
 .video { background: #ff6d00; color: white; }

    /* ADVERTISE BUTTON - CENTERED */
 .btn-advertise {
      background: linear-gradient(135deg, #FF8C00 0%, #FF4500 100%);
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      display: block;
      cursor: pointer;
    }
 .btn-advertise:hover { transform: scale(1.03); }

    /* MOBILE */
    @media (max-width: 480px) {
      h1 { font-size: 18px; }
   .shop-grid {
        max-width: 340px;
        gap: 8px;
      }
   .btn { font-size: 11px; padding: 12px 6px; max-width: 100px; }
   .btn-advertise { font-size: 13px; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <!-- ONLY BACK BUTTON AT TOP -->
  <div class="topbar">
    <button class="btn-back logout">← Back</button>
  </div>

  <h1>SHOP FROM US TODAY</h1>

  <div class="shop-grid">
    <button class="btn sale">FOR SALE *</button>
    <button class="btn sale">FOR SALE</button>
    <button class="btn sale">FOR SALE *</button>

    <button class="btn sale">FOR SALE</button>
    <button class="btn sale">FOR SALE</button>
    <button class="btn sale-alt">FOR SALE</button>

    <button class="btn sale-blue">FOR SALE</button>
    <button class="btn sale-blue">FOR SALE</button>
    <button class="btn sale-blue">FOR SALE</button>

    <button class="btn video">Video Advert *</button>
    <button class="btn video">Video Advert</button>
    <button class="btn video">Video Advert</button>
  </div>

  <button class="btn-advertise advertise">📢 Click to place yours</button>

  <script>
    const btns = document.querySelectorAll('.btn');
    btns[0].onclick = () => window.location.href="pro1.html"
    btns[1].onclick = () => window.location.href="pro5.html"
    btns[2].onclick = () => window.location.href="pro3.html"
    btns[3].onclick = () => window.location.href="pro6.html"
    btns[4].onclick = () => window.location.href="pro4.html"
    btns[5].onclick = () => window.location.href="pro2.html"
    btns[6].onclick = () => window.location.href="pro7.html"
    btns[7].onclick = () => window.location.href="pro8.html"
    btns[8].onclick = () => window.location.href="pro9.html"
    btns[9].onclick = () => window.location.href="pro1v.html"
    btns[10].onclick = () => window.location.href="pro2v.html"
    btns[11].onclick = () => window.location.href="pro3v.html"

    document.querySelector('.advertise').onclick = () => {
      const phone = "2348115614822";
      const message = `Hello, Thanks for advertising with us`;
      window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
    };

    document.querySelector('.logout').onclick = () => window.location.href="mainpage.html"
  </script>
</body>
</html>
