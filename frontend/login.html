<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login </title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
body { margin:0; background:#000; color:#fff; font-family: Arial; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; }
.box { border:1px solid #333; padding:40px; width:260px; text-align:center; background:#111; border-radius:12px; }
input { width:90%; padding:10px; margin:8px 0; background:#222; border:1px solid #333; color:#fff; border-radius:6px; }
button { width:95%; padding:10px; background:#0095f6; border:none; color:#fff; font-weight:bold; cursor:pointer; margin-top:10px; border-radius:8px; display:flex; justify-content:center; align-items:center; gap:8px; }
a { color:#0095f6; text-decoration:none; font-size:13px; }
#msg{font-size:13px;color:#ff3040;margin-top:10px}
#pwaBanner { position:fixed; top:0; left:0; right:0; background:#111; border-bottom:1px solid #333; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; z-index:9999; font-size:13px; }
</style>
</head>
<body>

<div id="pwaBanner">
  <div><b>Install RAyMoNd App</b><br><span style="color:#aaa; font-size:11px;">Click ⋮ 3 dots > Install App</span></div>
  <button id="installBtn" style="width:auto; padding:6px 14px; background:#fff; color:#000; border-radius:20px;">Install</button>
</div>

<div class="box" style="margin-top:70px;">
<h2 style="font-family:cursive;">RAyMoNd WEB</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" onclick="login()">Log in</button>
<p><a href="register.html">Don't have account? Sign up</a></p>
<p id="msg"></p>
</div>

<script>
let deferredPrompt;
const banner = document.getElementById('pwaBanner');
const installBtn = document.getElementById('installBtn');

if (window.matchMedia('(display-mode: standalone)').matches) {
  banner.style.display = 'none';
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  banner.style.display = 'flex';
});
installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') banner.style.display = 'none';
    deferredPrompt = null;
  } else {
    alert('To install:\n1. Click ⋮ 3 dots at top-right of Chrome\n2. Scroll down a little bit \n3. Click "Install App" or "Add to Home Screen"\n4. Click Install');
  }
});
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const res = await fetch('https://raymonddomain.dev/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (data.token) { localStorage.setItem('token', data.token); window.location = 'feed.html'; }
  else document.getElementById('msg').innerText = data.msg || "Login failed";
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
