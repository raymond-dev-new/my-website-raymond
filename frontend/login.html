<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Insta Clone</title>
<style>
body { margin:0; background:#000; color:#fff; font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; } /* black like Instagram */
.box { border:1px solid #333; padding:40px; width:300px; text-align:center; background:#111; } /* login box */
input { width:90%; padding:10px; margin:8px 0; background:#222; border:1px solid #333; color:#fff; } /* inputs */
button { width:95%; padding:10px; background:#0095f6; border:none; color:#fff; font-weight:bold; cursor:pointer; margin-top:10px; } /* blue button */
a { color:#0095f6; text-decoration:none; font-size:13px; } /* link */
</style>
</head>
<body>
<div class="box">
<h2>RAyMoNd</h2> <!-- logo -->
<input id="email" placeholder="Email"> <!-- email -->
<input id="password" type="password" placeholder="Password"> <!-- password -->
<button onclick="login()">Log in</button> <!-- login btn -->
<p><a href="register.html">Don't have account? Sign up</a></p> <!-- go to register -->
<p id="msg"></p> <!-- error message -->
</div>

<script>
async function login() { // login function
  const email = document.getElementById('email').value; // get email
  const password = document.getElementById('password').value; // get password
  const res = await fetch('https://raymonddomain.dev/api/auth/login', { // call backend login api
    method: 'POST', // post
    headers: { 'Content-Type': 'application/json' }, // json
    body: JSON.stringify({ email, password }) // send data
  });
  const data = await res.json(); // get response
  if (data.token) { // if token exists = success
    localStorage.setItem('token', data.token); // save token
    localStorage.setItem('user', JSON.stringify(data.user)); // save user
    window.location = 'feed.html'; // go to feed
  } else {
    document.getElementById('msg').innerText = data.msg; // show error
  }
}
</script>
</body>
</html>
