<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SewLab Layering</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font:9px Arial;background:#252a31;color:#e8edf7;padding-bottom:8px}button,input,select{font:inherit;touch-action:manipulation}button{cursor:pointer;border:0;outline:0}header{height:32px;background:#3c424c;display:flex;align-items:center;padding:0 7px;position:sticky;top:0;z-index:20;border-bottom:1px solid #555d6c}.logo{color:#ed5da5;font-weight:bold;font-size:11px}.section{padding:3px 4px}.box{background:#373d47;border:1px solid #515969;border-radius:8px;padding:5px;margin-bottom:3px;box-shadow:0 2px 7px #0006}h2{color:#ed5da5;font-size:11px;margin-bottom:3px}h3{font-size:7px;color:#b9c2d5;margin:3px 0 2px}#c{width:90%;height:145px;display:block;margin:auto;background:#20242a;border:1px solid #586174;border-radius:7px;touch-action:none}input,select{width:100%;height:25px;background:#2d323a;color:#eee;border:1px solid #606a80;border-radius:5px;padding:2px 4px;font-size:8px;margin-bottom:2px}.row{display:flex;gap:2px}.row input{width:34px;margin:0}.main{width:100%;height:27px;margin-bottom:2px;border-radius:6px;background:linear-gradient(135deg,#f05ca8,#c63be0);color:#fff;font-size:8px;font-weight:bold;box-shadow:0 3px 6px #0006}.clear{background:linear-gradient(135deg,#f05252,#b82f38)!important}.templates,.clothes,.controls,.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.template,.cloth,.control,.tool{height:25px;padding:1px;color:#fff;border-radius:6px;font-size:6px;line-height:1.05;border:1px solid #697386;box-shadow:0 2px 4px #0006,inset 0 1px #ffffff22}.template,.cloth,.control{background:linear-gradient(145deg,#596375,#3b4350)}.tool{background:linear-gradient(145deg,#806a45,#51432c);border-color:#9b8255}.template:active,.cloth:active,.control:active,.tool:active,.main:active{transform:scale(.95);filter:brightness(1.25)}.template.active{background:linear-gradient(135deg,#ed4d9f,#c73bdb)!important;border-color:#ff83c2}.sel{text-align:center;font-size:7px;margin:2px;color:#ed5da5;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.card{background:#303640;border:1px solid #515a6b;border-radius:6px;overflow:hidden;position:relative}.card img{width:100%;height:62px;object-fit:cover;display:block}.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:2px}.acts button{height:18px;color:#fff;font-size:5px;border-radius:4px}.top{background:#3b9f4e}.bottom{background:#087fc0}.cap{background:#9b2ead}.del{position:absolute;right:1px;top:1px;width:15px;height:15px;border-radius:50%;background:#c73840;color:#fff;font-size:8px;z-index:3}.empty{text-align:center;color:#929bad;font-size:8px;padding:7px}#wide{display:none;position:fixed;inset:0;background:#000e;z-index:9999;align-items:center;justify-content:center;padding:6px}.widebox{width:96vw;max-height:96vh;background:#383e48;border-radius:8px;padding:5px;display:flex;flex-direction:column;overflow:hidden}.wname{text-align:center;color:#ed61a8;font-weight:bold;font-size:11px;padding:4px}.wideimg{width:100%;flex:1;min-height:0;background:#20242a;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:auto}.widebox img{display:block;width:100%;height:auto;max-height:80vh;object-fit:contain;border-radius:5px}.close{width:100%;height:27px;margin-top:4px;background:#c73840;color:#fff;font-size:8px;font-weight:bold;border-radius:6px}@media(max-width:360px){header{height:29px}.logo{font-size:10px}.section{padding:2px 3px}.box{padding:4px}h2{font-size:10px}h3{font-size:6px}#c{height:130px}.template,.cloth,.control,.tool{height:23px;font-size:5.5px}.main{height:24px;font-size:7px}input,select{height:23px;font-size:7px}.card img{height:55px}}
</style></head><body>
<header><div class="logo">✂️ SewLab Layering</div></header>
<section class="section"><div class="box"><canvas id="c"></canvas>

<h3>1. Pick Type</h3><select id="cat"><option>Dress</option><option>Top</option><option>Bottom</option><option>Cap</option><option>Head</option></select>
<h3>2. Pick Template</h3><div class="templates" id="temps"></div>
<h3>3. Pick Color</h3><div class="row"><input type="color" id="color" value="#ec4899"><button class="main" id="apply">🎨 APPLY</button></div>

<h3>4. Add Clothing</h3><div class="clothes" id="clothes">
<button class="cloth" data-add="cap">🧢 CAP</button><button class="cloth" data-add="shirt">👕 SHIRT</button><button class="cloth" data-add="trousers">👖 TROUSER</button><button class="cloth" data-add="nikka">🩳 NIKKA</button><button class="cloth" data-add="gown">👗 GOWN</button><button class="cloth" data-add="maleHead">👨 MALE HEAD</button><button class="cloth" data-add="femaleHead">👩 FEMALE HEAD</button></div>

<div class="sel">Selected: <span id="selected">NONE</span></div>
<h3>5. Move / Resize Selected</h3><div class="controls" id="controls">
<button class="control" data-m="-5,0">⬅ LEFT</button><button class="control" data-m="5,0">RIGHT ➡</button><button class="control" data-m="0,-5">⬆ UP</button><button class="control" data-m="0,5">⬇ DOWN</button><button class="control" data-s="-.1">➖ SMALL</button><button class="control" data-s=".1">➕ BIG</button><button class="control" data-s=".25">⛶ RESIZE</button><button class="control" data-r="-5">↶ ROTATE</button><button class="control" data-r="5">↷ ROTATE</button></div>

<h3>6. Select Clothing</h3><div class="controls" id="selectClothes">
<button class="control" data-sel="maleHead">👨 HEAD</button><button class="control" data-sel="femaleHead">👩 HEAD</button><button class="control" data-sel="cap">🧢 CAP</button><button class="control" data-sel="shirt">👕 SHIRT</button><button class="control" data-sel="trousers">👖 TROUSER</button><button class="control" data-sel="nikka">🩳 NIKKA</button><button class="control" data-sel="gown">👗 GOWN</button></div>

<h3>7. Design Tools</h3><div class="tools" id="tools">
<button class="tool" data-t="recolor">🎨 Color</button><button class="tool" data-t="fabric">🧵 Fabric</button><button class="tool" data-t="pattern">🔷 Pattern</button><button class="tool" data-t="neck">◯ Neck</button><button class="tool" data-t="necklace">📿 Necklace</button><button class="tool" data-t="length">↕ Length</button><button class="tool" data-t="sleeve">👕 Sleeve</button><button class="tool" data-t="pocket">▣ Pocket</button><button class="tool" data-t="belt">▱ Belt</button><button class="tool" data-t="zipper">│ Zipper</button><button class="tool" data-t="lace">〰 Lace</button><button class="tool" data-t="flower">🌸 Flower</button><button class="tool" data-t="frills">〰 Frills</button><button class="tool" data-t="collar">♢ Collar</button><button class="tool" data-t="buttons">⚪ Buttons</button><button class="tool" data-t="pleats">▥ Pleats</button><button class="tool" data-t="ankara">✦ Ankara</button><button class="tool" data-t="ruffle">〰 Ruffle</button><button class="tool" data-t="bright">☀ Bright</button><button class="tool" data-t="contrast">◐ Contrast</button><button class="tool" data-t="blur">◌ Blur</button><button class="tool" data-t="shadow">◒ Shadow</button><button class="tool" data-t="glow">✧ Glow</button><button class="tool" data-t="text">T Text</button><button class="tool" id="undo">↩ Undo</button></div>

<button class="main clear" id="clear">🗑 CLEAR ALL</button><button class="main" id="save">💾 SAVE DESIGN</button></div></section>
<section class="section"><div class="box"><h2>👗 After clicking top/bottom buttom click undone to resize very well in screen before editing it</h2><div id="wardrobe" class="cards"></div></div></section>
<div id="wide"><div class="widebox"><div class="wname" id="wname"></div><div class="wideimg"><img id="wimg"></div><button class="close" id="close">CLOSE</button></div></div>

<script>
const $=i=>document.getElementById(i),c=$("c"),x=c.getContext("2d"),KEY="sewlab_collection_v2";
let col="#ec4899",sel=null,H=[],hp=-1,gownStyle="ball",parts={};

const T={Dress:[["Ball Gown","ball"],["A-Line","aline"],["Mermaid","mermaid"],["Long Gown","long"]],Top:[["T-Shirt","shirt"],["Crop Top","shirt"],["Blouse","shirt"],["Polo Shirt","shirt"],["Long Shirt","shirt"]],Bottom:[["Trouser","trousers"],["Nikka","nikka"],["Jeans","trousers"],["Shorts","nikka"]],Cap:[["Baseball","cap"],["Flat Cap","cap"],["Bucket","cap"]],Head:[["Male Head","maleHead"],["Female Head","femaleHead"]]};

function clone(){return JSON.parse(JSON.stringify(parts))}
function snap(){H=H.slice(0,hp+1);H.push({parts:clone(),sel,col,gownStyle});if(H.length>40)H.shift();hp=H.length-1}
function restore(s){parts=JSON.parse(JSON.stringify(s.parts));sel=s.sel;col=s.col;gownStyle=s.gownStyle||"ball";$("color").value=col;update();render()}
function update(){$("selected").textContent=sel?sel.toUpperCase():"NONE"}
function blank(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#20242a";x.fillRect(0,0,c.width,c.height)}
function pos(t){return{x:c.width/2,y:t.includes("Head")?35:t==="cap"?30:t==="shirt"?60:t==="trousers"?78:t==="nikka"?70:68}}
function part(t,s=.75){let p=pos(t);return{type:t,x:p.x,y:p.y,s,r:0,color:col,decor:[]}}

function add(t){
snap();
parts[t]=part(t,.65);
sel=t;update();render();snap()
}
function choose(t){if(!parts[t])return alert("Add the "+t+" first");sel=t;update();render()}
function move(a,b){if(!sel||!parts[sel])return alert("Select clothing first");snap();parts[sel].x+=a;parts[sel].y+=b;render()}
function size(v){if(!sel||!parts[sel])return alert("Select clothing first");snap();parts[sel].s=Math.max(.2,Math.min(4,parts[sel].s+v));render()}
function rot(v){if(!sel||!parts[sel])return alert("Select clothing first");snap();parts[sel].r+=v;render()}
function apply(){if(!sel||!parts[sel])return alert("Select clothing first");snap();col=$("color").value;parts[sel].color=col;render()}

function head(t){
if(t==="maleHead"){
  x.fillStyle="#b87552"; // male skin
  x.beginPath();x.ellipse(0,0,25,31,0,0,7);x.fill();
  x.fillStyle="#2a1a14"; // short hair
  x.beginPath();x.arc(0,-12,26,Math.PI,0);x.fill();
  x.fillStyle="#171717"; // eyes
  x.beginPath();x.arc(-9,-2,2.5,0,7);x.arc(9,-2,2.5,0,7);x.fill();
}else{ // femaleHead
  x.fillStyle="#c98b6b"; // female skin
  x.beginPath();x.ellipse(0,0,25,31,0,0,7);x.fill();
  x.fillStyle="#352019"; // long hair
  x.beginPath();x.arc(0,-15,28,Math.PI,0);x.fill();
  x.fillRect(-28,-15,8,25);x.fillRect(20,-15,8,25); // side hair
  x.fillStyle="#171717"; // eyes with lashes
  x.beginPath();x.arc(-9,-2,2.8,0,7);x.arc(9,-2,2.8,0,7);x.fill();
  x.beginPath(); // lips
  x.arc(0,6,3,0,Math.PI);x.strokeStyle="#a05a5a";x.lineWidth=1;x.stroke();
}
}

/* SHIRT ARMS */
function shirtArms(){
x.strokeStyle="#c98b6b";x.lineWidth=7;x.lineCap="round";
x.beginPath();x.moveTo(-30,-17);x.quadraticCurveTo(-42,-7,-43,8);x.quadraticCurveTo(-43,18,-48,25);x.stroke();
x.beginPath();x.moveTo(30,-17);x.quadraticCurveTo(42,-7,43,8);x.quadraticCurveTo(43,18,48,25);x.stroke();
x.fillStyle="#c98b6b";
x.beginPath();x.arc(-48,25,4,0,7);x.fill();
x.beginPath();x.arc(48,25,4,0,7);x.fill()
}

/* GOWN ARMS */
function gownArms(){
x.strokeStyle="#c98b6b";x.lineWidth=7;x.lineCap="round";
x.beginPath();x.moveTo(-14,-35);x.quadraticCurveTo(-27,-22,-29,-3);x.quadraticCurveTo(-30,12,-35,24);x.stroke();
x.beginPath();x.moveTo(14,-35);x.quadraticCurveTo(27,-22,29,-3);x.quadraticCurveTo(30,12,35,24);x.stroke();
x.fillStyle="#c98b6b";
x.beginPath();x.arc(-35,24,4,0,7);x.fill();
x.beginPath();x.arc(35,24,4,0,7);x.fill()
}

function drawGown(){
gownArms();x.fillStyle=col;
let w=gownStyle==="aline"?38:gownStyle==="long"?22:gownStyle==="mermaid"?30:50;
x.beginPath();
if(gownStyle==="mermaid"){
x.moveTo(-13,-43);x.quadraticCurveTo(-8,-37,0,-38);x.quadraticCurveTo(8,-37,13,-43);x.lineTo(17,20);x.quadraticCurveTo(18,38,30,63);x.lineTo(-30,63);x.quadraticCurveTo(-18,38,-17,20);x.closePath()
}else{
x.moveTo(-13,-43);x.quadraticCurveTo(-8,-37,0,-38);x.quadraticCurveTo(8,-37,13,-43);x.lineTo(17,0);x.quadraticCurveTo(25,10,w,63);x.lineTo(-w,63);x.quadraticCurveTo(-25,10,-17,0);x.closePath()
}
x.fill()
}

function base(p){
x.fillStyle=p.color||col;
if(p.type==="maleHead"||p.type==="femaleHead")return head(p.type);

if(p.type==="cap"){
x.beginPath();x.arc(0,-8,21,Math.PI,0);x.lineTo(21,-8);x.quadraticCurveTo(0,3,-21,-8);x.closePath();x.fill();
x.beginPath();x.ellipse(13,0,24,4,0,0,7);x.fill()
}

if(p.type==="shirt"){
x.beginPath();x.moveTo(-24,-30);x.lineTo(-10,-35);x.quadraticCurveTo(0,-27,10,-35);x.lineTo(24,-30);x.lineTo(40,-17);x.lineTo(32,18);x.lineTo(24,13);x.lineTo(22,35);x.lineTo(-22,35);x.lineTo(-24,13);x.lineTo(-32,18);x.lineTo(-40,-17);x.closePath();x.fill();
shirtArms()
}

if(p.type==="trousers"){x.fillRect(-20,-4,40,8);x.fillRect(-18,4,16,70);x.fillRect(2,4,16,70)}
if(p.type==="nikka"){x.fillRect(-20,-4,40,7);x.fillRect(-18,3,16,38);x.fillRect(2,3,16,38)}
if(p.type==="gown")drawGown()
}

function deco(p){
(p.decor||[]).forEach(d=>{
x.save();x.strokeStyle=d.color||p.color;x.fillStyle=d.color||p.color;
if(d.type==="fabric")for(let i=-50;i<=50;i+=6){x.beginPath();x.moveTo(i,-70);x.lineTo(i,75);x.stroke()}
if(d.type==="pattern")for(let i=-70;i<90;i+=12){x.beginPath();x.moveTo(i,-70);x.lineTo(i+60,70);x.stroke()}
if(d.type==="neck"){x.lineWidth=2.5;x.beginPath();x.arc(0,p.type==="gown"?-39:-30,10,0,Math.PI);x.stroke()}
if(d.type==="necklace"){x.strokeStyle="#f4c542";x.lineWidth=2;let y=p.type==="gown"?-30:p.type==="shirt"?-17:-10;x.beginPath();x.arc(0,y,14,0,Math.PI);x.stroke();x.beginPath();x.moveTo(-7,y+12);x.lineTo(0,y+19);x.lineTo(7,y+12);x.stroke();x.beginPath();x.arc(0,y+19,3.5,0,7);x.fill()}
if(d.type==="belt"){let y=p.type==="gown"?2:5,w=p.type==="gown"?35:30;x.fillStyle="#17191d";x.fillRect(-w,y,w*2,6);x.fillStyle="#e5bd4b";x.fillRect(-4,y,8,8)}
if(d.type==="collar"){let y=p.type==="gown"?-39:-30;x.beginPath();x.moveTo(-14,y);x.quadraticCurveTo(0,y+7,14,y);x.lineTo(10,y-5);x.quadraticCurveTo(0,y,-10,y-5);x.closePath();x.fill()}
if(d.type==="sleeve"){x.fillRect(-42,-24,13,38);x.fillRect(29,-24,13,38)}
if(d.type==="pocket"){x.lineWidth=2;x.strokeRect(-9,4,18,14)}
if(d.type==="zipper"){x.lineWidth=2;x.beginPath();x.moveTo(0,-35);x.lineTo(0,55);x.stroke()}
if(["lace","ruffle","frills"].includes(d.type)){x.lineWidth=2;x.beginPath();for(let i=-40;i<=40;i+=8){x.moveTo(i,50);x.quadraticCurveTo(i+4,44,i+8,50)}x.stroke()}
if(d.type==="flower"){x.fillStyle="#ffd84a";for(let i=0;i<5;i++){let a=i*Math.PI*2/5;x.beginPath();x.arc(Math.cos(a)*9,Math.sin(a)*9,4,0,7);x.fill()}}
if(d.type==="buttons")for(let y=-15;y<40;y+=11){x.beginPath();x.arc(0,y,3.5,0,7);x.fill()}
if(d.type==="pleats")for(let i=-25;i<=25;i+=8){x.beginPath();x.moveTo(i,8);x.lineTo(i+3,55);x.stroke()}
if(d.type==="ankara")for(let i=-40;i<=40;i+=14){x.beginPath();x.arc(i,0,6,0,7);x.stroke()}
if(d.type==="bright"){x.fillStyle="#fff4";x.fillRect(-55,-70,110,140)}
if(d.type==="shadow"){x.fillStyle="#0005";x.fillRect(-50,-60,100,120)}
if(d.type==="glow"){x.fillStyle="#ffe06655";x.fillRect(-55,-70,110,140)}
if(d.type==="contrast"){x.lineWidth=2;x.strokeRect(-32,-35,64,70)}
if(d.type==="blur"){x.globalAlpha=.35;x.fillRect(-45,-60,90,120)}
if(d.type==="text"){x.font="bold 10px Arial";x.textAlign="center";x.fillText(d.text,0,0)}
x.restore()
})
}

function draw(p){
x.save();x.translate(p.x,p.y);x.rotate((p.r||0)*Math.PI/180);x.scale(p.s,p.s);base(p);deco(p);x.restore()
}
function render(){blank();["gown","shirt","trousers","nikka","maleHead","femaleHead","cap"].forEach(k=>{if(parts[k])draw(parts[k])})}

function templates(){
let a=T[$("cat").value]||[];$("temps").innerHTML="";
a.forEach(v=>{let b=document.createElement("button");b.type="button";b.className="template";b.dataset.temp=v[1];b.textContent=v[0];$("temps").appendChild(b)})
}

function useTemplate(t,b){
document.querySelectorAll(".template").forEach(q=>q.classList.remove("active"));b.classList.add("active");snap();
if(["ball","aline","mermaid","long"].includes(t)){gownStyle=t;parts.gown=part("gown",.85);sel="gown"}
else{parts[t]=part(t,.65);sel=t}
update();render();snap()
}

function toolColor(t){return{fabric:"#8ecae6",pattern:"#ff9f1c",neck:"#b8f2e6",necklace:"#f4c542",sleeve:"#a8dadc",pocket:"#90be6d",belt:"#8d6e63",zipper:"#d9d9d9",lace:"#f7b2d8",flower:"#ffd166",frills:"#cdb4db",collar:"#74c69d",buttons:"#f1faee",pleats:"#ffafcc",ankara:"#00b4d8",ruffle:"#e5989b",bright:"#ffe066",contrast:"#f77f00",blur:"#adb5bd",shadow:"#343a40",glow:"#ffe66d"}[t]||"#ffd166"}

function tool(t){
if(!sel||!parts[sel])return alert("Select clothing first");
let p=parts[sel];snap();
if(t==="recolor")p.color=$("color").value;
else if(t==="text"){let q=prompt("Enter text");if(q)p.decor.push({type:"text",text:q,color:"#ffd166"})}
else if(t==="length")p.s=Math.min(4,p.s+.15);
else{p.decor=p.decor||[];p.decor.push({type:t,color:toolColor(t)})}
render()
}

function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function load(){
let a=saved();
$("wardrobe").innerHTML=a.length?a.map(i=>`<div class="card"><button class="del" data-del="${i._id}">×</button><img src="${i.image}" data-open="${i._id}"><div class="acts"><button class="top" data-addsaved="${i._id}" data-type="shirt">TOP</button><button class="bottom" data-addsaved="${i._id}" data-type="trousers">BOTTOM</button><button class="cap" data-addsaved="${i._id}" data-type="cap">CAP</button></div></div>`).join(""):'<div class="empty">No clothes saved yet.</div>'
}
function save(){
let a=saved();a.push({_id:Date.now(),name:"Design "+(a.length+1),image:c.toDataURL()});
try{localStorage.setItem(KEY,JSON.stringify(a));load();alert("Design saved successfully!")}catch(e){alert("Could not save.")}
}
function openSaved(id){
let i=saved().find(v=>+v._id===+id);if(!i)return;
$("wname").textContent=i.name;$("wimg").src=i.image;$("wide").style.display="flex"
}
function addSaved(id,t){
let v=saved().find(i=>+i._id===+id);if(!v)return;
let im=new Image;im.onload=()=>{let p=part(t,1);p.img=im;parts[t]=p;sel=t;update();renderSaved();snap()};im.src=v.image
}
function renderSaved(){
blank();Object.values(parts).forEach(p=>{if(!p)return;x.save();x.translate(p.x,p.y);x.rotate((p.r||0)*Math.PI/180);x.scale(p.s,p.s);p.img?x.drawImage(p.img,-50,-50,100,100):base(p);deco(p);x.restore()})
}

document.addEventListener("DOMContentLoaded",()=>{
c.width=c.clientWidth;c.height=innerWidth<=360?130:145;blank();templates();load();snap();update();
$("cat").onchange=templates;
$("apply").onclick=apply;
$("save").onclick=save;
$("close").onclick=()=>$("wide").style.display="none";
$("clear").onclick=()=>{if(!confirm("Clear everything from the canvas?"))return;snap();parts={};sel=null;gownStyle="ball";update();render()};
$("undo").onclick=()=>{if(hp<=0)return alert("Nothing to undo");hp--;restore(H[hp])};
$("clothes").onclick=e=>{let b=e.target.closest("[data-add]");if(b)add(b.dataset.add)};
$("temps").onclick=e=>{let b=e.target.closest("[data-temp]");if(b)useTemplate(b.dataset.temp,b)};
$("controls").onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.m){let v=b.dataset.m.split(",").map(Number);move(v[0],v[1])}else if(b.dataset.s)size(+b.dataset.s);else if(b.dataset.r)rot(+b.dataset.r)};
$("selectClothes").onclick=e=>{let b=e.target.closest("[data-sel]");if(b)choose(b.dataset.sel)};
$("tools").onclick=e=>{let b=e.target.closest("[data-t]");if(b)tool(b.dataset.t)};
$("wardrobe").onclick=e=>{let b=e.target.closest("[data-del]");if(b){localStorage.setItem(KEY,JSON.stringify(saved().filter(i=>+i._id!==+b.dataset.del)));load();return}b=e.target.closest("[data-open]");if(b){openSaved(b.dataset.open);return}b=e.target.closest("[data-addsaved]");if(b)addSaved(b.dataset.addsaved,b.dataset.type)};
$("wide").onclick=e=>{if(e.target===$("wide"))$("wide").style.display="none"}
})
</script></body></html>
