  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SewLab Layering</title><style>

</style></head><body>

<section class="section"><div class="box">

<canvas id="c"></canvas>

<option>Dress</option><option>Top</option><option>Bottom</option><option>Cap</option><option>Head</option>
</select>

<h3>2. Pick Template</h3>

<button class="cloth" data-add="nikka">🩳 NIKKA</button>
<button class="cloth" data-add="gown">👗 GOWN</button>

<div class="tools">

<button class="tool" data-t="pocket">▣ Pocket</button>

<button class="tool" data-t="lace">〰 Lace</button>

<button class="tool" data-t="frills">〰 Frills</button>

</div></section>

<div id="wide">
<div class="widebox">
<div class="wname" id="wname"></div>
<div class="wideimg"><img id="wimg"></div>
<button class="close" id="close">CLOSE</button>
</div>
</div>

<script>
const $=i=>document.getElementById(i),
c=$("c"),
x=c.getContext("2d"),
KEY="sewlab_collection_v2";

let col="#ec4899",sel=null,H=[],hp=-1,parts={};

const reset=()=>parts={
cap:null,
shirt:null,
trousers:null,
nikka:null,
gown:null,
maleHead:null,
femaleHead:null
};

reset();

function blank(){
x.fillStyle="#20242a";
x.fillRect(0,0,c.width,c.height)
}

function snap(){
let a=c.toDataURL();
if(H[hp]===a)return;
H=H.slice(0,hp+1);
H.push(a);
if(H.length>40)H.shift();
hp=H.length-1
}

function update(){
$("selected").textContent=sel?sel.toUpperCase():"NONE"
}

function pos(t){
return{
x:c.width/2,
y:t==="maleHead"||t==="femaleHead"?35:
t==="cap"?30:
t==="shirt"?60:
t==="trousers"?78:
t==="nikka"?70:68
}
}

function part(t,s=1){
let p=pos(t);
return{
type:t,
x:p.x,
y:p.y,
s:s,
r:0,
color:col,
decor:[]
}
}

function add(t){
if(t==="maleHead"){
parts.maleHead=part(t,.65);
parts.femaleHead=null
}else if(t==="femaleHead"){
parts.femaleHead=part(t,.65);
parts.maleHead=null
}else{
parts[t]=part(t,.75)
}
sel=t;
update();
render();
snap()
}

function choose(t){
if(!parts[t])return alert("Add the "+t+" first");
sel=t;
update();
render()
}

function move(a,b){
if(!sel||!parts[sel])return alert("Select clothing first");
parts[sel].x+=a;
parts[sel].y+=b;
render();
snap()
}

function size(v){
if(!sel||!parts[sel])return alert("Select clothing first");
parts[sel].s=Math.max(.2,Math.min(4,parts[sel].s+v));
render();
snap()
}

function rot(v){
if(!sel||!parts[sel])return alert("Select clothing first");
parts[sel].r+=v;
render();
snap()
}

function apply(){
col=$("color").value;
if(sel&&parts[sel])parts[sel].color=col;
render();
snap()
}

function head(t){

x.fillStyle=t==="maleHead"?"#b87552":"#c98b6b";
x.beginPath();
x.ellipse(0,0,25,31,0,0,7);
x.fill();

x.fillStyle=t==="maleHead"?"#352019":"#3a211b";
x.beginPath();
x.arc(0,-14,27,Math.PI,0);
x.fill();

x.fillStyle="#171717";
x.beginPath();
x.arc(-9,-2,2.5,0,7);
x.arc(9,-2,2.5,0,7);
x.fill();

x.strokeStyle="#69352c";
x.lineWidth=1.5;
x.beginPath();
x.moveTo(-6,11);
x.quadraticCurveTo(0,15,6,11);
x.stroke();

if(t==="femaleHead"){
x.fillStyle="#3a211b";

x.beginPath();
x.moveTo(-25,-16);
x.quadraticCurveTo(-35,15,-25,48);
x.lineTo(-15,25);
x.lineTo(-20,0);
x.closePath();
x.fill();

x.beginPath();
x.moveTo(25,-16);
x.quadraticCurveTo(35,15,25,48);
x.lineTo(15,25);
x.lineTo(20,0);
x.closePath();
x.fill()
}
}

function base(p){

x.fillStyle=p.color||col;

if(p.type==="maleHead"||p.type==="femaleHead")
return head(p.type);

if(p.type==="cap"){
x.beginPath();
x.arc(0,-8,21,Math.PI,0);
x.lineTo(21,-8);
x.quadraticCurveTo(0,3,-21,-8);
x.closePath();
x.fill();

x.beginPath();
x.ellipse(13,0,24,4,0,0,7);
x.fill()
}

if(p.type==="shirt"){
x.fillRect(-25,-30,50,52);

x.beginPath();
x.moveTo(-25,-28);
x.lineTo(-40,-18);
x.lineTo(-33,17);
x.lineTo(-25,11);
x.closePath();
x.fill();

x.beginPath();
x.moveTo(25,-28);
x.lineTo(40,-18);
x.lineTo(33,17);
x.lineTo(25,11);
x.closePath();
x.fill()
}

if(p.type==="trousers"){
x.fillRect(-20,-4,40,8);
x.fillRect(-18,4,16,70);
x.fillRect(2,4,16,70)
}

if(p.type==="nikka"){
x.fillRect(-20,-4,40,7);
x.fillRect(-18,3,16,38);
x.fillRect(2,3,16,38)
}

if(p.type==="gown"){
x.beginPath();
x.moveTo(-16,-43);
x.quadraticCurveTo(0,-49,16,-43);
x.lineTo(40,65);
x.lineTo(-40,65);
x.closePath();
x.fill()
}
}

function drawBelt(p){

let y=5,w=32,h=7;

if(p.type==="shirt"){
y=2;
w=30;
h=7
}

if(p.type==="gown"){
y=-2;
w=34;
h=8
}

if(p.type==="trousers"){
y=0;
w=23;
h=7
}

if(p.type==="nikka"){
y=0;
w=23;
h=7
}

x.save();

x.shadowColor="#0008";
x.shadowBlur=3;

x.fillStyle="#17191d";
x.beginPath();
x.roundRect(-w,y,w*2,h,3);
x.fill();

x.shadowBlur=0;

/* belt stitching */
x.strokeStyle="#777";
x.lineWidth=.8;
x.beginPath();
x.moveTo(-w+3,y+2);
x.lineTo(w-3,y+2);
x.stroke();

x.beginPath();
x.moveTo(-w+3,y+h-2);
x.lineTo(w-3,y+h-2);
x.stroke();

/* buckle */
x.fillStyle="#e5bd4b";
x.strokeStyle="#fff0a0";
x.lineWidth=1;

x.beginPath();
x.roundRect(-5,y-2,10,h+4,2);
x.fill();
x.stroke();

x.fillStyle="#17191d";
x.fillRect(-2,y,4,h);

/* belt holes */
x.fillStyle="#d8c58b";

for(let i=-w+8;i<=w-8;i+=6){
if(Math.abs(i)>7){
x.beginPath();
x.arc(i,y+h/2,1,0,Math.PI*2);
x.fill()
}
}

x.restore()
}

function deco(p){

(p.decor||[]).forEach(d=>{

x.save();

x.strokeStyle=d.color||p.color||col;
x.fillStyle=d.color||p.color||col;

if(d.type==="fabric")
for(let i=-50;i<=50;i+=6){
x.beginPath();
x.moveTo(i,-70);
x.lineTo(i,75);
x.stroke()
}

if(d.type==="pattern")
for(let i=-70;i<90;i+=12){
x.beginPath();
x.moveTo(i,-70);
x.lineTo(i+60,70);
x.stroke()
}

if(d.type==="neck"){
x.strokeStyle="#fff";
x.lineWidth=3;
x.beginPath();
x.arc(0,-25,11,0,Math.PI);
x.stroke();

x.strokeStyle=d.color||p.color||col;
x.lineWidth=2;
x.beginPath();
x.arc(0,-25,9,0,Math.PI);
x.stroke()
}

if(d.type==="necklace"){

x.strokeStyle="#f4c542";
x.lineWidth=2;

x.beginPath();
x.arc(0,-8,15,0,Math.PI);
x.stroke();

x.fillStyle="#f4c542";

x.beginPath();
x.arc(0,8,4,0,7);
x.fill();

for(let a=0;a<=Math.PI;a+=Math.PI/6){
x.beginPath();
x.arc(
Math.cos(a)*15,
-8+Math.sin(a)*15,
1.8,0,7
);
x.fill()
}
}

if(d.type==="sleeve"){
x.fillRect(-42,-24,13,38);
x.fillRect(29,-24,13,38)
}

if(d.type==="pocket"){
x.strokeStyle=d.color||p.color||col;
x.lineWidth=2;
x.strokeRect(-9,4,18,14)
}

if(d.type==="belt"){
drawBelt(p)
}

if(d.type==="zipper"){
x.lineWidth=2;
x.beginPath();
x.moveTo(0,-27);
x.lineTo(0,55);
x.stroke()
}

if(["lace","ruffle","frills"].includes(d.type)){
x.lineWidth=2;
x.beginPath();

for(let i=-40;i<=40;i+=8){
x.moveTo(i,50);
x.quadraticCurveTo(i+4,44,i+8,50)
}

x.stroke()
}

if(d.type==="flower"){
x.fillStyle="#ffd84a";

for(let i=0;i<5;i++){
let a=i*Math.PI*2/5;
x.beginPath();
x.arc(
Math.cos(a)*9,
Math.sin(a)*9,
4,0,7
);
x.fill()
}
}

if(d.type==="collar"){
x.lineWidth=2;
x.beginPath();
x.moveTo(-15,-28);
x.lineTo(0,-18);
x.lineTo(15,-28);
x.stroke()
}

if(d.type==="buttons"){

for(let y=-15;y<40;y+=11){

x.fillStyle="#fff";
x.beginPath();
x.arc(0,y,3.5,0,7);
x.fill();

x.strokeStyle="#555";
x.lineWidth=1;
x.stroke();

x.fillStyle="#777";
x.beginPath();
x.arc(-1,y-1,1,0,7);
x.fill()
}
}

if(d.type==="pleats")
for(let i=-25;i<=25;i+=8){
x.beginPath();
x.moveTo(i,-12);
x.lineTo(i+3,55);
x.stroke()
}

if(d.type==="ankara")
for(let i=-40;i<=40;i+=14){
x.beginPath();
x.arc(i,0,6,0,7);
x.stroke()
}

if(d.type==="bright"){
x.fillStyle="#fff3";
x.fillRect(-55,-70,110,140)
}

if(d.type==="shadow"){
x.fillStyle="#0004";
x.fillRect(-50,-60,100,120)
}

if(d.type==="glow"){
x.fillStyle=(p.color||col)+"44";
x.fillRect(-55,-70,110,140)
}

if(d.type==="contrast"){
x.lineWidth=2;
x.strokeRect(-32,-35,64,70)
}

if(d.type==="blur"){
x.globalAlpha=.35;
x.fillRect(-45,-60,90,120)
}

if(d.type==="text"){
x.fillStyle=d.color||col;
x.font="bold 10px Arial";
x.textAlign="center";
x.fillText(d.text,0,0)
}

x.restore()
})
}

function draw(p){

x.save();

x.translate(p.x,p.y);
x.rotate((p.r||0)*Math.PI/180);
x.scale(p.s,p.s);

base(p);
deco(p);

x.restore()
}

function render(){

blank();

[
"gown",
"shirt",
"trousers",
"nikka",
"maleHead",
"femaleHead",
"cap"
].forEach(k=>{
if(parts[k])draw(parts[k])
})
}

const T={
Dress:[
["Ball","gown"],
["A-Line","gown"],
["Mermaid","gown"],
["Menu","gown"]
],
Top:[
["Shirt","shirt"],
["Crop","shirt"],
["Blouse","shirt"]
],
Bottom:[
["Trouser","trousers"],
["Nikka","nikka"],
["Jeans","trousers"]
],
Cap:[
["Cap","cap"],
["Flat","cap"],
["Bucket","cap"]
],
Head:[
["Male Head","maleHead"],
["Female Head","femaleHead"]
]
};

function templates(){

$("temps").innerHTML=(T[$("cat").value]||[]).map(v=>
`<button type="button" class="template" data-temp="${v[1]}">${v[0]}</button>`
).join("")
}

function useTemplate(t){

reset();

sel=t;

parts[t]=part(
t,
(t==="maleHead"||t==="femaleHead")?.65:.75
);

update();
render();
snap()
}

function tool(t){

if(!sel||!parts[sel])
return alert("Select clothing first");

let p=parts[sel];

if(t==="recolor")
return apply();

if(t==="text"){

let q=prompt("Enter text");

if(q)
p.decor.push({
type:"text",
text:q,
color:col
});

}

else if(t==="length"){

p.s=Math.min(4,p.s+.15)

}

else{

/* prevent duplicate belt, necklace and neck */
if(["belt","necklace","neck"].includes(t)){
p.decor=p.decor.filter(d=>d.type!==t)
}

p.decor.push({
type:t,
color:col
});

}

render();
snap()
}

function clearTools(){

if(!sel||!parts[sel])
return alert("Select clothing first");

parts[sel].decor=[];

render();
snap()
}

function clearAll(){

if(!confirm("Clear the canvas?"))return;

reset();
sel=null;
blank();
update();
snap()
}

function saved(){

try{
return JSON.parse(localStorage.getItem(KEY)||"[]")
}catch(e){
return[]
}
}

function load(){

let a=saved();

$("wardrobe").innerHTML=a.length?a.map(i=>
`<div class="card">
<button type="button" class="del" data-del="${i._id}">×</button>
<img src="${i.image}" data-open="${i._id}">
<div class="acts">
<button type="button" class="top" data-addsaved="${i._id}" data-type="shirt">TOP</button>
<button type="button" class="bottom" data-addsaved="${i._id}" data-type="trousers">BOTTOM</button>
<button type="button" class="cap" data-addsaved="${i._id}" data-type="cap">CAP</button>
</div>
</div>`
).join(""):'<div class="empty">No clothes saved yet.</div>'
}

function save(){

let n=$("name").value.trim();

if(!n)
return alert("Name your design first");

let a=saved();

a.push({
_id:Date.now(),
name:n,
image:c.toDataURL()
});

try{

localStorage.setItem(KEY,JSON.stringify(a));
$("name").value="";
load();

alert("Design saved successfully!")

}catch(e){

alert("Could not save. Local storage may be full.")

}
}

function openSaved(id){

let i=saved().find(v=>+v._id===+id);

if(!i)return;

$("wname").textContent=i.name;
$("wimg").src=i.image;
$("wide").style.display="flex"
}

function addSaved(id,t){

let v=saved().find(i=>+i._id===+id);

if(!v)return;

let im=new Image;

im.onload=()=>{

let p=part(t,.75);

p.img=im;

parts[t]=p;
sel=t;

update();
renderSaved();
snap()

};

im.src=v.image
}

function renderSaved(){

blank();

[
"gown",
"shirt",
"trousers",
"nikka",
"maleHead",
"femaleHead",
"cap"
].forEach(k=>{

let p=parts[k];

if(!p)return;

x.save();

x.translate(p.x,p.y);
x.rotate((p.r||0)*Math.PI/180);
x.scale(p.s,p.s);

if(p.img)
x.drawImage(p.img,-50,-50,100,100);
else
base(p);

deco(p);

x.restore()

})
}
