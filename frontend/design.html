<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SewLab Layering</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#2e333b;overflow-y:auto}
header{height:40px;padding:0 3%;display:flex;align-items:center;background:#40454f;position:sticky;top:0;z-index:5}
.logo{font-weight:bold;color:#e65a9d;font-size:13px}
.section{padding:6px 3%}
.glass{background:#40454f;border-radius:10px;padding:8px;margin-bottom:6px;border:1px solid #596071}
h2{font-size:14px;color:#e65a9d;margin-bottom:4px}
h3{font-size:11px;color:#bfc7db;margin:4px 0 3px;font-weight:600}
#designCanvas{width:100%;height:120px;background:#262a30;border:2px solid #596071;border-radius:8px;display:block}
input,select{width:100%;padding:7px;border:2px solid #666e8c;border-radius:6px;margin-bottom:4px;font-size:11px;background:#33373f;color:#d9e0ef}
button{border:0;cursor:pointer;border-radius:6px;font-weight:bold;font-size:11px;padding:8px;width:100%;margin-bottom:4px}
.btn-main{background:linear-gradient(90deg,#d94c99,#cc40d9);color:#fff}
.btn-tool{padding:5px 1px;background:#4d525f;color:#bfc7db;font-size:7px;border:1px solid #666e8c;min-height:30px}
.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.template-btn{padding:6px;background:#4d525f;border:1px solid #666e8c;border-radius:6px;font-size:9px;text-align:center;cursor:pointer;color:#bfc7db}
.color-row{display:flex;gap:4px}
.color-row input{width:35px;height:30px;padding:1px;margin:0}
.color-row button{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px}
.card{position:relative;background:#40454f;border-radius:8px;overflow:hidden;border:1px solid #596071}
.card img{width:100%;height:100px;object-fit:cover}
.card-actions{display:flex;gap:2px}
.btn-add{background:#5abf66;color:#fff;font-size:6px;padding:2px;margin-bottom:0;flex:1}
.btn-add2{background:#0da6e6;color:#fff;font-size:6px;padding:2px;margin-bottom:0;flex:1}
.delete-btn{position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;background:#e64c4c;color:#fff;border-radius:50%;z-index:2;font-size:8px}
</style>
</head>
<body>
<header><div class="logo">SewLab Layering ✂️</div></header>
<section class="section"><div class="glass">
<h2>Design Studio</h2>
<canvas id="designCanvas"></canvas>
<select id="itemCategory"><option>Dress</option><option>Top</option><option>Bottom</option></select>
<div class="templates" id="templateArea"></div>
<div class="color-row"><input type="color" id="colorPicker" value="#ec4899"><button onclick="color()">APPLY</button></div>
<input id="itemName" placeholder="Name"><button class="btn-main" id="save">Save</button><button class="btn-main" id="clear" style="background:#f27f33">CLEAR</button>
</div></section>
<section class="section"><div class="glass"><h2>My Collection</h2><div id="wardrobe" class="cards"></div></div></section>

<script>
const $=x=>document.getElementById(x),c=$("designCanvas"),x=c.getContext("2d");
let hist=[],pos=-1,colorNow="#ec4899";
const STORAGE_KEY = "sewlab_collection";
function blank(){x.fillStyle="#262a30";x.fillRect(0,0,c.width,c.height)}
function size(){c.width=c.offsetWidth;c.height=120;blank()}
size();
function saveH(){let a=c.toDataURL();if(hist[pos]===a)return;hist=hist.slice(0,pos+1);hist.push(a);if(hist.length>50)hist.shift();pos=hist.length-1}
function put(a){let i=new Image;i.onload=()=>{x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height)};i.src=a}
$("colorPicker").oninput=e=>colorNow=e.target.value;
function color(){saveH();x.globalCompositeOperation="source-atop";x.fillStyle=colorNow; x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation="source-over";saveH()}

const temps={Dress:[["Ball","ball"],["A-Line","aline"],["Mumu","mumu"]],Top:[["Shirt","shirt"],["Crop","crop"]],Bottom:[["Trouser","trouser"],["Jeans","jeans"]]};
function templates(){$("templateArea").innerHTML=temps[$("itemCategory").value].map(t=>`<div class="template-btn" onclick="template('${t[1]}')">${t[0]}</div>`).join("")}
$("itemCategory").onchange=templates;templates();

function template(t){
 saveH();blank();x.fillStyle=colorNow;let w=c.width/2;
 if(t==="ball"){x.beginPath();x.moveTo(w-16,16);x.quadraticCurveTo(w,13,w+16,16);x.lineTo(w+32,c.height-13);x.quadraticCurveTo(w,c.height-8,w-32,c.height-13);x.closePath();x.fill()}
 if(t==="aline"){x.beginPath();x.moveTo(w-13,16);x.quadraticCurveTo(w,13,w+13,16);x.lineTo(w+24,c.height-13);x.lineTo(w-24,c.height-13);x.closePath();x.fill()}
 if(t==="mumu"){x.beginPath();x.moveTo(w-13,16);x.lineTo(w+13,16);x.lineTo(w+26,c.height-13);x.lineTo(w-26,c.height-13);x.closePath();x.fill()}
 if(t==="shirt"){x.fillRect(w-18,16,36,40)}
 if(t==="crop")x.fillRect(w-16,16,32,22);
 if(t==="trouser"){x.fillRect(w-12,52,24,5);x.fillRect(w-11,57,7,40);x.fillRect(w+4,57,7,40)}
 if(t==="jeans"){x.fillRect(w-10,52,20,5);x.fillRect(w-9,57,5,40);x.fillRect(w+4,57,5,40)}
 saveH();
}

$("clear").onclick=()=>{saveH();blank();saveH()};
$("save").onclick=()=>{
 let name=$("itemName").value.trim();if(!name)return alert("Name it");
 let collection = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 collection.push({_id:Date.now().toString(),name:name,category:$("itemCategory").value,color:colorNow,image:c.toDataURL()});
 localStorage.setItem(STORAGE_KEY, JSON.stringify(collection));
 alert("Saved!");$("itemName").value="";load();
};

// NO SPACE BETWEEN TOP AND BOTTOM
function addTop(image){
 saveH();
 let i=new Image();
 i.onload=()=>{
  let nw=c.width*0.52;
  let nh=c.height*0.48;
  let xp=(c.width-nw)/2;
  x.drawImage(i,xp,0,nw,nh); // starts at 0
  saveH();
 };
 i.src=image;
}

function addBottom(image){
 saveH();
 let i=new Image();
 i.onload=()=>{
  let nw=c.width*0.52;
  let nh=c.height*0.52;
  let xp=(c.width-nw)/2;
  x.drawImage(i,xp,c.height*0.48,nw,nh); // starts where top ends
  saveH();
 };
 i.src=image;
}

function del(id){
 let collection = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 collection = collection.filter(item => item._id!== id);
 localStorage.setItem(STORAGE_KEY, JSON.stringify(collection));
 load();
}

function load(){
 let list=$("wardrobe");
 let collection = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 if(!collection.length)return list.innerHTML='<div style="text-align:center;padding:10px;color:#99a1b3">Empty</div>';
 list.innerHTML=collection.map(a=>`
    <div class="card">
      <button class="delete-btn" onclick="del('${a._id}')">X</button>
      <img src="${a.image}">
      <div style="padding:3px">
        <h3 style="font-size:9px">${a.name}</h3>
        <div class="card-actions">
          <button class="btn-add" onclick="addTop('${a.image}')">TOP</button>
          <button class="btn-add2" onclick="addBottom('${a.image}')">BOTTOM</button>
        </div>
      </div>
    </div>
  `).join("");
}
load();
</script>
</body>
</html>
