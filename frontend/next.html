<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      color:#fff;
      background:#0a0a0f;
      position:relative;
      overflow-x:hidden;
    }
    /* background glow */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
        radial-gradient(600px at 20% 10%, rgba(99,102,241,0.25), transparent 60%),
        radial-gradient(800px at 80% 90%, rgba(139,92,246,0.20), transparent 60%),
        radial-gradient(500px at 50% 50%, rgba(59,130,246,0.15), transparent 70%);
      pointer-events:none;
      z-index:-1;
    }
    header{
      position:sticky;top:0;z-index:10;
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 20px;
      background:rgba(18,18,24,0.7);
      backdrop-filter:blur(20px) saturate(180%);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    header h1{
      font-size:18px;font-weight:700;letter-spacing:-0.3px;
      background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .btn-logout{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      color:#fff;
      padding:8px 16px;border-radius:100px;
      font-size:13px;font-weight:600;cursor:pointer;
      transition:.2s;display:flex;align-items:center;gap:6px;
    }
    .btn-logout:hover{background:rgba(255,255,255,0.15);transform:translateY(-1px)}

    .container{
      max-width:700px;margin:0 auto;
      padding:32px 20px 40px;
      display:flex;flex-direction:column;gap:28px;
    }
    .welcome{text-align:center}
    .welcome h2{
      font-size:clamp(22px,5vw,32px);
      font-weight:700;letter-spacing:-0.5px;
      margin-bottom:6px;
    }
    .welcome p{font-size:14px;color:rgba(255,255,255,0.6)}

    .dashboard{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }
    .card{
      position:relative;
      border-radius:20px;
      padding:22px 16px;
      text-align:left;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.1);
      overflow:hidden;
      transition:all .35s cubic-bezier(.2,.8,.2,1);
      isolation:isolate;
      min-height:130px;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .card::before{
      content:'';
      position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent);
      opacity:0;transition:.35s;z-index:-1;
    }
    .card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(255,255,255,0.2);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
    .card:hover::before{opacity:1}
    .card .icon{font-size:28px;margin-bottom:12px}
    .card .label{font-size:16px;font-weight:600;letter-spacing:-0.2px}
    .card .sub{font-size:12px;opacity:.7;margin-top:4px;font-weight:400}
    .card .arrow{position:absolute;top:16px;right:16px;font-size:14px;opacity:.5;transition:.2s}
    .card:hover .arrow{opacity:1;transform:translateX(3px)}

    /* specific gradients */
    .whot{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);grid-column:span 2;min-height:150px}
    .game{background:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 100%)}
    .chess{background:linear-gradient(135deg,#10b981 0%,#059669 100%)}

    /* ad placeholder - responsive and centered */
    .ad-wrapper{
      width:100%;max-width:600px;height:130px;
      margin:0 auto;
      background:rgba(255,255,255,0.04);
      border:1px dashed rgba(255,255,255,0.1);
      border-radius:16px;
      display:grid;place-items:center;
      font-size:12px;color:rgba(255,255,255,0.4);
    }

    footer{text-align:center;padding:20px;font-size:11px;color:rgba(255,255,255,0.35)}

    @media(max-width:480px){
      header{padding:12px 16px}
      header h1{font-size:16px}
      .container{padding:20px 16px}
      .dashboard{gap:12px}
      .card{border-radius:18px;min-height:120px;padding:18px 14px}
      .card .label{font-size:15px}
      .whot{min-height:135px}
    }
  </style>
</head>
<body>

  <header>
    <h1>Private Space</h1>
    <button class="btn-logout logout">← Back</button>
  </header>

  <div class="container">
    <div class="welcome">
      <h2>Welcome Back 👋</h2>
      <p>Choose what you want to play today</p>
    </div>

    <!-- If you want ads, keep this clean wrapper -->
    <!-- <div class="ad-wrapper">Ad Space</div> -->

    <div class="dashboard">
      <div class="card whot">
        <div class="arrow">↗</div>
        <div class="icon">🃏</div>
        <div>
          <div class="label">Whot Card Game</div>
          <div class="sub">Classic Nigerian whot • 2-4 players</div>
        </div>
      </div>

      <div class="card game">
        <div class="arrow">↗</div>
        <div class="icon">⚫</div>
        <div>
          <div class="label">Draughts</div>
          <div class="sub">Checkers battle</div>
        </div>
      </div>

      <div class="card chess">
        <div class="arrow">↗</div>
        <div class="icon">♞</div>
        <div>
          <div class="label">Chess</div>
          <div class="sub">Master the board</div>
        </div>
      </div>
    </div>
  </div>

  <footer>Private Space • v1.0</footer>

  <script>
    document.querySelector('.whot').onclick = () => window.location.href = "whot.html";
    document.querySelector('.game').onclick = () => window.location.href = "drat.html";
    document.querySelector('.chess').onclick = () => window.location.href = "chess.html";
    document.querySelector('.logout').onclick = () => window.location.href = "mainpage.html";
  </script>
</body>
</html>
