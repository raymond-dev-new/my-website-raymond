<!DOCTYPE html>
<html lang="en">
<head>
  <script>
   const tokenn = localStorage.getItem('token');
   if (!tokenn) {
     window.location.replace('/login.html');
   } 
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url("photo_2026-07-27_08-21-15.jpg") center/cover no-repeat fixed;
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER - SMALLER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px; /* was 16px 24px */
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      font-size: 20px; /* was 24px */
      font-weight: 700;
      background: linear-gradient(90deg, #4b75ff, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-logout {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 14px; /* was 10px 18px */
      border-radius: 10px; /* was 12px */
      font-weight: 600;
      font-size: 14px; /* ADDED */
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: #e84118;
      transform: translateY(-2px);
    }

    /* MAIN GRID - SMALLER */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px; /* was 40px 20px */
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px; /* was 40px */
    }
    .welcome h2 {
      font-size: 24px; /* was 32px */
      font-weight: 700;
      margin-bottom: 6px;
    }
    .welcome p {
      font-size: 14px; /* was 16px */
      opacity: 0.8;
    }

    /* BUTTON GRID - SMALLER CARDS */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* was 140px */
      gap: 14px; /* was 20px */
      width: 100%;
      max-width: 500px; /* was 600px */
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; /* was 20px */
      padding: 18px 12px; /* was 24px 16px */
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px; /* was 16px */
    }
    .card:hover {
      transform: translateY(-4px); /* was -5px */
      background: rgba(255,255,255,0.15);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3); /* was 8px 20px */
    }

    /* COLORS BY CATEGORY */
    .card.diary { background: linear-gradient(135deg, #667eea, #764ba2); }
    .card.expense { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .card.quiz { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .card.todo { background: linear-gradient(135deg, #43e97b, #38f9d7); }
    .card.calc { background: linear-gradient(135deg, #fa709a, #fee140); }
    .card.design { background: linear-gradient(135deg, #30cfd0, #330867); }
    .card.game { background: linear-gradient(135deg, #ffa502, #ff6347); grid-column: span 2; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 16px; /* was 20px */
      font-size: 11px; /* was 12px */
      opacity: 0.6;
    }

    /* MOBILE - EVEN SMALLER */
    @media (max-width: 480px) {
      header h1 { font-size: 18px; }
      .welcome h2 { font-size: 20px; }
      .dashboard { gap: 10px; grid-template-columns: repeat(2, 1fr); }
      .card { padding: 14px 10px; font-size: 13px; border-radius: 14px; }
      .card.game { grid-column: span 2; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Private Space</h1>
    <button class="btn-logout logout">← Back</button>
  </header>

  <div class="container">
    <div class="welcome">
      <h2>Welcome Back 👋</h2>
      <p>Choose what you want to do today</p>
    </div>

    <div class="dashboard">
      <div class="card diary">📓 Diary</div>
      <div class="card expense">💰 Expense</div>
      <div class="card quiz">🧠 Quiz</div>
      <div class="card todo">✅ Todo</div>
      <div class="card calc">🧮 Calculator</div>
      <div class="card design">🎨 Designers</div>
      <div class="card game">♟ Draughts</div>
    </div>
  </div>

  <script>
    document.querySelector('.diary').onclick = () => window.location.href = "mycorner.html";
    document.querySelector('.expense').onclick = () => window.location.href = "expense.html";
    document.querySelector('.quiz').onclick = () => window.location.href = "quiz.html";
    document.querySelector('.todo').onclick = () => window.location.href = "todo.html";
    document.querySelector('.calc').onclick = () => window.location.href = "calculate.html";
    document.querySelector('.design').onclick = () => window.location.href = "design.html";
    document.querySelector('.game').onclick = () => window.location.href = "drat.html";
    document.querySelector('.logout').onclick = () => window.location.href = "mainpage.html";
  </script>
</body>
</html>
