<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Insta Clone</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { border:1px solid #333; padding:40px; width:300px; text-align:center; background:#111; }
input { width:90%; padding:10px; margin:8px 0; background:#222; border:1px solid #333; color:#fff; }
button { width:95%; padding:10px; background:#0095f6; border:none; color:#fff; font-weight:bold; cursor:pointer; margin-top:10px; }
a { color:#0095f6; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<div class="box">
<h2>RAyMoNd</h2> <!-- logo -->
<input id="username" placeholder="Username"> <!-- username -->
<input id="email" placeholder="Email"> <!-- email -->
<input id="password" type="password" placeholder="Password"> <!-- password -->
<button onclick="register()">Sign up</button> <!-- signup -->
<p><a href="login.html">Have account? Log in</a></p> <!-- link to login -->
<p id="msg"></p> <!-- msg -->
</div>

<script>
async function register() { // register
  const username = document.getElementById('username').value; // username
  const email = document.getElementById('email').value; // email
  const password = document.getElementById('password').value; // password
  const res = await fetch('https://raymonddomain.dev/api/auth/register', { // call backend
    method: 'POST', // post
    headers: { 'Content-Type': 'application/json' }, // json
    body: JSON.stringify({ username, email, password }) // data
  });
  const data = await res.json(); // response
  if (data.token) { // success
    localStorage.setItem('token', data.token); // save token
    localStorage.setItem('user', JSON.stringify(data.user)); // save user
    window.location = 'feed.html'; // go to feed - linked
  } else {
    document.getElementById('msg').innerText = data.msg; // error
  }
}
</script>
</body>
</html>
