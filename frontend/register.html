<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - RAyMoNd</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:380px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:28px}h1{text-align:center;font-family:cursive;font-size:32px;margin:0 0 4px}p{text-align:center;color:#c4b5fd;font-size:13px;margin:0 0 20px}label{font-size:12px;color:#ddd}input{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;padding:14px;margin:6px 0 12px;outline:none}input::placeholder{color:#aaa}button{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.center{text-align:center;margin-top:16px}a{color:#c4b5fd;text-decoration:none;font-size:14px}</style>
</head><body>
<div class="card"><h1>Join WildReaders ✨</h1><p>Create your account with email</p>
<label>Username</label><input id="username" placeholder="e.g. raymond">
<label>Email</label><input id="email" type="email" placeholder="you@gmail.com">
<label>Password</label><input id="pass" type="password" placeholder="Create password">
<button onclick="register()">Create Account 🎉</button>
</div>
<script>
const BASE="https://raymonddomain.dev";
async function register(){
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('pass').value;
  if(!username||!email||!password) return alert('Fill all');
  const res=await fetch(BASE+'/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});
  const d=await res.json();
  if(!res.ok) return alert(d.msg||'Failed');
  localStorage.setItem('token',d.token);
  location.href='feed.html';
}
</script></body></html>
