<!DOCTYPE html>
<html>
<head>
  <script>
  const tokenN = localStorage.getItem('token');
    if (!tokenN) {
      window.location.replace('/login.html');
    }
    </script>
<title>City Driver PHONE FIX V11.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<style>
  *{touch-action: manipulation;}
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; padding-bottom: env(safe-area-inset-bottom); } /* FIX FOR IPHONE/ANDROID BAR */
  #gameContainer { position:relative; width:100vw; height:90vh; background:#000; overflow:hidden; }
  
  #menu { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:5px; }
  .mainBtn { padding:7px 10px; background:#FF6B00; border:none; color:#fff; font-weight:bold; border-radius:8px; font-size:11px; cursor:pointer; box-shadow:0 2px 4px #000; }
  #ghostBtn { background:#00FF88; }
  
  #hud { position:absolute; top:8px; left:8px; font-size:12px; color:#fff; background:rgba(0,0,0,0.85); padding:5px 8px; border-radius:6px; z-index:5; }
  #cityName { position:absolute; top:8px; right:8px; font-size:12px; color:#FFD700; font-weight:bold; text-shadow:0 0 2px #000; z-index:5; }
  
  #controls { 
    position:absolute; 
    bottom: calc(15px + env(safe-area-inset-bottom)); /* LIFT ABOVE NAV BAR */
    width:100%; 
    display:flex; 
    justify-content:center; 
    gap:8px; 
    z-index:5; 
    padding:0 5px;
    box-sizing:border-box;
  }
  .pad { 
    width:18vw; /* USE % OF SCREEN WIDTH */
    max-width:55px; 
    height:18vw; 
    max-height:55px; 
    font-size:20px; 
    background:rgba(34,34,34,0.95); 
    color:#00E5FF; 
    border:2px solid #00E5FF; 
    border-radius:14px; 
    cursor:pointer; 
    user-select:none; 
    box-shadow:0 0 8px #00E5FF;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #boost { background:rgba(0,255,136,0.95); color:#000; border-color:#00FF88; box-shadow:0 0 8px #00FF88; }
  #brake { background:rgba(255,59,48,0.95); color:#fff; border-color:#FF3B30; box-shadow:0 0 8px #FF3B30; }
  #downBtn { background:rgba(255,165,0,0.95); color:#000; border-color:#FFA500; box-shadow:0 0 8px #FFA500; } /* ORANGE DOWN */
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">Speed: 0 KM/H | Score: 0</div>
  <div id="cityName">CITY</div>
  
  <div id="menu">
    <button class="mainBtn" onclick="game.play()">PLAY</button>
    <button class="mainBtn" onclick="game.pause()">PAUSE</button>
    <button id="ghostBtn" class="mainBtn" onclick="game.toggleGhost()">GHOST: ON</button>
  </div>

  <div id="controls">
    <button class="pad" id="leftBtn">←</button>
    <button class="pad" id="upBtn">↑</button>
    <button class="pad" id="downBtn">↓</button> <!-- NEW DOWN BUTTON -->
    <button class="pad" id="rightBtn">→</button>
    <button class="pad" id="brakeBtn">B</button>
    <button class="pad" id="boostBtn">N</button>
  </div>

  <canvas id="game"></canvas>
</div>
<script>
const game = {
  canvas: document.getElementById('game'),
  ctx: null,
  running: true,
  speed: 7,
  carX: 0, carY: 0,
  left: false, right: false, up: false, down: false, brake: false, boost: false, // ADDED DOWN
  score: 0, city: 0, roadOffsetX: 0,
  traffic: [], buildings: [], 
  cities: ['CITY','DESERT','NIGHT'],
  SAFE_DISTANCE: 85,
  ghostMode: true,
  ROAD_WIDTH: 170,

  init() {
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this.reset();
    this.setupButtons();
    this.loop();
    window.addEventListener('keydown', e=>{ 
      if(e.key=='ArrowLeft')this.left=true; 
      if(e.key=='ArrowRight')this.right=true; 
      if(e.key=='ArrowUp')this.up=true;
      if(e.key=='ArrowDown')this.down=true; // KEYBOARD DOWN
    });
    window.addEventListener('keyup', e=>{ 
      if(e.key=='ArrowLeft')this.left=false; 
      if(e.key=='ArrowRight')this.right=false; 
      if(e.key=='ArrowUp')this.up=false;
      if(e.key=='ArrowDown')this.down=false;
    });
  },

  toggleGhost(){
    this.ghostMode = !this.ghostMode;
    document.getElementById('ghostBtn').innerText = `GHOST: ${this.ghostMode?'ON':'OFF'}`;
    document.getElementById('ghostBtn').style.background = this.ghostMode?'#00FF88':'#FF3B30';
  },

  setupButtons(){
    const bind = (id, down, up) => {
      const el = document.getElementById(id);
      if(!el) return;
      ['mousedown','touchstart'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); down();}));
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); up();}));
    };
    bind('leftBtn', ()=>this.left=true, ()=>this.left=false);
    bind('rightBtn', ()=>this.right=true, ()=>this.right=false);
    bind('upBtn', ()=>this.up=true, ()=>this.up=false);
    bind('downBtn', ()=>this.down=true, ()=>this.down=false); // NEW DOWN BIND
    bind('brakeBtn', ()=>this.brake=true, ()=>this.brake=false);
    bind('boostBtn', ()=>this.boost=true, ()=>this.boost=false);
  },

  resize(){
    this.canvas.width = window.innerWidth * window.devicePixelRatio;
    this.canvas.height = window.innerHeight * window.devicePixelRatio;
    this.ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);
    this.carX = window.innerWidth/2;
    this.carY = window.innerHeight - 150; // CAR HIGHER SO BUTTONS DON'T COVER
    this.roadPositions = [window.innerWidth/2-55, window.innerWidth/2, window.innerWidth/2+55];
  },

  reset() {
    this.speed=7; this.score=0; this.carX=window.innerWidth/2; this.carY=window.innerHeight-150; this.roadOffsetX=0;
    this.traffic=[]; this.buildings=[];

    for(let i=0;i<20;i++) this.buildings.push({
      x: Math.random()*window.innerWidth,
      y: -Math.random()*1200,
      w: 45+Math.random()*35,
      h: 90+Math.random()*100,
      floors: Math.floor(Math.random()*3)+2
    });

    // ONLY 4 CARS
    for(let lane=0; lane<3; lane++){
      for(let i=0;i<2;i++){
        if(lane==2 && i==1) continue;
        this.traffic.push({
          lane: lane,
          x: this.roadPositions[lane],
          y: -i*420 - 350,
          color: `hsl(${Math.random()*360},90%,55%)`,
          speed: 1 + Math.random()*0.8,
          targetLane: lane,
          avoiding: false
        });
      }
    }
    this.updateStats();
  },

  play(){ this.running=true; },
  pause(){ this.running=false; },

  updateStats(){ document.getElementById('hud').innerText = `Speed: ${Math.floor(this.speed*5)} KM/H | Score: ${this.score}`; },

  update(){
    if(!this.running) return;

    let moveSpeed = 5.5;
    if(this.left) { this.carX -= moveSpeed; this.roadOffsetX += 1.6; }
    if(this.right) { this.carX += moveSpeed; this.roadOffsetX -= 1.6; }
    if(this.up){ this.carY -= 5; this.speed += 0.35; }
    if(this.down){ this.carY += 5; this.speed -= 0.5; } // DOWN BUTTON = GO BACK
    if(this.brake) { this.speed -= 1; }
    if(this.boost) this.speed += 0.9;
    
    if(!this.up && !this.boost && !this.down) this.speed *= 0.99; 
    if(this.speed < 4) this.speed = 4;
    this.speed = Math.max(4, Math.min(this.speed, 28));

    this.carY = Math.max(90, Math.min(this.carY, window.innerHeight - 90));
    this.carX = Math.max(20, Math.min(this.carX, window.innerWidth-20));
    
    this.roadOffsetX *= 0.93; 
    
    if(Math.abs(this.roadOffsetX) > 95){
      this.city = (this.city + (this.roadOffsetX>0?2:1)) % 3;
      document.getElementById('cityName').innerText = this.cities[this.city];
      this.roadOffsetX *= 0.5;
    }

    this.buildings.forEach(b=>{ 
      b.y += this.speed; 
      if(b.y > window.innerHeight) b.y = -150;
    });

    this.traffic.forEach(t=>{
      t.avoiding = false;
      t.x = this.roadPositions[t.targetLane] + this.roadOffsetX;
      t.y += this.speed + t.speed;
      
      let dx = t.x - this.carX;
      let dy = t.y - this.carY;
      let dist = Math.hypot(dx, dy);

      if(this.ghostMode && dist < this.SAFE_DISTANCE && Math.abs(dy) < 120){
        if(dx > 0){ if(t.lane < 2) t.targetLane = t.lane + 1; }
        else { if(t.lane > 0) t.targetLane = t.lane - 1; }
        t.speed *= 0.92;
        t.avoiding = true;
      }

      if(t.y > window.innerHeight){
        t.y = -420 - Math.random()*150;
        t.lane = Math.floor(Math.random()*3);
        t.targetLane = t.lane;
        t.speed = 1 + Math.random()*0.8;
        this.score++;
      }

      if(!this.ghostMode && dist < 32) {
        this.running=false;
        setTimeout(()=>{ alert(`CRASH! Score: ${this.score}`); this.reset(); }, 200);
      }
    });

    this.updateStats();
  },

  drawCar(x,y,color,avoiding){
    this.ctx.fillStyle=color;
    this.roundRect(x-14, y-24, 28, 48, 4);
    this.ctx.fill();
    this.ctx.fillStyle='rgba(0,0,0,0.7)';
    this.ctx.fillRect(x-9, y-18, 18, 8);
    this.ctx.fillRect(x-9, y+8, 18, 8);
    this.ctx.fillStyle = avoiding? '#FF0000' : '#FFFFAA';
    this.ctx.fillRect(x-12, y-21, 5, 2);
    this.ctx.fillRect(x+7, y-21, 5, 2);
    this.ctx.fillStyle='#111';
    [[-9,-14], [9,-14], [-9,12], [9,12]].forEach(([ox,oy])=>{
      this.ctx.beginPath(); this.ctx.arc(x+ox, y+oy, 3.5, 0, Math.PI*2); this.ctx.fill();
    });
  },
  roundRect(x, y, w, h, r){
    this.ctx.beginPath();
    this.ctx.moveTo(x+r, y);
    this.ctx.lineTo(x+w-r, y);
    this.ctx.arcTo(x+w, y, x+w, y+r, r);
    this.ctx.lineTo(x+w, y+h-r);
    this.ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    this.ctx.lineTo(x+r, y+h);
    this.ctx.arcTo(x, y+h, x, y+h-r, r);
    this.ctx.lineTo(x, y+r);
    this.ctx.arcTo(x, y, x+r, y, r);
    this.ctx.closePath();
  },

  draw(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    let sky = this.ctx.createLinearGradient(0,0,0,h);
    if(this.city==0){ sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#E0F6FF'); }
    if(this.city==1){ sky.addColorStop(0,'#DEB887'); sky.addColorStop(1,'#F5DEB3'); }
    if(this.city==2){ sky.addColorStop(0,'#050515'); sky.addColorStop(1,'#1a1a3a'); }
    this.ctx.fillStyle=sky;
    this.ctx.fillRect(0,0,w,h);

    this.buildings.forEach(b=>{
      this.ctx.fillStyle=this.city==1?'#8B4513':(this.city==2?'#151515':'#333');
      this.ctx.fillRect(b.x, b.y, b.w, b.h);
      for(let i=0;i<b.floors;i++){
        this.ctx.fillStyle=this.city==2?'#FFD700':'#ADD8E6';
        this.ctx.fillRect(b.x+4, b.y+7+i*(b.h/b.floors), 5, 5);
        this.ctx.fillRect(b.x+b.w-9, b.y+7+i*(b.h/b.floors), 5, 5);
      }
    });

    let roadX = w/2 + this.roadOffsetX;
    this.ctx.fillStyle='#222';
    this.ctx.fillRect(roadX-this.ROAD_WIDTH/2, 0, this.ROAD_WIDTH, h);
    this.ctx.strokeStyle=this.city==2?'#FFFF00':'#FFFFFF'; 
    this.ctx.setLineDash([22,15]);
    this.roadPositions.forEach(rp=>{
      let x = rp + this.roadOffsetX;
      this.ctx.beginPath(); this.ctx.moveTo(x,0); this.ctx.lineTo(x,h); this.ctx.stroke();
    });
    this.ctx.setLineDash([]);

    this.traffic.forEach(t=>this.drawCar(t.x,t.y,t.color,t.avoiding));

    this.ctx.shadowColor='rgba(255,0,0,0.9)'; this.ctx.shadowBlur=20;
    this.drawCar(this.carX, this.carY, '#FF0000', false);
    this.ctx.shadowBlur=0;

    if(!this.running){
      this.ctx.fillStyle='rgba(0,0,0,0.8)'; this.ctx.fillRect(0,0,w,h);
      this.ctx.fillStyle='#fff'; this.ctx.font='bold 28px Arial'; this.ctx.textAlign='center'; 
      this.ctx.fillText('PAUSED', w/2, h/2);
    }
  },

  loop(){
    this.update();
    this.draw();
    requestAnimationFrame(()=>this.loop());
  }
};

window.onload = ()=>game.init();
window.onresize = ()=>game.resize();
</script>
</body>
</html>
