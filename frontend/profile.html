<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAyMoNd - Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.top{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#000;z-index:10}
.top b{font-size:16px;letter-spacing:0.5px}
.top span{font-size:22px;cursor:pointer}
.wrap{max-width:470px;margin:0 auto;width:100%;padding-bottom:70px}
.profile-head{padding:18px 16px;display:flex;align-items:center;gap:18px}
.avatar-wrap{position:relative;width:86px;height:86px;flex-shrink:0}
.avatar-circle{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;overflow:hidden}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.cam-badge{position:absolute;bottom:0;right:0;width:28px;height:28px;background:#0095f6;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #000;font-size:14px;cursor:pointer}
.info h3{font-size:18px;margin-bottom:6px}
.counts{display:flex;gap:12px;font-size:14px;color:#fff;margin-bottom:10px}
.counts b{margin-right:3px}
.btns{display:flex;gap:8px}
.btn-blue{background:#0095f6;color:#fff;border:none;padding:7px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn-dark{background:#262626;color:#fff;border:none;padding:7px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.grid{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;background:#000;border-top:1px solid #1a1a1a}
.grid-item{aspect-ratio:1;background:#111;overflow:hidden;position:relative;cursor:pointer}
.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover;display:block}
.video-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);padding:2px 5px;border-radius:4px;font-size:9px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;padding:10px 0;z-index:20;max-width:470px;margin:0 auto;width:100%}
.bottom a{font-size:22px;text-decoration:none}
input#avatarInput{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>RAyMoNd</b><span onclick="location.href='settings.html'">☰</span></div>
  
  <div class="profile-head">
    <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
      <div class="avatar-circle" id="avatarCircle">R</div>
      <div class="cam-badge">📷</div>
    </div>
    <div class="info">
      <h3 id="username">RAyMoNd</h3>
      <div class="counts"><span><b id="postCount">0</b> posts</span><span><b id="followers">0</b> followers</span><span><b id="following">0</b> following</span></div>
      <div class="btns">
        <button class="btn-blue" onclick="location.href='create.html'">+ Post</button>
        <button class="btn-dark" onclick="document.getElementById('avatarInput').click()">Edit Avatar</button>
      </div>
    </div>
  </div>

  <input type="file" id="avatarInput" accept="image/*">
  <div class="grid" id="grid"></div>
</div>

<div class="bottom">
  <a href="feed.html">🏠</a>
  <a href="explore.html">🔍</a>
  <a href="create.html">➕</a>
  <a href="message.html">💬</a>
  <a href="notification.html">🔔</a>
  <a href="reels.html">🎬</a>
  <a href="profile.html">👤</a>
</div>

<script>
const BASE = "https://raymonddomain.dev";
const token = localStorage.getItem('token');
if(!token) location.href='login.html';

function fixUrl(u){
  if(!u) return "";
  if(u.startsWith('data:')) return u;
  if(u.startsWith('/api/')) return BASE+u;
  if(u.startsWith('/uploads')) return BASE+u;
  if(u.startsWith('http')) return u;
  return u;
}

async function loadProfile(){
  try{
    const r = await fetch(BASE+'/api/users/me/profile',{headers:{authorization:token}});
    const d = await r.json();
    const user = d.user;
    const posts = d.posts||[];
    
    document.getElementById('username').innerText = user.username;
    document.getElementById('postCount').innerText = posts.length;
    document.getElementById('followers').innerText = d.followersCount ?? user.followers?.length ?? 0;
    document.getElementById('following').innerText = d.followingCount ?? user.following?.length ?? 0;

    const avatarCircle = document.getElementById('avatarCircle');
    if(user.avatar){
      avatarCircle.innerHTML = `<img src="${fixUrl(user.avatar)}">`;
    }else{
      avatarCircle.innerText = user.username[0].toUpperCase();
    }

    const grid = document.getElementById('grid');
    if(!posts.length){
      grid.innerHTML = `<div style="grid-column:1/4;padding:40px;text-align:center;color:#555">No posts</div>`;
      return;
    }
    grid.innerHTML = posts.map(p=>{
      const raw = p.mediaUrl||"";
      const src = fixUrl(raw);
      const isVid = p.type==='video' || raw.includes('/api/media-file');
      const media = isVid ? `<video src="${src}" muted></video><span class="video-badge">▶</span>` : `<img src="${src}" loading="lazy">`;
      return `<div class="grid-item" onclick="location.href='post.html?id=${p._id}'">${media}</div>`;
    }).join('');

  }catch(e){ console.error(e); }
}

// Edit avatar
document.getElementById('avatarInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(BASE+'/api/users/avatar',{
    method:'PUT',
    headers:{ authorization: token },
    body: fd
  });
  const data = await r.json();
  if(data.avatar){
    document.getElementById('avatarCircle').innerHTML = `<img src="${fixUrl(data.avatar)}">`;
  }
  loadProfile();
});

loadProfile();
</script>
</body>
</html>
