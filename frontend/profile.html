<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, Roboto, Arial; overflow-x: hidden; }
    * { box-sizing: border-box; }
  .header { max-width: 935px; margin: 0 auto; padding: 12px 15px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 10; transition:.3s; }
  .header.shrink { padding: 8px 15px; }
  .profile-info { max-width: 935px; margin: 0 auto; padding: 16px 14px; display: flex; gap: 20px; align-items: flex-start; }
  .avatar-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; cursor: pointer; }
  .circle { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; overflow: hidden; border: 2px solid #262626; }
  .circle img { width: 100%; height: 100%; object-fit: cover; }
  .cam { position: absolute; bottom: 0; right: 0; background: #0095f6; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid #000; }
  .profile-main { flex: 1; min-width: 0; }
    #name { margin: 0; font-size: 22px; font-weight: 800; display:flex; align-items:center; gap:8px; }
  .edit-name-icon{font-size:14px; cursor:pointer; background:#262626; padding:4px 8px; border-radius:6px;}
  .stats { display: flex; gap: 24px; margin-top: 12px; align-items: flex-start; }
  .stat { display: flex; flex-direction: column; align-items: center; cursor: pointer; line-height: 1.1; }
  .stat b { color: #fff; font-size: 20px; font-weight: 800; display: block; }
  .stat span { color: #fff; font-size: 14px; margin-top: 2px; }
  .bio-wrap { margin-top: 10px; max-width: 340px; }
  .bio-name { font-weight: 700; color: #fff; font-size: 15px; display: block; }
  .bio-text { color: #fff!important; font-size: 14.5px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; display: block; margin-top: 2px; }
  .bio-link a { color: #e0f1ff; font-weight: 600; text-decoration: none; font-size: 14px; word-break: break-all; }
  .edit-bio-btn { margin-top: 8px; background: #262626; border: 1px solid #363636; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .follow-btn { margin-top: 8px; padding: 7px 18px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .follow { background: #0095f6; color: #fff; }
  .following { background: #262626; color: #fff; border: 1px solid #555; }
  .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn-post { background: #0095f6; color: #fff; padding: 7px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; }
  .btn-gray { background: #262626; color: #fff; padding: 7px 16px; border-radius: 8px; border: 1px solid #333; font-size: 14px; font-weight: 600; cursor: pointer; }
  .posts { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; max-width: 600px; margin: 10px auto 0; padding: 0 0 80px; width: 100%; }
  .post-box { aspect-ratio: 1/1; background: #111; overflow: hidden; cursor: pointer; position: relative; border-radius: 3px; opacity: 0; transform: translateY(18px) scale(.96); transition: all.5s cubic-bezier(.25,.8,.25,1); will-change: transform, opacity; }
  .post-box.visible { opacity: 1; transform: translateY(0) scale(1); }
  .post-box:active { transform: scale(.97); }
  .post-box img,.post-box video { width: 100%; height: 100%; object-fit: cover; display: block; background: #111; }
  .vid-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.7); padding: 3px 6px; border-radius: 5px; font-size: 11px; backdrop-filter: blur(4px); }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
  .nav a { color: #fff; text-decoration: none; font-size: 22px; }
  .wide-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 100; justify-content: center; align-items: flex-start; overflow-y: auto; }
  .modal-box { background: #121212; width: 92%; max-width: 850px; display: flex; border-radius: 12px; overflow: hidden; margin: 20px auto; }
  .modal-media { flex: 1.5; background: #000; display: flex; align-items: center; justify-content: center; min-height: 200px; }
  .modal-media img,.modal-media video { max-width: 100%; max-height: 80vh; object-fit: contain; }
  .modal-info { flex: 1; background: #000; display: flex; flex-direction: column; border-left: 1px solid #262626; min-width: 0; }
  .modal-head { padding: 12px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; }
  .comment-list { flex: 1; overflow-y: auto; padding: 10px; min-height: 60px; }
  .cmt { margin-bottom: 8px; font-size: 13px; }
  .modal-actions { padding: 10px; border-top: 1px solid #262626; background: #000; }
  .likes-count { font-weight: 700; font-size: 13px; margin-top: 6px; }
  .add-cmt { display: flex; gap: 6px; margin-top: 8px; }
  .add-cmt input { flex: 1; background: transparent; border: none; color: #fff; outline: none; }
  .add-cmt button { color: #0095f6; background: none; border: none; font-weight: 600; cursor: pointer; }
  .wide-actions { display: flex; gap: 8px; margin-top: 10px; }
  .wide-actions button { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; flex: 1; }
  .del-btn { background: #ed4956; color: #fff; }
  .close-btn { background: #363636; color: #fff; }
  .list-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 200; justify-content: center; align-items: center; }
  .list-box { background: #121212; width: 90%; max-width: 380px; max-height: 70vh; border-radius: 12px; overflow: hidden; }
  .list-head { padding: 12px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; }
  .list-body { overflow-y: auto; max-height: 60vh; }
  .user-row { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; align-items: center; }
  .avatar-sm { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-weight: 700; }
  .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-modal,.bio-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 300; justify-content: center; align-items: center; padding: 18px; }
  .avatar-modal.open,.bio-modal.open { display: flex; }
  .avatar-card,.bio-card { background: #1e1e1e; width: 100%; max-width: 360px; border-radius: 14px; padding: 18px; border: 1px solid #333; text-align: center; }
  .avatar-card img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; background: #111; }
  .avatar-card button,.bio-card button { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700; margin-top: 8px; cursor: pointer; font-size: 14px; }
  .btn-blue { background: #0095f6; color: #fff; }
  .btn-gray2 { background: #262626; color: #fff; }
  .bio-card { text-align: left; }
  .bio-card textarea,.bio-card input { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 11px; margin-top: 6px; outline: none; font-size: 14px; }
  .bio-card textarea { height: 90px; resize: none; }
  /* SKELETON - REPLACES FETCHING SPINNER */
  .skeleton-wrap{ max-width:935px; margin:0 auto; padding:16px 14px; display:flex; gap:20px; align-items:flex-start; }
  .sk{ background: linear-gradient(90deg,#151515 25%,#222 37%,#151515 63%); background-size:400% 100%; animation: shimmer 1.2s ease-in-out infinite; border-radius:8px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  .sk-avatar{ width:100px; height:100px; border-radius:50%; }
  .sk-line{ height:14px; margin-bottom:10px; }
  .sk-name{ width:120px; height:22px; }
  .sk-stats{ display:flex; gap:18px; margin-top:12px; }
  .sk-stat{ width:50px; height:36px; }
  .sk-bio{ width:180px; }
  .sk-btn{ width:90px; height:32px; margin-top:10px; border-radius:8px; }
  .sk-post{ aspect-ratio:1/1; background:#111; border-radius:3px; }
  @media(max-width:600px){
    .profile-info { padding: 14px 14px; gap: 16px; }
    .avatar-wrap,.circle { width: 86px; height: 86px; font-size: 28px; }
    .skeleton-wrap{ padding:14px; gap:16px; }
    .sk-avatar{ width:86px; height:86px; }
      #name { font-size: 20px; }
    .stats { gap: 18px; }
    .stat b { font-size: 18px; }
    .posts { max-width: 100%; gap: 2px; }
    .modal-box { flex-direction: column; width: 100%; border-radius: 0; margin: 0; min-height: 100dvh; }
  }
  </style>
</head>
<body>
  <div class="header" id="header"><b id="topname">Profile</b><span onclick="location.href='feed.html'" style="cursor:pointer">☰</span></div>
  <div id="skeletonProfile">
    <div class="skeleton-wrap">
      <div class="sk sk-avatar"></div>
      <div style="flex:1">
        <div class="sk sk-line sk-name"></div>
        <div class="sk-stats"><div class="sk sk-stat"></div><div class="sk sk-stat"></div><div class="sk sk-stat"></div></div>
        <div class="sk sk-line sk-bio" style="margin-top:12px"></div><div class="sk sk-line" style="width:140px"></div><div class="sk sk-btn"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:600px;margin:10px auto;padding:0 0 80px">
      <div class="sk sk-post"></div><div class="sk sk-post"></div><div class="sk sk-post"></div><div class="sk sk-post"></div>
    </div>
  </div>
  <div class="profile-info" id="profileInfo" style="display:none">
    <div class="avatar-wrap" onclick="openAvatarModal()"><div class="circle" id="letter"></div><div class="cam" id="camIcon" style="display:none">📷</div></div>
    <div class="profile-main">
      <h3 id="name"><span id="nameText"></span><span id="editNameIcon" class="edit-name-icon" style="display:none" onclick="openBioModal()">✏️ Edit</span></h3>
      <div class="stats"><div class="stat"><b id="pc">-</b><span>posts</span></div><div class="stat" onclick="showFollowers()"><b id="followersCount">-</b><span>followers</span></div><div class="stat" onclick="showFollowing()"><b id="followingCount">-</b><span>following</span></div></div>
      <div class="bio-wrap"><span class="bio-name" id="bioDisplayName"></span><span class="bio-text" id="bioText"></span><div class="bio-link" id="bioLink"></div><button class="edit-bio-btn" id="editBioBtn" onclick="openBioModal()">Edit Bio</button></div>
      <button id="followBtn" class="follow-btn follow" style="display:none" onclick="toggleFollow()">Follow</button>
      <div class="action-row" id="ownActions" style="display:none"><a href="create.html" class="btn-post">+ Post</a><button onclick="openAvatarModal()" class="btn-gray">Edit profile</button></div>
    </div>
  </div>
  <div class="posts" id="grid" style="display:none"></div>
  <div class="avatar-modal" id="avatarModal" onclick="if(event.target===this) closeAvatarModal()"><div class="avatar-card"><h3>Profile Photo</h3><img id="avatarPreview" style="display:none"><div id="avatarLetter" class="circle" style="width:160px;height:160px;margin:0 auto 12px;font-size:50px"></div><input type="file" id="avatarInput" accept="image/*" hidden onchange="handleAvatarSelect(this)"><button class="btn-blue" onclick="document.getElementById('avatarInput').click()">Choose Photo</button><button class="btn-blue" id="saveAvatarBtn" style="display:none" onclick="uploadAvatar()">Save</button><button class="btn-gray2" onclick="closeAvatarModal()">Cancel</button><button class="btn-blue" style="background:#111;color:#ff3040;border:1px solid #333;display:none" id="removeAvatarBtn" onclick="removeAvatar()">Remove Photo</button></div></div>
  <div class="bio-modal" id="bioModal" onclick="if(event.target===this) closeBioModal()"><div class="bio-card"><h3 style="text-align:center;margin:0">Edit Profile</h3><label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Username</label><input id="usernameInput" placeholder="username"><label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Display Name</label><input id="bioNameInput" placeholder="Display name"><label style="font-size:11px;color:#aaa;margin-top:10px;display:block">Bio</label><textarea id="bioInput" maxlength="150" placeholder="Your bio"></textarea><div style="text-align:right;color:#777;font-size:11px"><span id="bioCount">0</span>/150</div><label style="font-size:11px;color:#aaa;margin-top:8px;display:block">Link</label><input id="linkInput" placeholder="https://..."><button class="btn-blue" id="saveBioBtn" onclick="saveBio()">Save</button><button class="btn-gray2" onclick="closeBioModal()">Cancel</button></div></div>
  <div class="wide-modal" id="wide" onclick="if(event.target===this) closeWide()"><div class="modal-box"><div class="modal-media" id="wideMedia"></div><div class="modal-info"><div class="modal-head"><b id="wideUser"></b><span onclick="closeWide()" style="cursor:pointer;font-size:20px;padding:4px 8px;background:#222;border-radius:50%">✕</span></div><div class="comment-list" id="commentList"></div><div class="modal-actions"><span id="likeBtn" onclick="likePost()" style="cursor:pointer;font-size:22px">🤍</span><div class="likes-count" id="likesCount"></div><div class="add-cmt"><input id="cmtInput" placeholder="Add comment..."><button onclick="addComment()">Post</button></div><div class="wide-actions"><button class="del-btn" id="delBtn" onclick="deletePost()">Delete</button><button class="close-btn" onclick="closeWide()">Close</button></div></div></div></div></div>
  <div class="list-modal" id="followModal" onclick="if(event.target===this) closeList()"><div class="list-box"><div class="list-head"><b id="listTitle"></b><span onclick="closeList()" style="cursor:pointer">✕</span></div><div class="list-body" id="listBody"></div></div></div>
  <div class="nav"><a href="feed.html">🏠</a><a href="explore.html">🔍</a><a href="create.html">➕</a><a href="message.html">💬</a><a href="reels.html">🎬</a><a href="notification.html">🔔</a><a href="profile.html">👤</a></div>
<script>
  const BASE = "https://raymonddomain.dev";
  const token = localStorage.getItem('token');
  if (!token) location.href = "login.html";
  let currentId = "", profileData = null, selectedAvatarFile = null, isOwnProfile = false, allPosts = [];
  function getMyId(){try{const parts=token.split('.');if(parts.length!==3)return"";return JSON.parse(atob(parts[1])).id||""}catch{return""}}
  function getParamId(){return new URLSearchParams(location.search).get('id')}
  function getCache(k){try{return JSON.parse(localStorage.getItem(k)||null)}catch{return null}}
  function setCache(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
  function fixUrl(u){if(!u)return"";if(u.startsWith('data:'))return u;if(u.startsWith('/api/'))return BASE+u;if(u.startsWith('/uploads'))return BASE+u;if(u.startsWith('http'))return u;return u}
  function isVideoFile(u){if(!u)return false;return u.includes('/api/media-file')||u.endsWith('.mp4')}
  async function safeJson(res){const text=await res.text();try{return JSON.parse(text)}catch{throw new Error("API returned HTML - check route: "+res.url)}}
  // ADDED: instant follow persistence
  function followKey(targetId){return 'follow_opt_'+getMyId()+'_'+targetId}
  function getOptimistic(targetId){try{return JSON.parse(localStorage.getItem(followKey(targetId))||'null')}catch{return null}}
  function setOptimistic(targetId,state){localStorage.setItem(followKey(targetId),JSON.stringify({state,ts:Date.now()}))}
  function clearOptimistic(targetId){localStorage.removeItem(followKey(targetId))}

  function renderAvatar(user){
    const el=document.getElementById('letter');
    if(user.avatar){el.innerHTML='<img src="'+fixUrl(user.avatar)+'" loading="lazy">';}
    else{el.innerText=(user.username||'U')[0].toUpperCase();}
    const prev=document.getElementById('avatarPreview');const lm=document.getElementById('avatarLetter');
    if(user.avatar){prev.src=fixUrl(user.avatar);prev.style.display='block';lm.style.display='none';document.getElementById('removeAvatarBtn').style.display=isOwnProfile?'block':'none';}
    else{prev.style.display='none';lm.style.display='flex';lm.innerText=(user.username||'U')[0].toUpperCase();document.getElementById('removeAvatarBtn').style.display='none';}
  }
  function renderProfileUI(data){
    document.getElementById('skeletonProfile').style.display='none';
    document.getElementById('profileInfo').style.display='flex';
    document.getElementById('grid').style.display='grid';
    profileData=data; allPosts=data.posts||[]; const u=data.user;
    const targetId=u._id||getParamId()||getMyId();
    let serverFollowing=(u.followers||[]).some(function(f){return (f._id||f)==getMyId()});
    let serverFollowersCount=data.followersCount||(u.followers?u.followers.length:0);
    const opt=!isOwnProfile?getOptimistic(targetId):null;
    let isFollowing=opt?(opt.state==='following'):serverFollowing;
    let followersCountToShow=serverFollowersCount;
    if(opt){
      if((opt.state==='following')===serverFollowing){clearOptimistic(targetId);}
      else{followersCountToShow=opt.state==='following'?serverFollowersCount+1:Math.max(0,serverFollowersCount-1);}
    }
    document.getElementById("nameText").innerText=u.username;
    document.getElementById("topname").innerText=u.username;
    document.getElementById("pc").innerText=allPosts.length;
    document.getElementById("followersCount").innerText=followersCountToShow;
    document.getElementById("followingCount").innerText=data.followingCount||(u.following?u.following.length:0);
    document.getElementById('bioDisplayName').innerText=u.displayName||'';
    const bioEl=document.getElementById('bioText');
    if(u.bio && u.bio.trim()!==""){bioEl.innerText=u.bio;bioEl.style.display='block';bioEl.style.opacity='1';bioEl.onclick=null;}
    else{if(isOwnProfile){bioEl.innerText='Add bio ✏️';bioEl.style.display='block';bioEl.style.opacity='.7';bioEl.onclick=openBioModal;}else{bioEl.style.display='none';}}
    document.getElementById('bioLink').innerHTML=u.link?'<a href="'+(u.link.startsWith('http')?u.link:'https://'+u.link)+'" target="_blank">🔗 '+u.link+'</a>':'';
    document.getElementById('editBioBtn').style.display=isOwnProfile?'block':'none';
    document.getElementById('editNameIcon').style.display=isOwnProfile?'block':'none';
    renderAvatar(u);
    const fb=document.getElementById('followBtn');const own=document.getElementById('ownActions');const cam=document.getElementById('camIcon');
    if(isOwnProfile){fb.style.display='none';own.style.display='flex';cam.style.display='flex';document.getElementById('delBtn').style.display='block';}
    else{own.style.display='none';cam.style.display='none';fb.style.display='block';document.getElementById('delBtn').style.display='none';fb.innerText=isFollowing?'Following':'Follow';fb.className=isFollowing?'follow-btn following':'follow-btn follow';}
    const grid=document.getElementById("grid");let h="";for(let p of allPosts){const url=fixUrl(p.mediaUrl||"");const isVid=p.type==='video'||isVideoFile(p.mediaUrl||"");if(isVid){h+='<div class="post-box" onclick="openWide(\''+p._id+'\')"><video src="'+url+'#t=0.1" muted preload="metadata" playsinline></video><span class="vid-badge">🎬</span></div>';}else{h+='<div class="post-box" onclick="openWide(\''+p._id+'\')"><img src="'+url+'" loading="lazy" decoding="async"></div>';}}grid.innerHTML=h||'<p style="grid-column:1/3;text-align:center;color:#777;padding:20px">No posts yet</p>';
    const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');const vid=entry.target.querySelector('video');if(vid &&!vid.dataset.loaded){vid.load();vid.dataset.loaded='1';}}});},{threshold:0.1,rootMargin:'100px'});document.querySelectorAll('.post-box').forEach(b=>observer.observe(b));
  }
  async function loadProfile(){
    const vid=getParamId()||getMyId();isOwnProfile=vid===getMyId();const key='profile_'+vid;const cached=getCache(key);
    if(cached){renderProfileUI(cached);}
    try{
      let url=isOwnProfile?BASE+'/api/users/me/profile':BASE+'/api/users/'+vid+'/profile';
      let res=await fetch(url,{headers:{authorization:token}});
      if(!res.ok){const res2=await fetch(BASE+'/api/users/'+vid,{headers:{authorization:token}});if(res2.ok){res=res2;}else{throw new Error("Profile API 404");}}
      const data=await safeJson(res);let norm;if(data.user){norm=data;}else{norm={user:data,posts:data.posts||[],followersCount:(data.followers?data.followers.length:0),followingCount:(data.following?data.following.length:0)};}
      renderProfileUI(norm);setCache(key,norm);
    }catch(e){console.log("loadProfile error",e);if(!getCache('profile_'+vid)){document.getElementById('skeletonProfile').innerHTML='<p style="text-align:center;color:#777;padding:40px">Failed to load user. Retrying...</p>';}setTimeout(loadProfile,2000);}
  }
  
  window.addEventListener('scroll',()=>{const y=window.scrollY;const head=document.getElementById('header');if(y>50)head.classList.add('shrink');else head.classList.remove('shrink');},{passive:true});
  function openBioModal(){if(!isOwnProfile)return;const u=profileData&&profileData.user?profileData.user:{};document.getElementById('usernameInput').value=u.username||'';document.getElementById('bioNameInput').value=u.displayName||'';document.getElementById('bioInput').value=u.bio||'';document.getElementById('linkInput').value=u.link||'';document.getElementById('bioCount').innerText=(u.bio||'').length;document.getElementById('bioModal').classList.add('open');}
  function closeBioModal(){document.getElementById('bioModal').classList.remove('open');}
  document.getElementById('bioInput').addEventListener('input',function(e){document.getElementById('bioCount').innerText=e.target.value.length;});
  async function saveBio(){const btn=document.getElementById('saveBioBtn');btn.innerText='Saving...';btn.disabled=true;const payload={username:document.getElementById('usernameInput').value.trim(),displayName:document.getElementById('bioNameInput').value.trim(),bio:document.getElementById('bioInput').value.trim(),link:document.getElementById('linkInput').value.trim()};try{let r=await fetch(BASE+'/api/users/me',{method:'PUT',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify(payload)});if(!r.ok){r=await fetch(BASE+'/api/users/update',{method:'PUT',headers:{'Content-Type':'application/json',authorization:token},body:JSON.stringify(payload)});}const data=await safeJson(r);if(!r.ok)throw new Error(data.msg||'Update failed');localStorage.removeItem('profile_'+getMyId());closeBioModal();loadProfile();}catch(e){alert(e.message);}btn.innerText='Save';btn.disabled=false;}
  function openAvatarModal(){if(!isOwnProfile)return;document.getElementById('avatarModal').classList.add('open');}
  function closeAvatarModal(){document.getElementById('avatarModal').classList.remove('open');selectedAvatarFile=null;document.getElementById('saveAvatarBtn').style.display='none';document.getElementById('avatarInput').value='';}
  function handleAvatarSelect(i){if(i.files&&i.files[0]){selectedAvatarFile=i.files[0];const u=URL.createObjectURL(selectedAvatarFile);const p=document.getElementById('avatarPreview');p.src=u;p.style.display='block';document.getElementById('avatarLetter').style.display='none';document.getElementById('saveAvatarBtn').style.display='block';}}
  async function uploadAvatar(){if(!selectedAvatarFile)return;const b=document.getElementById('saveAvatarBtn');b.innerText='Uploading...';b.disabled=true;const fd=new FormData();fd.append('file',selectedAvatarFile);try{let r=await fetch(BASE+'/api/users/avatar',{method:'POST',headers:{authorization:token},body:fd});if(!r.ok){r=await fetch(BASE+'/api/users/me/avatar',{method:'POST',headers:{authorization:token},body:fd});}if(!r.ok){r=await fetch(BASE+'/api/users/avatar',{method:'PUT',headers:{authorization:token},body:fd});}localStorage.removeItem('profile_'+getMyId());closeAvatarModal();loadProfile();}catch(e){alert(e.message);}b.innerText='Save';b.disabled=false;}
  async function removeAvatar(){if(!confirm('Remove?'))return;try{await fetch(BASE+'/api/users/avatar',{method:'DELETE',headers:{authorization:token}});}catch{}localStorage.removeItem('profile_'+getMyId());closeAvatarModal();setTimeout(loadProfile,400);}
  async function toggleFollow(){
    const id=getParamId()||getMyId();
    const btn=document.getElementById('followBtn');
    const countEl=document.getElementById('followersCount');
    const targetId=profileData?.user?._id||id;
    const wasFollowing=btn.innerText.trim()==='Following';
    const nextState=wasFollowing?'follow':'following';
    btn.innerText=nextState==='following'?'Following':'Follow';
    btn.className=nextState==='following'?'follow-btn following':'follow-btn follow';
    let currentCount=parseInt(countEl.innerText||"0");
    const newCount=wasFollowing?Math.max(0,currentCount-1):currentCount+1;
    countEl.innerText=newCount;
    setOptimistic(targetId,nextState);
    const cacheKey='profile_'+targetId; const cached=getCache(cacheKey);
    if(cached){try{const myId=getMyId();if(nextState==='following'){if(!cached.user.followers) cached.user.followers=[];if(!cached.user.followers.some(f=>(f._id||f)==myId)) cached.user.followers.push(myId);}else{if(cached.user.followers) cached.user.followers=cached.user.followers.filter(f=>(f._id||f)!=myId);}cached.followersCount=newCount;setCache(cacheKey,cached);}catch{}}
    try{const res=await fetch(BASE+"/api/users/"+id+"/follow",{method:'POST',headers:{authorization:token}});if(!res.ok)throw new Error('follow failed');localStorage.removeItem('profile_'+id);setTimeout(()=>{loadProfile();},300);}catch(e){btn.innerText=wasFollowing?'Following':'Follow';btn.className=wasFollowing?'follow-btn following':'follow-btn follow';countEl.innerText=currentCount;setOptimistic(targetId,wasFollowing?'following':'follow');}
  }
  async function openWide(id){currentId=id;const cachedPost=allPosts.find(p=>p._id===id);const mediaDiv=document.getElementById("wideMedia");const userDiv=document.getElementById("wideUser");const listDiv=document.getElementById("commentList");const likesDiv=document.getElementById("likesCount");const likeBtn=document.getElementById("likeBtn");if(cachedPost){const url=fixUrl(cachedPost.mediaUrl||"");const isVid=cachedPost.type==='video'||isVideoFile(cachedPost.mediaUrl||"");if(isVid){mediaDiv.innerHTML='<video id="activeVideo" src="'+url+'" controls autoplay playsinline style="width:100%;max-height:70vh;object-fit:contain"></video>';}else{mediaDiv.innerHTML='<img src="'+url+'" style="width:100%;max-height:70vh;object-fit:contain">';}userDiv.innerText='@'+(profileData.user.username||"");likesDiv.innerText=(cachedPost.likes?cachedPost.likes.length:0)+" likes";likeBtn.innerText=cachedPost.likes&&cachedPost.likes.includes(getMyId())?"❤️":"🤍";listDiv.innerHTML='<p style="color:#666">Loading...</p>';document.getElementById("wide").style.display="flex";}try{const r=await fetch(BASE+"/api/posts/"+id,{headers:{authorization:token}});if(!r.ok)throw new Error("Post API failed");const p=await safeJson(r);const url=fixUrl(p.mediaUrl||"");const isVid=p.type==='video'||isVideoFile(p.mediaUrl||"");if(!cachedPost){if(isVid){mediaDiv.innerHTML='<video id="activeVideo" src="'+url+'" controls autoplay playsinline style="width:100%;max-height:70vh;object-fit:contain"></video>';}else{mediaDiv.innerHTML='<img src="'+url+'" style="width:100%;max-height:70vh;object-fit:contain">';}document.getElementById("wide").style.display="flex";}userDiv.innerText='@'+p.user.username;likesDiv.innerText=p.likes.length+" likes";likeBtn.innerText=p.likes.includes(getMyId())?"❤️":"🤍";let c="";for(let x of p.comments){c+='<div class="cmt"><b>'+x.user.username+'</b> '+x.text+'</div>';}listDiv.innerHTML=c||"<p style='color:#777'>No comments</p>";}catch(e){console.log(e);}}
  function closeWide(){const v=document.getElementById("activeVideo");if(v){v.pause();v.src="";}document.getElementById("wideMedia").innerHTML="";document.getElementById("wide").style.display="none";}
  async function likePost(){const likeBtn=document.getElementById("likeBtn");const likesDiv=document.getElementById("likesCount");const wasLiked=likeBtn.innerText==="❤️";likeBtn.innerText=wasLiked?"🤍":"❤️";let num=parseInt((likesDiv.innerText||"0").split(" ")[0]||"0");likesDiv.innerText=(wasLiked?Math.max(0,num-1):num+1)+" likes";try{await fetch(BASE+"/api/posts/"+currentId+"/like",{method:"POST",headers:{authorization:token}});}catch{}}
  async function addComment(){const t=document.getElementById("cmtInput").value;if(!t)return;document.getElementById("cmtInput").value="";const listDiv=document.getElementById("commentList");listDiv.innerHTML+='<div class="cmt"><b>You</b> '+t+'</div>';await fetch(BASE+"/api/posts/"+currentId+"/comment",{method:"POST",headers:{"Content-Type":"application/json",authorization:token},body:JSON.stringify({text:t})});openWide(currentId);}
  async function deletePost(){if(!confirm("Delete this post?"))return;closeWide();document.getElementById("grid").innerHTML='<p style="grid-column:1/3;text-align:center;color:#777">Deleting...</p>';try{const res=await fetch(BASE+"/api/posts/"+currentId,{method:"DELETE",headers:{authorization:token}});const data=await safeJson(res);if(!res.ok)throw new Error(data.msg||'Delete failed');const vid=getParamId()||getMyId();const key='profile_'+vid;const cached=getCache(key);if(cached&&cached.posts){cached.posts=cached.posts.filter(p=>p._id!==currentId);setCache(key,cached);}allPosts=allPosts.filter(p=>p._id!==currentId);if(profileData&&profileData.posts){profileData.posts=profileData.posts.filter(p=>p._id!==currentId);}renderProfileUI({user:profileData.user,posts:allPosts,followersCount:profileData.followersCount,followingCount:profileData.followingCount});}catch(err){alert(err.message);loadProfile();}}
  function showFollowers(){if(!profileData)return;document.getElementById('listTitle').innerText='Followers';const list=profileData.user.followers||[];let html="";for(let u of list){const id=u._id||u;const name=u.username||id;const av=u.avatar?'<img src="'+fixUrl(u.avatar)+'">':(name[0]||'U').toUpperCase();html+='<div class="user-row" onclick="goToUser(\''+id+'\')"><div class="avatar-sm">'+av+'</div><b>'+name+'</b></div>';}document.getElementById('listBody').innerHTML=html||'<p style="padding:15px;color:#777">No followers</p>';document.getElementById('followModal').style.display='flex';}
  function showFollowing(){if(!profileData)return;document.getElementById('listTitle').innerText='Following';const list=profileData.user.following||[];let html="";for(let u of list){const id=u._id||u;const name=u.username||id;const av=u.avatar?'<img src="'+fixUrl(u.avatar)+'">':(name[0]||'U').toUpperCase();html+='<div class="user-row" onclick="goToUser(\''+id+'\')"><div class="avatar-sm">'+av+'</div><b>'+name+'</b></div>';}document.getElementById('listBody').innerHTML=html||'<p style="padding:15px;color:#777">None</p>';document.getElementById('followModal').style.display='flex';}
  function goToUser(id){closeList();location.href='profile.html?id='+id;}
  function closeList(){document.getElementById('followModal').style.display='none';}
  loadProfile();
</script>
