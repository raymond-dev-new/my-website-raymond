<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>/* keep your same style */ html{scroll-behavior:smooth}body{margin:0;background:#000;color:#fff;font-family:-apple-system,Roboto,Arial;overflow-x:hidden}*{box-sizing:border-box}.header{max-width:935px;margin:0 auto;padding:12px 15px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);z-index:10}.profile-info{max-width:935px;margin:0 auto;padding:16px 14px;display:flex;gap:20px;align-items:flex-start}.avatar-wrap{position:relative;width:100px;height:100px;flex-shrink:0}.circle{width:100px;height:100px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;overflow:hidden;border:2px solid #262626}.circle img{width:100%;height:100%;object-fit:cover}.profile-main{flex:1;min-width:0}#name{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}.stats{display:flex;gap:24px;margin-top:12px}.stat{display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.1}.stat b{color:#fff;font-size:20px;font-weight:800}.stat span{color:#fff;font-size:14px;margin-top:2px}.follow-btn{margin-top:8px;padding:7px 18px;border:none;border-radius:8px;font-weight:700;cursor:pointer}.follow{background:#0095f6;color:#fff}.following{background:#262626;color:#fff;border:1px solid #555}.posts{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:600px;margin:10px auto 0;padding:0 0 80px}.post-box{aspect-ratio:1/1;background:#111;overflow:hidden}.post-box img,.post-box video{width:100%;height:100%;object-fit:cover}.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:10px 0;z-index:10}.nav a{color:#fff;text-decoration:none;font-size:22px}.list-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;justify-content:center;align-items:center}.list-box{background:#121212;width:90%;max-width:380px;max-height:70vh;border-radius:12px;overflow:hidden}.list-head{padding:12px;border-bottom:1px solid #262626;display:flex;justify-content:space-between}.list-body{overflow-y:auto;max-height:60vh}.user-row{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222;cursor:pointer;align-items:center}.avatar-sm{width:36px;height:36px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}.avatar-sm img{width:100%;height:100%;object-fit:cover}</style>
</head>
<body>
<div class="header"><b id="topname">Profile</b><span onclick="location.href='feed.html'">☰</span></div>
<div class="profile-info"><div class="avatar-wrap"><div class="circle" id="letter"></div></div><div class="profile-main"><h3 id="name"></h3><div class="stats"><div class="stat"><b id="pc">-</b><span>posts</span></div><div class="stat" onclick="showFollowers()"><b id="followersCount">-</b><span>followers</span></div><div class="stat" onclick="showFollowing()"><b id="followingCount">-</b><span>following</span></div></div><button id="followBtn" class="follow-btn follow" style="display:none" onclick="toggleFollow()">Follow</button></div></div>
<div class="posts" id="grid"></div>
<div class="list-modal" id="followModal" onclick="if(event.target===this) closeList()"><div class="list-box"><div class="list-head"><b id="listTitle"></b><span onclick="closeList()">✕</span></div><div class="list-body" id="listBody"></div></div></div>
<div class="nav"><a href="feed.html">🏠</a><a href="message.html">💬</a><a href="profile.html">👤</a></div>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
function getMyId(){try{return JSON.parse(atob(token.split('.')[1])).id}catch{return""}}
function getCache(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function setCache(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function fixUrl(u){if(!u) return ""; if(u.startsWith('/api/')) return BASE+u; if(u.startsWith('http')) return u; return u;}
let profileData=null;
let allPosts=[];
function getParamId(){return new URLSearchParams(location.search).get('id')||getMyId()}
async function loadProfile(){
  const vid=getParamId();
  try{
    let r=await fetch(BASE+'/api/users/'+vid+'/profile',{headers:{authorization:token}});
    let d=await r.json();
    let user=d.user||d;
    profileData={user, posts:d.posts||[], followersCount:(user.followers||[]).length, followingCount:(user.following||[]).length};
    setCache('profile_'+vid, profileData);
    if(vid===getMyId()) setCache('profile_'+getMyId(), profileData);
    render();
  }catch(e){setTimeout(loadProfile,1000)}
}
function render(){
  const u=profileData.user;
  const vid=getParamId();
  document.getElementById('topname').innerText=u.username;
  document.getElementById('name').innerText=u.username;
  document.getElementById('pc').innerText=(profileData.posts||[]).length;
  document.getElementById('followersCount').innerText=profileData.followersCount;
  document.getElementById('followingCount').innerText=profileData.followingCount;
  const el=document.getElementById('letter');
  if(u.avatar) el.innerHTML='<img src="'+fixUrl(u.avatar)+'">';
  else el.innerText=(u.username||'U')[0].toUpperCase();
  const btn=document.getElementById('followBtn');
  if(vid===getMyId()){btn.style.display='none'}
  else{
    btn.style.display='block';
    const key='follow_opt_'+getMyId()+'_'+vid;
    const opt=JSON.parse(localStorage.getItem(key)||'null');
    let isFollowing=(u.followers||[]).some(f=>(f._id||f)==getMyId());
    if(opt) isFollowing=opt.state==='following';
    btn.innerText=isFollowing?'Following':'Follow';
    btn.className=isFollowing?'follow-btn following':'follow-btn follow';
  }
  const grid=document.getElementById('grid');
  grid.innerHTML=(profileData.posts||[]).map(p=>`<div class="post-box"><img src="${fixUrl(p.mediaUrl||'')}"></div>`).join('');
}
function addToCaches(targetId, username, avatar, follow){
  // 1. follow_opt
  localStorage.setItem('follow_opt_'+getMyId()+'_'+targetId, JSON.stringify({state:follow?'following':'follow', ts:Date.now()}));
  // 2. following_opt list
  let list=[];
  try{list=JSON.parse(localStorage.getItem('following_opt_'+getMyId())||'[]')}catch{}
  if(follow){ if(!list.some(x=>(x._id||x)==targetId)) list.push({_id:targetId, username, avatar}); }
  else{ list=list.filter(x=>(x._id||x)!=targetId); }
  localStorage.setItem('following_opt_'+getMyId(), JSON.stringify(list));
  // 3. my profile cache
  let myCache=getCache('profile_'+getMyId());
  if(myCache){
    if(!myCache.user.following) myCache.user.following=[];
    if(follow){ if(!myCache.user.following.some(f=>(f._id||f)==targetId)) myCache.user.following.push({_id:targetId, username, avatar}); }
    else{ myCache.user.following=myCache.user.following.filter(f=>(f._id||f)!=targetId); }
    myCache.followingCount=myCache.user.following.length;
    setCache('profile_'+getMyId(), myCache);
  }
  // 4. chat_users for messages - THIS IS WHAT YOU COULD NOT FIND
  let chats=[];
  try{chats=getCache('chat_users')||[]}catch{}
  if(follow){ if(!chats.some(x=>(x._id||x)==targetId)) chats.push({_id:targetId, username, avatar}); }
  else{
    let isFollower=false;
    try{isFollower=myCache?.user?.followers?.some(f=>(f._id||f)==targetId)}catch{}
    if(!isFollower) chats=chats.filter(x=>(x._id||x)!=targetId);
  }
  setCache('chat_users', chats);
}
async function toggleFollow(){
  const vid=getParamId();
  const btn=document.getElementById('followBtn');
  const wasFollowing=btn.innerText==='Following';
  const nextFollowing=!wasFollowing;
  const u=profileData.user;
  // instant UI
  btn.innerText=nextFollowing?'Following':'Follow';
  btn.className=nextFollowing?'follow-btn following':'follow-btn follow';
  document.getElementById('followersCount').innerText= nextFollowing ? profileData.followersCount+1 : Math.max(0,profileData.followersCount-1);
  // instant caches
  addToCaches(vid, u.username, u.avatar||'', nextFollowing);
  try{
    let res=await fetch(BASE+'/api/users/'+vid+'/follow',{method:'POST',headers:{authorization:token}});
    if(!res.ok) throw new Error('fail');
    localStorage.removeItem('profile_'+vid);
    loadProfile();
  }catch{
    // revert if failed
    btn.innerText=wasFollowing?'Following':'Follow';
    btn.className=wasFollowing?'follow-btn following':'follow-btn follow';
    addToCaches(vid, u.username, u.avatar||'', wasFollowing);
  }
}
function showFollowers(){
  document.getElementById('listTitle').innerText='Followers';
  let list=profileData.user.followers||[];
  document.getElementById('listBody').innerHTML=list.map(u=>`<div class="user-row" onclick="location.href='profile.html?id=${u._id||u}'"><div class="avatar-sm">${u.avatar?`<img src="${fixUrl(u.avatar)}">`:(u.username||'U')[0]}</div><b>${u.username||'user'}</b></div>`).join('')||'No followers';
  document.getElementById('followModal').style.display='flex';
}
function showFollowing(){
  document.getElementById('listTitle').innerText='Following';
  let list=[];
  const vid=getParamId();
  if(vid===getMyId()){
    // own profile: use cache which includes instant follows
    let myCache=getCache('profile_'+getMyId());
    list=myCache?.user?.following||profileData.user.following||[];
    let optList=[];
    try{optList=JSON.parse(localStorage.getItem('following_opt_'+getMyId())||'[]')}catch{}
    optList.forEach(o=>{if(!list.some(f=>(f._id||f)==(o._id||o))) list.push(o)});
    // remove unfollowed
    list=list.filter(item=>{
      const tid=item._id||item;
      const opt=JSON.parse(localStorage.getItem('follow_opt_'+getMyId()+'_'+tid)||'null');
      return !(opt && opt.state==='follow');
    });
  }else{
    list=profileData.user.following||[];
  }
  document.getElementById('listBody').innerHTML=list.map(u=>`<div class="user-row" onclick="location.href='profile.html?id=${u._id||u}'"><div class="avatar-sm">${u.avatar?`<img src="${fixUrl(u.avatar)}">`:(u.username||'U')[0]}</div><b>${u.username||'user'}</b></div>`).join('')||'None';
  document.getElementById('followModal').style.display='flex';
}
function closeList(){document.getElementById('followModal').style.display='none'}
loadProfile();
</script>
</body>
</html>
