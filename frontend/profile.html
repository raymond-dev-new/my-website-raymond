
<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0a0a12;
      color: #fff;
      font-family: Arial;
      padding-bottom: 90px;
    }
    .banner {
      height: 120px;
      background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b);
    }
    .top {
      max-width: 935px;
      margin: -55px auto 0;
      padding: 0 16px;
    }
    .card {
      background: #14141d;
      border: 1px solid #262626;
      border-radius: 22px;
      padding: 20px;
      position: relative;
    }
    .loadingBar {
      display: none;
      align-items: center;
      gap: 8px;
      background: #26262f;
      border: 1px solid #3a3a4a;
      color: #a78bfa;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .loadingBar.show {
      display: inline-flex;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #555;
      border-top: 2px solid #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .skeleton {
      background: linear-gradient(90deg, #26262f 25%, #3a3a4a 50%, #26262f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
      color: transparent !important;
    }
    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
    .avatar.loading {
      background: linear-gradient(90deg, #26262f 25%, #3a3a4a 50%, #26262f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      color: transparent;
    }
    .gcard.loading {
      min-height: 260px;
      background: linear-gradient(90deg, #16161f 25%, #26262f 50%, #16161f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid #14141d;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      overflow: hidden;
      margin-top: -10px;
      cursor: pointer;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stats {
      display: flex;
      gap: 26px;
      margin-top: 14px;
    }
    .stat {
      text-align: center;
      cursor: pointer;
    }
    .stat b {
      display: block;
      font-size: 18px;
      min-height: 22px;
    }
    .stat span {
      font-size: 12px;
      color: #aaa;
    }
    .btn {
      padding: 9px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-follow {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
    }
    .btn-following {
      background: #262626;
      color: #fff;
      border: 1px solid #555;
    }
    .btn-write {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      padding: 9px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      margin-top: 12px;
    }
    .btn.loadingBtn {
      background: #26262f !important;
      color: #888 !important;
      pointer-events: none;
    }
    .grid {
      max-width: 935px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 14px 16px;
    }
    .gcard {
      background: #16161f;
      border: 1px solid #26262f;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }
    .cover {
      width: 100%;
      height: 210px;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .noimg {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }
    .body {
      padding: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 18, .95);
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      font-size: 22px;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      z-index: 99;
      justify-content: center;
      align-items: center;
    }
    .modal.open {
      display: flex;
    }
    .mbox {
      background: #1a1a24;
      width: 90%;
      max-width: 380px;
      border-radius: 18px;
      max-height: 70vh;
      overflow: hidden;
    }
    .head {
      padding: 14px;
      border-bottom: 1px solid #262626;
      display: flex;
      justify-content: space-between;
    }
    .list {
      overflow-y: auto;
      max-height: 60vh;
    }
    .row {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #222;
      align-items: center;
      cursor: pointer;
    }
    .mini {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini.loadingMini {
      background: linear-gradient(90deg, #26262f 25%, #3a3a4a 50%, #26262f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      color: transparent;
    }
    .followName.loadingName {
      background: linear-gradient(90deg, #26262f 25%, #3a3a4a 50%, #26262f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 6px;
      color: transparent !important;
      min-width: 110px;
      min-height: 16px;
      display: inline-block;
    }
    .editBox {
      background: #1a1a24;
      width: 90%;
      max-width: 400px;
      border-radius: 18px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }
    .editAvatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      overflow: hidden;
      margin: 0 auto;
      cursor: pointer;
    }
    .editAvatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .editInput {
      width: 100%;
      background: #26262f;
      border: 1px solid #333;
      border-radius: 12px;
      color: #fff;
      padding: 13px;
      margin-top: 10px;
      outline: none;
      font-size: 14px;
    }
    .editLabel {
      font-size: 12px;
      color: #aaa;
      margin-top: 14px;
      display: block;
    }
    .btn-save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff;
      font-weight: 800;
      margin-top: 16px;
      cursor: pointer;
    }
    .btn-remove {
      background: #262626;
      color: #fff;
      border: 1px solid #444;
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      margin-top: 8px;
      cursor: pointer;
    }
    .editBox.loadingInputs .editInput {
      opacity: 0.6;
      pointer-events: none;
    }
    .btn-delete {
      background: #ff3b30;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-mini-unfollow {
      background: #262626;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      flex-shrink: 0;
    }
    .scrollLoader{ text-align:center; padding:16px; color:#888; display:none; }
    .scrollLoader .spinner{ width:28px; height:28px; border-width:3px; margin:0 auto 8px; }
  </style>
</head>
<body>

  <div class="banner"></div>

  <div class="top">
    <div class="card">
      <div class="loadingBar" id="loadingBar">
        <div class="spinner"></div>
        <span id="loadingBarText">Loading profile...</span>
      </div>
      <div class="avatar loading" id="avatar" onclick="if(isOwn) openEdit()">U</div>
      <h3 id="name" style="margin:12px 0 2px">Loading...</h3>
      <p id="emailLine" style="color:#a78bfa;font-size:13px;margin:0"></p>
      <p id="bio" style="color:#aaa;font-size:14px;margin:8px 0">Loading...</p>
      <a id="linkLine" href="#" target="_blank" style="color:#7dd3fc;font-size:13px;display:none"></a>
      <div class="stats">
        <!-- REMOVED - Post count number removed to save data. No more novels count, no fetch to count it. -->
        <div class="stat" onclick="showList('followers')"><b id="fCount">...</b><span>followers</span></div>
        <div class="stat" onclick="showList('following')"><b id="fgCount">...</b><span>following</span></div>
      </div>
      <button id="followBtn" class="btn btn-follow loadingBtn" style="display:none" onclick="toggleFollow()">Loading...</button>
      <a href="create.html" id="writeBtn" class="btn-write" style="display:none">+ Write Novel ✍️</a>
      <button id="msgBtn" class="btn" style="display:none;background:#262626;color:#fff" onclick="goMessage()">💬 Message</button>
      <button id="editBtn" class="btn" style="display:none;background:#262626;color:#fff;border:1px solid #555" onclick="openEdit()">✏️ Edit Profile</button>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="gcard loading"></div>
    <div class="gcard loading"></div>
  </div>

  <div id="scrollLoader" class="scrollLoader"><div class="spinner"></div>Loading more novels...</div>

  <div class="modal" id="listModal" onclick="if(event.target===this) closeList()">
    <div class="mbox">
      <div class="head"><b id="listTitle"></b><span onclick="closeList()" style="cursor:pointer">✕</span></div>
      <div class="list" id="listBody"></div>
    </div>
  </div>

  <div class="modal" id="editModal" onclick="if(event.target===this) closeEdit()">
    <div class="editBox" id="editBox">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Edit Profile</b><span onclick="closeEdit()" style="cursor:pointer;font-size:20px">✕</span></div>
      <p id="editLoadingText" style="display:none;color:#a78bfa;font-size:12px;font-weight:700;margin:10px 0">Loading profile... please wait</p>
      <div class="editAvatar" id="editAvatarPreview" onclick="document.getElementById('uploaddInput').click()">U</div>
      <p style="text-align:center;font-size:12px;color:#aaa;margin:8px 0">Tap picture to change</p>
      <input type="file" id="uploaddInput" accept="image/*" hidden onchange="previewNewAvatar(this)">
      <label class="editLabel">Name / Username</label>
      <input class="editInput" id="editName" placeholder="Loading...">
      <label class="editLabel">Bio</label>
      <input class="editInput" id="editBio" placeholder="Loading...">
      <label class="editLabel">Link</label>
      <input class="editInput" id="editLink" placeholder="Loading...">
      <button class="btn-save" id="saveBtn" onclick="saveProfile()">Save Changes ✅</button>
      <button class="btn-remove" onclick="removeAvatar()">Remove Profile Picture</button>
    </div>
  </div>

  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <a href="message.html">💬</a>
    <a href="diary.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

<script>
  const WRDB = {
    dbName: 'WildReadersDB',
    storeName: 'cache',
    _open() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(this.dbName, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(this.storeName)) {
            req.result.createObjectStore(this.storeName);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    },
    async save(key, data) {
      try {
        const db = await this._open();
        return new Promise((resolve) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    },
    async get(key) {
      try {
        const db = await this._open();
        return new Promise((resolve) => {
          const tx = db.transaction(this.storeName, 'readonly');
          const req = tx.objectStore(this.storeName).get(key);
          req.onsuccess = () => resolve(req.result ? req.result.data : null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      try {
        const db = await this._open();
        return new Promise((resolve) => {
          const tx = db.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).delete(key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }
  };

  function stripFollowFields(user) {
    if (!user) {
      return null;
    }
    const copy = { ...user };
    delete copy.followers;
    delete copy.following;
    return copy;
  }

  function saveProfileToStorage(profileIdToSave, user) {
    const safe = stripFollowFields(user);
    WRDB.save('profile_' + profileIdToSave, safe);
  }

  // ============================================================
  // NEW - FOLLOW COUNTS CACHE (small, separate from profile)
  // We save only 2 numbers: followers count + following count.
  // So even when profile is 24h cached, we can still show
  // followers / following instantly, then refresh them live.
  // ============================================================
  function saveFollowCounts(profileIdToSave, followersLen, followingLen) {
    try {
      localStorage.setItem('profile_follow_counts_' + profileIdToSave, JSON.stringify({
        f: followersLen,
        fg: followingLen,
        time: Date.now()
      }));
    } catch (e) {}
  }

  function getFollowCounts(profileIdToSave) {
    try {
      const raw = localStorage.getItem('profile_follow_counts_' + profileIdToSave);
      if (!raw) {
        return null;
      }
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function getCacheFast(key) {
    return Promise.race([
      WRDB.get(key),
      new Promise(r => setTimeout(() => r(null), 500))
    ]);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const _inFlight = new Map();

  function fetchFast(url) {
    if (_inFlight.has(url)) {
      return _inFlight.get(url);
    }
    const p = fetch(url, {
      headers: { authorization: token }
    }).finally(() => {
      setTimeout(() => _inFlight.delete(url), 500);
    });
    _inFlight.set(url, p);
    return p;
  }

  function fetchNoCache(url) {
    if (_inFlight.has(url)) {
      return _inFlight.get(url);
    }
    const p = fetch(url, {
      headers: {
        authorization: token,
        'Cache-Control': 'no-cache',
        'Pragma': 'no-cache'
      },
      cache: 'no-store'
    }).finally(() => {
      setTimeout(() => _inFlight.delete(url), 500);
    });
    _inFlight.set(url, p);
    return p;
  }

  let _pendingBeacon = [];

  function surviveFetch(url, method) {
    return fetch(url, {
      method: method,
      headers: { authorization: token },
      keepalive: true
    })
    .then(async r => {
      return { ok: r.ok,
         data: await r.json().catch(() => ({})) 
      };
    })
    .catch(() => {
      _pendingBeacon.push({ url: url, method: method });
      return { ok: true, data: {}, beaconQueued: true };
    });
  }

  window.addEventListener('pagehide', () => {
    for (const p of _pendingBeacon) {
      try {
        navigator.sendBeacon(p.url, new Blob([], { type: 'application/json' }));
      } catch (e) {}
    }
    for (const a of getPending()) {
      try {
        navigator.sendBeacon(a.url, new Blob([], { type: 'application/json' }));
      } catch (e) {}
    }
    _pendingBeacon = [];
  });

  let isProfileLoading = false;

  function showProfileLoading() {
    isProfileLoading = true;
    const bar = document.getElementById('loadingBar');
    if (bar) {
      bar.classList.add('show');
    }
    const barText = document.getElementById('loadingBarText');
    if (barText) {
      barText.innerText = 'Loading profile...';
    }
    const fb = document.getElementById('followBtn');
    if (fb && !isOwn) {
      fb.innerText = 'Loading...';
      fb.className = 'btn btn-follow loadingBtn';
    }
    const editBtn = document.getElementById('editBtn');
    if (editBtn && isOwn) {
      editBtn.innerText = '⏳ Loading...';
    }
  }

  function hideProfileLoading() {
    isProfileLoading = false;
    const bar = document.getElementById('loadingBar');
    if (bar) {
      bar.classList.remove('show');
    }
    const av = document.getElementById('avatar');
    if (av) {
      av.classList.remove('loading');
    }
    const nameEl = document.getElementById('name');
    if (nameEl) {
      nameEl.classList.remove('skeleton');
    }
    const editBtn = document.getElementById('editBtn');
    if (editBtn && isOwn) {
      editBtn.innerText = '✏️ Edit Profile';
    }
  }

  function getPending() {
    try {
      return JSON.parse(localStorage.getItem('pending_actions') || '[]');
    } catch (e) {
      return [];
    }
  }

  function savePending(action) {
    const list = getPending().filter(x => !(x.url === action.url && x.method === action.method));
    list.push({
      url: action.url,
      method: action.method,
      time: Date.now()
    });
    try {
      localStorage.setItem('pending_actions', JSON.stringify(list));
    } catch (e) {}
  }

  function removePending(url, method) {
    try {
      const filtered = getPending().filter(x => !(x.url === url && x.method === method));
      localStorage.setItem('pending_actions', JSON.stringify(filtered));
    } catch (e) {}
  }

  async function retryPending() {
    const list = getPending();
    if (!list.length) {
      return;
    }
    await Promise.allSettled(list.map(async (a) => {
      if (Date.now() - a.time > 5 * 60 * 1000) {
        removePending(a.url, a.method);
        return;
      }
      try {
        const r = await fetch(a.url, {
          method: a.method,
          headers: { authorization: token },
          keepalive: true
        });
        if (r.ok) {
          removePending(a.url, a.method);
        }
      } catch (e) {}
    }));
  }

  const BASE = "https://raymond-web-rho.vercel.app";
  const token = localStorage.getItem('token');
  if (!token) {
    location.href = "dashboard.html";
  } 

  function getMyId() {
    try {
      return JSON.parse(atob(token.split('.')[1])).id;
    } catch (e) {
      return "";
    }
  }

  let profileUser = null;
  let isOwn = false;
  let profileId = "";
  let newAvatarFile = null;

  let profilePage = 1;
  let isLoadingPosts = false;
  let hasMorePosts = true;
  let loadedPostIds = new Set();

  function postCard(p){
    let cover = p.cover ? '<img src="' + p.cover + '" loading="lazy">' : '<div class="noimg">📖</div>';
    let delBtn = isOwn ? '<button class="btn-delete" onclick="deletePost(event,\'' + p._id + '\')">🗑️ Delete</button>' : '';
    return '<div class="gcard" onclick="location.href=\'read.html?id=' + p._id + '\'"><div class="cover">' + cover + '</div><div class="body"><div class="title">' + p.title + '</div><div style="font-size:12px;color:#888;margin-top:4px">❤️ ' + (p.likes?.length || 0) + ' • 💬 ' + (p.comments?.length || 0) + '</div>' + delBtn + '</div></div>';
  }

  // ============================================================
  // REMOVED - updatePostCount() DELETED COMPLETELY
  // No more fetch to count posts, no more post count number.
  // This saves data: no limit=1000 fetch, no /api/posts fetch.
  // Followers / Following are NOT touched.
  // ============================================================

  async function loadProfilePosts(pageToLoad = 1, isFirstLoad = false){
    if(isLoadingPosts || !hasMorePosts) {
      return;
    }
    isLoadingPosts = true;
    if(!isFirstLoad) {
      document.getElementById('scrollLoader').style.display = 'block';
    }

    try {
      let res = await fetchNoCache(BASE + '/api/posts/user/' + profileId + '?page=' + pageToLoad + '&limit=8');

      // ============================================================
      // FIX - NO MORE FALLBACK THAT DOWNLOADS ALL POSTS - SAVES DATA
      // Before: if user posts failed, it fetched /api/posts (ALL posts
      // from ALL users) just to filter one user. That was huge.
      // Now: if user posts fail, just stop. Show cached / empty.
      // ============================================================
      if(!res.ok){
        hasMorePosts = false;
        if(isFirstLoad && !document.querySelector('#grid .gcard:not(.loading)')){
          document.getElementById('grid').innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">No novels yet. Write your first one! ✨</p>';
        }
        isLoadingPosts = false;
        document.getElementById('scrollLoader').style.display = 'none';
        return;
      }

      let posts = await res.json();
      if(!Array.isArray(posts)) {
        posts = [];
      }

      if(!posts.length){
        hasMorePosts = false;
        if(isFirstLoad) {
          document.getElementById('grid').innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">No novels yet. Write your first one! ✨</p>';
        }
        isLoadingPosts = false;
        document.getElementById('scrollLoader').style.display = 'none';
        return;
      }
      if(posts.length < 8) {
        hasMorePosts = false;
      }

      if(isFirstLoad){
        document.getElementById('grid').innerHTML = posts.map(p=>postCard(p)).join('');
        posts.forEach(p=>loadedPostIds.add(String(p._id)));
        WRDB.save('profile_posts_' + profileId, posts);
      } else {
        let newPosts = posts.filter(p => !loadedPostIds.has(String(p._id)));
        newPosts.forEach(p=>loadedPostIds.add(String(p._id)));
        if(newPosts.length) {
          document.getElementById('grid').innerHTML += newPosts.map(p=>postCard(p)).join('');
        }
      }
      profilePage = pageToLoad;
    } catch(e) {
      if(isFirstLoad){
        const grid = document.getElementById('grid');
        if(grid && grid.querySelector('.gcard.loading')){
          grid.innerHTML = '<p style="grid-column:1/3;text-align:center">Could not load. Check internet and refresh.</p>';
        }
      }
    }
    document.getElementById('scrollLoader').style.display = 'none';
    isLoadingPosts = false;
  }

  window.addEventListener('scroll', () => {
    if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 300){
      if(!isLoadingPosts && hasMorePosts && profileId){
        loadProfilePosts(profilePage + 1, false);
      }
    }
  });

  async function fetchFollowFromBackend(userId) {
    if (profileUser && String(profileId) === String(userId) && profileUser.followers) {
      return {
        followers: profileUser.followers || [],
        following: profileUser.following || [],
        fullUser: profileUser
      };
    }
    try {
      const res = await fetchNoCache(BASE + '/api/users/' + userId);
      if (!res.ok) {
        return null;
      }
      const data = await res.json();
      const user = data.user || data;
      return {
        followers: user.followers || [],
        following: user.following || [],
        fullUser: user
      };
    } catch (e) {
      return null;
    }
  }

  function applyFollowFromBackend(followers, following) {
    document.getElementById('fCount').innerText = (followers || []).length;
    document.getElementById('fgCount').innerText = (following || []).length;
    // NEW - Save follow counts separately so cached profile can still show them
    saveFollowCounts(profileId, (followers || []).length, (following || []).length);
    if (profileUser) {
      profileUser.followers = followers || [];
      profileUser.following = following || [];
    }
  }

  // ============================================================
  // NEW - REFRESH FOLLOW ONLY (ALWAYS LIVE, NOT 24H)
  // This runs even when profile + posts are 24h cached.
  // It fetches ONLY /api/users/:id to update:
  // - followers count, following count
  // - Follow / Following button state
  // It does NOT touch posts, bio, avatar, or the 24h timer.
  // So followers stay live while profile stays cached.
  // ============================================================
  async function refreshFollowOnly() {
    try {
      const res = await fetchNoCache(BASE + '/api/users/' + profileId).catch(() => null);
      if (!res || !res.ok) {
        return;
      }
      const data = await res.json();
      const freshUser = data.user || data;
      const followers = freshUser.followers || [];
      const following = freshUser.following || [];
      // Update numbers on page
      applyFollowFromBackend(followers, following);
      // Update Follow button if viewing someone else
      if (!isOwn) {
        const fb = document.getElementById('followBtn');
        if (fb) {
          const amIFollowing = followers.some(f => (f._id || f) === getMyId());
          fb.style.display = 'block';
          fb.innerText = amIFollowing ? 'Following' : 'Follow';
          fb.className = amIFollowing ? 'btn btn-following' : 'btn btn-follow';
          fb.disabled = false;
        }
      }
      // Keep profileUser follow lists fresh for showList()
      if (profileUser) {
        profileUser.followers = followers;
        profileUser.following = following;
      }
    } catch (e) {}
  }

  async function load() {
    profileId = new URLSearchParams(location.search).get('id') || getMyId();
    isOwn = profileId === getMyId();
    profilePage = 1;
    isLoadingPosts = false;
    hasMorePosts = true;
    loadedPostIds = new Set();
    showProfileLoading();
    retryPending().catch(() => {});

    // ============================================================
    // 24H RULE - PROFILE + POSTS ONLY, NOT FOLLOWERS
    // Profile + posts fetch = once per day per user.
    // Followers / Following = ALWAYS live via refreshFollowOnly().
    // If you just made a new post / edited / deleted, create.html
    // / saveProfile / deletePost sets profile_force_refresh = 1,
    // then this load ignores 24h timer once and fetches fresh.
    // ============================================================
    let skipFreshFetch = false;
    const forceRefresh = localStorage.getItem('profile_force_refresh') === '1';
    if (forceRefresh) {
      localStorage.removeItem('profile_force_refresh');
      localStorage.removeItem('profile_last_fetch_' + profileId);
      skipFreshFetch = false;
    } else {
      const lastFetch = Number(localStorage.getItem('profile_last_fetch_' + profileId) || 0);
      if (lastFetch && (Date.now() - lastFetch) < 24*60*60*1000) {
        skipFreshFetch = true;
      }
    }

    let hasCache = false;
    try {
      const cachedUser = await getCacheFast('profile_' + profileId);
      const cachedMine = await getCacheFast('profile_posts_' + profileId);

      if (cachedUser) {
        hasCache = true;
        profileUser = cachedUser;
        profileUser.followers = [];
        profileUser.following = [];

        document.getElementById('name').innerText = cachedUser.username || 'User';
        document.getElementById('name').classList.remove('skeleton');
        document.getElementById('bio').innerText = cachedUser.bio || '';

        const linkEl = document.getElementById('linkLine');
        if (cachedUser.link) {
          linkEl.style.display = 'block';
          linkEl.innerText = cachedUser.link;
          linkEl.href = cachedUser.link.startsWith('http') ? cachedUser.link : 'https://' + cachedUser.link;
        }

        if (cachedUser.avatar) {
          document.getElementById('avatar').innerHTML = '<img src="' + cachedUser.avatar + '">';
          document.getElementById('avatar').classList.remove('loading');
        }

        // NEW - Show cached follow counts instantly (from last fresh fetch)
        const cachedCounts = getFollowCounts(profileId);
        if (cachedCounts) {
          document.getElementById('fCount').innerText = cachedCounts.f;
          document.getElementById('fgCount').innerText = cachedCounts.fg;
        }

        if (Array.isArray(cachedMine) && cachedMine.length) {
          document.getElementById('grid').innerHTML = cachedMine.map(p => postCard(p)).join('');
          cachedMine.forEach(p=>loadedPostIds.add(String(p._id)));
          profilePage = 1;
          if(cachedMine.length < 8) {
            hasMorePosts = false;
          }
        }

        if (isOwn) {
          document.getElementById('writeBtn').style.display = 'inline-block';
          document.getElementById('editBtn').style.display = 'inline-block';
          document.getElementById('editBtn').innerText = '⏳ Loading...';
        } else {
          const fbCache = document.getElementById('followBtn');
          fbCache.style.display = 'block';
          fbCache.innerText = 'Loading...';
          fbCache.className = 'btn btn-follow loadingBtn';
          document.getElementById('msgBtn').style.display = 'block';
        }
      }
    } catch (e) {}

    // If same user was fetched within 24h and we have cache - STOP profile/posts fetch
    // BUT still refresh FOLLOWERS live in background, then return.
    if (skipFreshFetch && hasCache) {
      hideProfileLoading();
      // REMOVED - No more postCount update here. Post count number is gone.
      // NEW - Followers still fetch + update even in cached mode
      refreshFollowOnly();
      return;
    }

    if (!hasCache) {
      document.getElementById('name').innerText = 'Loading...';
      document.getElementById('bio').innerText = 'Loading...';
      // REMOVED - No more postCount = '...' . Post count is gone.
      document.getElementById('fCount').innerText = '...';
      document.getElementById('fgCount').innerText = '...';
    }

    try {
      const r1 = await fetchNoCache(BASE + '/api/users/' + profileId).catch(() => null);

      if (r1 && r1.ok) {
        const data = await r1.json();
        const freshUser = data.user || data;
        profileUser = freshUser;

        document.getElementById('name').innerText = profileUser.username || 'User';
        document.getElementById('name').classList.remove('skeleton');
        document.getElementById('emailLine').innerText = '';
        document.getElementById('bio').innerText = profileUser.bio || '';

        const linkEl = document.getElementById('linkLine');
        if (profileUser.link) {
          linkEl.style.display = 'block';
          linkEl.innerText = profileUser.link;
          linkEl.href = profileUser.link.startsWith('http') ? profileUser.link : 'https://' + profileUser.link;
        } else {
          linkEl.style.display = 'none';
        }

        if (profileUser.avatar) {
          document.getElementById('avatar').innerHTML = '<img src="' + profileUser.avatar + '">';
          document.getElementById('avatar').classList.remove('loading');
        } else {
          document.getElementById('avatar').innerText = (profileUser.username || 'U')[0].toUpperCase();
          document.getElementById('avatar').classList.remove('loading');
        }

        applyFollowFromBackend(profileUser.followers || [], profileUser.following || []);

        if (isOwn) {
          document.getElementById('writeBtn').style.display = 'inline-block';
          document.getElementById('editBtn').style.display = 'inline-block';
          document.getElementById('editBtn').innerText = '✏️ Edit Profile';
        } else {
          const fb = document.getElementById('followBtn');
          fb.style.display = 'block';
          document.getElementById('msgBtn').style.display = 'block';
          const amIFollowing = (profileUser.followers || []).some(f => (f._id || f) === getMyId());
          fb.innerText = amIFollowing ? 'Following' : 'Follow';
          fb.className = amIFollowing ? 'btn btn-following' : 'btn btn-follow';
          fb.disabled = false;
        }

        saveProfileToStorage(profileId, profileUser);
        // Save 24h timer for THIS user - profile + posts only, not followers
        localStorage.setItem('profile_last_fetch_' + profileId, String(Date.now()));
      }

      hideProfileLoading();
      isProfileLoading = false;

      if(hasCache){
        loadedPostIds = new Set();
        hasMorePosts = true;
        profilePage = 1;
        isLoadingPosts = false;
        await loadProfilePosts(1, true);
        // REMOVED - No more await updatePostCount(). Post count is gone.
      } else {
        await loadProfilePosts(1, true);
        // REMOVED - No more await updatePostCount(). Post count is gone.
      }

    } catch (e) {
      hideProfileLoading();
      isProfileLoading = false;
      const grid = document.getElementById('grid');
      if (grid && grid.querySelector('.gcard.loading')) {
        grid.innerHTML = '<p style="grid-column:1/3;text-align:center">Could not load. Check internet and refresh.</p>';
      }
    }
  }

  async function toggleFollow() {
    if (isProfileLoading && !profileUser) {
      return;
    }
    // NEW - Follow is ALWAYS live, never blocked by 24h profile cache
    const fb = document.getElementById('followBtn');
    const fCountEl = document.getElementById('fCount');
    const wasFollowing = fb.innerText === 'Following';
    const myId = getMyId();
    const action = wasFollowing ? 'unfollow' : 'follow';
    const url = BASE + '/api/users/' + profileId + '/' + action;
    fb.disabled = true;
    if (wasFollowing) {
      fb.innerText = 'Follow';
      fb.className = 'btn btn-follow';
      fCountEl.innerText = Math.max(0, (parseInt(fCountEl.innerText) || 0) - 1);
      if (profileUser && profileUser.followers) {
        profileUser.followers = profileUser.followers.filter(f => (f._id || f) !== myId);
      }
    } else {
      fb.innerText = 'Following';
      fb.className = 'btn btn-following';
      fCountEl.innerText = (parseInt(fCountEl.innerText) || 0) + 1;
      if (profileUser) {
        if (!profileUser.followers) {
          profileUser.followers = [];
        }
        profileUser.followers.push(myId);
      }
    }
    // NEW - Save new count so cached profile shows correct number next time
    saveFollowCounts(profileId, parseInt(fCountEl.innerText) || 0, parseInt(document.getElementById('fgCount').innerText) || 0);
    savePending({ url: url, method: 'POST' });
    fb.disabled = false;
    try {
      const result = await surviveFetch(url, 'POST');
      if (!result.ok || result.data.ok === false) {
        throw new Error(result.data.error || 'failed');
      }
      removePending(url, 'POST');
      // NEW - After follow/unfollow succeeds, refresh follow counts live from backend
      refreshFollowOnly();
    } catch (e) {
      if (wasFollowing) {
        fb.innerText = 'Following';
        fb.className = 'btn btn-following';
        fCountEl.innerText = (parseInt(fCountEl.innerText) || 0) + 1;
      } else {
        fb.innerText = 'Follow';
        fb.className = 'btn btn-follow';
        fCountEl.innerText = Math.max(0, (parseInt(fCountEl.innerText) || 0) - 1);
      }
      saveFollowCounts(profileId, parseInt(fCountEl.innerText) || 0, parseInt(document.getElementById('fgCount').innerText) || 0);
    }
  }

  async function unfollowFromList(userId, btnEl) {
    if (btnEl) {
      btnEl.innerText = '...';
      btnEl.disabled = true;
    }
    const rowEl = btnEl ? btnEl.closest('.row') : document.getElementById('follow-row-' + userId);
    const savedRowHTML = rowEl ? rowEl.outerHTML : '';
    const savedFg = parseInt(document.getElementById('fgCount').innerText) || 0;
    if (rowEl) {
      rowEl.remove();
    }
    if (profileUser && profileUser.following) {
      profileUser.following = profileUser.following.filter(u => (u._id || u) !== userId);
    }
    const fg = document.getElementById('fgCount');
    if (fg) {
      fg.innerText = Math.max(0, savedFg - 1);
    }
    // NEW - Save new following count so cached profile stays correct
    saveFollowCounts(profileId, parseInt(document.getElementById('fCount').innerText) || 0, parseInt(fg.innerText) || 0);
    const body = document.getElementById('listBody');
    if (body && !body.querySelector('.row')) {
      body.innerHTML = '<p style="padding:15px;color:#777">None yet</p>';
    }
    const url = BASE + '/api/users/' + userId + '/unfollow';
    savePending({ url: url, method: 'POST' });
    try {
      const result = await surviveFetch(url, 'POST');
      if (!result.ok || result.data.ok === false) {
        throw new Error('failed');
      }
      removePending(url, 'POST');
      // NEW - Refresh follow counts live after unfollow from list
      refreshFollowOnly();
    } catch (e) {
      alert('Could not unfollow. Will retry on next load.');
      if (savedRowHTML && body) {
        if (body.innerHTML.includes('None yet')) {
          body.innerHTML = '';
        }
        body.insertAdjacentHTML('beforeend', savedRowHTML);
      }
      if (fg) {
        fg.innerText = savedFg;
      }
      saveFollowCounts(profileId, parseInt(document.getElementById('fCount').innerText) || 0, savedFg);
      if (profileUser) {
        if (!profileUser.following) {
          profileUser.following = [];
        }
        profileUser.following.push(userId);
      }
    }
  }

  function buildFollowRow(u, type) {
    const id = (u && u._id) || u;
    const hasName = u && typeof u === 'object' && u.username;
    const hasAvatar = u && typeof u === 'object' && u.avatar;
    const nameText = hasName ? u.username : 'Loading...';
    const nameClass = hasName ? 'followName' : 'followName loadingName';
    let avatarHTML = '';
    let avatarClass = 'mini';
    if (hasAvatar) {
      avatarHTML = '<img src="' + u.avatar + '">';
    } else if (hasName) {
      avatarHTML = u.username[0].toUpperCase();
    } else {
      avatarHTML = '';
      avatarClass = 'mini loadingMini';
    }
    const unfollowBtn = (isOwn && type === 'following') ? '<button class="btn-mini-unfollow" onclick="event.stopPropagation(); unfollowFromList(\'' + id + '\', this)">Unfollow</button>' : '';
    return '<div class="row" id="follow-row-' + id + '" onclick="location.href=\'profile.html?id=' + id + '\'"><div class="' + avatarClass + '" id="follow-avatar-' + id + '">' + avatarHTML + '</div><div><b class="' + nameClass + '" id="follow-name-' + id + '">' + nameText + '</b></div>' + unfollowBtn + '</div>';
  }

  async function fillOneFollowRow(userOrId) {
    if (userOrId && typeof userOrId === 'object' && userOrId.username) {
      return;
    }
    const userId = (userOrId && userOrId._id) || userOrId;
    if (!userId) {
      return;
    }
    try {
      const res = await fetch(BASE + '/api/users/' + userId, {
        headers: {
          authorization: token,
          'Cache-Control': 'no-cache'
        },
        cache: 'no-store'
      });
      if (!res.ok) {
        return;
      }
      const data = await res.json();
      const fullUser = data.user || data;
      if (!fullUser || !fullUser.username) {
        return;
      }
      const nameEl = document.getElementById('follow-name-' + userId);
      if (nameEl) {
        nameEl.innerText = fullUser.username;
        nameEl.classList.remove('loadingName');
      }
      const avEl = document.getElementById('follow-avatar-' + userId);
      if (avEl) {
        avEl.classList.remove('loadingMini');
        if (fullUser.avatar) {
          avEl.innerHTML = '<img src="' + fullUser.avatar + '">';
        } else {
          avEl.innerHTML = fullUser.username[0].toUpperCase();
        }
      }
    } catch (e) {}
  }

  async function showList(type) {
    // NEW - Followers / Following list is ALWAYS live, never 24h cached
    document.getElementById('listTitle').innerText = type === 'followers' ? 'Followers' : 'Following';
    document.getElementById('listModal').classList.add('open');
    let instantList = [];
    if (profileUser) {
      instantList = type === 'followers' ? (profileUser.followers || []) : (profileUser.following || []);
    }
    if (instantList.length) {
      document.getElementById('listBody').innerHTML = instantList.map(u => buildFollowRow(u, type)).join('');
    } else {
      document.getElementById('listBody').innerHTML = '<p style="padding:15px;color:#777">None yet</p>';
      return;
    }
    try {
      const res = await fetch(BASE + '/api/users/' + profileId + '/' + type, {
        headers: {
          authorization: token,
          'Cache-Control': 'no-cache'
        },
        cache: 'no-store'
      });
      if (res.ok) {
        const data = await res.json();
        const freshList = data[type] || [];
        if (freshList.length) {
          if (!document.getElementById('listModal').classList.contains('open')) {
            return;
          }
          document.getElementById('listBody').innerHTML = freshList.map(u => buildFollowRow(u, type)).join('');
          if (profileUser) {
            if (type === 'followers') {
              profileUser.followers = freshList;
            } else {
              profileUser.following = freshList;
            }
            applyFollowFromBackend(profileUser.followers, profileUser.following);
          }
          return;
        }
      }
      for (let i = 0; i < instantList.length; i += 5) {
        const chunk = instantList.slice(i, i + 5);
        await Promise.all(chunk.map(u => fillOneFollowRow(u)));
      }
    } catch (e) {
      for (let i = 0; i < instantList.length; i += 5) {
        const chunk = instantList.slice(i, i + 5);
        await Promise.all(chunk.map(u => fillOneFollowRow(u)));
      }
    }
  }

  function closeList() {
    document.getElementById('listModal').classList.remove('open');
  }

  async function deletePost(e, postId) {
    e.stopPropagation();
    if (!isOwn) {
      return alert('You can only delete your own post');
    }
    if (!confirm('Delete this novel? This cannot be undone.')) {
      return;
    }
    const btn = e.target;
    const card = btn.closest('.gcard');
    const savedHTML = card ? card.outerHTML : '';
    // REMOVED - No more savedCount / postCount logic. Post count number is gone.
    const grid = document.getElementById('grid');
    btn.innerText = 'Deleting...';
    btn.disabled = true;
    if (card) {
      card.remove();
    }
    loadedPostIds.delete(String(postId));
    // REMOVED - No more countEl.innerText update. Post count is gone.
    if (grid && !grid.querySelector('.gcard')) {
      grid.innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">No novels yet. Write your first one! ✨</p>';
    }
    const url = BASE + '/api/posts/' + postId;
    savePending({ url: url, method: 'DELETE' });
    try {
      await WRDB.delete('profile_posts_' + profileId);
      await WRDB.delete('profile_' + profileId);
      await WRDB.delete('feed_posts');
      let del = JSON.parse(localStorage.getItem('deleted_post_ids') || '[]');
      if (!del.includes(postId)) {
        del.push(postId);
      }
      localStorage.setItem('deleted_post_ids', JSON.stringify(del));
      // NEW - After delete, force fresh on next profile open so deleted post stays gone
      localStorage.setItem('profile_force_refresh', '1');
    } catch (err) {}
    try {
      const result = await surviveFetch(url, 'DELETE');
      if (!result.ok || result.data.ok === false) {
        throw new Error(result.data.error || 'Could not delete. You can only delete your own post.');
      }
      removePending(url, 'DELETE');
    } catch (err) {
      alert(err.message + ' - Novel NOT deleted in database. Will retry on next load.');
      if (grid) {
        if (grid.innerHTML.includes('No novels yet')) {
          grid.innerHTML = '';
        }
        grid.insertAdjacentHTML('beforeend', savedHTML);
      }
      // REMOVED - No more countEl restore. Post count is gone.
      loadedPostIds.add(String(postId));
    }
  }

  async function saveProfile() {
    const btn = document.getElementById('saveBtn');
    btn.innerText = 'Saving...';
    btn.disabled = true;
    document.getElementById('editBox').classList.add('loadingInputs');
    try {
      const username = document.getElementById('editName').value.trim();
      const bio = document.getElementById('editBio').value.trim();
      const link = document.getElementById('editLink').value.trim();
      const res1 = await fetch(BASE + '/api/users/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', authorization: token },
        body: JSON.stringify({ username: username, bio: bio, link: link }),
        keepalive: true
      });
      if (!res1.ok) {
        throw new Error('Could not save profile');
      }
      if (newAvatarFile) {
        const fd = new FormData();
        fd.append('file', newAvatarFile);
        const res2 = await fetch(BASE + '/api/users/avatar', {
          method: 'POST',
          headers: { authorization: token },
          body: fd,
          keepalive: true
        });
        if (!res2.ok) {
          throw new Error('Could not save picture');
        }
      }
      alert('Profile updated! ✅');
      closeEdit();
      // NEW - After edit, force fresh on next load so new name/bio/avatar shows instantly
      localStorage.setItem('profile_force_refresh', '1');
      load();
    } catch (e) {
      alert(e.message);
    }
    btn.innerText = 'Save Changes ✅';
    btn.disabled = false;
    document.getElementById('editBox').classList.remove('loadingInputs');
  }

  async function removeAvatar() {
    if (!confirm('Remove profile picture?')) {
      return;
    }
    await fetch(BASE + '/api/users/avatar', {
      method: 'DELETE',
      headers: { authorization: token },
