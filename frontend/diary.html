<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Diary</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a12;color:#fff;font-family:Arial;padding-bottom:90px}.top{max-width:935px;margin:0 auto;padding:20px 16px}.top h2{margin:0;font-size:26px}.top p{color:#888;font-size:13px}.grid{max-width:935px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 16px}.card{background:#16161f;border:1px solid #26262f;border-radius:18px;overflow:hidden;cursor:pointer}.cover{width:100%;height:210px}.cover img{width:100%;height:100%;object-fit:cover}.noimg{width:100%;height:100%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:50px}.body{padding:12px}.title{font-size:14px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,18,.95);border-top:1px solid #262626;display:flex;justify-content:space-around;padding:14px 0}.nav a{color:#fff;text-decoration:none;font-size:22px}</style>
</head><body>
<div class="top"><h2>📖 My Diary</h2><p>Novels you saved - all from database</p></div>
<div class="grid" id="grid"><p style="grid-column:1/3;text-align:center;color:#777">Loading...</p></div>
<div class="nav"><a href="feed.html">🏠</a><a href="search.html">🔍</a><a href="create.html">✍️</a><a href="message.html">💬</a><a href="diary.html">📖</a><a href="profile.html">👤</a></div>
<script>
const BASE="https://raymonddomain.dev";
const token=localStorage.getItem('token');
if(!token) location.href="login.html";
async function load(){
  const res=await fetch(BASE+'/api/posts/saved/mine',{headers:{authorization:token}});
  const posts=await res.json();
  if(!posts.length){ document.getElementById('grid').innerHTML='<p style="grid-column:1/3;text-align:center;color:#777">No saved novels yet.<br>Tap 🔖 on any novel to save it here.</p>'; return; }
  document.getElementById('grid').innerHTML=posts.map(p=>{
    let cover=p.cover ? '<img src="'+p.cover+'">' : '<div class="noimg">📖</div>';
    return '<div class="card" onclick="location.href=\'read.html?id='+p._id+'\'"><div class="cover">'+cover+'</div><div class="body"><div class="title">'+p.title+'</div><div style="font-size:12px;color:#888;margin-top:4px">@'+(p.user?.username||'author')+'</div></div></div>';
  }).join('');
}
load();
</script></body></html>
