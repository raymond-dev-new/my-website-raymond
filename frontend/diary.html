<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Diary</title>
  <!-- ============================================================ -->
  <!-- CACHE ADDITION - ADDED ONLY - DO NOT REMOVE                  -->
  <!-- Loads shared cache helper. If file is missing, inline WRDB  -->
  <!-- below still works, so app never breaks.                     -->
  <!-- ============================================================ -->
  <script src="wildreaders-db.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a12; color: #fff; font-family: Arial; padding-bottom: 90px; }
    .top { max-width: 935px; margin: 0 auto; padding: 20px 16px; }
    .top h2 { margin: 0; font-size: 26px; }
    .top p { color: #888; font-size: 13px; }
    .grid { max-width: 935px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 10px 16px; }
    .card { background: #16161f; border: 1px solid #26262f; border-radius: 18px; overflow: hidden; cursor: pointer; }
    .cover { width: 100%; height: 210px; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .noimg { width: 100%; height: 100%; background: linear-gradient(135deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 50px; }
    .body { padding: 12px; }
    .title { font-size: 14px; font-weight: 800; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 18, .95); border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 14px 0; }
    .nav a { color: #fff; text-decoration: none; font-size: 22px; }

    /* ============================================================ */
    /* ADDED ONLY - MESSAGE NOTIFICATION BADGE STYLES               */
    /* Copy this whole block to any other page you want badge on    */
    /* ============================================================ */
    /* Makes the 💬 link able to hold a badge on top of it */
    .navMsg { position: relative; }
    /* The red circle with number, e.g. 1, 2, 99+ */
    .msgBadge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: none; /* hidden when 0 unread, JS will show it */
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <!-- Top title area -->
  <div class="top">
    <h2>📖 My Diary</h2>
    <p>Novels you saved</p>
    <p>Click on 🔖 to unsave</p>
  </div>

  <!-- Saved novels grid -->
  <div class="grid" id="grid"><p style="grid-column:1/3;text-align:center;color:#777">Loading...</p></div>

  <!-- Bottom navigation -->
  <div class="nav">
    <a href="feed.html">🏠</a>
    <a href="search.html">🔍</a>
    <a href="create.html">✍️</a>
    <!-- ADDED ONLY - Added class="navMsg" + <span id="msgBadge"> so badge can show on 💬 -->
    <a href="message.html" class="navMsg">💬<span class="msgBadge" id="msgBadge">0</span></a>
    <a href="diary.html">📖</a>
    <a href="profile.html">👤</a>
  </div>

  <script>
    // ============================================================
    // CACHE ADDITION - ADDED ONLY - START
    // ============================================================
    // WildReaders Cache - IndexedDB (FREE, unlimited) + Cache Storage (FREE, for images)
    // Why: Diary has many covers. localStorage is only ~5MB and would crash. IndexedDB has no such limit.
    // Pattern: Show cached diary instantly (0s) -> Fetch new in background -> Update if changed.
    // This block does NOT replace your logic below. It runs BESIDE it.
    // ============================================================
    const WRDB = window.WRDB || {
      dbName: 'WildReadersDB',
      storeName: 'cache',
      _open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(this.storeName)) {
              req.result.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      // CACHE ADDITION: Save anything - saved novels - to IndexedDB
      async save(key, data) {
        try {
          const db = await this._open();
          return new Promise((resolve) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put({ data: data, time: Date.now() }, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) { return false; }
      },
      // CACHE ADDITION: Get anything from IndexedDB, returns null if not found
      async get(key) {
        try {
          const db = await this._open();
          return new Promise((resolve) => {
            const tx = db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => resolve(req.result ? req.result.data : null);
            req.onerror = () => resolve(null);
          });
        } catch (e) { return null; }
      }
    };
    // CACHE ADDITION: Turn ON Cache Storage for images (covers) via Service Worker
    // Service Worker caches cover images so they load in 0s second time.
    // It NEVER caches /api/ - so new saved novels always come fresh from server.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // CACHE ADDITION: Helper - paint diary grid from posts using your SAME HTML as load() below
    // This is only for instant cached render. Your original load() still does the fresh fetch below.
    function renderDiaryFromCache(posts) {
      if (!Array.isArray(posts)) return;
      if (!posts.length) {
        document.getElementById('grid').innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">No saved novels yet.<br>Tap 🔖 on any novel to save it here.</p>';
        return;
      }
      document.getElementById('grid').innerHTML = posts.map(p => {
        let cover = p.cover ? '<img src="' + p.cover + '">' : '<div class="noimg">📖</div>';
        return '<div class="card" onclick="location.href=\'read.html?id=' + p._id + '\'"><div class="cover">' + cover + '</div><div class="body"><div class="title">' + p.title + '</div><div style="font-size:12px;color:#888;margin-top:4px">@' + (p.user?.username || 'author') + '</div></div></div>';
      }).join('');
    }
    // ============================================================
    // CACHE ADDITION - ADDED ONLY - END
    // ============================================================

    // ============================================================
    // ORIGINAL CODE - Do not touch, everything below is your old code
    // ============================================================
    const BASE = "https://raymonddomain.dev";
    const token = localStorage.getItem('token');
    if (!token) location.href = "login.html";

    // Load my saved novels from server
    async function load() {
      // CACHE ADDITION - ADDED ONLY: Show cached diary instantly (0s) BEFORE server fetch
      // User sees old saved novels immediately while we fetch fresh data below.
      // If no cache, this does nothing and normal fetch below runs.
      try {
        const cachedPosts = await WRDB.get('diary_saved');
        if (cachedPosts && cachedPosts.length) {
          renderDiaryFromCache(cachedPosts);
        }
      } catch (e) {}

      const res = await fetch(BASE + '/api/posts/saved/mine', { headers: { authorization: token } });
      const posts = await res.json();

      if (!posts.length) {
        document.getElementById('grid').innerHTML = '<p style="grid-column:1/3;text-align:center;color:#777">No saved novels yet.<br>Tap 🔖 on any novel to save it here.</p>';
        // CACHE ADDITION - ADDED ONLY: Save empty list too, so unsaved novels disappear from cache next open
        // Without this, old cached novels would keep showing even after you unsave them.
        WRDB.save('diary_saved', []);
        return;
      }

      document.getElementById('grid').innerHTML = posts.map(p => {
        let cover = p.cover ? '<img src="' + p.cover + '">' : '<div class="noimg">📖</div>';
        return '<div class="card" onclick="location.href=\'read.html?id=' + p._id + '\'"><div class="cover">' + cover + '</div><div class="body"><div class="title">' + p.title + '</div><div style="font-size:12px;color:#888;margin-top:4px">@' + (p.user?.username || 'author') + '</div></div></div>';
      }).join('');

      // CACHE ADDITION - ADDED ONLY: Save fresh saved novels to IndexedDB for next instant open
      // This runs AFTER your original fetch, so it never changes what user sees now.
      // Next time user opens diary, it will show in 0s from this cache.
      WRDB.save('diary_saved', posts);
    }

    load();

    // ====================================================================
    // ADDED ONLY - MESSAGE NOTIFICATION FOR THIS PAGE (DIARY)
    // Copy this WHOLE block to any other page to get same badge there.
    // It uses the SAME localStorage keys as message.html, so they stay in sync.
    // ====================================================================

    // --- STEP 1: Get my own ID from token ---
    // We need my ID to build the "read_" key and to know if a message is from me or from them
    function getMyIdForBadge() {
      try {
        // Token is like xxx.YYY.zzz, the middle part holds my id
        return JSON.parse(atob(token.split('.')[1])).id;
      } catch {
        return "";
      }
    }

    // --- STEP 2: Helpers to remember what I have already read ---
    // We save: read_MYID_OTHERID = ID of last message I saw from that person
    // Example: read_123_456 = "msg789"
    // If server has a newer message ID after that one, and it's from THEM, it's unread.
    function getReadKeyForBadge(otherId) {
      return 'read_' + getMyIdForBadge() + '_' + otherId;
    }
    function getLastReadIdForBadge(otherId) {
      return localStorage.getItem(getReadKeyForBadge(otherId)) || '';
    }

    // --- STEP 3: Show / hide the red badge on 💬 button ---
    function updateMsgBadge(count) {
      // Find the badge span in the bottom nav
      const badge = document.getElementById('msgBadge');
      if (!badge) return; // If this page has no badge, do nothing
      if (count > 0) {
        badge.style.display = 'flex'; // Show badge
        badge.innerText = count > 99 ? '99+' : count; // 99+ if too many
      } else {
        badge.style.display = 'none'; // Hide badge when 0 unread
      }
    }

    // --- STEP 4: Check server for new messages ---
    async function checkMsgNotifications() {
      try {
        // 4a. Get my profile to know who I follow / who follows me = people who can message me
        const meRes = await fetch(BASE + '/api/users/' + getMyIdForBadge(), { headers: { authorization: token } });
        const meData = await meRes.json();
        const me = meData.user || meData;
        let people = [...(me.followers || []), ...(me.following || [])];

        // 4b. Remove duplicates + remove myself
        let seen = {};
        people = people.filter(p => {
          let id = p._id || p;
          if (seen[id]) return false;
          seen[id] = true;
          return id !== getMyIdForBadge();
        });

        let totalUnread = 0; // Total unread across all chats

        // 4c. For each person, fetch our chat and count unread
        for (const p of people) {
          const otherId = p._id || p;
          const res = await fetch(BASE + '/api/messages/' + otherId, { headers: { authorization: token } });
          const msgs = await res.json();
          if (!Array.isArray(msgs) || !msgs.length) continue; // No messages with this person

          const lastReadId = getLastReadIdForBadge(otherId);

          // If I have NEVER opened this chat before, treat all old messages as already read
          // (so old chats don't suddenly show as unread on first load)
          // We save the last message as "read" and continue
          if (!lastReadId) {
            localStorage.setItem(getReadKeyForBadge(otherId), msgs[msgs.length - 1]._id);
            continue;
          }

          // Find where I stopped reading
          const idx = msgs.findIndex(m => m._id === lastReadId);

          if (idx === -1) {
            // My last read message was deleted, so check last message:
            // If last message is new AND from them, count it as 1 unread
            const lastMsg = msgs[msgs.length - 1];
            const fromId = lastMsg.from?._id || lastMsg.from;
            if (lastMsg._id !== lastReadId && fromId !== getMyIdForBadge()) {
              totalUnread += 1;
            }
          } else {
            // Count messages AFTER my last read one that are FROM THEM (not from me)
            const after = msgs.slice(idx + 1);
            for (const m of after) {
              const fromId = m.from?._id || m.from;
              if (fromId !== getMyIdForBadge()) totalUnread++;
            }
          }
        }

        // 4d. Update the badge on screen
        updateMsgBadge(totalUnread);

      } catch (e) {
        // If internet fails, just ignore, will try again in 3 seconds
      }
    }

    // --- STEP 5: Start checking ---
    // Check immediately when page loads
    checkMsgNotifications();
    // Then check every 3 seconds, so new message shows fast while you are on Diary
    setInterval(checkMsgNotifications, 3000);
  </script>
</body>
</html>
