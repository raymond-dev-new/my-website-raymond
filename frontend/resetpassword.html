<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover Password - WildReaders</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo{text-align:center;font-size:42px;margin:0}
h1{text-align:center;font-family:cursive;font-size:30px;margin:6px 0 4px}
.sub{text-align:center;color:#c4b5fd;font-size:13px;margin:0 0 22px;line-height:1.5}
label{font-size:12px;color:#ddd}
input{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;padding:14px;margin:6px 0 12px;outline:none;font-size:15px}
input::placeholder{color:#aaa}
input:focus{border-color:#a78bfa;background:rgba(255,255,255,.16)}
button{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,.4);display:flex;align-items:center;justify-content:center;gap:10px}
button:disabled{opacity:.7;cursor:not-allowed}
button.secondary{background:rgba(255,255,255,.12);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
a{color:#c4b5fd;text-decoration:none;font-size:14px}
.center{text-align:center;margin-top:16px}
.back{color:#aaa;font-size:13px}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:13px;display:none;text-align:center;line-height:1.4}
.msg.ok{display:block;background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.4)}
.msg.err{display:block;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.step{display:none}
.step.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.code-box{margin:4px 0 14px;background:rgba(34,197,94,.12);border:1px dashed #22c55e;padding:14px;border-radius:14px;text-align:center;display:none}
.code-box small{font-size:11px;color:#aaa;letter-spacing:1px}
.code-box b{font-size:26px;letter-spacing:6px;color:#4ade80;display:block;margin-top:4px}
.progress{display:flex;gap:6px;margin-bottom:20px}
.progress div{flex:1;height:4px;border-radius:10px;background:rgba(255,255,255,.15)}
.progress div.on{background:linear-gradient(90deg,#7c3aed,#ec4899)}
.step-label{font-size:11px;color:#aaa;text-align:center;margin:-12px 0 16px}
.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.eye{position:relative}
.eye span{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;opacity:.7}
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Recover Password</h1>
  <p class="sub" id="subtitle">Enter your email and we'll send you a 6-digit code to reset your password.</p>

  <div class="progress">
    <div id="bar1" class="on"></div>
    <div id="bar2"></div>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="step active">
    <div class="step-label">STEP 1 OF 2 — GET CODE</div>
    <label>Email Address</label>
    <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email">
    <button id="btn1" onclick="sendCode()"><span id="btn1Text">Send Code ✨</span><span id="spinner1" class="spinner"></span></button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">
    <div class="step-label">STEP 2 OF 2 — CREATE NEW PASSWORD</div>

    <div id="codeBox" class="code-box">
      <small>YOUR CODE (FOR TESTING)</small>
      <b id="codeDisplay">------</b>
    </div>

    <label>6-Digit Code</label>
    <input id="codeInput" placeholder="e.g. 123456" inputmode="numeric" maxlength="6">

    <label>New Password</label>
    <div class="eye">
      <input id="newPass" type="password" placeholder="Min 6 characters">
      <span onclick="togglePass('newPass')">👁️</span>
    </div>

    <label>Confirm Password</label>
    <div class="eye">
      <input id="confirmPass" type="password" placeholder="Repeat password">
      <span onclick="togglePass('confirmPass')">👁️</span>
    </div>

    <button id="btn2" onclick="resetPass()"><span id="btn2Text">Change Password 🎉</span><span id="spinner2" class="spinner"></span></button>
    <button class="secondary" onclick="back1()" style="margin-top:10px">← Back</button>
  </div>

  <div id="msg" class="msg"></div>

</div>

<script>
const BASE = "https://raymonddomain.dev";

function showMsg(t, ok){
  const el = document.getElementById('msg');
  el.innerText = t;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
function hideMsg(){ document.getElementById('msg').style.display='none'; }

function togglePass(id){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function back1(){
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('bar2').classList.remove('on');
  document.getElementById('subtitle').innerText = "Enter your email and we'll send you a 6-digit code to reset your password.";
  hideMsg();
}

async function sendCode(){
  const email = document.getElementById('email').value.trim();
  if(!email) return showMsg('Please enter your email', false);
  if(!email.includes('@')) return showMsg('Enter a valid email', false);

  const btn = document.getElementById('btn1');
  const btnText = document.getElementById('btn1Text');
  const spinner = document.getElementById('spinner1');
  btn.disabled = true; btnText.innerText = 'Sending...'; spinner.classList.add('show');

  try{
    let r = await fetch(BASE + '/api/auth/forgot-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    let d = await r.json();
    if(!r.ok) throw new Error(d.message || 'Failed');

    showMsg(d.message || 'Code sent to ' + email, true);

    // Go to step 2
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('bar2').classList.add('on');
    document.getElementById('subtitle').innerText = 'We sent a code to ' + email + '. Enter it below.';

    // Show code if backend returns it (for testing)
    if(d.code){
      document.getElementById('codeBox').style.display = 'block';
      document.getElementById('codeDisplay').innerText = d.code;
    }

  }catch(e){ showMsg(e.message, false); }
  finally{
    btn.disabled = false; btnText.innerText = 'Send Code ✨'; spinner.classList.remove('show');
  }
}

async function resetPass(){
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  const np = document.getElementById('newPass').value.trim();
  const cp = document.getElementById('confirmPass').value.trim();

  if(!code || !np || !cp) return showMsg('Fill all fields', false);
  if(code.length !== 6) return showMsg('Code must be 6 digits', false);
  if(np !== cp) return showMsg('Passwords do not match', false);
  if(np.length < 6) return showMsg('Password too short (min 6)', false);

  const btn = document.getElementById('btn2');
  const btnText = document.getElementById('btn2Text');
  const spinner = document.getElementById('spinner2');
  btn.disabled = true; btnText.innerText = 'Resetting...'; spinner.classList.add('show');

  try{
    let r = await fetch(BASE + '/api/auth/reset-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, code, newPassword: np, password: np })
    });
    let d = await r.json();
    if(!r.ok) throw new Error(d.message || 'Invalid code');

    showMsg('Password changed! Redirecting to login...', true);
    setTimeout(()=> location.href = 'login.html', 1500);

  }catch(e){ showMsg(e.message, false); }
  finally{
    btn.disabled = false; btnText.innerText = 'Change Password 🎉'; spinner.classList.remove('show');
  }
}
</script>
</body>
</html>
